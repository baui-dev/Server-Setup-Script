# FLARESOLVERR
# GitHub: https://github.com/FlareSolverr/FlareSolverr
# Image: https://ghcr.io/flaresolverr/flaresolverr
# Docs: https://github.com/FlareSolverr/FlareSolverr#readme
#
# Local proxy service that helps indexers and automation tools work with sites
# protected by Cloudflare or similar anti-bot challenges.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      # - CAPTCHA_SOLVER=none # Select an external captcha solver if needed

    ports:
      - ${PORT_FLARESOLVERR:-8191}:8191
