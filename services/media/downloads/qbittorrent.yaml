# QBITTORRENT
# GitHub: https://github.com/qbittorrent/qBittorrent
# Image: https://hub.docker.com/r/linuxserver/qbittorrent
# Docs: https://docs.linuxserver.io/images/docker-qbittorrent/
#
# Feature-rich BitTorrent client with a web UI for manual downloads and
# automation flows used by Sonarr, Radarr, and related media tools.

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8085
      # - TORRENTING_PORT=${PORT_QBITTORRENT_TORRENT:-6881} # Incoming BitTorrent port

    volumes:
      - ${DOCKER_DATA}/media/downloads/qbittorrent/config:/config
      - ${DOCKER_DATA}/media/downloads/qbittorrent/downloads:/downloads

    ports:
      - ${PORT_QBITTORRENT:-8085}:8085
      - ${PORT_QBITTORRENT_TORRENT:-6881}:6881
      - ${PORT_QBITTORRENT_TORRENT:-6881}:6881/udp
