# AUTOBRR
# GitHub: https://github.com/autobrr/autobrr
# Image: https://ghcr.io/autobrr/autobrr
# Docs: https://autobrr.com/installation/docker
#
# Download automation tool for torrent and Usenet workflows. Watches announce
# feeds, filters releases, and forwards matches to your download clients.

services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    hostname: autobrr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/automation/autobrr/config:/config

    ports:
      - ${PORT_AUTOBRR:-7474}:7474
