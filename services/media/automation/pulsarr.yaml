# PULSARR
# GitHub: https://github.com/jamcalli/Pulsarr
# Image: lakker/pulsarr:latest (Docker Hub)
# Docs: https://github.com/jamcalli/Pulsarr/wiki
#
# Pulsarr is a Plex watchlist automation tool that bridges Plex's watchlist feature
# with Sonarr and Radarr. When you add a movie or show to your Plex watchlist,
# Pulsarr automatically sends a request to the appropriate *arr app to download it.
# Supports multiple users, webhook notifications, and configurable quality profiles.
#
# NOTE: The correct Docker image is lakker/pulsarr (Docker Hub), NOT ghcr.io/jamcalli/pulsarr.
# For ARM/older kernels (Linux <4.11): use lakker/pulsarr:node (Node.js instead of Bun).
#
# === QUICK START ===
# 1. docker compose -f pulsarr.yaml up -d
# 2. Navigate to http://localhost:${PORT_PULSARR}
# 3. Configure Plex token, Plex URL, Sonarr/Radarr URLs and API keys in the web UI

services:
  pulsarr:
    image: lakker/pulsarr:latest
    # image: lakker/pulsarr:node  # ARM / Linux kernel < 4.11 alternative
    container_name: pulsarr
    hostname: pulsarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Primary config is done via web UI after first start.
      # Optional env vars (can also be set in the UI):
      # - PLEX_TOKEN=${AGREGARR_PLEX_TOKEN}          # Plex authentication token
      # - PLEX_URL=http://plex:32400                 # Plex server URL
      # - SONARR_URL=http://sonarr:8989              # Sonarr instance URL
      # - SONARR_API_KEY=${SONARR_API_KEY}           # Sonarr API key
      # - RADARR_URL=http://radarr:7878              # Radarr instance URL
      # - RADARR_API_KEY=${RADARR_API_KEY}           # Radarr API key
      # - LOG_LEVEL=info                             # Logging verbosity
    volumes:
      - ${DOCKER_DATA}/pulsarr/config:/config          # Pulsarr configuration and state database
    ports:
      - ${PORT_PULSARR:-3003}:3003
    # networks:
    #   - ${DEFAULT_NETWORK}

