# Immich
# GitHub: https://github.com/immich-app/immich
# Image: ghcr.io/immich-app/immich-server:release
# Docs: https://immich.app/docs
#
# High-performance, self-hosted photo and video management solution. Backup from
# iOS/Android via the official Immich app, then browse with facial recognition,
# object detection, reverse geocoding, duplicate detection, and an interactive
# timeline. Supports RAW files, Live Photos, and 4K video. Requires PostgreSQL
# (with the pgvecto.rs extension for vector similarity search) and Redis.
#
# IMPORTANT: Always pin versions - do NOT use :latest for immich images.
# Breaking changes happen frequently. Use a specific release tag in production,
# e.g., IMMICH_VERSION=v1.100.0 and reference it as ${IMMICH_VERSION:-release}.
#
# Upload location: set UPLOAD_LOCATION in your .env to the host path where
# photos/videos should be stored (e.g., /mnt/photos/immich).

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    hostname: immich-server
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-db
      - DB_PORT=5432
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - DB_USERNAME=${IMMICH_DB_USER}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PORT=6379
      - UPLOAD_LOCATION=/usr/src/app/upload
      - IMMICH_LOG_LEVEL=${IMMICH_LOG_LEVEL:-log}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${PORT_IMMICH}:2283
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    hostname: immich-machine-learning
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Uncomment to enable GPU acceleration (CUDA):
      # - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${DOCKER_DATA}/immich/model-cache:/cache
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # networks:
    #   - ${DEFAULT_NETWORK}

  immich-redis:
    image: redis:6.2-alpine
    container_name: immich-redis
    hostname: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  immich-db:
    # pgvecto.rs provides vector similarity search used by Immich for ML features.
    # See https://github.com/tensorchord/pgvecto.rs for details.
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-db
    hostname: immich-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${IMMICH_DB_USER}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=${IMMICH_DB_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${DOCKER_DATA}/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
        Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}"
        --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
        echo "checksum failure count is $$Chksum";
        [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_period: 5m
      start_interval: 30s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true
