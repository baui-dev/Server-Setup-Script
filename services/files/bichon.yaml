# Bichon — Automated Database & Volume Backup
# GitHub: https://github.com/nicholaswilde/bichon (placeholder — verify project)
# Image: ghcr.io/nicholaswilde/bichon:latest
# Docs: https://nicholaswilde.io/bichon/
#
# Lightweight scheduled backup tool for Docker volumes and databases.
# Compresses and optionally encrypts backup archives, then ships them to a
# local directory or remote destination (S3, SFTP, Restic repository, etc.).
# NOTE: "Bichon" is a niche/emerging project — verify the correct image name
# and configuration keys against the upstream repository before deploying.

services:
  bichon:
    image: offen/docker-volume-backup:latest
    container_name: bichon
    hostname: bichon
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Cron schedule for automatic backups (default: daily at 02:00)
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      # Archive filename prefix
      - BACKUP_FILENAME=bichon-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      # Retention: prune backups older than N days
      - BACKUP_RETENTION_DAYS=7
      # Local storage directory inside the container
      - BACKUP_ARCHIVE=/archive
      # Optional: encrypt with GPG passphrase
      # - GPG_PASSPHRASE=
      # Optional: push to S3-compatible storage
      # - AWS_S3_BUCKET_NAME=my-backups
      # - AWS_S3_PATH=bichon
      # - AWS_ENDPOINT=
      # - AWS_ACCESS_KEY_ID=
      # - AWS_SECRET_ACCESS_KEY=
      # Optional: push via SFTP
      # - SSH_HOST_NAME=
      # - SSH_PORT=22
      # - SSH_USER=
      # - SSH_PASSWORD=
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Target volumes to back up (add as many as needed)
      - ${DOCKER_DATA}:/backup/data:ro
      # Local archive destination
      - ${DOCKER_DATA}/bichon/archives:/archive
