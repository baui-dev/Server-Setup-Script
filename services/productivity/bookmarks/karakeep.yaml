# Karakeep (formerly Hoarder)
# GitHub: https://github.com/karakeep-app/karakeep
# Image: ghcr.io/karakeep-app/karakeep:release
# Docs: https://karakeep.app/docs
#
# AI-powered self-hosted bookmark manager - the successor/rename of Hoarder.
# Automatically tags bookmarks with AI, captures screenshots via headless Chromium,
# and provides full-text search via Meilisearch. Compatible with Hoarder data.
#
# Required env vars: HOARDER_NEXTAUTH_SECRET, HOARDER_MEILI_KEY
# (reuses Hoarder secrets since it is the same project, just renamed)

services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    hostname: karakeep
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Authentication - generate with: openssl rand -hex 32
      - NEXTAUTH_SECRET=${HOARDER_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:${PORT_KARAKEEP:-3000}
      - DATA_DIR=/data
      # Meilisearch integration
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
      # Chromium for screenshots
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      # -- AI Tagging (choose one provider) --
      # OpenAI:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - INFERENCE_TEXT_MODEL=gpt-4o-mini
      # - INFERENCE_IMAGE_MODEL=gpt-4o-mini
      # Ollama (self-hosted):
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - INFERENCE_TEXT_MODEL=llama3.1
      # - INFERENCE_IMAGE_MODEL=llava
      # - INFERENCE_LANG=english
      # -- Optional settings --
      # - DISABLE_SIGNUPS=true
      # - MAX_ASSET_SIZE=4194304
      # OAuth SSO:
      # - OAUTH_WELLKNOWN_URL=https://auth.${BASE_DOMAIN}/.well-known/openid-configuration
      # - OAUTH_CLIENT_ID=${KARAKEEP_OAUTH_CLIENT_ID}
      # - OAUTH_CLIENT_SECRET=${KARAKEEP_OAUTH_CLIENT_SECRET}
    volumes:
      - ${DOCKER_DATA}/karakeep/data:/data
    ports:
      - ${PORT_KARAKEEP:-3000}:3000
    depends_on:
      - karakeep-meilisearch
      - karakeep-chrome
    # networks:
    #   - ${DEFAULT_NETWORK}

  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: karakeep-chrome
    hostname: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    # networks:
    #   - ${DEFAULT_NETWORK}

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.11.3
    container_name: karakeep-meilisearch
    hostname: karakeep-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
    volumes:
      - ${DOCKER_DATA}/karakeep/meilisearch:/meili_data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true
