# PIHOLE
# GitHub: https://github.com/pi-hole/pi-hole
# Image: pihole/pihole
# Docs: https://docs.pi-hole.net/
#
# Network-wide ad blocking via your own Linux hardware. DNS sinkhole that protects
# your devices from unwanted content without installing any client-side software.

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=changeme                                 # Admin panel password
      # - PIHOLE_DNS_=8.8.8.8;8.8.4.4                         # Upstream DNS servers
      # - DNSSEC=true                                          # Enable DNSSEC
      # - DNS_BOGUS_PRIV=true                                  # Never forward bogon IPs
      # - DNS_FQDN_REQUIRED=true                               # Never forward non-FQDNs
      # - REV_SERVER=true                                      # Enable reverse server (router)
      # - REV_SERVER_CIDR=192.168.0.0/16                       # Reverse server CIDR
      # - REV_SERVER_TARGET=192.168.0.1                        # Reverse server target (router IP)

    volumes:
      - ${DOCKER_DATA}/networking/pihole/config:/etc/pihole
      - ${DOCKER_DATA}/networking/pihole/dnsmasq:/etc/dnsmasq.d

    ports:
      - ${PORT_PIHOLE:-8080}:80                                # Admin web UI
      - ${PORT_PIHOLE_DNS:-53}:53/tcp                          # DNS over TCP
      - ${PORT_PIHOLE_DNS:-53}:53/udp                          # DNS over UDP
      # - 67:67/udp                                            # DHCP server (optional)

    # networks:
    #   - ${DEFAULT_NETWORK}
