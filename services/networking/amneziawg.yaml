# AMNEZIAVPN
# GitHub: https://github.com/amnezia-vpn/amnezia-client
# Image: amneziavpn/amnezia-wg:latest
# Docs: https://docs.amnezia.org/documentation/amnezia-wg/
#
# AmneziaVPN is a censorship-resistant VPN solution that extends WireGuard
# with traffic obfuscation to bypass Deep Packet Inspection (DPI).
# AmneziaWG (AWG) is the obfuscated WireGuard protocol that prevents
# fingerprinting by ISPs and censors. The server component runs as a
# WireGuard-compatible daemon with obfuscation applied.
# Client apps available for Windows, macOS, Android, iOS, and Linux.

services:
  amneziawg:
    image: amneziavpn/amnezia-wg:latest
    container_name: amneziawg
    hostname: amneziawg
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/amneziawg/config:/config
      - ${DOCKER_DATA}/amneziawg/data:/data
    ports:
      # WireGuard/AmneziaWG UDP port (choose a non-standard port to avoid detection)
      - ${PORT_AMNEZIAWG:-51820}:51820/udp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# AmneziaVPN server setup:
# 1. Generate server keys:
#    docker exec amneziawg awg genkey | tee /tmp/server_private | awg pubkey > /tmp/server_public
#
# 2. Create ${DOCKER_DATA}/amneziawg/config/wg0.conf:
#    [Interface]
#    PrivateKey = <server-private-key>
#    Address = 10.8.0.1/24
#    ListenPort = 51820
#    PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
#    PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
#
#    # Obfuscation parameters (AmneziaWG specific)
#    Jc = 3       # Junk packet count (1-128)
#    Jmin = 50    # Junk min size
#    Jmax = 1000  # Junk max size
#    S1 = 0       # Init packet junk size
#    S2 = 0       # Response junk size
#    H1 = 1       # Init packet magic header
#    H2 = 2       # Response magic header
#    H3 = 3       # Cookie magic header
#    H4 = 4       # Transport magic header
#
#    [Peer]
#    PublicKey = <client-public-key>
#    AllowedIPs = 10.8.0.2/32
#
# 3. Configure AmneziaVPN client app with server IP and obfuscation params
# ============================================================
