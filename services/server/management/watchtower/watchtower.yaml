# WATCHTOWER
# GitHub: https://github.com/containrrr/watchtower
# Image: containrrr/watchtower
# Docs: https://containrrr.dev/watchtower/
#
# Automatically updates running Docker containers when new images are available.
# Can notify via email, Slack, and other services after updates.

services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true                                 # Remove old images after update
      - WATCHTOWER_SCHEDULE=0 0 4 * * *                        # Cron: run daily at 4 AM
      # - WATCHTOWER_NOTIFICATIONS=shoutrrr                    # Notification provider
      # - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL} # Notification URL
      # - WATCHTOWER_MONITOR_ONLY=true                         # Only monitor, don't update

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock               # Docker socket (required)

    # networks:
    #   - ${DEFAULT_NETWORK}
