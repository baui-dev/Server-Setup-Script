# POSTAL
# GitHub: https://github.com/postalserver/postal
# Image: ghcr.io/postalserver/postal:latest
# Docs: https://docs.postalserver.io
#
# Postal is a full-featured, open-source mail delivery platform — an
# alternative to SendGrid, Mailgun, and Postmark. It provides a web UI
# for managing mail servers, domains, API credentials, and delivery logs.
#
# Architecture: Postal runs as multiple processes from the same image:
#   - web-server:  Rails web UI and REST API (port 5000)
#   - smtp-server: Incoming SMTP receiver (port 25)
#   - worker:      Background job processor (deliveries, webhooks)
#   - cron:        Scheduled maintenance tasks
#
# Setup steps:
#   1. Create the config directory and generate postal.yml:
#        docker run --rm -v /opt/docker/postal/config:/config \
#          ghcr.io/postalserver/postal postal initialize-config
#   2. Edit postal.yml (set your domain, database credentials, secret key, etc.)
#   3. Start the stack: docker compose up -d
#   4. Initialize the database:
#        docker exec -it postal postal initialize
#   5. Create the first admin user:
#        docker exec -it postal postal make-user
#   6. Access the web UI at http://<host>:${PORT_POSTAL_HTTP}
#
# DNS records required per mail server:
#   MX:  postal.example.com  ->  your server IP
#   A:   postal.example.com  ->  your server IP
#   SPF, DKIM, and DMARC must be configured per mail server in the UI.

services:
  postal:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal
    hostname: postal
    restart: unless-stopped
    command: postal web-server
    environment:
      - TZ=${TZ}
      # Postal is configured via /config/postal.yml (generated by initialize-config).
      # The YAML file must include database, redis, signing secret, and SMTP settings.
      # - POSTAL_WEB_HOST=postal.${DOMAIN}             # Hostname for web UI (set in postal.yml)
    volumes:
      - ${BASE_DATA}/postal/config:/config               # Contains postal.yml and signing keys
    ports:
      - "${PORT_POSTAL_HTTP}:5000"                       # Postal web UI and REST API
    depends_on:
      postal-mysql:
        condition: service_healthy
      postal-redis:
        condition: service_healthy
    # networks:
    #   - ${DOCKER_NETWORK}

  postal-smtp:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal-smtp
    hostname: postal-smtp
    restart: unless-stopped
    command: postal smtp-server
    environment:
      - TZ=${TZ}
    volumes:
      - ${BASE_DATA}/postal/config:/config               # Shares the same config as the web server
    ports:
      - "25:25"                                          # SMTP — inbound mail from remote MTAs
      # - "587:587"                                      # SMTP Submission (if configured in postal.yml)
    depends_on:
      - postal
    # networks:
    #   - ${DOCKER_NETWORK}

  postal-worker:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal-worker
    hostname: postal-worker
    restart: unless-stopped
    command: postal worker
    environment:
      - TZ=${TZ}
    volumes:
      - ${BASE_DATA}/postal/config:/config               # Shares the same config
    depends_on:
      - postal
    # networks:
    #   - ${DOCKER_NETWORK}

  postal-cron:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal-cron
    hostname: postal-cron
    restart: unless-stopped
    command: postal cron
    environment:
      - TZ=${TZ}
    volumes:
      - ${BASE_DATA}/postal/config:/config               # Shares the same config
    depends_on:
      - postal
    # networks:
    #   - ${DOCKER_NETWORK}

  postal-mysql:
    image: mysql:8.0
    container_name: postal-mysql
    hostname: postal-mysql
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=postal
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ${BASE_DATA}/postal/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # networks:
    #   - ${DOCKER_NETWORK}

  postal-redis:
    image: redis:7-alpine
    container_name: postal-redis
    hostname: postal-redis
    restart: unless-stopped
    # Note: Postal typically connects to Redis without a password (configure in postal.yml if needed)
    command: redis-server --appendonly yes
    volumes:
      - ${BASE_DATA}/postal/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # networks:
    #   - ${DOCKER_NETWORK}

# networks:
#   proxy:
#     external: true
