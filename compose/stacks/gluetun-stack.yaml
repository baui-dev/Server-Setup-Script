# gluetun-stack
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  gluetun-stack:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: gluetun-stack
    hostname: gluetun-stack
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/compose/stacks/gluetun-stack/config:/config
    ports:
      - ${PORT_GLUETUN_STACK:-18080}:8080
