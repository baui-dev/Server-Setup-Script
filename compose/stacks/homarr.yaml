# HOMARR
# GitHub: https://github.com/ajnart/homarr
# Image: ghcr.io/ajnart/homarr:latest
# Docs: https://homarr.dev/docs/getting-started
#
# Homarr is a modern, feature-rich home server dashboard with drag-and-drop
# customization, built-in integrations for popular self-hosted apps (Sonarr,
# Radarr, qBittorrent, etc.), widgets, and user management.

services:
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    hostname: homarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Secret key for JWT signing — generate with: openssl rand -hex 32
      - SECRET_ENCRYPTION_KEY=${SECRET_KEY}
      # Optional: set AUTH_PROVIDER to "credentials" (default) or "ldap"
      - AUTH_PROVIDER=credentials
      # Optional: disable auto-login for single-user setups
      # - AUTH_DISABLE_CREDENTIALS_AUTH=false
    volumes:
      - ${BASE_DATA}/homarr/config:/appdata/configs
      - ${BASE_DATA}/homarr/icons:/app/public/icons
      - ${BASE_DATA}/homarr/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${PORT_HOMARR}:7575
    # networks:
    #   - ${DOCKER_NETWORK}

