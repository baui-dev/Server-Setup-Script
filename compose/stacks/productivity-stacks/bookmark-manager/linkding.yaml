# Linkding
# GitHub: https://github.com/sissbruecker/linkding
# Image: sissbruecker/linkding:latest
# Docs: https://github.com/sissbruecker/linkding/blob/master/docs/README.md
#
# Minimal self-hosted bookmark manager with a focus on simplicity and speed.
# Features tag-based organization, bookmarklet, browser extensions, and a REST API.
# Stores data in SQLite by default. Supports optional PostgreSQL backend.
# Automatically fetches favicons and creates text snapshots of bookmarked pages.

services:
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    hostname: linkding
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Initial superuser credentials (only used if no superuser exists)
      - LD_SUPERUSER_NAME=${LINKDING_ADMIN_USER:-admin}
      - LD_SUPERUSER_PASSWORD=${LINKDING_ADMIN_PASSWORD:-changeme}
      # Optional: superuser email
      - LD_SUPERUSER_EMAIL=${LINKDING_ADMIN_EMAIL:-admin@example.com}
      # Disable public user registration (recommended for personal use)
      - LD_ENABLE_PUBLIC_SHARING=False
      # Context path if running behind a reverse proxy sub-path (e.g., /bookmarks)
      # - LD_CONTEXT_PATH=bookmarks/
      # Server port inside the container
      - LD_SERVER_PORT=9090
      # Enable authentication proxy support (e.g., Authelia, Authentik)
      # - LD_ENABLE_AUTH_PROXY=True
      # - LD_AUTH_PROXY_USERNAME_HEADER=HTTP_X_FORWARDED_USER
      # - LD_AUTH_PROXY_LOGOUT_URL=https://auth.${DOMAIN}/logout
      # Optional: custom DB backend (default is SQLite)
      # - LD_DB_ENGINE=postgres
      # - LD_DB_HOST=linkding-postgres
      # - LD_DB_NAME=linkding
      # - LD_DB_USER=${POSTGRES_USER}
      # - LD_DB_PASSWORD=${POSTGRES_PASSWORD}
      # - LD_DB_PORT=5432
    volumes:
      # Persists the SQLite database and favicon cache
      - ${BASE_DATA}/linkding/data:/etc/linkding/data
    ports:
      - ${PORT_LINKDING:-9090}:9090
    # networks:
    #   - ${DOCKER_NETWORK}

