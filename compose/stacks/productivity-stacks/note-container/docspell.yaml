# docspell
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  docspell:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: docspell
    hostname: docspell
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/productivity-stacks/note-container/docspell/config:/config
    ports:
      - ${PORT_DOCSPELL:-18080}:8080
