# plumio
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  plumio:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: plumio
    hostname: plumio
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/productivity-stacks/note-container/plumio/config:/config
    ports:
      - ${PORT_PLUMIO:-18080}:8080
