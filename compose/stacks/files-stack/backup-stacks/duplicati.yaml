# ZeroTier
# GitHub: https://github.com/zerotier/ZeroTierOne
# Image: zerotier/zerotier:latest
# Docs: https://docs.zerotier.com/self-hosting/network-controllers
#
# Software-defined networking (SDN) / mesh VPN. Connects devices across the
# internet as if they were on a local LAN, with automatic NAT traversal.
# Requires a ZeroTier network ID from my.zerotier.com or a self-hosted
# controller. Needs NET_ADMIN and SYS_MODULE capabilities plus the TUN device.

services:
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    hostname: zerotier
    restart: unless-stopped
    # ZeroTier must run in host network mode or with specific capabilities
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - TZ=${TZ}
      # Automatically join this network on container start
      # - ZEROTIER_ONE_NETWORK_IDS=<your-network-id>
    volumes:
      # Persists identity and network config across restarts
      - ${BASE_DATA}/zerotier/data:/var/lib/zerotier-one
    # ports: not needed when network_mode: host

