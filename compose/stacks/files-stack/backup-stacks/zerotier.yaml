# AList (Cloud Stacks)
# GitHub: https://github.com/alist-org/alist
# Image: xhofe/alist:latest
# Docs: https://alist.nn.ci/guide/
#
# Self-hosted file list and WebDAV server supporting 40+ cloud and network
# storage backends. Deployed here as part of the cloud-stacks collection,
# configured to front cloud storage providers (OneDrive, Google Drive,
# Alibaba Cloud Drive, BaiduPan, Quark, 115, S3, etc.) with a unified web UI.

services:
  alist:
    image: xhofe/alist:latest
    container_name: alist-cloud
    hostname: alist-cloud
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Set to true to force a password reset on next start
      - ALIST_FORCE_RESET_PASSWORD=false
    volumes:
      - ${BASE_DATA}/alist-cloud/data:/opt/alist/data
    ports:
      - ${PORT_ALIST}:5244
    # networks:
    #   - ${DOCKER_NETWORK}

