# syncthing
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  syncthing:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: syncthing
    hostname: syncthing
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/files-stack/file-sync-stacks/syncthing/config:/config
    ports:
      - ${PORT_SYNCTHING:-18080}:8080
