# resilio
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  resilio:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: resilio
    hostname: resilio
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/files-stack/file-sync-stacks/resilio/config:/config
    ports:
      - ${PORT_RESILIO:-18080}:8080
