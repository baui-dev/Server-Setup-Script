# flemmarr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  flemmarr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: flemmarr
    hostname: flemmarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/flemmarr/config:/config
    ports:
      - ${PORT_FLEMMARR:-18080}:8080
