# huntarrr2
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  huntarrr2:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: huntarrr2
    hostname: huntarrr2
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/huntarrr2/config:/config
    ports:
      - ${PORT_HUNTARRR2:-18080}:8080
