# releasarr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  releasarr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: releasarr
    hostname: releasarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/music-stack/releasarr/config:/config
    ports:
      - ${PORT_RELEASARR:-18080}:8080
