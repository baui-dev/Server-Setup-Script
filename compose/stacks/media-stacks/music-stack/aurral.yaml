# aurral
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  aurral:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: aurral
    hostname: aurral
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/music-stack/aurral/config:/config
    ports:
      - ${PORT_AURRAL:-18080}:8080
