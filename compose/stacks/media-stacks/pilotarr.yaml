# pilotarr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  pilotarr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: pilotarr
    hostname: pilotarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/pilotarr/config:/config
    ports:
      - ${PORT_PILOTARR:-18080}:8080
