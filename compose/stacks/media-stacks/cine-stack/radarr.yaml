# RADARR
# GitHub: https://github.com/Radarr/Radarr
# Image: lscr.io/linuxserver/radarr:latest
# Docs: https://wiki.servarr.com/radarr
#
# Radarr is a movie collection manager for Usenet and BitTorrent users.
# Monitors multiple RSS feeds for new movies, integrates with download clients
# and subtitle managers, and handles post-processing, renaming, and quality upgrades.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${BASE_DATA}/radarr/config:/config       # Radarr configuration and SQLite database
      - ${MOVIES_DIR}:/movies                    # Movie library root path
      - ${DOWNLOADS_DIR}:/downloads              # Download client completed downloads path
      # - ${MEDIA_DIR}:/media                    # Optional: unified media root if using single-path layout
    ports:
      - ${PORT_RADARR:-7878}:7878
    # networks:
    #   - ${DOCKER_NETWORK}

