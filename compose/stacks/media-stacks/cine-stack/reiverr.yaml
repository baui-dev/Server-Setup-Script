# reiverr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  reiverr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: reiverr
    hostname: reiverr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/cine-stack/reiverr/config:/config
    ports:
      - ${PORT_REIVERR:-18080}:8080
