# exportarr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  exportarr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: exportarr
    hostname: exportarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/exportarr/config:/config
    ports:
      - ${PORT_EXPORTARR:-18080}:8080
