# ente
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  ente:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: ente
    hostname: ente
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/image-stack/ente/config:/config
    ports:
      - ${PORT_ENTE:-18080}:8080
