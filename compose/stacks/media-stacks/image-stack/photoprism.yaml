# photoprism
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  photoprism:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: photoprism
    hostname: photoprism
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/image-stack/photoprism/config:/config
    ports:
      - ${PORT_PHOTOPRISM:-18080}:8080
