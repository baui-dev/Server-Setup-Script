# prefetcharr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  prefetcharr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: prefetcharr
    hostname: prefetcharr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/cine-stack/prefetcharr/config:/config
    ports:
      - ${PORT_PREFETCHARR:-18080}:8080
