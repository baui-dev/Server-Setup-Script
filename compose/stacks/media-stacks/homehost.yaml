# HOMEHOST (ridhwaans)
# GitHub: https://github.com/ridhwaans/homehost
# Image: ridhwaans/homehost (Docker Hub — verify availability)
# Docs: https://github.com/ridhwaans/homehost#readme
#
# HomeHost is a self-hosted Node.js streaming server for locally stored videos.
# Supports local media libraries and serves a simple web interface for browsing
# and streaming video content directly in the browser.
#
# NOTE: This project was last active circa 2021 and may not have an up-to-date
# Docker image. Verify the image exists on Docker Hub before deploying.
# See cine-stack/homehost.yaml for a similar, actively maintained alternative:
#   https://github.com/home-host/homehost (ghcr.io/home-host/homehost)
#
# If a Docker image is unavailable, build from source:
#   git clone https://github.com/ridhwaans/homehost
#   docker build -t ridhwaans/homehost .

