# swaparr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  swaparr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: swaparr
    hostname: swaparr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/media-stacks/swaparr/config:/config
    ports:
      - ${PORT_SWAPARR:-18080}:8080
