# N8N
# GitHub: https://github.com/n8n-io/n8n
# Image: n8nio/n8n:latest
# Docs: https://docs.n8n.io/hosting/installation/docker/
#
# n8n is a powerful, fair-code workflow automation platform with 400+ integrations.
# It lets you connect APIs, services, and databases with a visual node-based editor.
# Ideal for automating repetitive tasks, building AI agent pipelines, and integrating
# services without writing much code. Includes built-in AI/LLM nodes for agentic workflows.
# PostgreSQL is recommended over SQLite for production use (better performance, reliability).
#
# === QUICK START ===
# 1. Copy config.env to .env and set N8N_BASIC_AUTH_USER, N8N_BASIC_AUTH_PASSWORD,
#    N8N_ENCRYPTION_KEY, and POSTGRES_PASSWORD
# 2. docker compose -f n8n.yaml up -d
# 3. Navigate to http://localhost:${PORT_N8N}
#
# === UPGRADE NOTE ===
# Always back up your database before upgrading. Migrations run automatically on start.

services:

  # --- PostgreSQL (recommended for production) ---
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    hostname: n8n-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=n8n
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_NON_ROOT_USER=n8n
      - POSTGRES_NON_ROOT_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${BASE_DATA}/n8n/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- n8n ---
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}          # n8n's own timezone setting for cron nodes

      # --- Authentication ---
      # Basic auth (legacy method, still supported)
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      # Owner / first-user setup (alternative to basic auth for n8n v1+)
      # - N8N_USER_MANAGEMENT_DISABLED=false
      # - N8N_EMAIL_MODE=smtp           # Enable email for user invitations

      # --- Encryption ---
      # REQUIRED: Encrypts saved credentials in the database. Back this up!
      # Generate with: openssl rand -hex 32
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # --- Database (PostgreSQL) ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # - DB_POSTGRESDB_SSL_ENABLED=false  # Enable if using SSL/TLS for Postgres connection
      # Uncomment for SQLite (simpler but not recommended for production):
      # - DB_TYPE=sqlite
      # - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite

      # --- URLs & Networking ---
      - N8N_HOST=${N8N_HOST:-n8n.${DOMAIN}}     # Hostname where n8n is accessible (for webhooks)
      - N8N_PORT=5678                            # Internal listen port
      - N8N_PROTOCOL=https                       # Protocol used externally (http or https)
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.${DOMAIN}}/  # Full webhook base URL (trailing slash required)
      # - N8N_LISTEN_ADDRESS=0.0.0.0             # Bind address

      # --- Execution Data ---
      - EXECUTIONS_DATA_PRUNE=true               # Prune old execution logs to save disk space
      - EXECUTIONS_DATA_MAX_AGE=168              # Keep execution data for this many hours (168 = 7 days)
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000    # Maximum number of executions to keep
      # - EXECUTIONS_PROCESS=main                # main (in-process) or own (isolated worker)
      # - EXECUTIONS_TIMEOUT=3600                # Workflow execution timeout in seconds
      # - EXECUTIONS_TIMEOUT_MAX=7200            # Maximum allowed timeout override in seconds

      # --- Logging ---
      # - N8N_LOG_LEVEL=info             # Log level: debug | info | warn | error
      # - N8N_LOG_OUTPUT=console         # Log destination: console, file, or console,file
      # - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs/n8n.log

      # --- Email (SMTP - for user invitations and notifications) ---
      # - N8N_EMAIL_MODE=smtp
      # - N8N_SMTP_HOST=smtp.example.com
      # - N8N_SMTP_PORT=587
      # - N8N_SMTP_USER=
      # - N8N_SMTP_PASS=
      # - N8N_SMTP_SENDER=n8n@example.com
      # - N8N_SMTP_SSL=false

      # --- Security & Performance ---
      # - N8N_PAYLOAD_SIZE_MAX=16          # Max payload size in MB
      # - N8N_METRICS=false                # Enable Prometheus metrics endpoint at /metrics
      # - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false

      # --- Diagnostics / Telemetry ---
      # - N8N_DIAGNOSTICS_ENABLED=false    # Disable diagnostic data collection
      # - N8N_VERSION_NOTIFICATIONS_ENABLED=false  # Disable version update notifications
      # - N8N_PERSONALIZATION_ENABLED=false # Disable personalization survey on first use

      # --- External Secrets (n8n Enterprise) ---
      # - N8N_EXTERNAL_SECRETS_UPDATE_INTERVAL=300  # Seconds between secret refresh

      # --- Community Nodes ---
      - NODE_FUNCTION_ALLOW_BUILTIN=*      # Allow all built-in Node.js modules in Code nodes
      # - NODE_FUNCTION_ALLOW_EXTERNAL=    # Comma-separated list of allowed external npm packages

    volumes:
      - ${BASE_DATA}/n8n/config:/home/node/.n8n    # n8n config, credentials cache, custom nodes

    ports:
      - ${PORT_N8N}:5678                   # WebUI + Webhook receiver

