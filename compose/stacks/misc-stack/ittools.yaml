# ittools
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  ittools:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: ittools
    hostname: ittools
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/misc-stack/ittools/config:/config
    ports:
      - ${PORT_ITTOOLS:-18080}:8080
