# tianzy
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  tianzy:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: tianzy
    hostname: tianzy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/tianzy/config:/config
    ports:
      - ${PORT_TIANZY:-18080}:8080
