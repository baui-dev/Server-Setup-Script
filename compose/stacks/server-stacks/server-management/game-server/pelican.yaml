# pelican
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  pelican:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: pelican
    hostname: pelican
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/server-management/game-server/pelican/config:/config
    ports:
      - ${PORT_PELICAN:-18080}:8080
