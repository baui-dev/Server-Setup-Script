# byparr
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  byparr:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: byparr
    hostname: byparr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/download-stacks/byparr/config:/config
    ports:
      - ${PORT_BYPARR:-18080}:8080
