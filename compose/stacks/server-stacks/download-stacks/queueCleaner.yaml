# queuecleaner
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  queuecleaner:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: queuecleaner
    hostname: queuecleaner
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/download-stacks/queuecleaner/config:/config
    ports:
      - ${PORT_QUEUECLEANER:-18080}:8080
