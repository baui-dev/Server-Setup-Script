# netbox
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  netbox:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: netbox
    hostname: netbox
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/download-stacks/netbox/config:/config
    ports:
      - ${PORT_NETBOX:-18080}:8080
