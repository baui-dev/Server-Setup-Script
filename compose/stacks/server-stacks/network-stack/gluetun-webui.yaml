# gluetun-webui
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  gluetun-webui:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: gluetun-webui
    hostname: gluetun-webui
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/network-stack/gluetun-webui/config:/config
    ports:
      - ${PORT_GLUETUN_WEBUI:-18080}:8080
