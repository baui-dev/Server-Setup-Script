# authelia
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  authelia:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/network-stack/authelia/config:/config
    ports:
      - ${PORT_AUTHELIA:-18080}:8080
