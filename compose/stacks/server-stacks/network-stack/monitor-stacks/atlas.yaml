# atlas
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  atlas:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: atlas
    hostname: atlas
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/network-stack/monitor-stacks/atlas/config:/config
    ports:
      - ${PORT_ATLAS:-18080}:8080
