# NETGOAT (Replacement: Nginx Proxy Manager)
# GitHub: https://github.com/NginxProxyManager/nginx-proxy-manager
# Image: jc21/nginx-proxy-manager:latest
# Docs: https://nginxproxymanager.com/guide/
#
# The original Netgoat project/image could not be verified.
# This stack provides a maintained reverse-proxy replacement with a web UI.

services:
	netgoat:
		image: jc21/nginx-proxy-manager:latest
		container_name: netgoat-proxy
		hostname: netgoat-proxy
		restart: unless-stopped
		environment:
			- TZ=${TZ}
		volumes:
			- ${BASE_DATA}/netgoat-proxy/data:/data
			- ${BASE_DATA}/netgoat-proxy/letsencrypt:/etc/letsencrypt
		ports:
			- 80:80
			- 443:443
			- ${PORT_NETGOAT_ADMIN:-81}:81

