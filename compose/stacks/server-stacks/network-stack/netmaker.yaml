# netmaker
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  netmaker:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: netmaker
    hostname: netmaker
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/network-stack/netmaker/config:/config
    ports:
      - ${PORT_NETMAKER:-18080}:8080
