# docker-compose-maker
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  docker-compose-maker:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: docker-compose-maker
    hostname: docker-compose-maker
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/server-stacks/docker-compose-maker/config:/config
    ports:
      - ${PORT_DOCKER_COMPOSE_MAKER:-18080}:8080
