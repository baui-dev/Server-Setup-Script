# PORTAINER CE
# GitHub: https://github.com/portainer/portainer
# Image: portainer/portainer-ce:latest
# Docs: https://docs.portainer.io
#
# Portainer Community Edition is a lightweight management UI for Docker,
# Docker Swarm, and Kubernetes. Provides a web-based interface to manage
# containers, images, volumes, networks, and stacks. The edge agent port
# (8000) enables remote management of edge environments.

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BASE_DATA}/portainer/data:/data
    ports:
      # Web UI
      - ${PORT_PORTAINER}:9000
      # Edge agent tunnel (for managing remote Portainer edge agents)
      - ${PORT_PORTAINER_EDGE}:8000
