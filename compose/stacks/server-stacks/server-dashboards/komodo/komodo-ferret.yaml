# KOMODO (FERRETDB BACKEND)
# GitHub: https://github.com/moghtech/komodo
# Image: ghcr.io/moghtech/komodo-core:latest
# Docs: https://komo.do/docs
#
# Komodo is a comprehensive server and Docker resource management platform.
# This stack uses FerretDB (Mongo-compatible) backed by PostgreSQL.
# Deploys: Postgres + FerretDB adapter, Komodo Core, and Komodo Periphery agent.
#
# Generate compose.env alongside this file with:
#   KOMODO_PASSKEY, KOMODO_DATABASE_USERNAME, KOMODO_DATABASE_PASSWORD

services:
  postgres:
    # Pin to a specific version in production:
    # https://github.com/FerretDB/documentdb/pkgs/container/postgres-documentdb
    image: ghcr.io/ferretdb/postgres-documentdb:latest
    container_name: komodo-postgres
    hostname: komodo-postgres
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${KOMODO_DB_USERNAME}
      - POSTGRES_PASSWORD=${KOMODO_DB_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - ${BASE_DATA}/komodo/postgres:/var/lib/postgresql/data
    # ports:
    #   - 5432:5432
    # networks:
    #   - ${DOCKER_NETWORK}

  ferretdb:
    # Pin to a specific version in production:
    # https://github.com/FerretDB/FerretDB/pkgs/container/ferretdb
    image: ghcr.io/ferretdb/ferretdb:latest
    container_name: komodo-ferretdb
    hostname: komodo-ferretdb
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - TZ=${TZ}
      - FERRETDB_POSTGRESQL_URL=postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@komodo-postgres:5432/postgres
    volumes:
      - ${BASE_DATA}/komodo/ferretdb:/state
    # ports:
    #   - 27017:27017
    # networks:
    #   - ${DOCKER_NETWORK}

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    container_name: komodo-core
    hostname: komodo-core
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - ferretdb
    env_file: ./compose.env
    environment:
      - TZ=${TZ}
      - KOMODO_DATABASE_ADDRESS=komodo-ferretdb:27017
      - KOMODO_DATABASE_USERNAME=${KOMODO_DB_USERNAME}
      - KOMODO_DATABASE_PASSWORD=${KOMODO_DB_PASSWORD}
      - KOMODO_PASSKEY=${KOMODO_PASSKEY}
    volumes:
      # Core cache for repos / latest commit hash
      - ${BASE_DATA}/komodo/repo-cache:/repo-cache
      # Optionally store sync files on the host:
      # - ${BASE_DATA}/komodo/syncs:/syncs
      # Optionally mount a custom config:
      # - ${BASE_DATA}/komodo/core.config.toml:/config/config.toml
    ports:
      - ${PORT_KOMODO}:9120
    # Allows systemd Periphery connection at http://host.docker.internal:8120
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    # networks:
    #   - ${DOCKER_NETWORK}

  periphery:
    # Deploy as container here, or as a systemd binary:
    # https://github.com/moghtech/komodo/tree/main/scripts
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    container_name: komodo-periphery
    hostname: komodo-periphery
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./compose.env
    environment:
      - TZ=${TZ}
      - PERIPHERY_PASSKEY=${KOMODO_PASSKEY}
    volumes:
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Allow Periphery to see host processes
      - /proc:/proc
      # Periphery agent root directory — must match inside and outside container.
      # See: https://github.com/moghtech/komodo/discussions/180
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    # networks:
    #   - ${DOCKER_NETWORK}

# networks:
#   proxy:
#     external: true
