# HOMEPAGE
# GitHub: https://github.com/gethomepage/homepage
# Image: ghcr.io/gethomepage/homepage:latest
# Docs: https://gethomepage.dev/installation/docker
#
# Homepage is a highly customizable static dashboard with integrations
# for hundreds of self-hosted services. Configured entirely via YAML files.
# Supports Docker socket auto-discovery, widgets, bookmarks, and more.

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    hostname: homepage
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Pass env vars into widget configurations using this prefix:
      # - HOMEPAGE_VAR_MYTOKEN=secrettoken
    volumes:
      # Configuration files (services.yaml, bookmarks.yaml, widgets.yaml, etc.)
      - ${BASE_DATA}/homepage/config:/app/config
      # Optional: serve custom static files
      - ${BASE_DATA}/homepage/images:/app/public/images
      # Docker socket for auto-discovery (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - ${PORT_HOMEPAGE}:3000
    # networks:
    #   - ${DOCKER_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# REQUIRED: Create configuration files under ${BASE_DATA}/homepage/config/
# Key files:
#   services.yaml   — define service groups and links
#   bookmarks.yaml  — quick-access bookmarks
#   widgets.yaml    — top-bar info widgets (weather, search, etc.)
#   docker.yaml     — Docker socket integration settings
#   settings.yaml   — global settings (title, theme, layout, etc.)
# See: https://gethomepage.dev/configs/services/
# ============================================================
