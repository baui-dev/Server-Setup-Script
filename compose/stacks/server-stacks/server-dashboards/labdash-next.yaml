# LABDASH-NEXT (Replacement: Homarr)
# GitHub: https://github.com/ajnart/homarr
# Image: ghcr.io/ajnart/homarr:latest
# Docs: https://homarr.dev/docs/
#
# The original Labdash Next project/image could not be verified.
# This replacement provides a maintained homelab dashboard.

services:
	labdash-next:
		image: ghcr.io/ajnart/homarr:latest
		container_name: labdash-next
		hostname: labdash-next
		restart: unless-stopped
		environment:
			- TZ=${TZ}
			- SECRET_ENCRYPTION_KEY=${HOMARR_ENCRYPTION_KEY}
		volumes:
			- ${BASE_DATA}/labdash-next/data:/app/data
			- /var/run/docker.sock:/var/run/docker.sock:ro
		ports:
			- ${PORT_LABDASH_NEXT:-7575}:7575

