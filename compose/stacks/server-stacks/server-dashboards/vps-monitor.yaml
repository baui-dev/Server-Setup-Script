# VPS-MONITOR (Replacement: Netdata)
# GitHub: https://github.com/netdata/netdata
# Image: netdata/netdata:stable

services:
	vps-monitor:
		image: netdata/netdata:stable
		container_name: vps-monitor
		hostname: vps-monitor
		restart: unless-stopped
		cap_add:
			- SYS_PTRACE
		security_opt:
			- apparmor:unconfined
		environment:
			- TZ=${TZ}
		volumes:
			- ${BASE_DATA}/vps-monitor/config:/etc/netdata
			- ${BASE_DATA}/vps-monitor/lib:/var/lib/netdata
			- ${BASE_DATA}/vps-monitor/cache:/var/cache/netdata
			- /etc/passwd:/host/etc/passwd:ro
			- /etc/group:/host/etc/group:ro
			- /proc:/host/proc:ro
			- /sys:/host/sys:ro
			- /etc/os-release:/host/etc/os-release:ro
		ports:
			- ${PORT_VPS_MONITOR:-19999}:19999
