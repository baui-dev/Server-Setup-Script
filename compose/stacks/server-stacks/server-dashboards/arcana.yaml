# ARCANA (Replacement: Homepage)
# GitHub: https://github.com/gethomepage/homepage
# Image: ghcr.io/gethomepage/homepage:latest
# Docs: https://gethomepage.dev/latest/
#
# The original Arcana project/image could not be verified.
# This replacement provides a maintained dashboard with widget integrations.

services:
	arcana:
		image: ghcr.io/gethomepage/homepage:latest
		container_name: arcana
		hostname: arcana
		restart: unless-stopped
		environment:
			- TZ=${TZ}
		volumes:
			- ${BASE_DATA}/arcana/config:/app/config
			- /var/run/docker.sock:/var/run/docker.sock:ro
		ports:
			- ${PORT_ARCANA:-3000}:3000

