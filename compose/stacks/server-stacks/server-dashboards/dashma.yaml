# DASHMA (Replacement: Dashy)
# GitHub: https://github.com/Lissy93/dashy
# Image: lissy93/dashy:latest

services:
	dashma:
		image: lissy93/dashy:latest
		container_name: dashma
		hostname: dashma
		restart: unless-stopped
		environment:
			- TZ=${TZ}
		volumes:
			- ${BASE_DATA}/dashma/conf.yml:/app/user-data/conf.yml
		ports:
			- ${PORT_DASHMA:-4000}:8080

