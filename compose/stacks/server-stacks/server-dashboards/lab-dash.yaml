# LAB-DASH (Replacement: Flame)
# GitHub: https://github.com/pawelmalak/flame
# Image: pawelmalak/flame:latest
# Docs: https://github.com/pawelmalak/flame
#
# The original Labdash project/image could not be verified.
# This replacement provides a lightweight bookmark/app dashboard.

services:
	lab-dash:
		image: pawelmalak/flame:latest
		container_name: lab-dash
		hostname: lab-dash
		restart: unless-stopped
		environment:
			- TZ=${TZ}
			- PASSWORD=${FLAME_PASSWORD:-changeme}
		volumes:
			- ${BASE_DATA}/lab-dash/data:/app/data
			- /var/run/docker.sock:/var/run/docker.sock
		ports:
			- ${PORT_LAB_DASH:-5005}:5005
