# WAZUH
# GitHub: https://github.com/wazuh/wazuh-docker
# Images: wazuh/wazuh-manager, wazuh/wazuh-indexer, wazuh/wazuh-dashboard
# Docs: https://documentation.wazuh.com/current/deployment-options/docker/
#
# Open-source SIEM and XDR platform. Collects, correlates, and analyses security
# events from endpoints, cloud workloads, and network devices.
# Architecture:
#   wazuh-manager   — Core SIEM engine: event ingestion, rules, active response
#   wazuh-indexer   — OpenSearch-based data store for security events
#   wazuh-dashboard — OpenSearch Dashboards UI for searching and visualising events
#
# IMPORTANT — TLS certificates:
#   The official single-node deployment generates self-signed certificates via
#   the wazuh-certs-generator container (run once before starting the stack).
#   See: https://documentation.wazuh.com/current/deployment-options/docker/wazuh-container.html
#   Mount the generated certs directory at the paths shown below.
#
# IMPORTANT — Indexer memory:
#   OpenSearch requires a high virtual memory map limit. Run once on the host:
#     sysctl -w vm.max_map_count=262144
#   Or set permanently in /etc/sysctl.d/99-wazuh.conf.

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.10.2
    container_name: wazuh-manager
    hostname: wazuh-manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - TZ=${TZ}
      # Indexer credentials — must match wazuh-indexer INDEXER_PASSWORD
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      # mTLS for Filebeat → Indexer communication
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      # Wazuh API credentials (used by Dashboard)
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      - ${BASE_DATA}/wazuh/manager/api:/var/ossec/api/configuration
      - ${BASE_DATA}/wazuh/manager/etc:/var/ossec/etc
      - ${BASE_DATA}/wazuh/manager/logs:/var/ossec/logs
      - ${BASE_DATA}/wazuh/manager/queue:/var/ossec/queue
      - ${BASE_DATA}/wazuh/manager/integrations:/var/ossec/integrations
      - ${BASE_DATA}/wazuh/manager/active-response:/var/ossec/active-response/bin
      - ${BASE_DATA}/wazuh/manager/agentless:/var/ossec/agentless
      - ${BASE_DATA}/wazuh/manager/wodles:/var/ossec/wodles
      - ${BASE_DATA}/wazuh/manager/filebeat-etc:/etc/filebeat
      - ${BASE_DATA}/wazuh/manager/filebeat-var:/var/lib/filebeat
      # TLS certificates generated by wazuh-certs-generator
      - ${BASE_DATA}/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ${BASE_DATA}/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ${BASE_DATA}/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      # Custom manager configuration
      # - ${BASE_DATA}/wazuh/config/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
    ports:
      - 1514:1514        # Agent event ingestion (TCP)
      - 1515:1515        # Agent self-registration (TCP)
      - 514:514/udp      # Remote syslog (UDP)
      - 55000:55000      # Wazuh REST API
    # networks:
    #   - ${DOCKER_NETWORK}

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.10.2
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - TZ=${TZ}
      # OpenSearch bootstrap password (becomes the 'admin' user password)
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${WAZUH_ADMIN_PASSWORD}"
      # Node identity
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"  # Increase for production
    volumes:
      - ${BASE_DATA}/wazuh/indexer/data:/var/lib/wazuh-indexer
      # TLS certificates
      - ${BASE_DATA}/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ${BASE_DATA}/wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem:ro
      - ${BASE_DATA}/wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer-key.pem:ro
      # Custom indexer config
      # - ${BASE_DATA}/wazuh/config/indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
    ports:
      - 9200:9200        # OpenSearch REST API (internal — restrict via firewall)
    # networks:
    #   - ${DOCKER_NETWORK}

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.10.2
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    environment:
      - TZ=${TZ}
      # Indexer host and credentials
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - WAZUH_API_URL=https://wazuh-manager
      # Dashboard admin credentials
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      # - SERVER_SSL_ENABLED=true              # Enable HTTPS on dashboard (requires certs below)
    volumes:
      # TLS certificates for the dashboard HTTPS endpoint
      - ${BASE_DATA}/wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ${BASE_DATA}/wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ${BASE_DATA}/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      # Custom dashboard config
      # - ${BASE_DATA}/wazuh/config/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    ports:
      - ${PORT_WAZUH_DASHBOARD}:443
    # networks:
    #   - ${DOCKER_NETWORK}

