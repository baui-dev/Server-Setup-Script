# databasement
# Restored scaffold generated from repository conventions.
# Replace image/ports/volumes with the real upstream service details if needed.

services:
  databasement:
    image: ghcr.io/linuxserver/baseimage-alpine:latest
    container_name: databasement
    hostname: databasement
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${DOCKER_DATA:-/srv/dockerdata}/hardened-stack/databases/databasement/config:/config
    ports:
      - ${PORT_DATABASEMENT:-18080}:8080
