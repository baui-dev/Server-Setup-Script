# AUTHELIA
# GitHub: https://github.com/authelia/authelia
# Image: authelia/authelia:latest
# Docs: https://www.authelia.com/integration/deployment/docker/
#
# Open-source authentication and authorization server providing SSO (single
# sign-on) with 2FA/MFA support. Acts as a forward-auth middleware for reverse
# proxies such as Traefik and Nginx. Requires a configuration.yml mounted at
# /config/configuration.yml and a Redis instance for session storage.

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Injected secrets — Authelia reads *_FILE variants if you prefer file-based secrets,
      # but plain env vars work for simple deployments.
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      # Redis connection for distributed session storage (matches companion service)
      - AUTHELIA_SESSION_REDIS_HOST=authelia-redis
      - AUTHELIA_SESSION_REDIS_PORT=6379
      # - AUTHELIA_SESSION_REDIS_PASSWORD=${REDIS_PASSWORD}  # Set if Redis auth is enabled
      # Optional PostgreSQL storage backend (replaces default SQLite)
      # - AUTHELIA_STORAGE_POSTGRES_HOST=authelia-postgres
      # - AUTHELIA_STORAGE_POSTGRES_DATABASE=authelia
      # - AUTHELIA_STORAGE_POSTGRES_USERNAME=${POSTGRES_USER}
      # - AUTHELIA_STORAGE_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Log verbosity: trace, debug, info, warn, error
      # - AUTHELIA_LOG_LEVEL=info
    volumes:
      # configuration.yml must exist here before starting — see docs for minimal example
      - ${BASE_DATA}/authelia/config:/config
    ports:
      - ${PORT_AUTHELIA}:9091
    depends_on:
      - authelia-redis
    # networks:
    #   - ${DOCKER_NETWORK}

  authelia-redis:
    image: redis:7-alpine
    container_name: authelia-redis
    hostname: authelia-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    # Uncomment to require a password (also set AUTHELIA_SESSION_REDIS_PASSWORD above)
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${BASE_DATA}/authelia/redis:/data
    # networks:
    #   - ${DOCKER_NETWORK}

# networks:
#   proxy:
#     external: true
