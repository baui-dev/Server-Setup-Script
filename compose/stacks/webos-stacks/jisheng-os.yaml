# Jisheng OS
# GitHub: https://github.com/jishengx/jisheng-os (Chinese web OS project)
# Image: nginx:alpine (static site - no official Docker image)
# Docs: https://github.com/jishengx/jisheng-os
#
# Jisheng OS is a Chinese-developed browser-based web desktop environment.
# There is no official prebuilt Docker image. Clone the repository, build
# the static assets, and serve them via nginx.
#
# Build steps (run once before starting):
#   git clone https://github.com/jishengx/jisheng-os /tmp/jisheng-src
#   cd /tmp/jisheng-src && npm install && npm run build
#   cp -r /tmp/jisheng-src/dist/* ${BASE_DATA}/jisheng-os/html/
#
# Note: Repository URL may vary - search GitHub for "jisheng-os" or "吉生OS"
# for the authoritative source.

services:
  jisheng-os:
    # No official Docker image available.
    # Build from source: git clone https://github.com/jishengx/jisheng-os
    image: nginx:alpine
    container_name: jisheng-os
    hostname: jisheng-os
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${BASE_DATA}/jisheng-os/html:/usr/share/nginx/html:ro
      - ${BASE_DATA}/jisheng-os/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${PORT_JISHENGS:-8887}:80
    # networks:
    #   - ${DOCKER_NETWORK}

