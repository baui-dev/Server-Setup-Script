# 1US OS
# GitHub: https://github.com/1usOS
# Web: https://webde.1us.ca/
# Image: nginx:alpine (static site - no official Docker image)
# Docs: https://github.com/1usOS
#
# 1US OS is a browser-based web desktop/OS environment. There is no official
# prebuilt Docker image. Clone the repo, build the static assets, then mount
# them into an nginx container. See build instructions in the comments below.

services:
  1us-os:
    image: nginx:alpine
    container_name: 1us-os
    hostname: 1us-os
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      # Build steps (run once before starting):
      #   git clone https://github.com/1usOS/1usOS /tmp/1us-os-src
      #   cd /tmp/1us-os-src && npm install && npm run build
      #   cp -r /tmp/1us-os-src/dist/* ${BASE_DATA}/1us-os/html/
      - ${BASE_DATA}/1us-os/html:/usr/share/nginx/html:ro
      - ${BASE_DATA}/1us-os/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${PORT_1USOS:-8880}:80
    # networks:
    #   - ${DOCKER_NETWORK}

# networks:
#   proxy:
#     external: true
