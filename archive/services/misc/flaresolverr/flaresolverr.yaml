# FLARESOLVERR
# GitHub: https://github.com/FlareSolverr/FlareSolverr
# Image: ghcr.io/flaresolverr/flaresolverr
# Docs: https://github.com/FlareSolverr/FlareSolverr#readme
#
# Proxy server to bypass Cloudflare and DDoS-GUARD protection. Used by Prowlarr
# and Jackett to access protected torrent indexers.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info                                         # Log level (error, warn, info, verbose, debug)
      # - LOG_HTML=false                                       # Log HTML content of requests
      # - CAPTCHA_SOLVER=none                                  # Captcha solver (none, hcaptcha-solver, etc.)
      # - BROWSER_TIMEOUT=40000                                # Browser timeout in milliseconds

    ports:
      - ${PORT_FLARESOLVERR:-8191}:8191

    # networks:
    #   - ${DEFAULT_NETWORK}
