# AI STACK
# Generated by scripts/generate-stacks.py
# Services: openwebui, n8n, anythingllm
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    hostname: openwebui
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/ai/openwebui/config:/app/backend/data
    ports:
    - ${PORT_OPENWEBUI:-3000}:8080
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/ai/n8n/config:/home/node/.n8n
    ports:
    - ${PORT_N8N:-5678}:5678
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    hostname: anythingllm
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/ai/anythingllm/config:/app/server/storage
    ports:
    - ${PORT_ANYTHINGLLM:-3020}:3001
