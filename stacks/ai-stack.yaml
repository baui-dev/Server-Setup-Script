# AI STACK
# Generated by scripts/generate-stacks.sh
# Services: openwebui n8n anythingllm
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f ai-stack.yaml up -d

services:
  # ── openwebui (services/ai/openwebui/openwebui.yaml)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    hostname: openwebui
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - OLLAMA_BASE_URL=http://ollama:11434                  # Ollama backend URL
      # - OPENAI_API_KEY=${OPENAI_API_KEY}                     # OpenAI API key (optional)
      # - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}                 # Secret key for sessions
      # - DEFAULT_MODELS=llama3                                # Default model to load

    volumes:
      - ${DOCKER_DATA}/ai/openwebui/config:/app/backend/data

    ports:
      - ${PORT_OPENWEBUI:-3000}:8080

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── n8n (services/ai/n8n/n8n.yaml)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - N8N_BASIC_AUTH_ACTIVE=true                           # Enable basic auth
      # - N8N_BASIC_AUTH_USER=admin                            # Basic auth username
      # - N8N_BASIC_AUTH_PASSWORD=changeme                     # Basic auth password
      # - N8N_HOST=n8n.${BASE_DOMAIN}                          # External hostname
      # - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}/              # Webhook base URL
      # - GENERIC_TIMEZONE=${TZ}                               # Timezone for workflows

    volumes:
      - ${DOCKER_DATA}/ai/n8n/config:/home/node/.n8n

    ports:
      - ${PORT_N8N:-5678}:5678

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── anythingllm (services/ai/anythingllm/anythingllm.yaml)
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    hostname: anythingllm
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - STORAGE_DIR=/app/server/storage                      # Data storage directory
      # - LLM_PROVIDER=ollama                                  # LLM provider (ollama, openai, etc.)
      # - OLLAMA_BASE_PATH=http://ollama:11434                 # Ollama base URL
      # - VECTOR_DB=lancedb                                    # Vector database provider
      # - JWT_SECRET=${JWT_SECRET}                             # JWT signing secret

    volumes:
      - ${DOCKER_DATA}/ai/anythingllm/config:/app/server/storage

    ports:
      - ${PORT_ANYTHINGLLM:-3020}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}


