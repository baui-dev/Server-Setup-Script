  # ── local-deep-research (services/ai/local-deep-research.yaml)
  local-deep-research:
    image: ghcr.io/learningcircuit/local-deep-research:latest
    container_name: local-deep-research
    hostname: local-deep-research
    restart: unless-stopped
    environment:
      - TZ=${TZ}

      # --- Gradio Server ---
      - GRADIO_SERVER_NAME=0.0.0.0          # Bind to all interfaces (required for Docker)
      - GRADIO_SERVER_PORT=7860             # Gradio listen port

      # --- LLM Provider ---
      # Options: ollama | openai | anthropic | google | mistral | together
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434  # Ollama endpoint
      - LLM_MODEL=llama3.1:8b               # Model to use (must be pulled in Ollama)
      # - LLM_TEMPERATURE=0.7               # Sampling temperature (0.0 = deterministic)
      # - LLM_MAX_TOKENS=4096               # Max tokens per LLM response
      # - LLM_CONTEXT_LENGTH=8192           # Context window size

      # Uncomment if using cloud providers:
      # - OPENAI_API_KEY=                   # OpenAI API key
      # - ANTHROPIC_API_KEY=                # Anthropic API key
      # - GOOGLE_API_KEY=                   # Google Gemini API key
      # - MISTRAL_API_KEY=                  # Mistral AI API key
      # - TOGETHER_API_KEY=                 # Together AI API key

      # --- Search Provider ---
      # Options: duckduckgo (default, no key) | searxng | serper | tavily | bing | google
      - SEARCH_PROVIDER=duckduckgo
      # SearXNG (recommended for production - privacy-respecting, self-hosted)
      # - SEARCH_PROVIDER=searxng
      # - SEARXNG_URL=http://searxng:8080   # SearXNG instance URL
      # Serper (Google Search API - high quality results)
      # - SEARCH_PROVIDER=serper
      # - SERPER_API_KEY=                   # Serper.dev API key
      # Tavily (purpose-built search API for AI agents)
      # - SEARCH_PROVIDER=tavily
      # - TAVILY_API_KEY=                   # Tavily API key
      # Bing Search
      # - SEARCH_PROVIDER=bing
      # - BING_SEARCH_API_KEY=              # Azure Bing Search API key

      # --- Research Parameters ---
      # - MAX_SEARCH_RESULTS=5              # Number of search results to fetch per query
      # - MAX_FILTERED_RESULTS=3            # Results to keep after relevance filtering
      # - MAX_ITERATIONS=3                  # Maximum research iteration cycles
      # - MAX_FOLLOW_UP_QUESTIONS=3         # Follow-up questions generated per iteration
      # - RESEARCH_TIMEOUT=300             # Max seconds for a single research task

      # --- Content Extraction ---
      # - ENABLE_WEB_SCRAPING=true          # Fetch and read full page content (vs. snippets only)
      # - SCRAPING_TIMEOUT=30               # Timeout in seconds per page fetch
      # - MAX_PAGE_CONTENT_LENGTH=10000     # Max characters to extract per page

      # --- Output ---
      # - REPORT_FORMAT=markdown            # Report format: markdown or html
      # - SAVE_REPORTS=true                 # Save generated reports to disk
      # - REPORTS_DIR=/app/reports          # Directory to save reports

    volumes:
      - ${DOCKER_DATA}/local-deep-research/config:/app/config    # Configuration and settings
      - ${DOCKER_DATA}/local-deep-research/reports:/app/reports  # Saved research reports

    ports:
      - ${PORT_LOCAL_DEEP_RESEARCH}:7860   # Gradio WebUI

    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow container to reach host services (Ollama)

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.local-deep-research.rule=Host(`research.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.local-deep-research.entrypoints=websecure"
    #   - "traefik.http.routers.local-deep-research.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.local-deep-research.loadbalancer.server.port=7860"

# networks:
#   proxy:
#     external: true

  # ── magg (services/ai/magg.yaml)
  magg:
    image: ghcr.io/magicwand-ai/magg:latest
    container_name: magg
    hostname: magg
    restart: unless-stopped
    environment:
      - TZ=${TZ}

      # --- Server ---
      # - MAGG_HOST=0.0.0.0             # Bind address
      # - MAGG_PORT=3000                # Internal listen port
      # - MAGG_LOG_LEVEL=info           # Log level: debug | info | warn | error

      # --- Configuration ---
      # Path to the JSON/YAML config file listing upstream MCP servers
      - MAGG_CONFIG=/config/config.json

      # --- Transport ---
      # - MAGG_TRANSPORT=sse            # Transport mode: sse (HTTP+SSE) or stdio
      # - MAGG_SSE_PATH=/sse            # SSE endpoint path
      # - MAGG_MCP_PATH=/mcp            # MCP JSON-RPC endpoint path

      # --- Authentication ---
      # - MAGG_API_KEY=                 # Optional API key to protect the gateway endpoint

      # --- Tool Namespacing ---
      # - MAGG_NAMESPACE_TOOLS=true     # Prefix tool names with server name (avoids collisions)

    volumes:
      - ${DOCKER_DATA}/magg/config:/config    # Config directory (place config.json here)
      - ${DOCKER_DATA}/magg/data:/data        # Optional: shared data volume for file-based MCP servers
      # Mount Docker socket if running MCP servers that need to spawn containers
      # - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - ${PORT_MAGG_MCP:-${AUTO_PORT_MAGG_MCP}}:3000         # MCP gateway HTTP/SSE endpoint

    extra_hosts:
      - "host.docker.internal:host-gateway"  # Allow reaching host services (Ollama, other MCPs)

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.magg.rule=Host(`mcp.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.magg.entrypoints=websecure"
    #   - "traefik.http.routers.magg.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.magg.loadbalancer.server.port=3000"

# networks:
#   proxy:
#     external: true

  # ── n8n (services/ai/n8n/n8n.yaml)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - N8N_BASIC_AUTH_ACTIVE=true                           # Enable basic auth
      # - N8N_BASIC_AUTH_USER=admin                            # Basic auth username
      # - N8N_BASIC_AUTH_PASSWORD=changeme                     # Basic auth password
      # - N8N_HOST=n8n.${BASE_DOMAIN}                          # External hostname
      # - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}/              # Webhook base URL
      # - GENERIC_TIMEZONE=${TZ}                               # Timezone for workflows

    volumes:
      - ${DOCKER_DATA}/ai/n8n/config:/home/node/.n8n

    ports:
      - ${PORT_N8N:-${AUTO_PORT_N8N}}:5678

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── openhands (services/ai/openhands.yaml)
  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands
    hostname: openhands
    restart: unless-stopped
    environment:
      - TZ=${TZ}

      # --- LLM Configuration ---
      # OpenHands uses LiteLLM, so model names follow LiteLLM conventions.
      # Examples: claude-3-5-sonnet-20241022, gpt-4o, ollama/llama3.1:70b, gemini/gemini-1.5-pro
      - LLM_MODEL=${OPENHANDS_LLM_MODEL:-claude-3-5-sonnet-20241022}
      - LLM_API_KEY=${OPENHANDS_LLM_API_KEY}        # API key for chosen LLM provider
      # - LLM_BASE_URL=                              # Override API base URL (e.g. for Ollama: http://host.docker.internal:11434)
      # - LLM_OLLAMA_BASE_URL=http://host.docker.internal:11434  # Explicit Ollama base URL

      # --- Workspace ---
      # WORKSPACE_MOUNT_PATH: the directory on your HOST that the agent will be able to read/write.
      # The agent sees this directory as /workspace inside its sandbox container.
      - WORKSPACE_MOUNT_PATH=${OPENHANDS_WORKSPACE:-/opt/docker/openhands/workspace}
      # - WORKSPACE_BASE_DIR=/workspace              # Internal mount point (usually /workspace)

      # --- Sandbox / Runtime ---
      # - SANDBOX_USER_ID=${PUID}                    # UID to run as inside the sandbox container
      # - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main  # Sandbox runtime image
      # - SANDBOX_TIMEOUT=120                        # Seconds before idle sandbox is killed
      # - SANDBOX_VOLUMES=                           # Extra volumes to mount into the sandbox (host:container)
      # - PERSIST_SANDBOX=false                      # Keep sandbox container between sessions

      # --- Server ---
      # - OPENHANDS_PORT=3000                        # Internal listen port
      # - DEBUG=false                                # Enable verbose debug logging

      # --- Features ---
      # - SECURITY_ANALYZER=                         # Enable invariant security analysis (requires key)
      # - EVALUATION_HARNESS=false                   # Enable evaluation harness for benchmarking

    volumes:
      - ${DOCKER_DATA}/openhands/config:/.openhands    # OpenHands settings, history, and session data
      # Docker socket: REQUIRED for spawning sandbox runtime containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace volume (mount the same path as WORKSPACE_MOUNT_PATH so files persist)
      - ${OPENHANDS_WORKSPACE:-/opt/docker/openhands/workspace}:/opt/workspace_base

    ports:
      - ${PORT_OPENHANDS}:3000                       # WebUI

    extra_hosts:
      - "host.docker.internal:host-gateway"          # Allow container to reach host services (Ollama)

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.openhands.rule=Host(`openhands.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.openhands.entrypoints=websecure"
    #   - "traefik.http.routers.openhands.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.openhands.loadbalancer.server.port=3000"

# networks:
#   proxy:
#     external: true

  # ── open-webui (services/ai/open-webui.yaml)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    hostname: open-webui
    restart: unless-stopped
    environment:
      - TZ=${TZ}

      # --- Ollama Backend ---
      # Set to your Ollama instance URL. Use host.docker.internal to reach Ollama on the host.
      # Set to empty string "" to disable Ollama integration entirely (OpenAI-only mode).
      - OLLAMA_BASE_URL=${OPENWEBUI_OLLAMA_URL:-http://host.docker.internal:11434}
      # - OLLAMA_API_BASE_URL=${OPENWEBUI_OLLAMA_URL:-http://host.docker.internal:11434}/api  # Deprecated alias

      # --- OpenAI API ---
      # Connect to OpenAI or any OpenAI-compatible API (LiteLLM, LocalAI, vLLM, etc.)
      # - OPENAI_API_KEY=                            # OpenAI or compatible API key
      # - OPENAI_API_BASE_URL=https://api.openai.com/v1  # Base URL (override for local/alt endpoints)
      # Multiple OpenAI-compatible endpoints (semicolon-separated for keys, comma-separated for URLs):
      # - OPENAI_API_KEYS=key1;key2
      # - OPENAI_API_BASE_URLS=http://litellm:4000/v1,http://localai:8080/v1

      # --- Authentication & Security ---
      # REQUIRED: Secret key for session signing. Generate with: openssl rand -hex 32
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # - WEBUI_AUTH=true                            # true = require login, false = open access
      # - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=           # Header for trusted SSO email (e.g. X-Auth-Email)
      # - WEBUI_AUTH_TRUSTED_NAME_HEADER=            # Header for trusted SSO display name
      # - DEFAULT_USER_ROLE=pending                  # Role for new signups: admin | user | pending
      # - ENABLE_SIGNUP=true                         # Allow new user registration
      # - ENABLE_LOGIN_FORM=true                     # Show username/password login form
      # - ENABLE_OAUTH_SIGNUP=false                  # Allow account creation via OAuth
      # - ENABLE_API_KEY=true                        # Allow API key authentication

      # --- OAuth / SSO (Authentik, Keycloak, Zitadel, etc.) ---
      # - ENABLE_OAUTH_SIGNUP=false
      # - OAUTH_PROVIDER_NAME=SSO                    # Display name on login button
      # - OAUTH_CLIENT_ID=                           # OAuth2 client ID
      # - OAUTH_CLIENT_SECRET=                       # OAuth2 client secret
      # - OPENID_PROVIDER_URL=                       # OIDC discovery endpoint
      # - OAUTH_SCOPES=openid email profile

      # --- UI / Branding ---
      # - WEBUI_NAME=Open WebUI                      # Application display name
      # - WEBUI_FAVICON_URL=                         # Custom favicon URL
      # - WEBUI_BANNERS=[]                           # JSON array of banner messages to display
      # - DEFAULT_MODELS=llama3.2                    # Pre-select this model on new chats
      # - DEFAULT_PROMPT_SUGGESTIONS=[]              # JSON array of preset prompt suggestions

      # --- RAG (Retrieval Augmented Generation) ---
      # - RAG_EMBEDDING_ENGINE=                      # Embedding engine: default (local) or openai
      # - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2  # Local embedding model
      # - RAG_RERANKING_MODEL=                       # Optional reranking model for better results
      # - PDF_EXTRACT_IMAGES=false                   # Extract images from PDFs during ingestion
      # - CHUNK_SIZE=1500                            # Document chunk size for RAG
      # - CHUNK_OVERLAP=100                          # Chunk overlap in characters

      # --- Web Search ---
      # - ENABLE_RAG_WEB_SEARCH=false                # Enable web search in chat
      # - RAG_WEB_SEARCH_ENGINE=duckduckgo           # Engine: duckduckgo | searxng | serper | brave | bing
      # - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      # - SERPER_API_KEY=                            # Serper.dev API key
      # - BRAVE_SEARCH_API_KEY=                      # Brave Search API key

      # --- Image Generation ---
      # - ENABLE_IMAGE_GENERATION=false              # Enable image generation tab
      # - IMAGE_GENERATION_ENGINE=openai             # Engine: openai | comfyui | automatic1111
      # - IMAGES_OPENAI_API_BASE_URL=https://api.openai.com/v1
      # - IMAGES_OPENAI_API_KEY=                     # API key for image generation
      # - AUTOMATIC1111_BASE_URL=http://a1111:7860   # Automatic1111 / Stable Diffusion WebUI URL

      # --- Audio (TTS / STT) ---
      # - AUDIO_STT_ENGINE=                          # Speech-to-text: openai or web (browser built-in)
      # - AUDIO_TTS_ENGINE=                          # Text-to-speech: openai, elevenlabs, or empty (browser)
      # - AUDIO_TTS_OPENAI_API_KEY=                  # TTS API key (if using openai engine)
      # - AUDIO_TTS_VOICE=alloy                      # OpenAI TTS voice

      # --- Pipelines ---
      # Open WebUI Pipelines allow custom Python processing of messages
      # - PIPELINES_URL=http://pipelines:9099        # Pipelines service URL

      # --- Telemetry ---
      # - SCARF_NO_ANALYTICS=true                    # Disable Scarf analytics

    volumes:
      - ${DOCKER_DATA}/open-webui/data:/app/backend/data    # Chat history, users, RAG docs, uploads, config

    ports:
      - ${PORT_OPENWEBUI}:8080                            # WebUI

    extra_hosts:
      - "host.docker.internal:host-gateway"               # Allows reaching Ollama on the Docker host

