# AI STACK
# Generated by scripts/generate-stacks.sh
# Services: anythingllm flowise khoj local-deep-research magg n8n openhands open-webui openwebui
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f ai-stack.yaml up -d

services:
  # ── anythingllm (services/ai/anythingllm/anythingllm.yaml)
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    hostname: anythingllm
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - STORAGE_DIR=/app/server/storage                      # Data storage directory
      # - LLM_PROVIDER=ollama                                  # LLM provider (ollama, openai, etc.)
      # - OLLAMA_BASE_PATH=http://ollama:11434                 # Ollama base URL
      # - VECTOR_DB=lancedb                                    # Vector database provider
      # - JWT_SECRET=${JWT_SECRET}                             # JWT signing secret

    volumes:
      - ${DOCKER_DATA}/ai/anythingllm/config:/app/server/storage

    ports:
      - ${PORT_ANYTHINGLLM:-${AUTO_PORT_ANYTHINGLLM}}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── flowise (services/ai/flowise.yaml)
  flowise:
    image: flowiseai/flowise:latest
    container_name: flowise
    hostname: flowise
    restart: unless-stopped
    user: "${PUID}:${PGID}"            # Run as non-root for security
    environment:
      - TZ=${TZ}

      # --- Server ---
      - PORT=3000                      # Internal listen port
      - FLOWISE_HOST=0.0.0.0           # Bind address (0.0.0.0 for all interfaces)
      # - CORS_ORIGINS=*               # Allowed CORS origins (comma-separated). Defaults to * (all)
      # - IFRAME_ORIGINS=*             # Allowed iframe origins for embedded chatbots
      # - DISABLE_FLOWISE_TELEMETRY=true  # Disable anonymous telemetry

      # --- Authentication ---
      # Basic auth credentials for the WebUI and API
      - FLOWISE_USERNAME=${FLOWISE_USERNAME:-admin}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD:-changeme}
      # Override encryption key for API keys stored in database (generate with: openssl rand -hex 24)
      # - FLOWISE_SECRETKEY_OVERWRITE=${SECRET_KEY}

      # --- File / Storage Paths (inside container) ---
      - DATABASE_PATH=/root/.flowise         # SQLite database directory
      - APIKEY_PATH=/root/.flowise           # API key storage directory
      - LOG_PATH=/root/.flowise/logs         # Log files directory
      - SECRETKEY_PATH=/root/.flowise        # Encryption key storage directory
      - TEMP_PATH=/root/.flowise/temp        # Temporary file uploads directory
      - BLOB_STORAGE_PATH=/root/.flowise/storage  # File/blob upload storage

      # --- Logging ---
      # - LOG_LEVEL=info               # Log level: error | warn | info | verbose | debug
      # - DEBUG=false                  # Enable debug mode (verbose logging)

      # --- File Uploads ---
      # - FLOWISE_FILE_SIZE_LIMIT=50mb # Maximum file upload size (e.g., 50mb, 100mb)

      # --- Execution ---
      # - EXECUTION_MODE=main          # main (synchronous) or worker (async with queue)
      # - WORKER_CONCURRENCY=5         # Number of concurrent flows when using worker mode

      # --- Tool / Function Node External Dependencies ---
      # Comma-separated list of npm packages available in Function nodes
      # - TOOL_FUNCTION_BUILTIN_DEP=crypto,fs  # Built-in Node.js modules to allow
      # - TOOL_FUNCTION_EXTERNAL_DEP=moment,lodash  # External npm packages to allow

      # --- Queue (required for EXECUTION_MODE=worker) ---
      # - QUEUE_NAME=flowise            # BullMQ queue name
      # - REDIS_URL=redis://:${REDIS_PASSWORD}@flowise-redis:6379  # Redis connection for queue

      # --- Database (SQLite default; PostgreSQL optional) ---
      # By default Flowise uses SQLite stored at DATABASE_PATH.
      # Uncomment below to use PostgreSQL instead:
      # - DATABASE_TYPE=postgres
      # - DATABASE_HOST=flowise-postgres
      # - DATABASE_PORT=5432
      # - DATABASE_NAME=${POSTGRES_DB:-flowise}
      # - DATABASE_USER=${POSTGRES_USER}
      # - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      # - DATABASE_SSL=false

      # --- OpenAI / LLM Keys (optional - can also be added per-credential in UI) ---
      # - OPENAI_API_KEY=              # Pre-populate OpenAI key
      # - ANTHROPIC_API_KEY=           # Pre-populate Anthropic key

      # --- HuggingFace ---
      # - HUGGINGFACEHUB_API_TOKEN=    # HuggingFace API token

    volumes:
      - ${DOCKER_DATA}/flowise/data:/root/.flowise    # All Flowise data: DB, API keys, logs, uploads

    ports:
      - ${PORT_FLOWISEAI}:3000         # WebUI + REST API

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.flowise.rule=Host(`flowise.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.flowise.entrypoints=websecure"
    #   - "traefik.http.routers.flowise.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.flowise.loadbalancer.server.port=3000"

# networks:
#   proxy:
#     external: true

  # ── khoj (services/ai/khoj.yaml)

  # --- PostgreSQL with pgvector (required for vector similarity search) ---
  khoj-postgres:
    image: ankane/pgvector:latest      # PostgreSQL with pgvector extension for semantic search
    container_name: khoj-postgres
    hostname: khoj-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=khoj
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/khoj/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d khoj"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Redis (required for task queue and caching) ---
  khoj-redis:
    image: redis:7-alpine
    container_name: khoj-redis
    hostname: khoj-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ${DOCKER_DATA}/khoj/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Khoj Server ---
  khoj:
    image: ghcr.io/khoj-ai/khoj:latest
    container_name: khoj
    hostname: khoj
    restart: unless-stopped
    depends_on:
      khoj-postgres:
        condition: service_healthy
      khoj-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}

      # --- Admin Account (created on first start) ---
      - KHOJ_ADMIN_EMAIL=${KHOJ_ADMIN_EMAIL:-admin@example.com}
      - KHOJ_ADMIN_PASSWORD=${KHOJ_ADMIN_PASSWORD:-changeme}
      # Django secret key - REQUIRED, generate with: openssl rand -hex 32
      - KHOJ_DJANGO_SECRET_KEY=${KHOJ_DJANGO_SECRET_KEY:-changeme_generate_with_openssl_rand_hex_32}

      # --- Database (PostgreSQL with pgvector) ---
      - POSTGRES_DB=khoj
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=khoj-postgres
      - POSTGRES_PORT=5432

      # --- Redis ---
      - KHOJ_REDIS_URL=redis://:${REDIS_PASSWORD}@khoj-redis:6379/0

      # --- LLM Providers (configure at least one) ---
      # Khoj will use these for AI chat and agent features
      # - OPENAI_API_KEY=              # OpenAI API key (gpt-4o, gpt-4-turbo, etc.)
      # - ANTHROPIC_API_KEY=           # Anthropic API key (claude-3-5-sonnet, etc.)
      # - GEMINI_API_KEY=              # Google Gemini API key
      # - MISTRAL_API_KEY=             # Mistral AI API key (mistral-large, etc.)
      # - COHERE_API_KEY=              # Cohere API key

      # --- Ollama / Local LLM ---
      # - OLLAMA_HOST=http://host.docker.internal:11434  # Ollama endpoint for local models

      # --- Search / Features ---
      # - KHOJ_TELEMETRY_DISABLED=true # Disable anonymous telemetry (recommended for self-hosted)
      - KHOJ_TELEMETRY_DISABLED=true
      # - KHOJ_DEBUG=false             # Enable Django debug mode (do NOT use in production)

      # --- Storage ---
      # - KHOJ_MODELS_DIR=/root/.khoj/models  # Directory to cache downloaded embedding models

      # --- Web Search (for web agent) ---
      # - SERPER_DEV_API_KEY=          # Serper.dev key for Google web search agent capability
      # - BING_SEARCH_V7_SUBSCRIPTION_KEY=  # Bing Search API key
      # - JINA_API_KEY=                # Jina.ai reader key (for URL content extraction)

    volumes:
      - ${DOCKER_DATA}/khoj/config:/root/.khoj    # Config files, model cache, uploaded files

    ports:
      - ${PORT_KHOJ}:42110             # WebUI + API

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.khoj.rule=Host(`khoj.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.khoj.entrypoints=websecure"
    #   - "traefik.http.routers.khoj.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.khoj.loadbalancer.server.port=42110"

# networks:
