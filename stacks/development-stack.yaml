# DEVELOPMENT STACK
# Generated by scripts/generate-stacks.sh
# Services: appsmith appwrite bytestash coder code-server gitea nextterm rustpad semaphore
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f development-stack.yaml up -d

services:
  # ── appsmith (services/development/appsmith.yaml)
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: appsmith
    hostname: appsmith
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - APPSMITH_DISABLE_TELEMETRY=true              # Opt out of anonymous usage analytics
      # - APPSMITH_SIGNUP_DISABLED=false               # Set true to prevent new user self-registration
      # - APPSMITH_ADMIN_EMAILS=admin@example.com      # Comma-separated emails that are auto-granted admin
      # - APPSMITH_ALLOWED_FRAME_ANCESTORS=            # Origins allowed to embed Appsmith in an iframe
      # --- Encryption (generate both with: openssl rand -hex 16) ---
      # - APPSMITH_ENCRYPTION_PASSWORD=changeme        # Required for encrypting stored datasource credentials
      # - APPSMITH_ENCRYPTION_SALT=changeme            # Salt for the encryption password above
      # --- Custom Domain / TLS ---
      # - APPSMITH_CUSTOM_DOMAIN=app.example.com       # Enables auto Let's Encrypt TLS via Caddy
      # --- Email / SMTP ---
      # - APPSMITH_MAIL_ENABLED=false                  # Set true to enable outbound email
      # - APPSMITH_MAIL_HOST=smtp.example.com          # SMTP server hostname
      # - APPSMITH_MAIL_PORT=587                       # SMTP port (587=STARTTLS, 465=SSL)
      # - APPSMITH_MAIL_SMTP_AUTH=true                 # Enable SMTP authentication
      # - APPSMITH_MAIL_USERNAME=                      # SMTP login username
      # - APPSMITH_MAIL_PASSWORD=                      # SMTP login password
      # - APPSMITH_MAIL_FROM=noreply@example.com       # Sender address for system emails
      # - APPSMITH_MAIL_SMTP_TLS_ENABLED=true          # Enable TLS for SMTP connection
      # --- OAuth2 (Google) ---
      # - APPSMITH_OAUTH2_GOOGLE_CLIENT_ID=            # Google OAuth2 client ID
      # - APPSMITH_OAUTH2_GOOGLE_CLIENT_SECRET=        # Google OAuth2 client secret
      # --- OAuth2 (GitHub) ---
      # - APPSMITH_OAUTH2_GITHUB_CLIENT_ID=            # GitHub OAuth2 client ID
      # - APPSMITH_OAUTH2_GITHUB_CLIENT_SECRET=        # GitHub OAuth2 client secret
      # --- Google Maps ---
      # - APPSMITH_GOOGLE_MAPS_API_KEY=                # Google Maps JS API key for map widgets
    volumes:
      - ${DOCKER_DATA}/appsmith/stacks:/appsmith-stacks  # All data: MongoDB, Caddy config, uploads, logs
    ports:
      - ${PORT_APPSMITH}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── appwrite (services/development/appwrite.yaml)
  # ------------------------------------------------------------------ #
  # Main API + Console
  # ------------------------------------------------------------------ #
  appwrite:
    image: appwrite/appwrite:latest
    container_name: appwrite
    hostname: appwrite
    restart: unless-stopped
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/uploads:/storage/uploads
      - ${DOCKER_DATA}/appwrite/cache:/storage/cache
      - ${DOCKER_DATA}/appwrite/config:/storage/config
      - ${DOCKER_DATA}/appwrite/certificates:/storage/certificates
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions
    ports:
      - ${PORT_APPWRITE}:80
    depends_on:
      appwrite-mariadb:
        condition: service_healthy
      appwrite-redis:
        condition: service_healthy
      appwrite-meili:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  # ------------------------------------------------------------------ #
  # Realtime WebSocket Service
  # ------------------------------------------------------------------ #
  appwrite-realtime:
    image: appwrite/appwrite:latest
    container_name: appwrite-realtime
    hostname: appwrite-realtime
    restart: unless-stopped
    command: realtime
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-mariadb:
        condition: service_healthy
      appwrite-redis:
        condition: service_healthy

  # ------------------------------------------------------------------ #
  # Workers
  # ------------------------------------------------------------------ #
  appwrite-worker-audits:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-audits
    restart: unless-stopped
    command: worker-audits
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-webhooks:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-webhooks
    restart: unless-stopped
    command: worker-webhooks
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-deletes:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-deletes
    restart: unless-stopped
    command: worker-deletes
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/uploads:/storage/uploads
      - ${DOCKER_DATA}/appwrite/cache:/storage/cache
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-databases:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-databases
    restart: unless-stopped
    command: worker-databases
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-builds:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-builds
    restart: unless-stopped
    command: worker-builds
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-functions:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-functions
    restart: unless-stopped
    command: worker-functions
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-executor:
        condition: service_started

  appwrite-worker-certificates:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-certificates
    restart: unless-stopped
    command: worker-certificates
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/config:/storage/config
      - ${DOCKER_DATA}/appwrite/certificates:/storage/certificates
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-mails:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-mails
    restart: unless-stopped
    command: worker-mails
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-messaging:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-messaging
    restart: unless-stopped
    command: worker-messaging
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-migrations:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-migrations
    restart: unless-stopped
    command: worker-migrations
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-usage:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-usage
    restart: unless-stopped
    command: worker-usage
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-usage-dump:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-usage-dump
    restart: unless-stopped
    command: worker-usage-dump
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  # ------------------------------------------------------------------ #
  # Maintenance & Schedulers
  # ------------------------------------------------------------------ #
  appwrite-maintenance:
    image: appwrite/appwrite:latest
    container_name: appwrite-maintenance
    restart: unless-stopped
    command: maintenance
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-schedule-functions:
    image: appwrite/appwrite:latest
    container_name: appwrite-schedule-functions
    restart: unless-stopped
    command: schedule-functions
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-schedule-messages:
    image: appwrite/appwrite:latest
    container_name: appwrite-schedule-messages
    restart: unless-stopped
    command: schedule-messages
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  # ------------------------------------------------------------------ #
  # Function Executor — spawns isolated runtime containers
  # ------------------------------------------------------------------ #
  appwrite-executor:
    image: appwrite/appwrite:latest
    container_name: appwrite-executor
    restart: unless-stopped
    command: executor
    environment:
      <<: *appwrite-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required: executor creates function containers
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions

  # ------------------------------------------------------------------ #
  # MariaDB — primary relational database
  # ------------------------------------------------------------------ #
  appwrite-mariadb:
    image: mariadb:10.11
    container_name: appwrite-mariadb
    hostname: appwrite-mariadb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=appwrite_root_pass    # CHANGE THIS — must match _APP_DB_ROOT_PASS
      - MYSQL_DATABASE=appwrite
      - MYSQL_USER=appwrite
      - MYSQL_PASSWORD=appwrite_db_pass           # CHANGE THIS — must match _APP_DB_PASS
    volumes:
      - ${DOCKER_DATA}/appwrite/mariadb:/var/lib/mysql
    command: mysqld --innodb-flush-method=fsync   # Safer flush method on some filesystems
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appwrite", "-pappwrite_db_pass"]
      timeout: 10s
      interval: 15s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------ #
  # Redis — message queue broker and cache layer
  # ------------------------------------------------------------------ #
  appwrite-redis:
    image: redis:7.2-alpine
    container_name: appwrite-redis
    hostname: appwrite-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DOCKER_DATA}/appwrite/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------ #
  # MeiliSearch — full-text search engine
  # ------------------------------------------------------------------ #
  appwrite-meili:
    image: getmeili/meilisearch:v1.7
    container_name: appwrite-meili
    hostname: appwrite-meili
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=appwrite_meili_key       # CHANGE THIS — must match _APP_SEARCH_MEILISEARCH_API_KEY
    volumes:
      - ${DOCKER_DATA}/appwrite/meili:/meili_data

# networks:
#   proxy:
#     external: true

  # ── bytestash (services/development/bytestash.yaml)
  bytestash:
    image: ghcr.io/jordan-dalby/bytestash:latest
    container_name: bytestash
    hostname: bytestash
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # --- Authentication ---
      - SECRET_KEY=${SECRET_KEY}               # JWT signing secret — generate: openssl rand -hex 32
      # - TOKEN_EXPIRY_HOURS=168               # JWT token lifespan in hours (default: 168 = 7 days)
      # - ALLOW_REGISTRATION=true              # Set false to prevent new account self-registration
      # - ALLOW_ANONYMOUS_READ=false           # Set true to allow unauthenticated read-only access
      # --- Base URL (recommended for correct link generation) ---
      # - BASE_URL=https://snippets.example.com  # Public URL of this instance
    volumes:
      - ${DOCKER_DATA}/bytestash/data:/data      # SQLite database and snippet storage
    ports:
      - ${PORT_BYTESTASH}:5000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── coder (services/development/coder.yaml)
  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    hostname: coder
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # --- Core networking (REQUIRED) ---
      - CODER_HTTP_ADDRESS=0.0.0.0:3000          # Bind address inside the container
      - CODER_ACCESS_URL=http://coder.${DOMAIN:-localhost}:${PORT_CODER}  # Public URL agents use to reach Coder
      # - CODER_WILDCARD_ACCESS_URL=             # Wildcard domain for port-forwarding (e.g., *.coder.example.com)
      # --- Database ---
      - CODER_PG_CONNECTION_URL=postgresql://coder:coder_db_pass@coder-db/coder?sslmode=disable  # CHANGE PASSWORD
      # --- TLS (if not terminating TLS upstream) ---
      # - CODER_TLS_ENABLE=false                 # Enable built-in TLS
      # - CODER_TLS_CERT_FILE=/certs/tls.crt     # Path to TLS certificate
      # - CODER_TLS_KEY_FILE=/certs/tls.key      # Path to TLS private key
      # --- OIDC / SSO ---
      # - CODER_OIDC_ISSUER_URL=                 # OIDC provider URL (e.g., https://accounts.google.com)
      # - CODER_OIDC_CLIENT_ID=                  # OIDC client ID
      # - CODER_OIDC_CLIENT_SECRET=              # OIDC client secret
      # - CODER_OIDC_EMAIL_DOMAIN=               # Allowed email domain for OIDC login
      # --- Email (SMTP) ---
      # - CODER_EMAIL_FROM=coder@example.com     # Sender address for Coder system emails
      # - CODER_EMAIL_SMARTHOST=smtp.example.com:587  # SMTP server (host:port)
      # - CODER_EMAIL_HELLO=localhost            # SMTP EHLO hostname
      # - CODER_EMAIL_USERNAME=                  # SMTP username
      # - CODER_EMAIL_PASSWORD=                  # SMTP password
      # --- Telemetry ---
      # - CODER_TELEMETRY=true                   # Set false to disable anonymous usage telemetry
      # --- Logging ---
      # - CODER_LOG_HUMAN_TIME=true              # Prefix log lines with human-readable timestamps
      # - CODER_VERBOSE=false                    # Enable verbose/debug logging
      # --- Non-interactive first-user bootstrap (optional) ---
      # - CODER_FIRST_USER_USERNAME=admin        # Admin username created on first run
      # - CODER_FIRST_USER_EMAIL=admin@example.com  # Admin email
      # - CODER_FIRST_USER_PASSWORD=changeme     # Admin password (min 8 chars)
      # - CODER_FIRST_USER_TRIAL=false           # Enable Coder trial license on first run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required: Coder uses Docker for workspace provisioning
      - ${DOCKER_DATA}/coder/config:/home/coder/.config
    ports:
      - ${PORT_CODER}:3000
    group_add:
      - "999"                                    # Add coder user to the docker group (adjust GID if needed)
    depends_on:
      coder-db:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  # ------------------------------------------------------------------ #
  # PostgreSQL — Coder's primary database
  # ------------------------------------------------------------------ #
  coder-db:
    image: postgres:16-alpine
    container_name: coder-db
    hostname: coder-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=coder
      - POSTGRES_PASSWORD=coder_db_pass          # CHANGE THIS — must match CODER_PG_CONNECTION_URL
      - POSTGRES_DB=coder
    volumes:
      - ${DOCKER_DATA}/coder/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# networks:
#   proxy:
#     external: true

  # ── code-server (services/development/code-server/code-server.yaml)
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    hostname: code-server
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - PASSWORD=changeme                                    # Web UI password
      # - HASHED_PASSWORD=                                     # Bcrypt-hashed password (takes precedence)
      # - SUDO_PASSWORD=changeme                               # Sudo password in container
      # - PROXY_DOMAIN=code.${BASE_DOMAIN}                    # Domain for proxy headers

    volumes:
      - ${DOCKER_DATA}/development/code-server/config:/config
      # - /path/to/projects:/projects                          # Project files directory

    ports:
      - ${PORT_CODE_SERVER:-${AUTO_PORT_CODE_SERVER}}:8443

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── gitea (services/development/gitea/gitea.yaml)
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    hostname: gitea
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - USER_UID=${PUID}                                     # Run as this UID
      # - USER_GID=${PGID}                                     # Run as this GID
      # - GITEA__database__DB_TYPE=sqlite3                     # Database type
      # - GITEA__server__DOMAIN=gitea.${BASE_DOMAIN}           # External domain
      # - GITEA__server__SSH_DOMAIN=gitea.${BASE_DOMAIN}       # SSH domain
      # - GITEA__server__ROOT_URL=https://gitea.${BASE_DOMAIN} # Root URL

    volumes:
      - ${DOCKER_DATA}/development/gitea/config:/data

    ports:
      - ${PORT_GITEA:-${AUTO_PORT_GITEA}}:3000                               # Web UI
      # - ${PORT_GITEA_SSH:-${AUTO_PORT_GITEA_SSH}}:22                           # SSH port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── nextterm (services/development/nextterm.yaml)
  nextterm:
    image: ghcr.io/gnmyt/nexterm:latest
    container_name: nextterm
    hostname: nextterm
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - DEVELOPMENT_MODE=false               # Set true to enable hot-reload (dev only)
      # - DISABLE_AUTH=false                   # Set true to bypass login (DANGER: for trusted networks only)
    volumes:
      - ${DOCKER_DATA}/nextterm/config:/app/data  # SQLite database, saved connections, and settings
    ports:
      - ${PORT_NEXTTERM:-${AUTO_PORT_NEXTTERM}}:6989
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── rustpad (services/development/rustpad.yaml)
  rustpad:
    image: ekzhang/rustpad:latest
    container_name: rustpad
    hostname: rustpad
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - PORT=3030                            # Internal HTTP listen port (default: 3030)
      # - EXPIRY_DAYS=1                        # Days before an idle document is automatically deleted (default: 1)
      # - RUST_LOG=info                        # Log verbosity: error | warn | info | debug | trace
      # - ORIGIN=https://pad.example.com       # Allowed CORS origin for WebSocket connections (set to public URL)
    ports:
      - ${PORT_RUSTPAD}:3030
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── semaphore (services/development/semaphore/semaphore.yaml)
  semaphore:
    image: semaphoreui/semaphore:latest
    container_name: semaphore
    hostname: semaphore
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - SEMAPHORE_DB_DIALECT=bolt                              # Database type (bolt for embedded)
      # - SEMAPHORE_ADMIN=admin                                # Admin username
      # - SEMAPHORE_ADMIN_PASSWORD=changeme                    # Admin password
      # - SEMAPHORE_ADMIN_NAME=Admin                           # Admin display name
      # - SEMAPHORE_ADMIN_EMAIL=admin@example.com              # Admin email

    volumes:
      - ${DOCKER_DATA}/development/semaphore/config:/etc/semaphore
      - ${DOCKER_DATA}/development/semaphore/data:/var/lib/semaphore

    ports:
      - ${PORT_SEMAPHORE:-${AUTO_PORT_SEMAPHORE}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}


