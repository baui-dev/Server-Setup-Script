# SERVER STACK
# Generated by scripts/generate-stacks.sh
# Services: homepage homarr glance portainer watchtower dozzle dockge authelia
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f server-stack.yaml up -d

services:
  # ── homepage (services/server/dashboards/homepage/homepage.yaml)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    hostname: homepage
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/server/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (for container stats)

    ports:
      - ${PORT_HOMEPAGE:-3050}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── homarr (services/server/dashboards/homarr/homarr.yaml)
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    hostname: homarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - BASE_URL=homarr.${BASE_DOMAIN}                       # External base URL
      # - SECRET_ENCRYPTION_KEY=${SECRET_KEY}                  # Encryption key (32 hex chars)
      # - AUTH_PROVIDER=credentials                            # Auth provider (credentials, ldap, oidc)

    volumes:
      - ${DOCKER_DATA}/server/homarr/config:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (for container info)

    ports:
      - ${PORT_HOMARR:-7575}:7575

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── glance (services/server/dashboards/glance.yaml)
  glance:
    image: ghcr.io/glanceapp/glance:latest
    container_name: glance
    hostname: glance
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/server/dashboards/glance/config:/app/config

    ports:
      - ${PORT_GLANCE:-8084}:8080

  # ── portainer (services/server/dashboards/portainer/portainer.yaml)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/server/portainer/config:/data
      - /var/run/docker.sock:/var/run/docker.sock                # Docker socket

    ports:
      - ${PORT_PORTAINER:-9000}:9000                             # HTTP web UI
      - ${PORT_PORTAINER_HTTPS:-9443}:9443                       # HTTPS web UI
      # - ${PORT_PORTAINER_AGENT:-8000}:8000                     # Agent/Edge agent port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── watchtower (services/server/management/watchtower/watchtower.yaml)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true                                 # Remove old images after update
      - WATCHTOWER_SCHEDULE=0 0 4 * * *                        # Cron: run daily at 4 AM
      # - WATCHTOWER_NOTIFICATIONS=shoutrrr                    # Notification provider
      # - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL} # Notification URL
      # - WATCHTOWER_MONITOR_ONLY=true                         # Only monitor, don't update

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock               # Docker socket (required)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── dozzle (services/server/management/dozzle/dozzle.yaml)
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    hostname: dozzle
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - DOZZLE_LEVEL=info                                    # Log level (trace, debug, info, warn, error)
      # - DOZZLE_REMOTE_HOST=tcp://remotehost:2375             # Remote Docker host
      # - DOZZLE_AUTH_PROVIDER=simple                          # Auth provider (simple, forward-proxy)
      # - DOZZLE_NO_ANALYTICS=true                             # Disable analytics

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (read-only)

    ports:
      - ${PORT_DOZZLE:-8940}:8080

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── dockge (services/server/management/dockge/dockge.yaml)
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    hostname: dockge
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOCKGE_STACKS_DIR=${DOCKER_DATA}/server/management/dockge/stacks

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/server/management/dockge/config:/app/data
      - ${DOCKER_DATA}/server/management/dockge/stacks:${DOCKER_DATA}/server/management/dockge/stacks

    ports:
      - ${PORT_DOCKGE:-${AUTO_PORT_DOCKGE}}:5001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── authelia (services/server/auth/authelia/authelia.yaml)
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}           # JWT secret (required)
      # - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}   # Session secret (required)
      # - AUTHELIA_STORAGE_ENCRYPTION_KEY=${ENCRYPTION_KEY}    # Storage encryption key

    volumes:
      - ${DOCKER_DATA}/server/authelia/config:/config

    ports:
      - ${PORT_AUTHELIA:-9091}:9091

    # networks:
    #   - ${DEFAULT_NETWORK}


