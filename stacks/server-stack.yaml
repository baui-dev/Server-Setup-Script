# SERVER STACK
# Generated by scripts/generate-stacks.py
# Services: homepage, homarr, portainer, watchtower, dozzle, authelia
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    hostname: homepage
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/server/homepage/config:/app/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - ${PORT_HOMEPAGE:-3050}:3000
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    hostname: homarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/server/homarr/config:/appdata
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - ${PORT_HOMARR:-7575}:7575
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/server/portainer/config:/data
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - ${PORT_PORTAINER:-9000}:9000
    - ${PORT_PORTAINER_HTTPS:-9443}:9443
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - WATCHTOWER_CLEANUP=true
    - WATCHTOWER_SCHEDULE=0 0 4 * * *
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    hostname: dozzle
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - ${PORT_DOZZLE:-8940}:8080
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/server/authelia/config:/config
    ports:
    - ${PORT_AUTHELIA:-9091}:9091
