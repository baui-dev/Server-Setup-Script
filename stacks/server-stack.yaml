# SERVER STACK
# Generated by scripts/generate-stacks.sh
# Services: 1panel aaronos aliasvault app arozos astroluma authelia authentik-server backvault chartdb clamav cloudbeaver cloudpanel cockpit core cronmaster cv4pve-admin datastation db-studio dockge dokploy dozzle ferretdb friendup-os glance homarr homepage infisical kasm keycloak kodcloud kubero openpanel portainer puter safeline-mgt ssm-client stackauth-backend tirreno watchtower wazuhmanager zitadel
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f server-stack.yaml up -d

services:
  # ── 1panel (services/server/management/1panel.yaml)
  1panel:
    image: registry.cn-hangzhou.aliyuncs.com/1panel/1panel:latest
    container_name: 1panel
    hostname: 1panel
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ}
      # Initial panel port — default 10086
      - PANEL_PORT=${PORT_1PANEL:-${AUTO_PORT_1PANEL}}
      # Initial admin username
      - PANEL_USERNAME=${PANEL_USERNAME:-admin}
      # Initial admin password
      - PANEL_PASSWORD=${PANEL_PASSWORD:-${SECRET_KEY}}
    volumes:
      - ${DOCKER_DATA}/1panel/data:/var/lib/1panel
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/etc
      - /var/log:/var/log
    # ports exposed via network_mode: host
    # - ${PORT_1PANEL:-${AUTO_PORT_1PANEL}}:10086

  # ── aaronos (services/server/webos/aaronos.yaml)
  aaronos:
    image: php:8-apache
    container_name: aaronos
    hostname: aaronos
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      # Clone source before starting:
      #   git clone https://github.com/MineAndCraft12/AaronOS \
      #     ${DOCKER_DATA}/aaronos/html
      - ${DOCKER_DATA}/aaronos/html:/var/www/html
    ports:
      - ${PORT_AARONOS:-${AUTO_PORT_AARONOS}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── aliasvault (services/server/security/aliasvault.yaml)
  aliasvault:
    image: lanedirt/aliasvault:latest
    container_name: aliasvault
    hostname: aliasvault
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Public-facing domain — required for correct link generation in emails
      - PUBLIC_DOMAIN=aliasvault.${BASE_DOMAIN}
      # Password for the built-in admin account (change on first run)
      - ADMIN_PASSWORD=${SECRET_KEY}
      # Passphrase used to encrypt the data-protection certificate stored on disk
      - DATA_PROTECTION_CERT_PASS=${SECRET_KEY}
      # SMTP relay for sending alias emails (all optional)
      # - SMTP_HOST=smtp.${BASE_DOMAIN}           # SMTP server hostname
      # - SMTP_PORT=587                       # SMTP port (587 for STARTTLS, 465 for TLS)
      # - SMTP_USERNAME=aliasvault@${BASE_DOMAIN} # SMTP auth username
      # - SMTP_PASSWORD=changeme              # SMTP auth password
      # - SMTP_FROM=noreply@${BASE_DOMAIN}        # Envelope from address
      # - SMTP_SECURE=true                   # Use TLS/STARTTLS
      # - ASPNETCORE_ENVIRONMENT=Production  # Runtime environment (Production/Development)
    volumes:
      - ${DOCKER_DATA}/aliasvault/data:/app/data
    ports:
      - ${PORT_ALIASVAULT}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── app (services/server/dashboards/app.yaml)
  app:
    image: sanjeet990/astroluma:latest
    container_name: astroluma
    ##ports:
    ##  - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      SECRET_KEY: a2c5f9a8b2d7e1a7f2c9c8d9b5f7a3d5
      MONGODB_URI: mongodb://localhost:27017/astroluma
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      - mongodb
    restart: always
    network_mode: host

  mongodb:
    image: mongo:6.0
    container_name: astroluma_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always



  # ── arozos (services/server/webos/arozos.yaml)
  arozos:
    image: tobychui/arozos:latest
    container_name: arozos
    hostname: arozos
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - PUID=${PUID}   # User ID for file permissions
      # - PGID=${PGID}   # Group ID for file permissions
    volumes:
      - ${DOCKER_DATA}/arozos/files:/system/storage     # User file storage
      - ${DOCKER_DATA}/arozos/conf:/system/conf          # System configuration
      - ${DOCKER_DATA}/arozos/web:/system/web             # Web modules
    ports:
      - ${PORT_AROZOS:-${AUTO_PORT_AROZOS}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── astroluma (services/server/dashboards/astroluma.yaml)
  astroluma:
    image: sanjeet990/astroluma:latest
    container_name: astroluma
    hostname: astroluma
    restart: unless-stopped
    depends_on:
      - astroluma-mongodb
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - MONGODB_URI=mongodb://astroluma-mongodb:27017/astroluma
    volumes:
      - ${DOCKER_DATA}/astroluma/uploads:/app/storage/uploads
    ports:
      - ${PORT_ASTROLUMA}:8000
    # networks:
    #   - ${DEFAULT_NETWORK}

  astroluma-mongodb:
    image: mongo:6.0
    container_name: astroluma-mongodb
    hostname: astroluma-mongodb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/astroluma/mongodb:/data/db
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── authelia (services/server/auth/authelia/authelia.yaml)
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}           # JWT secret (required)
      # - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}   # Session secret (required)
      # - AUTHELIA_STORAGE_ENCRYPTION_KEY=${ENCRYPTION_KEY}    # Storage encryption key

    volumes:
      - ${DOCKER_DATA}/server/authelia/config:/config

    ports:
      - ${PORT_AUTHELIA:-${AUTO_PORT_AUTHELIA}}:9091

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── authentik-server (services/server/auth/authentik-server.yaml)
  authentik-postgres:
    image: postgres:16-alpine
    container_name: authentik-postgres
    hostname: authentik-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=authentik
      - POSTGRES_USER=authentik
      - POSTGRES_PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/authentik/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    hostname: authentik-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/authentik/redis:/data
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    hostname: authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Core secret - generate with: openssl rand -base64 60
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      # Database
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
      # Redis
      - AUTHENTIK_REDIS__HOST=authentik-redis
      # Email (optional)
      # - AUTHENTIK_EMAIL__HOST=smtp.${BASE_DOMAIN}
      # - AUTHENTIK_EMAIL__PORT=587
      # - AUTHENTIK_EMAIL__USERNAME=${SMTP_USERNAME}
      # - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASSWORD}
      # - AUTHENTIK_EMAIL__USE_TLS=true
      # - AUTHENTIK_EMAIL__FROM=authentik@${BASE_DOMAIN}
      # Log level: trace, debug, info, warning, error
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-info}
      # Error reporting (optional, disable for self-hosted)
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      # Cookie domain
      - AUTHENTIK_COOKIE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/authentik/media:/media
      - ${DOCKER_DATA}/authentik/custom-templates:/templates
    ports:
      - ${PORT_AUTHENTIK:-${AUTO_PORT_AUTHENTIK}}:9000
      - ${PORT_AUTHENTIK_HTTPS:-${AUTO_PORT_AUTHENTIK_HTTPS}}:9443
    # networks:
    #   - ${DEFAULT_NETWORK}

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    hostname: authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    user: root
    environment:
      - TZ=${TZ}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      # - AUTHENTIK_EMAIL__HOST=smtp.${BASE_DOMAIN}
      # - AUTHENTIK_EMAIL__PORT=587
      # - AUTHENTIK_EMAIL__USERNAME=${SMTP_USERNAME}
      # - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASSWORD}
      # - AUTHENTIK_EMAIL__USE_TLS=true
      # - AUTHENTIK_EMAIL__FROM=authentik@${BASE_DOMAIN}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/authentik/media:/media
      - ${DOCKER_DATA}/authentik/certs:/certs
      - ${DOCKER_DATA}/authentik/custom-templates:/templates
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Navigate to http://your-server:${PORT_AUTHENTIK:-${AUTO_PORT_AUTHENTIK}}/if/flow/initial-setup/
# 2. Create the initial admin user
# 3. Configure applications, providers, and flows via the admin UI
#
# Outpost (application proxy) - deploy separately per-service:
#   AUTHENTIK_TOKEN: obtained from Admin -> Outposts -> Create
# ============================================================

  # ── backvault (services/server/security/backvault.yaml)
  backvault:
    image: nicedoc/backvault:latest
    container_name: backvault
    hostname: backvault
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Encryption passphrase for backup archives (required — generate: openssl rand -hex 32)
      - ENCRYPTION_KEY=${SECRET_KEY}
      # Cron schedule for automatic backups (default: 02:00 daily)
      # - BACKUP_SCHEDULE=0 2 * * *
      # Number of snapshots to retain
      # - RETAIN_DAILY=7
      # - RETAIN_WEEKLY=4
      # - RETAIN_MONTHLY=3
      # Optional S3-compatible remote target
      # - S3_ENDPOINT=https://s3.${BASE_DOMAIN}
      # - S3_BUCKET=backvault
      # - S3_ACCESS_KEY=changeme
      # - S3_SECRET_KEY=changeme
      # Optional SFTP remote target
      # - SFTP_HOST=backup.${BASE_DOMAIN}
      # - SFTP_USER=backupuser
      # - SFTP_PRIVATE_KEY_PATH=/config/ssh/id_rsa
    volumes:
      - ${DOCKER_DATA}/backvault/config:/config
      - ${DOCKER_DATA}/backvault/data:/data
      # Mount source directories to include in backups (read-only recommended)
      # - ${DOCKER_DATA}/aliasvault:/sources/aliasvault:ro
      # - ${DOCKER_DATA}/infisical:/sources/infisical:ro
    ports:
      - ${PORT_BACKVAULT}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── chartdb (services/server/databases/chartdb.yaml)
  chartdb:
    image: ghcr.io/chartdb/chartdb:latest
    container_name: chartdb
    hostname: chartdb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Optional: restrict access to a specific origin (CORS)
      # - CHARTDB_ALLOWED_ORIGIN=https://chartdb.${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/chartdb/config:/config
    ports:
      - ${PORT_CHARTDB}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── clamav (services/server/clamav.yaml)
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    hostname: clamav
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Freshclam update interval in seconds (default: 3600)
      - FRESHCLAM_SLEEP_DURATION=3600
      # Allow concurrent connections to clamd
      - CLAMD_MAX_THREADS=10
    volumes:
      # Persistent virus signature database (avoids re-download on restart)
      - ${DOCKER_DATA}/clamav/db:/var/lib/clamav
      # Optional: scan files from a host directory
      # - /path/to/scan:/scan:ro
    ports:
      # clamd daemon TCP socket — used by clients to submit scan requests
      - ${PORT_CLAMAV:-${AUTO_PORT_CLAMAV}}:3310
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── cloudbeaver (services/server/databases/cloudbeaver.yaml)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    hostname: cloudbeaver
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Initial admin credentials (only used on first boot if workspace is empty)
      # - CB_ADMIN_NAME=admin
      # - CB_ADMIN_PASSWORD=changeme
      # Override the server name shown in the UI
      # - CB_SERVER_NAME=CloudBeaver
      # Listening port inside the container (default 8978)
      # - CB_SERVER_PORT=8978
      # URL prefix when served behind a reverse proxy at a sub-path
      # - CB_ROOT_URI=/cloudbeaver
    volumes:
      # Workspace stores driver configs, connection presets, and user sessions
      - ${DOCKER_DATA}/cloudbeaver/workspace:/opt/cloudbeaver/workspace
    ports:
      - ${PORT_CLOUDBEAVER}:8978
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── cloudpanel (services/server/management/cloudpanel.yaml)
  cloudpanel:
    image: cloudpanel/cloudpanel:latest
    container_name: cloudpanel
    hostname: cloudpanel
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/cloudpanel/data:/home
      - ${DOCKER_DATA}/cloudpanel/clp:/etc/clp
      - ${DOCKER_DATA}/cloudpanel/mysql:/var/lib/mysql
      - ${DOCKER_DATA}/cloudpanel/nginx:/etc/nginx
      - ${DOCKER_DATA}/cloudpanel/letsencrypt:/etc/letsencrypt
    # Ports exposed via host networking:
    # 80   HTTP
    # 443  HTTPS
    # 8443 CloudPanel admin UI (HTTPS)
    # 22   SSH

# networks:
#   proxy:
#     external: true

  # ── cockpit (services/server/management/cockpit.yaml)
  cockpit:
    image: cockpit/ws:latest
    container_name: cockpit
    hostname: cockpit
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      - TZ=${TZ}
    volumes:
      # Allow Cockpit to manage the host system
      - /run/systemd/private:/run/systemd/private
      - /run/dbus:/run/dbus
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/os-release:/etc/os-release:ro
      - /etc/hostname:/etc/hostname:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - ${PORT_COCKPIT}:9090
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── core (services/server/management/core.yaml)
  mongo:
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    # ports:
    #   - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
  
  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Core cache for repos for latest commit hash / contents
      - repo-cache:/repo-cache
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at 
    ## "http://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using 
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./compose.env
    volumes:
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}


  # ── cronmaster (services/server/automation/cronmaster.yaml)
  cronmaster:
    image: ghcr.io/fccview/cronmaster:latest
    container_name: cronmaster
    hostname: cronmaster
    user: "root"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      - DOCKER=true
      - AUTH_PASSWORD=${CRONMASTER_AUTH_PASSWORD:-changeme}
      - HOST_CRONTAB_USER=${CRONMASTER_HOST_USER:-root}
      - NEXT_PUBLIC_CLOCK_UPDATE_INTERVAL=${CRONMASTER_CLOCK_INTERVAL:-30000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/cronmaster/scripts:/app/scripts
      - ${DOCKER_DATA}/cronmaster/data:/app/data
      - ${DOCKER_DATA}/cronmaster/snippets:/app/snippets
    ports:
      - ${PORT_CRONMASTER:-${AUTO_PORT_CRONMASTER}}:3000
    pid: host
    privileged: true
    init: true


  # ── cv4pve-admin (services/server/management/cv4pve-admin.yaml)
  cv4pve-admin:
    image: corsinvest/cv4pve-admin:latest
    container_name: cv4pve-admin
    hostname: cv4pve-admin
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Proxmox VE cluster connection — set your PVE host/port
      # - PVE_HOST=proxmox.${BASE_DOMAIN}
      # - PVE_PORT=8006
    volumes:
      - ${DOCKER_DATA}/cv4pve-admin/config:/config
      - ${DOCKER_DATA}/cv4pve-admin/data:/data
    ports:
      - ${PORT_CV4PVE_ADMIN:-${AUTO_PORT_CV4PVE_ADMIN}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── datastation (services/server/databases/datastation.yaml)
  datastation:
    image: multiprocessio/datastation:latest
    container_name: datastation
    hostname: datastation
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Server address to bind (default 0.0.0.0)
      # - HOST=0.0.0.0
      # Internal listening port (default 8080)
      # - PORT=8080
      # Authentication token — leave empty to disable (not recommended for public)
      # - AUTH_TOKEN=changeme
    volumes:
      # Project files and connection configs are stored here
      - ${DOCKER_DATA}/datastation/data:/root/.datastation
    ports:
      - ${PORT_DATASTATION}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── db-studio (services/server/databases/db-studio.yaml)
  db-studio:
    image: husamql3/db-studio:latest
    container_name: db-studio
    hostname: db-studio
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Optional: pre-configure a default database host
      # - DB_HOST=postgres
      # - DB_PORT=5432
      # - DB_USER=${POSTGRES_USER}
      # - DB_PASSWORD=${POSTGRES_PASSWORD}
      # - DB_NAME=${POSTGRES_DB}
    volumes:
      - ${DOCKER_DATA}/db-studio/config:/config
    ports:
      - ${PORT_DB_STUDIO}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── dockge (services/server/management/dockge/dockge.yaml)
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    hostname: dockge
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - DOCKGE_STACKS_DIR=${DOCKER_DATA}/server/management/dockge/stacks

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/server/management/dockge/config:/app/data
      - ${DOCKER_DATA}/server/management/dockge/stacks:${DOCKER_DATA}/server/management/dockge/stacks

    ports:
      - ${PORT_DOCKGE:-${AUTO_PORT_DOCKGE}}:5001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── dokploy (services/server/dashboards/dokploy.yaml)
  dokploy:
    image: dokploy/dokploy:latest
    container_name: dokploy
    hostname: dokploy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # --- Optional: SMTP for invitation / password reset emails ---
      # - SMTP_HOST=${SMTP_HOST}
      # - SMTP_PORT=${SMTP_PORT}
      # - SMTP_USERNAME=${SMTP_USERNAME}
      # - SMTP_PASSWORD=${SMTP_PASSWORD}
      # - SMTP_FROM=${SMTP_FROM}
      # --- Optional: S3-compatible storage for database backups ---
      # - AWS_ACCESS_KEY_ID=your_s3_access_key
      # - AWS_SECRET_ACCESS_KEY=your_s3_secret_key
      # - AWS_REGION=us-east-1
      # - AWS_BUCKET=dokploy-backups
      # --- Optional: GitHub OAuth app for SSO login ---
      # - GITHUB_CLIENT_ID=your_github_client_id
      # - GITHUB_CLIENT_SECRET=your_github_client_secret
      # --- Optional: GitLab OAuth ---
      # - GITLAB_CLIENT_ID=your_gitlab_client_id
      # - GITLAB_CLIENT_SECRET=your_gitlab_client_secret
      # - GITLAB_URL=https://gitlab.com         # Self-hosted GitLab URL if applicable
      # --- Optional: Bitbucket OAuth ---
      # - BITBUCKET_CLIENT_ID=your_bitbucket_client_id
      # - BITBUCKET_CLIENT_SECRET=your_bitbucket_client_secret
    volumes:
      # Dokploy state: database, config, deploy logs
      - ${DOCKER_DATA}/dokploy/data:/etc/dokploy
      # Docker socket required for container/stack management
      - /var/run/docker.sock:/var/run/docker.sock
      # Traefik certificate storage (Dokploy manages its own Traefik instance)
      - ${DOCKER_DATA}/dokploy/traefik:/etc/traefik
      # Optional: mount host Docker configuration for registry auth
      # - /root/.docker:/root/.docker:ro
    ports:
      # Dokploy web UI and API
      - ${PORT_DOCK_DPLOY:-${AUTO_PORT_DOCK_DPLOY}}:3000
      # Traefik HTTP (managed by Dokploy — exposes deployed apps)
      # Uncomment if you want Dokploy's Traefik to handle HTTP traffic
      # - "80:80"
      # - "443:443"
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Start: docker compose up -d
# 2. Access: http://your-server:${PORT_DOCK_DPLOY:-${AUTO_PORT_DOCK_DPLOY}}
# 3. Register an admin account on first visit (first user becomes admin)
# 4. Set your server domain in Settings → Server → Domain
#    to enable automatic HTTPS for deployed apps via Let's Encrypt
#
# Notes:
# - Dokploy manages its own Traefik internally — do NOT run a separate
#   Traefik container on ports 80/443 alongside Dokploy unless you
#   configure Dokploy to use an external proxy instead.
# - /etc/dokploy contains the SQLite database and all state — back it up.
# - /var/run/docker.sock is required; Dokploy needs Docker engine access.
# - Multi-server: add remote Docker hosts under Settings → Servers.
# ============================================================

  # ── dozzle (services/server/management/dozzle/dozzle.yaml)
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    hostname: dozzle
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - DOZZLE_LEVEL=info                                    # Log level (trace, debug, info, warn, error)
      # - DOZZLE_REMOTE_HOST=tcp://remotehost:2375             # Remote Docker host
      # - DOZZLE_AUTH_PROVIDER=simple                          # Auth provider (simple, forward-proxy)
      # - DOZZLE_NO_ANALYTICS=true                             # Disable analytics

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (read-only)

    ports:
      - ${PORT_DOZZLE:-${AUTO_PORT_DOZZLE}}:8080

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── ferretdb (services/server/management/ferretdb.yaml)
  postgres:
    # Recommended: Pin to a specific version
    # https://github.com/FerretDB/documentdb/pkgs/container/postgres-documentdb
    image: ghcr.io/ferretdb/postgres-documentdb
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    # ports:
    #   - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres

  ferretdb:
    # Recommended: Pin to a specific version
    # https://github.com/FerretDB/FerretDB/pkgs/container/ferretdb
    image: ghcr.io/ferretdb/ferretdb
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - postgres
    # ports:
    #   - 27017:27017
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres
  
  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Core cache for repos for latest commit hash / contents
      - repo-cache:/repo-cache
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at 
    ## "http://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using 
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./compose.env
    volumes:
      ## Mount external docker socket
      - :/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}


  # ── friendup-os (services/server/webos/friendup-os.yaml)
  friendup-os:
    image: friendupcloud/friendup:latest
    container_name: friendup-os
    hostname: friendup-os
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - PUID=${PUID}   # User ID for file permissions
      # - PGID=${PGID}   # Group ID for file permissions
    volumes:
      - ${DOCKER_DATA}/friendup-os/cfg:/home/friend/friendup/build/cfg         # Config
      - ${DOCKER_DATA}/friendup-os/storage:/home/friend/friendup/build/storage # User storage
    ports:
      - ${PORT_FRIENDUP:-${AUTO_PORT_FRIENDUP}}:6502
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── glance (services/server/dashboards/glance.yaml)
  glance:
    image: ghcr.io/glanceapp/glance:latest
    container_name: glance
    hostname: glance
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/server/dashboards/glance/config:/app/config

    ports:
      - ${PORT_GLANCE:-${AUTO_PORT_GLANCE}}:8080

  # ── homarr (services/server/dashboards/homarr/homarr.yaml)
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    hostname: homarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - BASE_URL=homarr.${BASE_DOMAIN}                       # External base URL
      # - SECRET_ENCRYPTION_KEY=${SECRET_KEY}                  # Encryption key (32 hex chars)
      # - AUTH_PROVIDER=credentials                            # Auth provider (credentials, ldap, oidc)

    volumes:
      - ${DOCKER_DATA}/server/homarr/config:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (for container info)

    ports:
      - ${PORT_HOMARR:-${AUTO_PORT_HOMARR}}:7575

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── homepage (services/server/dashboards/homepage/homepage.yaml)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    hostname: homepage
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/server/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (for container stats)

    ports:
      - ${PORT_HOMEPAGE:-${AUTO_PORT_HOMEPAGE}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── infisical (services/server/security/infisical.yaml)
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    hostname: infisical
    restart: unless-stopped
    depends_on:
      infisical-postgres:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    environment:
      - TZ=${TZ}
      # Node environment
      - NODE_ENV=production
      # 32-character hex key used to encrypt secrets at rest (generate: openssl rand -hex 16)
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      # Auth secret for signing JWT tokens (generate: openssl rand -hex 32)
      - AUTH_SECRET=${SECRET_KEY}
      # PostgreSQL connection URI
      - DB_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infisical-postgres:5432/infisical
      # Redis connection URI
      - REDIS_URL=redis://infisical-redis:6379
      # Public URL this instance is reachable at (no trailing slash)
      - SITE_URL=https://infisical.${BASE_DOMAIN}
      # Optional SMTP settings for email invitations and notifications
      # - SMTP_HOST=smtp.${BASE_DOMAIN}
      # - SMTP_PORT=587
      # - SMTP_USERNAME=infisical@${BASE_DOMAIN}
      # - SMTP_PASSWORD=changeme
      # - SMTP_FROM_NAME=Infisical
      # - SMTP_FROM_ADDRESS=noreply@${BASE_DOMAIN}
      # Telemetry (set to false to opt out)
      # - TELEMETRY_ENABLED=false
    volumes:
      - ${DOCKER_DATA}/infisical/config:/app/config
    ports:
      - ${PORT_INFISICAL}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  infisical-postgres:
    image: postgres:16-alpine
    container_name: infisical-postgres
    hostname: infisical-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - ${DOCKER_DATA}/infisical/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    hostname: infisical-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    # Uncomment to require Redis auth (also update REDIS_URL above)
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/infisical/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── kasm (services/server/remote-desktop/kasm.yaml)
  kasm:
    image: lscr.io/linuxserver/kasm:latest
    container_name: kasm
    hostname: kasm
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Password for the built-in admin user (set on first run)
      - KASM_PORT=443
      # Optional: override default user password
      # - KASM_USER_PASSWORD=${SECRET_KEY}
    volumes:
      - ${DOCKER_DATA}/kasm/data:/opt
      - ${DOCKER_DATA}/kasm/profiles:/profiles
      # Optional: persist workspace user home directories
      # - ${DOCKER_DATA}/kasm/persistent:/persistent
    ports:
      # Kasm web UI and workspace streaming (HTTPS)
      - ${PORT_KASM}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── keycloak (services/server/auth/keycloak.yaml)
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    hostname: keycloak-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_pass}
    volumes:
      - ${DOCKER_DATA}/keycloak/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    hostname: keycloak
    restart: unless-stopped
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    # Run in production mode (requires HTTPS or proxy headers)
    # Use 'start-dev' for development (no HTTPS required)
    command: start --optimized
    environment:
      - TZ=${TZ}
      # Admin credentials (change immediately after first login)
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      # Database
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_pass}
      # Hostname (required for production mode)
      - KC_HOSTNAME=auth.${BASE_DOMAIN}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      # HTTP settings
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      # Proxy mode: edge (reverse proxy handles TLS), reencrypt, passthrough
      - KC_PROXY=edge
      # Health and metrics endpoints
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      # Logging
      - KC_LOG_LEVEL=${KC_LOG_LEVEL:-INFO}
      # Caching (ispn = Infinispan, local = single node)
      - KC_CACHE=local
      # Theme (optional custom theme)
      # - KC_SPI_THEME_DEFAULT=keycloak
    volumes:
      - ${DOCKER_DATA}/keycloak/config:/opt/keycloak/conf
      # Optional: custom themes
      # - ${DOCKER_DATA}/keycloak/themes:/opt/keycloak/themes
      # Optional: custom providers/extensions
      # - ${DOCKER_DATA}/keycloak/providers:/opt/keycloak/providers
    ports:
      - ${PORT_KEYCLOAK:-${AUTO_PORT_KEYCLOAK}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_KEYCLOAK:-${AUTO_PORT_KEYCLOAK}}/admin
# 2. Login with KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
# 3. Create a new realm (do not use the master realm for apps)
# 4. Create clients for each application needing SSO
#
# For development (no reverse proxy), use:
#   command: start-dev
#   Remove KC_HOSTNAME, KC_PROXY, KC_HOSTNAME_STRICT settings
#
# Build optimized image for production:
#   docker build --build-arg KC_DB=postgres -t keycloak-custom .
# ============================================================

  # ── kodcloud (services/server/webos/kodcloud.yaml)
  kodcloud:
    image: kodcloud/kodcloud:latest
    container_name: kodcloud
    hostname: kodcloud
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - PUID=${PUID}   # User ID for file permissions
      # - PGID=${PGID}   # Group ID for file permissions
    volumes:
      - ${DOCKER_DATA}/kodcloud/data:/var/www/html/data    # User data and uploads
      - ${DOCKER_DATA}/kodcloud/config:/var/www/html/config # Application configuration
    ports:
      - ${PORT_KODCLOUD:-${AUTO_PORT_KODCLOUD}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── kubero (services/server/management/kubero.yaml)
  kubero:
    image: ghcr.io/kubero-dev/kubero/kubero:latest
    container_name: kubero
    hostname: kubero
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Kubernetes access — mount kubeconfig or use in-cluster config
      - KUBECONFIG=/home/kubero/.kube/config
      # Application secret key
      - KUBERO_SESSION_KEY=${SECRET_KEY}
      # Admin credentials
      - KUBERO_USERS=[{"id":1,"method":"local","username":"admin","password":"${SECRET_KEY}","insecure":false,"skipTLSVerify":false}]
      # Webhook secret for git integrations
      - KUBERO_WEBHOOK_SECRET=${SECRET_KEY}
      # Domain used for app routing
      # - KUBERO_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/kubero/config:/home/kubero/.kube
      - ${DOCKER_DATA}/kubero/data:/app/data
    ports:
      - ${PORT_KUBERO}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── openpanel (services/server/management/openpanel.yaml)
  openpanel:
    image: openpanel/openpanel:latest
    container_name: openpanel
    hostname: openpanel
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=${TZ}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${SECRET_KEY}
    volumes:
      - ${DOCKER_DATA}/openpanel/data:/etc/openpanel
      - ${DOCKER_DATA}/openpanel/websites:/home
      - ${DOCKER_DATA}/openpanel/mysql:/var/lib/mysql
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${PORT_OPENPANEL}:2087
      # Optional: expose website hosting ports
      # - "80:80"
      # - "443:443"
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── portainer (services/server/dashboards/portainer/portainer.yaml)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/server/portainer/config:/data
      - /var/run/docker.sock:/var/run/docker.sock                # Docker socket

    ports:
      - ${PORT_PORTAINER:-${AUTO_PORT_PORTAINER}}:9000                             # HTTP web UI
      - ${PORT_PORTAINER_HTTPS:-${AUTO_PORT_PORTAINER_HTTPS}}:9443                       # HTTPS web UI
      # - ${PORT_PORTAINER_AGENT:-${AUTO_PORT_PORTAINER_AGENT}}:8000                     # Agent/Edge agent port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── puter (services/server/webos/puter.yaml)
  puter:
    image: ghcr.io/heyputer/puter:latest
    container_name: puter
    hostname: puter
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUTER_DOMAIN=${PUTER_DOMAIN}          # Domain for the Puter instance (e.g. puter.example.com)
      # - PUTER_API_DOMAIN=api.${PUTER_DOMAIN} # API subdomain (auto-derived if unset)
    volumes:
      - ${DOCKER_DATA}/puter/config:/etc/puter   # Application configuration
      - ${DOCKER_DATA}/puter/data:/var/puter     # User data and file storage
    ports:
      - ${PORT_PUTER:-${AUTO_PORT_PUTER}}:4100
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── safeline-mgt (services/server/security/safeline-mgt.yaml)
  safeline-pg:
    image: postgres:15-alpine
    container_name: safeline-pg
    hostname: safeline-pg
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=safeline-ce
      - POSTGRES_DB=safeline-ce
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/safeline/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeline-ce -d safeline-ce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-mgt:
    image: chaitin/safeline-mgt:latest
    container_name: safeline-mgt
    hostname: safeline-mgt
    restart: unless-stopped
    depends_on:
      safeline-pg:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # PostgreSQL DSN
      - MGT_PG=host=safeline-pg port=5432 user=safeline-ce password=${POSTGRES_PASSWORD} dbname=safeline-ce sslmode=disable
      # Detection engine endpoint
      - MARIO_URL=http://safeline-mario:80/
      # WAF proxy management socket
      - TENGINE_URL=http://safeline-tengine:9001
      # FVM rule engine endpoint
      - FVM_URL=http://safeline-fvm:9004
      # Initial admin password (set on first boot only)
      # - ADMIN_PASSWORD=${SECRET_KEY}
    volumes:
      - ${DOCKER_DATA}/safeline/mgt:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Management Web UI — access via https://HOST:PORT_SAFELINE
      - ${PORT_SAFELINE}:1443
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-tengine:
    image: chaitin/safeline-tengine:latest
    container_name: safeline-tengine
    hostname: safeline-tengine
    restart: unless-stopped
    depends_on:
      - safeline-mgt
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/safeline/tengine/config:/etc/nginx
      - ${DOCKER_DATA}/safeline/tengine/logs:/var/log/nginx
      - ${DOCKER_DATA}/safeline/tengine/cache:/var/cache/nginx
    ports:
      # Public HTTP/HTTPS ports — traffic routed through the WAF
      - 80:80
      - 443:443
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-mario:
    image: chaitin/safeline-mario:latest
    container_name: safeline-mario
    hostname: safeline-mario
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Log verbosity: debug, info, warn, error
      # - LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/safeline/mario:/app/data
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-fvm:
    image: chaitin/safeline-fvm:latest
    container_name: safeline-fvm
    hostname: safeline-fvm
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/safeline/fvm:/app/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── ssm-client (services/server/management/ssm-client.yaml)
  ssm-client:
    image: ghcr.io/squirrelcorporation/squirrelserversmanager-client:latest
    container_name: ssm-client
    hostname: ssm-client
    restart: unless-stopped
    depends_on:
      - ssm-server
    environment:
      - TZ=${TZ}
    ports:
      - ${PORT_SSM:-${AUTO_PORT_SSM}}:8000
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-server:
    image: ghcr.io/squirrelcorporation/squirrelserversmanager-server:latest
    container_name: ssm-server
    hostname: ssm-server
    restart: unless-stopped
    depends_on:
      ssm-mongodb:
        condition: service_healthy
      ssm-redis:
        condition: service_started
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - MONGODB_URI=mongodb://ssm-mongodb:27017/ssm
      - REDIS_HOST=ssm-redis
      - REDIS_PORT=6379
    volumes:
      - ${DOCKER_DATA}/ssm/server/config:/app/config
      - ${DOCKER_DATA}/ssm/server/playbooks:/app/playbooks
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-agent-proxy:
    image: ghcr.io/squirrelcorporation/squirrelserversmanager-agent-proxy:latest
    container_name: ssm-agent-proxy
    hostname: ssm-agent-proxy
    restart: unless-stopped
    depends_on:
      - ssm-server
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ssm/agent-proxy/config:/config
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-mongodb:
    image: mongo:7.0
    container_name: ssm-mongodb
    hostname: ssm-mongodb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ssm/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-redis:
    image: redis:7-alpine
    container_name: ssm-redis
    hostname: ssm-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ssm/redis:/data
    command: --save 60 1 --loglevel warning
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── stackauth-backend (services/server/auth/stackauth-backend.yaml)
  stackauth-postgres:
    image: postgres:16-alpine
    container_name: stackauth-postgres
    hostname: stackauth-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=stackauth
      - POSTGRES_USER=stackauth
      - POSTGRES_PASSWORD=${STACKAUTH_POSTGRES_PASSWORD:-stackauth_pass}
    volumes:
      - ${DOCKER_DATA}/stackauth/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackauth -d stackauth"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  stackauth-backend:
    image: stackauth/backend:latest
    container_name: stackauth-backend
    hostname: stackauth-backend
    restart: unless-stopped
    depends_on:
      stackauth-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database
      - STACK_DATABASE_CONNECTION_STRING=postgresql://stackauth:${STACKAUTH_POSTGRES_PASSWORD:-stackauth_pass}@stackauth-postgres:5432/stackauth
      # Secret key for signing tokens - generate with: openssl rand -hex 32
      - STACK_SECRET_SERVER_KEY=${STACKAUTH_SECRET_SERVER_KEY}
      # Public URL of the backend (used for redirect URIs)
      - NEXT_PUBLIC_STACK_API_URL=https://auth.${BASE_DOMAIN}
      # Superuser API key (for dashboard access)
      - STACK_SUPERUSER_USERNAME=${STACKAUTH_ADMIN_EMAIL:-admin@${BASE_DOMAIN}}
      - STACK_SUPERUSER_PASSWORD=${STACKAUTH_ADMIN_PASSWORD:-changeme}
      # Email (optional, for magic links and notifications)
      # - STACK_EMAIL_HOST=smtp.${BASE_DOMAIN}
      # - STACK_EMAIL_PORT=587
      # - STACK_EMAIL_USERNAME=${SMTP_USERNAME}
      # - STACK_EMAIL_PASSWORD=${SMTP_PASSWORD}
      # - STACK_EMAIL_FROM=auth@${BASE_DOMAIN}
      # OAuth providers (configure in dashboard or via env)
      # - STACK_OAUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # - STACK_OAUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # - STACK_OAUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      # - STACK_OAUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    volumes:
      - ${DOCKER_DATA}/stackauth/backend:/app/data
    ports:
      - ${PORT_STACKAUTH:-${AUTO_PORT_STACKAUTH}}:8101
    # networks:
    #   - ${DEFAULT_NETWORK}

  stackauth-dashboard:
    image: stackauth/dashboard:latest
    container_name: stackauth-dashboard
    hostname: stackauth-dashboard
    restart: unless-stopped
    depends_on:
      - stackauth-backend
    environment:
      - TZ=${TZ}
      # Points to the backend API
      - NEXT_PUBLIC_STACK_API_URL=https://auth.${BASE_DOMAIN}
      - STACK_API_URL=http://stackauth-backend:8101
    ports:
      - ${PORT_STACKAUTH_DASHBOARD:-${AUTO_PORT_STACKAUTH_DASHBOARD}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access the dashboard at http://your-server:${PORT_STACKAUTH_DASHBOARD:-${AUTO_PORT_STACKAUTH_DASHBOARD}}
# 2. Login with STACKAUTH_ADMIN_EMAIL / STACKAUTH_ADMIN_PASSWORD
# 3. Create your first project and configure auth methods
# 4. Copy the Project API keys into your application
#
# SDK integration (Next.js example):
#   npm install @stackframe/stack
#   Configure NEXT_PUBLIC_STACK_PROJECT_ID and NEXT_PUBLIC_STACK_API_URL
# ============================================================

  # ── tirreno (services/server/security/tirreno.yaml)
  tirreno:
    image: ghcr.io/tirrenotechnologies/tirreno:latest
    container_name: tirreno
    hostname: tirreno
    restart: unless-stopped
    depends_on:
      tirreno-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # PostgreSQL connection details
      - DB_HOST=tirreno-postgres
      - DB_PORT=5432
      - DB_NAME=tirreno
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Application secret for signing sessions/tokens
      - APP_SECRET=${SECRET_KEY}
      # Full public URL (used for callback and link generation)
      # - APP_URL=https://tirreno.${BASE_DOMAIN}
      # Admin account credentials set on first boot
      # - ADMIN_EMAIL=admin@${BASE_DOMAIN}
      # - ADMIN_PASSWORD=changeme
      # Log level: debug, info, warning, error
      # - LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/tirreno/config:/app/config
      - ${DOCKER_DATA}/tirreno/data:/app/data
    ports:
      - ${PORT_TIRRENO}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

  tirreno-postgres:
    image: postgres:16-alpine
    container_name: tirreno-postgres
    hostname: tirreno-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tirreno
    volumes:
      - ${DOCKER_DATA}/tirreno/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tirreno"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── watchtower (services/server/management/watchtower/watchtower.yaml)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true                                 # Remove old images after update
      - WATCHTOWER_SCHEDULE=0 0 4 * * *                        # Cron: run daily at 4 AM
      # - WATCHTOWER_NOTIFICATIONS=shoutrrr                    # Notification provider
      # - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL} # Notification URL
      # - WATCHTOWER_MONITOR_ONLY=true                         # Only monitor, don't update

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock               # Docker socket (required)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wazuhmanager (services/server/wazuhmanager.yaml)
  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - TZ=${TZ}
      # Indexer connection
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      # Filebeat TLS verification
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      # API credentials
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      # Wazuh manager persistent state
      - wazuh-api-config:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      # SSL certificates (generate before first run)
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      # Manager ossec.conf
      - ${DOCKER_DATA}/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    ports:
      # Agent registration (authd)
      - "1515:1515"
      # Agent data ingestion (agentd) — UDP and TCP
      - "1514:1514/udp"
      - "1514:1514"
      # Wazuh REST API
      - "55000:55000"
    # networks:
    #   - ${DEFAULT_NETWORK}

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.0
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - TZ=${TZ}
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      # SSL certificates
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      # Indexer configuration
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    ports:
      # OpenSearch REST API / indexer
      - "9200:9200"
    # networks:
    #   - ${DEFAULT_NETWORK}

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
    environment:
      - TZ=${TZ}
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      # SSL certificates for the dashboard
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      # Dashboard configuration
      - ${DOCKER_DATA}/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ${DOCKER_DATA}/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    ports:
      # Dashboard HTTPS web UI
      - ${PORT_WAZUH_DASHBOARD}:443
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    # networks:
    #   - ${DEFAULT_NETWORK}


  # ── zitadel (services/server/auth/zitadel.yaml)
  zitadel-postgres:
    image: postgres:16-alpine
    container_name: zitadel-postgres
    hostname: zitadel-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=zitadel
      - POSTGRES_USER=zitadel
      - POSTGRES_PASSWORD=${ZITADEL_POSTGRES_PASSWORD:-zitadel_pass}
    volumes:
      - ${DOCKER_DATA}/zitadel/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    hostname: zitadel
    restart: unless-stopped
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode disabled
    environment:
      - TZ=${TZ}
      # Master key for encryption - generate with: zitadel keys generate or openssl rand -hex 32
      - ZITADEL_MASTERKEY=${ZITADEL_MASTERKEY}
      # Database (PostgreSQL)
      - ZITADEL_DATABASE_POSTGRES_HOST=zitadel-postgres
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=${ZITADEL_POSTGRES_PASSWORD:-zitadel_pass}
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=zitadel
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=${ZITADEL_POSTGRES_PASSWORD:-zitadel_pass}
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable
      # External domain - the public-facing URL
      - ZITADEL_EXTERNALDOMAIN=${BASE_DOMAIN}
      - ZITADEL_EXTERNALPORT=${PORT_ZITADEL:-${AUTO_PORT_ZITADEL}}
      - ZITADEL_EXTERNALSECURE=false
      # First instance admin user (created on first start)
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME=${ZITADEL_ADMIN_EMAIL:-admin@${BASE_DOMAIN}}
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=${ZITADEL_ADMIN_PASSWORD:-Password1!}
      # Port
      - ZITADEL_PORT=8080
      # Log level: debug, info, warn, error
      # - ZITADEL_LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/zitadel/config:/config
    ports:
      - ${PORT_ZITADEL:-${AUTO_PORT_ZITADEL}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_ZITADEL:-${AUTO_PORT_ZITADEL}}/ui/console
# 2. Login with ZITADEL_ADMIN_EMAIL and ZITADEL_ADMIN_PASSWORD
# 3. You will be prompted to change the password on first login
# 4. Create organizations, projects, and applications from the console
#
# For production with TLS:
#   Change --tlsMode to 'external' or 'enabled'
#   Set ZITADEL_EXTERNALSECURE=true
#   Set ZITADEL_EXTERNALPORT=443
#
# CockroachDB alternative (for distributed deployments):
#   Replace postgres service with CockroachDB and update
#   ZITADEL_DATABASE_COCKROACH_* env vars instead
# ============================================================


