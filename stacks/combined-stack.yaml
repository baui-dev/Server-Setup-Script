  # ── headscale (services/networking/vpn/headscale/headscale.yaml)
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    hostname: headscale
    restart: unless-stopped

    command: serve

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/headscale/config:/etc/headscale
      - ${DOCKER_DATA}/networking/headscale/data:/var/lib/headscale

    ports:
      - ${PORT_HEADSCALE:-${AUTO_PORT_HEADSCALE}}:8080                           # gRPC and HTTP port
      # - ${PORT_HEADSCALE_METRICS:-${AUTO_PORT_HEADSCALE_METRICS}}:9090                 # Metrics endpoint

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── hiddify (services/networking/hiddify.yaml)
  hiddify:
    image: hiddify/hiddify-manager:latest
    container_name: hiddify
    hostname: hiddify
    restart: unless-stopped
    # Hiddify needs host network for full protocol support
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ}
      # Admin panel credentials
      - ADMIN_SECRET=${HIDDIFY_ADMIN_SECRET:-changeme}
      # Domain for certificates and proxy endpoints
      - DOMAIN=${BASE_DOMAIN}
      # Fake domain (SNI for reality protocol)
      # - FAKE_DOMAIN=www.google.com
      # Mode: auto-cdn-ip, direct, sub-link-only
      # - MODE=auto-cdn-ip
    volumes:
      - ${DOCKER_DATA}/hiddify/config:/opt/hiddify-manager
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # When using bridge network (limited functionality):
    # ports:
    #   - 80:80
    #   - 443:443
    #   - ${PORT_HIDDIFY:-${AUTO_PORT_HIDDIFY}}:8443

# ============================================================
# Hiddify Manager requires host network for full functionality.
# It manages its own internal Docker containers for different protocols.
#
# First-time setup:
# 1. Point your domain DNS to the server IP
# 2. Start the container and wait for initialization (~2 min)
# 3. Access the admin panel:
#    https://your-server/<ADMIN_SECRET>/
# 4. Configure proxy protocols and generate subscription links
# 5. Share the subscription link with clients (Hiddify, V2rayNG, etc.)
#
# Client apps:
# - HiddifyNext (Android, iOS, Windows, macOS, Linux)
# - V2rayNG (Android)
# - Shadowrocket (iOS)
# - Clash / Mihomo (cross-platform)
#
# Note: This tool is designed for use in regions with internet censorship.
# Ensure compliance with local laws when deploying.
# ============================================================

  # ── hoarder (services/productivity/bookmarks/hoarder.yaml)
  hoarder:
    image: ghcr.io/hoarder-app/hoarder:release
    container_name: hoarder
    hostname: hoarder
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Authentication - generate with: openssl rand -hex 32
      - NEXTAUTH_SECRET=${HOARDER_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:${PORT_HOARDER:-${AUTO_PORT_HOARDER}}
      # Data directory inside the container
      - DATA_DIR=/data
      # Meilisearch integration (full-text search)
      - MEILI_ADDR=${HOARDER_MEILI_ADDR:-http://hoarder-meilisearch:7700}
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
      # Chromium for screenshots and link previews
      - BROWSER_WEB_URL=http://hoarder-chrome:9222
      # -- AI Tagging (choose one provider) --
      # OpenAI (recommended for best results):
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - INFERENCE_TEXT_MODEL=gpt-4o-mini
      # - INFERENCE_IMAGE_MODEL=gpt-4o-mini
      # Ollama (self-hosted, no API key needed):
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - INFERENCE_TEXT_MODEL=llama3.1
      # - INFERENCE_IMAGE_MODEL=llava
      # Language for AI inference
      # - INFERENCE_LANG=english
      # -- Optional settings --
      # Disable new user registration after initial setup:
      # - DISABLE_SIGNUPS=true
      # Max asset size for screenshots (bytes):
      # - MAX_ASSET_SIZE=4194304
      # Enable OAuth (e.g., Authentik, Authelia):
      # - OAUTH_WELLKNOWN_URL=https://auth.${BASE_DOMAIN}/.well-known/openid-configuration
      # - OAUTH_CLIENT_ID=${HOARDER_OAUTH_CLIENT_ID}
      # - OAUTH_CLIENT_SECRET=${HOARDER_OAUTH_CLIENT_SECRET}
    volumes:
      - ${DOCKER_DATA}/hoarder/data:/data
    ports:
      - ${PORT_HOARDER:-${AUTO_PORT_HOARDER}}:3000
    depends_on:
      - hoarder-meilisearch
      - hoarder-chrome
    # networks:
    #   - ${DEFAULT_NETWORK}

  hoarder-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: hoarder-chrome
    hostname: hoarder-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    # networks:
    #   - ${DEFAULT_NETWORK}

  hoarder-meilisearch:
    image: getmeili/meilisearch:v1.11.3
