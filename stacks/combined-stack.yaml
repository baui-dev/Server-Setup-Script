# COMBINED STACK
# Generated by scripts/generate-stacks.sh
# Categories: ai communication development files media misc networking productivity server
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f combined-stack.yaml up -d

services:
  # ── 1panel (services/server/management/1panel.yaml)
  1panel:
    image: registry.cn-hangzhou.aliyuncs.com/1panel/1panel:latest
    container_name: 1panel
    hostname: 1panel
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ}
      # Initial panel port — default 10086
      - PANEL_PORT=${PORT_1PANEL:-${AUTO_PORT_1PANEL}}
      # Initial admin username
      - PANEL_USERNAME=${PANEL_USERNAME:-admin}
      # Initial admin password
      - PANEL_PASSWORD=${PANEL_PASSWORD:-${SECRET_KEY}}
    volumes:
      - ${DOCKER_DATA}/1panel/data:/var/lib/1panel
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/etc
      - /var/log:/var/log
    # ports exposed via network_mode: host
    # - ${PORT_1PANEL:-${AUTO_PORT_1PANEL}}:10086

  # ── aaronos (services/server/webos/aaronos.yaml)
  aaronos:
    image: php:8-apache
    container_name: aaronos
    hostname: aaronos
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      # Clone source before starting:
      #   git clone https://github.com/MineAndCraft12/AaronOS \
      #     ${DOCKER_DATA}/aaronos/html
      - ${DOCKER_DATA}/aaronos/html:/var/www/html
    ports:
      - ${PORT_AARONOS:-${AUTO_PORT_AARONOS}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── actual-budget (services/productivity/finance/actual-budget/actual-budget.yaml)
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    hostname: actual-budget
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - ACTUAL_OPENID_DISCOVERY_URL=${ACTUAL_OPENID_DISCOVERY_URL} # Optional OIDC SSO provider

    volumes:
      - ${DOCKER_DATA}/productivity/finance/actual-budget/config:/config
      - ${DOCKER_DATA}/productivity/finance/actual-budget/data:/data

    ports:
      - ${PORT_ACTUAL_BUDGET:-${AUTO_PORT_ACTUAL_BUDGET}}:5006

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── adguard (services/networking/dns/adguard/adguard.yaml)
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/adguard/work:/opt/adguardhome/work
      - ${DOCKER_DATA}/networking/adguard/config:/opt/adguardhome/conf

    ports:
      - ${PORT_ADGUARD_SETUP:-${AUTO_PORT_ADGUARD_SETUP}}:3000                       # Initial setup web UI
      - ${PORT_ADGUARD_HTTP:-${AUTO_PORT_ADGUARD_HTTP}}:80                            # Web UI after setup
      - ${PORT_ADGUARD_HTTPS:-${AUTO_PORT_ADGUARD_HTTPS}}:443                         # HTTPS web UI
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/tcp                         # DNS over TCP
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/udp                         # DNS over UDP
      # - 853:853/tcp                                          # DNS over TLS
      # - 784:784/udp                                          # DNS over QUIC
      # - 67:67/udp                                            # DHCP server

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── adguardhome (services/networking/adguardhome.yaml)
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    hostname: adguardhome
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      # Config and work directories
      - ${DOCKER_DATA}/adguardhome/conf:/opt/adguardhome/conf
      - ${DOCKER_DATA}/adguardhome/work:/opt/adguardhome/work
    ports:
      # Web UI (initial setup wizard and admin panel)
      - ${PORT_ADGUARD:-${AUTO_PORT_ADGUARD}}:3000/tcp
      # Web UI (after setup, migrates from 3000 to 80/443)
      - ${PORT_ADGUARD_HTTP:-${AUTO_PORT_ADGUARD_HTTP}}:80/tcp
      - ${PORT_ADGUARD_HTTPS:-${AUTO_PORT_ADGUARD_HTTPS}}:443/tcp
      # DNS (UDP + TCP)
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/udp
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/tcp
      # DNS-over-TLS (optional)
      # - ${PORT_ADGUARD_DOT:-${AUTO_PORT_ADGUARD_DOT}}:853/tcp
      # DNS-over-HTTPS (optional, served via HTTPS port)
      # - ${PORT_ADGUARD_DOH:-${AUTO_PORT_ADGUARD_DOH}}:443/tcp
      # DNSCrypt (optional)
      # - ${PORT_ADGUARD_DNSCRYPT:-${AUTO_PORT_ADGUARD_DNSCRYPT}}:5443/udp
      # - ${PORT_ADGUARD_DNSCRYPT:-${AUTO_PORT_ADGUARD_DNSCRYPT}}:5443/tcp
    # AdGuard Home needs to bind to port 53 - ensure system DNS is released
    # On systemd systems: sudo systemctl stop systemd-resolved
    # And: sudo sed -i 's/#DNSStubListener=yes/DNSStubListener=no/' /etc/systemd/resolved.conf
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_ADGUARD:-${AUTO_PORT_ADGUARD}} for initial setup
# 2. Set admin username/password
# 3. Configure upstream DNS servers (e.g., Unbound, 1.1.1.1, 8.8.8.8)
# 4. Add blocklists (Recommended: OISD, AdGuard DNS filter)
#
# If port 53 is in use by systemd-resolved:
#   sudo systemctl stop systemd-resolved && sudo systemctl disable systemd-resolved
#   echo "nameserver 127.0.0.1" | sudo tee /etc/resolv.conf
#
# Upstream DNS (configured in UI, not env vars):
#   - Unbound (local): 127.0.0.1:5335 or host-gateway:5335
#   - Cloudflare: https://cloudflare-dns.com/dns-query (DoH)
#   - Quad9: tls://dns.quad9.net (DoT)
#
# Recommended blocklists (add in UI):
#   https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
#   https://raw.githubusercontent.com/nicehash/NiceHashQuickMiner/main/assets/blocklist.txt
#   https://big.oisd.nl
# ============================================================

  # ── agregarr (services/media/movies-tv/agregarr.yaml)
  agregarr:
    image: agregarr/agregarr:latest
    container_name: agregarr
    hostname: agregarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Plex connection (configure via web UI after first start, or set here)
      # - PLEX_TOKEN=${AGREGARR_PLEX_TOKEN}          # Your Plex auth token
      # - PLEX_URL=${AGREGARR_PLEX_URL:-http://plex:32400}  # Plex server URL
    volumes:
      - ${DOCKER_DATA}/agregarr/config:/config          # Agregarr configuration and state
    ports:
      - ${PORT_AGREGARR:-${AUTO_PORT_AGREGARR}}:7171
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.agregarr.rule=Host(`agregarr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.agregarr.entrypoints=websecure"
    #   - "traefik.http.routers.agregarr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.agregarr.loadbalancer.server.port=7171"

# networks:
#   proxy:
#     external: true

  # ── aiostreams (services/media/movies-tv/aiostreams.yaml)
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  # ── algo (services/networking/algo.yaml)
  algo:
    image: trailofbits/algo:latest
    container_name: algo
    hostname: algo
    # Algo runs as a one-shot provisioning task, not a persistent service
    restart: "no"
    environment:
      - TZ=${TZ}
      # Cloud provider (local = on this host/VM)
      # - PROVIDER=local
      # Server configuration (see config/config.cfg)
    volumes:
      # Config file with user list and server settings
      - ${DOCKER_DATA}/algo/config:/algo/config
      # Output directory for client configs and keys
      - ${DOCKER_DATA}/algo/output:/algo/configs
      # SSH keys for server access (if provisioning remote)
      # - ~/.ssh:/root/.ssh:ro
    # Interactive run command - see below for usage
    command: algo

# ============================================================
# Algo VPN is primarily an Ansible-based provisioning tool.
# Usage via Docker (interactive):
#
#   docker run --rm -it \
#     -v ${DOCKER_DATA}/algo/config:/algo/config \
#     -v ${DOCKER_DATA}/algo/output:/algo/configs \
#     trailofbits/algo:latest
#
# For LOCAL server deployment (on this host):
#   1. Edit ${DOCKER_DATA}/algo/config/config.cfg to add user names
#   2. Run: docker run --rm -it --net=host --cap-add=NET_ADMIN \
#        -v ${DOCKER_DATA}/algo/config:/algo/config \
#        trailofbits/algo:latest bash -c "cd /algo && ansible-playbook main.yml -e 'provider=local'"
#
# Output (client configs) will be at:
#   ${DOCKER_DATA}/algo/output/<server-ip>/
#   - configs/wireguard/*.conf  (WireGuard client configs)
#   - configs/ipsec/manual/*.mobileconfig  (iOS/macOS IKEv2)
#
# Alternative: Use WireGuard directly (simpler for Docker):
#   See: https://github.com/linuxserver/docker-wireguard
#   Image: lscr.io/linuxserver/wireguard:latest
# ============================================================

  # ── aliasvault (services/server/security/aliasvault.yaml)
  aliasvault:
    image: lanedirt/aliasvault:latest
    container_name: aliasvault
    hostname: aliasvault
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Public-facing domain — required for correct link generation in emails
      - PUBLIC_DOMAIN=aliasvault.${BASE_DOMAIN}
      # Password for the built-in admin account (change on first run)
      - ADMIN_PASSWORD=${SECRET_KEY}
      # Passphrase used to encrypt the data-protection certificate stored on disk
      - DATA_PROTECTION_CERT_PASS=${SECRET_KEY}
      # SMTP relay for sending alias emails (all optional)
      # - SMTP_HOST=smtp.${BASE_DOMAIN}           # SMTP server hostname
      # - SMTP_PORT=587                       # SMTP port (587 for STARTTLS, 465 for TLS)
      # - SMTP_USERNAME=aliasvault@${BASE_DOMAIN} # SMTP auth username
      # - SMTP_PASSWORD=changeme              # SMTP auth password
      # - SMTP_FROM=noreply@${BASE_DOMAIN}        # Envelope from address
      # - SMTP_SECURE=true                   # Use TLS/STARTTLS
      # - ASPNETCORE_ENVIRONMENT=Production  # Runtime environment (Production/Development)
    volumes:
      - ${DOCKER_DATA}/aliasvault/data:/app/data
    ports:
      - ${PORT_ALIASVAULT}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── alist (services/files/alist.yaml)
  alist:
    image: xhofe/alist:latest
    container_name: alist
    hostname: alist
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Set to true to force a password reset on next start
      - ALIST_FORCE_RESET_PASSWORD=false
    volumes:
      - ${DOCKER_DATA}/alist/data:/opt/alist/data
    ports:
      - ${PORT_ALIST}:5244
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── alist-sync (services/files/backup/alist-sync.yaml)
  alist-sync:
    image: ghcr.io/alist-org/alist-sync:latest
    container_name: alist-sync
    hostname: alist-sync
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # AList base URL and admin token
      - ALIST_BASE_URL=http://alist:5244
      - ALIST_TOKEN=${ALIST_ADMIN_TOKEN:-changeme}
      # Sync schedule (cron format)
      - SYNC_CRON=0 3 * * *
      # Source and destination paths within AList (e.g. /local/backup -> /onedrive/backup)
      - SYNC_SRC=/local/source
      - SYNC_DST=/remote/destination
      # Sync mode: copy | sync | move
      - SYNC_MODE=copy
      # Delete destination files not present in source (sync mode only)
      - SYNC_DELETE=false
    volumes:
      - ${DOCKER_DATA}/alist-sync/config:/app/config
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── amneziawg (services/networking/amneziawg.yaml)
  amneziawg:
    image: amneziavpn/amnezia-wg:latest
    container_name: amneziawg
    hostname: amneziawg
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/amneziawg/config:/config
      - ${DOCKER_DATA}/amneziawg/data:/data
    ports:
      # WireGuard/AmneziaWG UDP port (choose a non-standard port to avoid detection)
      - ${PORT_AMNEZIAWG:-${AUTO_PORT_AMNEZIAWG}}:51820/udp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# AmneziaVPN server setup:
# 1. Generate server keys:
#    docker exec amneziawg awg genkey | tee /tmp/server_private | awg pubkey > /tmp/server_public
#
# 2. Create ${DOCKER_DATA}/amneziawg/config/wg0.conf:
#    [Interface]
#    PrivateKey = <server-private-key>
#    Address = 10.8.0.1/24
#    ListenPort = 51820
#    PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
#    PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
#
#    # Obfuscation parameters (AmneziaWG specific)
#    Jc = 3       # Junk packet count (1-128)
#    Jmin = 50    # Junk min size
#    Jmax = 1000  # Junk max size
#    S1 = 0       # Init packet junk size
#    S2 = 0       # Response junk size
#    H1 = 1       # Init packet magic header
#    H2 = 2       # Response magic header
#    H3 = 3       # Cookie magic header
#    H4 = 4       # Transport magic header
#
#    [Peer]
#    PublicKey = <client-public-key>
#    AllowedIPs = 10.8.0.2/32
#
# 3. Configure AmneziaVPN client app with server IP and obfuscation params
# ============================================================

  # ── anythingllm (services/ai/anythingllm/anythingllm.yaml)
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    hostname: anythingllm
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - STORAGE_DIR=/app/server/storage                      # Data storage directory
      # - LLM_PROVIDER=ollama                                  # LLM provider (ollama, openai, etc.)
      # - OLLAMA_BASE_PATH=http://ollama:11434                 # Ollama base URL
      # - VECTOR_DB=lancedb                                    # Vector database provider
      # - JWT_SECRET=${JWT_SECRET}                             # JWT signing secret

    volumes:
      - ${DOCKER_DATA}/ai/anythingllm/config:/app/server/storage

    ports:
      - ${PORT_ANYTHINGLLM:-${AUTO_PORT_ANYTHINGLLM}}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── app (services/server/dashboards/app.yaml)
  app:
    image: sanjeet990/astroluma:latest
    container_name: astroluma
    ##ports:
    ##  - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      SECRET_KEY: a2c5f9a8b2d7e1a7f2c9c8d9b5f7a3d5
      MONGODB_URI: mongodb://localhost:27017/astroluma
    volumes:
      - uploads_data:/app/storage/uploads
    depends_on:
      - mongodb
    restart: always
    network_mode: host

  mongodb:
    image: mongo:6.0
    container_name: astroluma_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always



  # ── appsmith (services/development/appsmith.yaml)
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: appsmith
    hostname: appsmith
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - APPSMITH_DISABLE_TELEMETRY=true              # Opt out of anonymous usage analytics
      # - APPSMITH_SIGNUP_DISABLED=false               # Set true to prevent new user self-registration
      # - APPSMITH_ADMIN_EMAILS=admin@example.com      # Comma-separated emails that are auto-granted admin
      # - APPSMITH_ALLOWED_FRAME_ANCESTORS=            # Origins allowed to embed Appsmith in an iframe
      # --- Encryption (generate both with: openssl rand -hex 16) ---
      # - APPSMITH_ENCRYPTION_PASSWORD=changeme        # Required for encrypting stored datasource credentials
      # - APPSMITH_ENCRYPTION_SALT=changeme            # Salt for the encryption password above
      # --- Custom Domain / TLS ---
      # - APPSMITH_CUSTOM_DOMAIN=app.example.com       # Enables auto Let's Encrypt TLS via Caddy
      # --- Email / SMTP ---
      # - APPSMITH_MAIL_ENABLED=false                  # Set true to enable outbound email
      # - APPSMITH_MAIL_HOST=smtp.example.com          # SMTP server hostname
      # - APPSMITH_MAIL_PORT=587                       # SMTP port (587=STARTTLS, 465=SSL)
      # - APPSMITH_MAIL_SMTP_AUTH=true                 # Enable SMTP authentication
      # - APPSMITH_MAIL_USERNAME=                      # SMTP login username
      # - APPSMITH_MAIL_PASSWORD=                      # SMTP login password
      # - APPSMITH_MAIL_FROM=noreply@example.com       # Sender address for system emails
      # - APPSMITH_MAIL_SMTP_TLS_ENABLED=true          # Enable TLS for SMTP connection
      # --- OAuth2 (Google) ---
      # - APPSMITH_OAUTH2_GOOGLE_CLIENT_ID=            # Google OAuth2 client ID
      # - APPSMITH_OAUTH2_GOOGLE_CLIENT_SECRET=        # Google OAuth2 client secret
      # --- OAuth2 (GitHub) ---
      # - APPSMITH_OAUTH2_GITHUB_CLIENT_ID=            # GitHub OAuth2 client ID
      # - APPSMITH_OAUTH2_GITHUB_CLIENT_SECRET=        # GitHub OAuth2 client secret
      # --- Google Maps ---
      # - APPSMITH_GOOGLE_MAPS_API_KEY=                # Google Maps JS API key for map widgets
    volumes:
      - ${DOCKER_DATA}/appsmith/stacks:/appsmith-stacks  # All data: MongoDB, Caddy config, uploads, logs
    ports:
      - ${PORT_APPSMITH}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── appwrite (services/development/appwrite.yaml)
  # ------------------------------------------------------------------ #
  # Main API + Console
  # ------------------------------------------------------------------ #
  appwrite:
    image: appwrite/appwrite:latest
    container_name: appwrite
    hostname: appwrite
    restart: unless-stopped
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/uploads:/storage/uploads
      - ${DOCKER_DATA}/appwrite/cache:/storage/cache
      - ${DOCKER_DATA}/appwrite/config:/storage/config
      - ${DOCKER_DATA}/appwrite/certificates:/storage/certificates
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions
    ports:
      - ${PORT_APPWRITE}:80
    depends_on:
      appwrite-mariadb:
        condition: service_healthy
      appwrite-redis:
        condition: service_healthy
      appwrite-meili:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  # ------------------------------------------------------------------ #
  # Realtime WebSocket Service
  # ------------------------------------------------------------------ #
  appwrite-realtime:
    image: appwrite/appwrite:latest
    container_name: appwrite-realtime
    hostname: appwrite-realtime
    restart: unless-stopped
    command: realtime
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-mariadb:
        condition: service_healthy
      appwrite-redis:
        condition: service_healthy

  # ------------------------------------------------------------------ #
  # Workers
  # ------------------------------------------------------------------ #
  appwrite-worker-audits:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-audits
    restart: unless-stopped
    command: worker-audits
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-webhooks:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-webhooks
    restart: unless-stopped
    command: worker-webhooks
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-deletes:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-deletes
    restart: unless-stopped
    command: worker-deletes
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/uploads:/storage/uploads
      - ${DOCKER_DATA}/appwrite/cache:/storage/cache
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-databases:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-databases
    restart: unless-stopped
    command: worker-databases
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-builds:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-builds
    restart: unless-stopped
    command: worker-builds
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-functions:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-functions
    restart: unless-stopped
    command: worker-functions
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-executor:
        condition: service_started

  appwrite-worker-certificates:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-certificates
    restart: unless-stopped
    command: worker-certificates
    environment:
      <<: *appwrite-env
    volumes:
      - ${DOCKER_DATA}/appwrite/config:/storage/config
      - ${DOCKER_DATA}/appwrite/certificates:/storage/certificates
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-mails:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-mails
    restart: unless-stopped
    command: worker-mails
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-messaging:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-messaging
    restart: unless-stopped
    command: worker-messaging
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-migrations:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-migrations
    restart: unless-stopped
    command: worker-migrations
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy
      appwrite-mariadb:
        condition: service_healthy

  appwrite-worker-usage:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-usage
    restart: unless-stopped
    command: worker-usage
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-worker-usage-dump:
    image: appwrite/appwrite:latest
    container_name: appwrite-worker-usage-dump
    restart: unless-stopped
    command: worker-usage-dump
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  # ------------------------------------------------------------------ #
  # Maintenance & Schedulers
  # ------------------------------------------------------------------ #
  appwrite-maintenance:
    image: appwrite/appwrite:latest
    container_name: appwrite-maintenance
    restart: unless-stopped
    command: maintenance
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-schedule-functions:
    image: appwrite/appwrite:latest
    container_name: appwrite-schedule-functions
    restart: unless-stopped
    command: schedule-functions
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  appwrite-schedule-messages:
    image: appwrite/appwrite:latest
    container_name: appwrite-schedule-messages
    restart: unless-stopped
    command: schedule-messages
    environment:
      <<: *appwrite-env
    depends_on:
      appwrite-redis:
        condition: service_healthy

  # ------------------------------------------------------------------ #
  # Function Executor — spawns isolated runtime containers
  # ------------------------------------------------------------------ #
  appwrite-executor:
    image: appwrite/appwrite:latest
    container_name: appwrite-executor
    restart: unless-stopped
    command: executor
    environment:
      <<: *appwrite-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required: executor creates function containers
      - ${DOCKER_DATA}/appwrite/functions:/storage/functions

  # ------------------------------------------------------------------ #
  # MariaDB — primary relational database
  # ------------------------------------------------------------------ #
  appwrite-mariadb:
    image: mariadb:10.11
    container_name: appwrite-mariadb
    hostname: appwrite-mariadb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=appwrite_root_pass    # CHANGE THIS — must match _APP_DB_ROOT_PASS
      - MYSQL_DATABASE=appwrite
      - MYSQL_USER=appwrite
      - MYSQL_PASSWORD=appwrite_db_pass           # CHANGE THIS — must match _APP_DB_PASS
    volumes:
      - ${DOCKER_DATA}/appwrite/mariadb:/var/lib/mysql
    command: mysqld --innodb-flush-method=fsync   # Safer flush method on some filesystems
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appwrite", "-pappwrite_db_pass"]
      timeout: 10s
      interval: 15s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------ #
  # Redis — message queue broker and cache layer
  # ------------------------------------------------------------------ #
  appwrite-redis:
    image: redis:7.2-alpine
    container_name: appwrite-redis
    hostname: appwrite-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DOCKER_DATA}/appwrite/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------ #
  # MeiliSearch — full-text search engine
  # ------------------------------------------------------------------ #
  appwrite-meili:
    image: getmeili/meilisearch:v1.7
    container_name: appwrite-meili
    hostname: appwrite-meili
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=appwrite_meili_key       # CHANGE THIS — must match _APP_SEARCH_MEILISEARCH_API_KEY
    volumes:
      - ${DOCKER_DATA}/appwrite/meili:/meili_data

# networks:
#   proxy:
#     external: true

  # ── archivebox (services/files/archivebox.yaml)
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    hostname: archivebox
    restart: unless-stopped
    command: server --quick-init 0.0.0.0:8000
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Admin credentials — set before first run
      - ADMIN_USERNAME=${ARCHIVEBOX_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ARCHIVEBOX_ADMIN_PASSWORD:-changeme}
      # Allow public access without login
      - PUBLIC_INDEX=false
      - PUBLIC_SNAPSHOTS=false
      - PUBLIC_ADD_VIEW=false
      # Public-facing URL (important for assets and links)
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=https://archivebox.${BASE_DOMAIN}
      # Storage backends to enable (all enabled by default)
      - SAVE_TITLE=true
      - SAVE_FAVICON=true
      - SAVE_WGET=true
      - SAVE_WARC=true
      - SAVE_PDF=true
      - SAVE_SCREENSHOT=true
      - SAVE_DOM=true
      - SAVE_SINGLEFILE=true
      # Chrome/Chromium binary (bundled in the image)
      # - CHROME_BINARY=chromium-browser
      # Search backend (uncomment to enable full-text search)
      # - SEARCH_BACKEND_ENGINE=sonic
      # - SEARCH_BACKEND_HOST_NAME=sonic
      # - SEARCH_BACKEND_PORT=1491
      # - SEARCH_BACKEND_PASSWORD=changeme
    volumes:
      - ${DOCKER_DATA}/archivebox/data:/data
    ports:
      - ${PORT_ARCHIVEBOX}:8000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── arozos (services/server/webos/arozos.yaml)
  arozos:
    image: tobychui/arozos:latest
    container_name: arozos
    hostname: arozos
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - PUID=${PUID}   # User ID for file permissions
      # - PGID=${PGID}   # Group ID for file permissions
    volumes:
      - ${DOCKER_DATA}/arozos/files:/system/storage     # User file storage
      - ${DOCKER_DATA}/arozos/conf:/system/conf          # System configuration
      - ${DOCKER_DATA}/arozos/web:/system/web             # Web modules
    ports:
      - ${PORT_AROZOS:-${AUTO_PORT_AROZOS}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── astroluma (services/server/dashboards/astroluma.yaml)
  astroluma:
    image: sanjeet990/astroluma:latest
    container_name: astroluma
    hostname: astroluma
    restart: unless-stopped
    depends_on:
      - astroluma-mongodb
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - MONGODB_URI=mongodb://astroluma-mongodb:27017/astroluma
    volumes:
      - ${DOCKER_DATA}/astroluma/uploads:/app/storage/uploads
    ports:
      - ${PORT_ASTROLUMA}:8000
    # networks:
    #   - ${DEFAULT_NETWORK}

  astroluma-mongodb:
    image: mongo:6.0
    container_name: astroluma-mongodb
    hostname: astroluma-mongodb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/astroluma/mongodb:/data/db
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── authelia (services/server/auth/authelia/authelia.yaml)
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}           # JWT secret (required)
      # - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}   # Session secret (required)
      # - AUTHELIA_STORAGE_ENCRYPTION_KEY=${ENCRYPTION_KEY}    # Storage encryption key

    volumes:
      - ${DOCKER_DATA}/server/authelia/config:/config

    ports:
      - ${PORT_AUTHELIA:-${AUTO_PORT_AUTHELIA}}:9091

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── authentik-server (services/server/auth/authentik-server.yaml)
  authentik-postgres:
    image: postgres:16-alpine
    container_name: authentik-postgres
    hostname: authentik-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=authentik
      - POSTGRES_USER=authentik
      - POSTGRES_PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/authentik/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    hostname: authentik-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/authentik/redis:/data
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  authentik-server:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-server
    hostname: authentik-server
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Core secret - generate with: openssl rand -base64 60
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      # Database
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
      # Redis
      - AUTHENTIK_REDIS__HOST=authentik-redis
      # Email (optional)
      # - AUTHENTIK_EMAIL__HOST=smtp.${BASE_DOMAIN}
      # - AUTHENTIK_EMAIL__PORT=587
      # - AUTHENTIK_EMAIL__USERNAME=${SMTP_USERNAME}
      # - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASSWORD}
      # - AUTHENTIK_EMAIL__USE_TLS=true
      # - AUTHENTIK_EMAIL__FROM=authentik@${BASE_DOMAIN}
      # Log level: trace, debug, info, warning, error
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-info}
      # Error reporting (optional, disable for self-hosted)
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      # Cookie domain
      - AUTHENTIK_COOKIE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/authentik/media:/media
      - ${DOCKER_DATA}/authentik/custom-templates:/templates
    ports:
      - ${PORT_AUTHENTIK:-${AUTO_PORT_AUTHENTIK}}:9000
      - ${PORT_AUTHENTIK_HTTPS:-${AUTO_PORT_AUTHENTIK_HTTPS}}:9443
    # networks:
    #   - ${DEFAULT_NETWORK}

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    hostname: authentik-worker
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    user: root
    environment:
      - TZ=${TZ}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRES_PASSWORD}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      # - AUTHENTIK_EMAIL__HOST=smtp.${BASE_DOMAIN}
      # - AUTHENTIK_EMAIL__PORT=587
      # - AUTHENTIK_EMAIL__USERNAME=${SMTP_USERNAME}
      # - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASSWORD}
      # - AUTHENTIK_EMAIL__USE_TLS=true
      # - AUTHENTIK_EMAIL__FROM=authentik@${BASE_DOMAIN}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_LOG_LEVEL=${AUTHENTIK_LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/authentik/media:/media
      - ${DOCKER_DATA}/authentik/certs:/certs
      - ${DOCKER_DATA}/authentik/custom-templates:/templates
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Navigate to http://your-server:${PORT_AUTHENTIK:-${AUTO_PORT_AUTHENTIK}}/if/flow/initial-setup/
# 2. Create the initial admin user
# 3. Configure applications, providers, and flows via the admin UI
#
# Outpost (application proxy) - deploy separately per-service:
#   AUTHENTIK_TOKEN: obtained from Admin -> Outposts -> Create
# ============================================================

  # ── autobrr (services/media/automation/autobrr.yaml)
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    hostname: autobrr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/automation/autobrr/config:/config

    ports:
      - ${PORT_AUTOBRR:-${AUTO_PORT_AUTOBRR}}:7474

  # ── backvault (services/server/security/backvault.yaml)
  backvault:
    image: nicedoc/backvault:latest
    container_name: backvault
    hostname: backvault
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Encryption passphrase for backup archives (required — generate: openssl rand -hex 32)
      - ENCRYPTION_KEY=${SECRET_KEY}
      # Cron schedule for automatic backups (default: 02:00 daily)
      # - BACKUP_SCHEDULE=0 2 * * *
      # Number of snapshots to retain
      # - RETAIN_DAILY=7
      # - RETAIN_WEEKLY=4
      # - RETAIN_MONTHLY=3
      # Optional S3-compatible remote target
      # - S3_ENDPOINT=https://s3.${BASE_DOMAIN}
      # - S3_BUCKET=backvault
      # - S3_ACCESS_KEY=changeme
      # - S3_SECRET_KEY=changeme
      # Optional SFTP remote target
      # - SFTP_HOST=backup.${BASE_DOMAIN}
      # - SFTP_USER=backupuser
      # - SFTP_PRIVATE_KEY_PATH=/config/ssh/id_rsa
    volumes:
      - ${DOCKER_DATA}/backvault/config:/config
      - ${DOCKER_DATA}/backvault/data:/data
      # Mount source directories to include in backups (read-only recommended)
      # - ${DOCKER_DATA}/aliasvault:/sources/aliasvault:ro
      # - ${DOCKER_DATA}/infisical:/sources/infisical:ro
    ports:
      - ${PORT_BACKVAULT}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── bazarr (services/media/movies-tv/bazarr/bazarr.yaml)
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/bazarr/config:/config
      # - /path/to/movies:/movies                              # Movies library (must match Radarr)
      # - /path/to/tvseries:/tv                                # TV library (must match Sonarr)

    ports:
      - ${PORT_BAZARR:-${AUTO_PORT_BAZARR}}:6767

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── beepass (services/networking/beepass.yaml)
  beepass:
    image: beepassvpn/hub:latest
    container_name: beepass
    hostname: beepass
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # API and management port
      # - API_PORT=8080
      # VPN server ports
      # - VPN_PORT_START=10000
      # - VPN_PORT_END=11000
    volumes:
      - ${DOCKER_DATA}/beepass/config:/config
      - ${DOCKER_DATA}/beepass/data:/data
    ports:
      - ${PORT_BEEPASS:-${AUTO_PORT_BEEPASS}}:8080
      # VPN access key port range (expose the range used by Outline servers)
      # - "10000-10100:10000-10100/tcp"
      # - "10000-10100:10000-10100/udp"
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Outline Server (Shadowsocks-based, managed by BeePass)
  # Each Outline server instance provides VPN access via Shadowsocks
  outline-server:
    image: quay.io/outline/shadowbox:stable
    container_name: outline-server
    hostname: outline-server
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - SB_API_PORT=8081
      - SB_CERTIFICATE_FILE=/data/shadowbox.crt
      - SB_PRIVATE_KEY_FILE=/data/shadowbox.key
      # Management API prefix - must match Outline Manager
      - SB_API_PREFIX=${OUTLINE_API_PREFIX:-secret}
    volumes:
      - ${DOCKER_DATA}/beepass/outline:/data
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN

# networks:
#   proxy:
#     external: true

# ============================================================
# BeePass / Outline Setup:
# 1. Install Outline Manager (desktop app) from getoutline.org/get-started
# 2. Run the Outline server container above
# 3. In Outline Manager, click "Advanced" -> "Set up Outline yourself"
# 4. Provide the management API URL: https://your-server:8081/secret/
# 5. Create access keys and share them with BeePass clients
#
# Client apps: https://getoutline.org/get-started/#step-3
# BeePass client: https://beepass.app
#
# Note: BeePass Hub may have different requirements - verify the
# correct image and configuration at the GitHub repository.
# ============================================================

  # ── beszel (services/networking/monitoring/beszel/beszel.yaml)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    hostname: beszel
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/beszel/config:/beszel_data

    ports:
      - ${PORT_BESZEL:-${AUTO_PORT_BESZEL}}:8090

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── bichon (services/files/bichon.yaml)
  bichon:
    image: offen/docker-volume-backup:latest
    container_name: bichon
    hostname: bichon
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Cron schedule for automatic backups (default: daily at 02:00)
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      # Archive filename prefix
      - BACKUP_FILENAME=bichon-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      # Retention: prune backups older than N days
      - BACKUP_RETENTION_DAYS=7
      # Local storage directory inside the container
      - BACKUP_ARCHIVE=/archive
      # Optional: encrypt with GPG passphrase
      # - GPG_PASSPHRASE=
      # Optional: push to S3-compatible storage
      # - AWS_S3_BUCKET_NAME=my-backups
      # - AWS_S3_PATH=bichon
      # - AWS_ENDPOINT=
      # - AWS_ACCESS_KEY_ID=
      # - AWS_SECRET_ACCESS_KEY=
      # Optional: push via SFTP
      # - SSH_HOST_NAME=
      # - SSH_PORT=22
      # - SSH_USER=
      # - SSH_PASSWORD=
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Target volumes to back up (add as many as needed)
      - ${DOCKER_DATA}:/backup/data:ro
      # Local archive destination
      - ${DOCKER_DATA}/bichon/archives:/archive
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── bitmagnet (services/media/downloads/bitmagnet.yaml)
  bitmagnet-postgres:
    image: postgres:16-alpine
    container_name: bitmagnet-postgres
    hostname: bitmagnet-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=bitmagnet
      - POSTGRES_USER=bitmagnet
      - POSTGRES_PASSWORD=${BITMAGNET_POSTGRES_PASSWORD:-bitmagnet_pass}
      # Tuning for DHT indexer workload
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --data-checksums
    volumes:
      - ${DOCKER_DATA}/bitmagnet/postgres:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitmagnet -d bitmagnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  bitmagnet:
    image: bitmagnetio/bitmagnet:latest
    container_name: bitmagnet
    hostname: bitmagnet
    restart: unless-stopped
    depends_on:
      bitmagnet-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database
      - POSTGRES_HOST=bitmagnet-postgres
      - POSTGRES_NAME=bitmagnet
      - POSTGRES_USER=bitmagnet
      - POSTGRES_PASSWORD=${BITMAGNET_POSTGRES_PASSWORD:-bitmagnet_pass}
      # DHT crawler settings
      # Number of DHT nodes to crawl simultaneously
      - DHT_CRAWLER_MAX_OPEN_CONNECTIONS=4096
      # Disable classification to reduce resource usage (comment out to enable)
      # - CLASSIFIER_DISABLED=true
      # tmdb API key for media metadata enrichment (optional)
      # - TMDB_API_KEY=${TMDB_API_KEY}
      # Log level: debug, info, warn, error
      - LOG_LEVEL=${BITMAGNET_LOG_LEVEL:-info}
    volumes:
      - ${DOCKER_DATA}/bitmagnet/config:/root/.config/bitmagnet
    ports:
      # Web UI and API
      - ${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}:3333
      # DHT crawler port (BitTorrent DHT protocol)
      - ${PORT_BITMAGNET_TORRENT:-${AUTO_PORT_BITMAGNET_TORRENT}}:3334/tcp
      - ${PORT_BITMAGNET_TORRENT:-${AUTO_PORT_BITMAGNET_TORRENT}}:3334/udp
    command:
      - worker
      - run
      - --all
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Access:
#   Web UI:    http://your-server:${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}
#   GraphQL:   http://your-server:${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}/graphql
#   Torznab:   http://your-server:${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}/torznab (for Prowlarr/Sonarr)
#
# Prowlarr integration:
#   Add as Torznab indexer with URL: http://bitmagnet:3333/torznab
#
# Resource requirements:
#   The DHT crawler is network and DB intensive. Expect:
#   - High network traffic (DHT crawling)
#   - Large PostgreSQL database (grows continuously)
#   - Significant CPU for content classification
#   Reduce --max-open-connections to lower resource usage.
# ============================================================

  # ── blinko (services/productivity/notes/blinko.yaml)
  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    hostname: blinko
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      # Database connection (PostgreSQL required)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@blinko-postgres:5432/blinko
      # NextAuth secret - generate with: openssl rand -hex 32
      - NEXTAUTH_SECRET=${BLINKO_NEXTAUTH_SECRET:-changeme_generate_a_real_secret}
      - NEXTAUTH_URL=https://${BASE_DOMAIN}
      # Application port inside the container
      - PORT=1111
      # -- AI provider (optional but recommended) --
      # OpenAI:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_MODEL=gpt-4o-mini
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # Ollama (self-hosted):
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - OLLAMA_MODEL=llama3.1
    volumes:
      - ${DOCKER_DATA}/blinko/data:/app/.blinko
    ports:
      - ${PORT_BLINKO:-${AUTO_PORT_BLINKO}}:1111
    depends_on:
      blinko-postgres:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  blinko-postgres:
    image: postgres:16-alpine
    container_name: blinko-postgres
    hostname: blinko-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=blinko
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/blinko/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d blinko"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── bytestash (services/development/bytestash.yaml)
  bytestash:
    image: ghcr.io/jordan-dalby/bytestash:latest
    container_name: bytestash
    hostname: bytestash
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # --- Authentication ---
      - SECRET_KEY=${SECRET_KEY}               # JWT signing secret — generate: openssl rand -hex 32
      # - TOKEN_EXPIRY_HOURS=168               # JWT token lifespan in hours (default: 168 = 7 days)
      # - ALLOW_REGISTRATION=true              # Set false to prevent new account self-registration
      # - ALLOW_ANONYMOUS_READ=false           # Set true to allow unauthenticated read-only access
      # --- Base URL (recommended for correct link generation) ---
      # - BASE_URL=https://snippets.example.com  # Public URL of this instance
    volumes:
      - ${DOCKER_DATA}/bytestash/data:/data      # SQLite database and snippet storage
    ports:
      - ${PORT_BYTESTASH}:5000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── caddy (services/networking/caddy.yaml)
  caddy:
    image: caddy:latest
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${DOCKER_DATA}/caddy/data:/data
      - ${DOCKER_DATA}/caddy/config:/config
    ports:
      - 80:80
      - 443:443


  # ── changedetection (services/networking/monitoring/changedetection.yaml)
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/networking/monitoring/changedetection/data:/datastore

    ports:
      - ${PORT_CHANGEDETECTION:-${AUTO_PORT_CHANGEDETECTION}}:5000

  # ── chartdb (services/server/databases/chartdb.yaml)
  chartdb:
    image: ghcr.io/chartdb/chartdb:latest
    container_name: chartdb
    hostname: chartdb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Optional: restrict access to a specific origin (CORS)
      # - CHARTDB_ALLOWED_ORIGIN=https://chartdb.${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/chartdb/config:/config
    ports:
      - ${PORT_CHARTDB}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── checkmate (services/networking/checkmate.yaml)
  checkmate-mongo:
    image: mongo:7
    container_name: checkmate-mongo
    hostname: checkmate-mongo
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MONGO_INITDB_DATABASE=checkmate
      - MONGO_INITDB_ROOT_USERNAME=${CHECKMATE_MONGO_USER:-checkmate}
      - MONGO_INITDB_ROOT_PASSWORD=${CHECKMATE_MONGO_PASSWORD:-checkmate_pass}
    volumes:
      - ${DOCKER_DATA}/checkmate/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # networks:
    #   - ${DEFAULT_NETWORK}

  checkmate:
    image: bluewavelabs/checkmate:latest
    container_name: checkmate
    hostname: checkmate
    restart: unless-stopped
    depends_on:
      checkmate-mongo:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database
      - DB_CONNECTION_STRING=mongodb://${CHECKMATE_MONGO_USER:-checkmate}:${CHECKMATE_MONGO_PASSWORD:-checkmate_pass}@checkmate-mongo:27017/checkmate?authSource=admin
      # JWT secret for sessions - generate with: openssl rand -hex 32
      - JWT_SECRET=${CHECKMATE_JWT_SECRET}
      # Admin account created on first run
      - ADMIN_EMAIL=${CHECKMATE_ADMIN_EMAIL:-admin@${BASE_DOMAIN}}
      - ADMIN_PASSWORD=${CHECKMATE_ADMIN_PASSWORD:-changeme}
      # App URL (used for alert links)
      - CLIENT_HOST=https://checkmate.${BASE_DOMAIN}
      # Email notifications (optional)
      # - MAILER_SERVICE=gmail
      # - MAILER_HOST=smtp.${BASE_DOMAIN}
      # - MAILER_PORT=587
      # - MAILER_USER=${SMTP_USERNAME}
      # - MAILER_PASS=${SMTP_PASSWORD}
      # - SYSTEM_EMAIL_ADDRESS=checkmate@${BASE_DOMAIN}
      # Log level: error, warn, info, http, debug
      - LOG_LEVEL=${CHECKMATE_LOG_LEVEL:-info}
      # Allow new user registration (false for private instance)
      - ALLOW_REGISTRATION=false
    volumes:
      - ${DOCKER_DATA}/checkmate/config:/app/config
    ports:
      - ${PORT_CHECKMATE:-${AUTO_PORT_CHECKMATE}}:12000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_CHECKMATE:-${AUTO_PORT_CHECKMATE}}
# 2. Login with ADMIN_EMAIL / ADMIN_PASSWORD
# 3. Add monitors: URL, TCP port, ping, or Docker container checks
# 4. Configure notification integrations (email, Slack, Discord, etc.)
# 5. Create status pages for public visibility
# ============================================================

  # ── clamav (services/server/clamav.yaml)
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    hostname: clamav
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Freshclam update interval in seconds (default: 3600)
      - FRESHCLAM_SLEEP_DURATION=3600
      # Allow concurrent connections to clamd
      - CLAMD_MAX_THREADS=10
    volumes:
      # Persistent virus signature database (avoids re-download on restart)
      - ${DOCKER_DATA}/clamav/db:/var/lib/clamav
      # Optional: scan files from a host directory
      # - /path/to/scan:/scan:ro
    ports:
      # clamd daemon TCP socket — used by clients to submit scan requests
      - ${PORT_CLAMAV:-${AUTO_PORT_CLAMAV}}:3310
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── cloudbeaver (services/server/databases/cloudbeaver.yaml)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    hostname: cloudbeaver
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Initial admin credentials (only used on first boot if workspace is empty)
      # - CB_ADMIN_NAME=admin
      # - CB_ADMIN_PASSWORD=changeme
      # Override the server name shown in the UI
      # - CB_SERVER_NAME=CloudBeaver
      # Listening port inside the container (default 8978)
      # - CB_SERVER_PORT=8978
      # URL prefix when served behind a reverse proxy at a sub-path
      # - CB_ROOT_URI=/cloudbeaver
    volumes:
      # Workspace stores driver configs, connection presets, and user sessions
      - ${DOCKER_DATA}/cloudbeaver/workspace:/opt/cloudbeaver/workspace
    ports:
      - ${PORT_CLOUDBEAVER}:8978
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── cloudpanel (services/server/management/cloudpanel.yaml)
  cloudpanel:
    image: cloudpanel/cloudpanel:latest
    container_name: cloudpanel
    hostname: cloudpanel
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/cloudpanel/data:/home
      - ${DOCKER_DATA}/cloudpanel/clp:/etc/clp
      - ${DOCKER_DATA}/cloudpanel/mysql:/var/lib/mysql
      - ${DOCKER_DATA}/cloudpanel/nginx:/etc/nginx
      - ${DOCKER_DATA}/cloudpanel/letsencrypt:/etc/letsencrypt
    # Ports exposed via host networking:
    # 80   HTTP
    # 443  HTTPS
    # 8443 CloudPanel admin UI (HTTPS)
    # 22   SSH

# networks:
#   proxy:
#     external: true

  # ── cloudreve (services/files/cloud/cloudreve.yaml)
  cloudreve:
    image: cloudreve/cloudreve:latest
    container_name: cloudreve
    hostname: cloudreve
    restart: unless-stopped
    depends_on:
      cloudreve-db:
        condition: service_healthy
      cloudreve-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/cloudreve/uploads:/cloudreve/uploads
      - ${DOCKER_DATA}/cloudreve/avatar:/cloudreve/avatar
      # The conf.ini is generated on first run inside /cloudreve
      - ${DOCKER_DATA}/cloudreve/config:/cloudreve
      # Aria2 downloads directory (optional)
      # - ${DOCKER_DATA}/cloudreve/downloads:/downloads
    ports:
      - ${PORT_CLOUDREVE:-${AUTO_PORT_CLOUDREVE}}:5212
    # networks:
    #   - ${DEFAULT_NETWORK}

  cloudreve-db:
    image: mariadb:11
    container_name: cloudreve-db
    hostname: cloudreve-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=cloudreve
      - MYSQL_USER=${MYSQL_USER:-cloudreve}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/cloudreve/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  cloudreve-redis:
    image: redis:7-alpine
    container_name: cloudreve-redis
    hostname: cloudreve-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── cockpit (services/server/management/cockpit.yaml)
  cockpit:
    image: cockpit/ws:latest
    container_name: cockpit
    hostname: cockpit
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      - TZ=${TZ}
    volumes:
      # Allow Cockpit to manage the host system
      - /run/systemd/private:/run/systemd/private
      - /run/dbus:/run/dbus
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /etc/os-release:/etc/os-release:ro
      - /etc/hostname:/etc/hostname:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - ${PORT_COCKPIT}:9090
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── coder (services/development/coder.yaml)
  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    hostname: coder
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # --- Core networking (REQUIRED) ---
      - CODER_HTTP_ADDRESS=0.0.0.0:3000          # Bind address inside the container
      - CODER_ACCESS_URL=http://coder.${DOMAIN:-localhost}:${PORT_CODER}  # Public URL agents use to reach Coder
      # - CODER_WILDCARD_ACCESS_URL=             # Wildcard domain for port-forwarding (e.g., *.coder.example.com)
      # --- Database ---
      - CODER_PG_CONNECTION_URL=postgresql://coder:coder_db_pass@coder-db/coder?sslmode=disable  # CHANGE PASSWORD
      # --- TLS (if not terminating TLS upstream) ---
      # - CODER_TLS_ENABLE=false                 # Enable built-in TLS
      # - CODER_TLS_CERT_FILE=/certs/tls.crt     # Path to TLS certificate
      # - CODER_TLS_KEY_FILE=/certs/tls.key      # Path to TLS private key
      # --- OIDC / SSO ---
      # - CODER_OIDC_ISSUER_URL=                 # OIDC provider URL (e.g., https://accounts.google.com)
      # - CODER_OIDC_CLIENT_ID=                  # OIDC client ID
      # - CODER_OIDC_CLIENT_SECRET=              # OIDC client secret
      # - CODER_OIDC_EMAIL_DOMAIN=               # Allowed email domain for OIDC login
      # --- Email (SMTP) ---
      # - CODER_EMAIL_FROM=coder@example.com     # Sender address for Coder system emails
      # - CODER_EMAIL_SMARTHOST=smtp.example.com:587  # SMTP server (host:port)
      # - CODER_EMAIL_HELLO=localhost            # SMTP EHLO hostname
      # - CODER_EMAIL_USERNAME=                  # SMTP username
      # - CODER_EMAIL_PASSWORD=                  # SMTP password
      # --- Telemetry ---
      # - CODER_TELEMETRY=true                   # Set false to disable anonymous usage telemetry
      # --- Logging ---
      # - CODER_LOG_HUMAN_TIME=true              # Prefix log lines with human-readable timestamps
      # - CODER_VERBOSE=false                    # Enable verbose/debug logging
      # --- Non-interactive first-user bootstrap (optional) ---
      # - CODER_FIRST_USER_USERNAME=admin        # Admin username created on first run
      # - CODER_FIRST_USER_EMAIL=admin@example.com  # Admin email
      # - CODER_FIRST_USER_PASSWORD=changeme     # Admin password (min 8 chars)
      # - CODER_FIRST_USER_TRIAL=false           # Enable Coder trial license on first run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required: Coder uses Docker for workspace provisioning
      - ${DOCKER_DATA}/coder/config:/home/coder/.config
    ports:
      - ${PORT_CODER}:3000
    group_add:
      - "999"                                    # Add coder user to the docker group (adjust GID if needed)
    depends_on:
      coder-db:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  # ------------------------------------------------------------------ #
  # PostgreSQL — Coder's primary database
  # ------------------------------------------------------------------ #
  coder-db:
    image: postgres:16-alpine
    container_name: coder-db
    hostname: coder-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=coder
      - POSTGRES_PASSWORD=coder_db_pass          # CHANGE THIS — must match CODER_PG_CONNECTION_URL
      - POSTGRES_DB=coder
    volumes:
      - ${DOCKER_DATA}/coder/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# networks:
#   proxy:
#     external: true

  # ── code-server (services/development/code-server/code-server.yaml)
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    hostname: code-server
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - PASSWORD=changeme                                    # Web UI password
      # - HASHED_PASSWORD=                                     # Bcrypt-hashed password (takes precedence)
      # - SUDO_PASSWORD=changeme                               # Sudo password in container
      # - PROXY_DOMAIN=code.${BASE_DOMAIN}                    # Domain for proxy headers

    volumes:
      - ${DOCKER_DATA}/development/code-server/config:/config
      # - /path/to/projects:/projects                          # Project files directory

    ports:
      - ${PORT_CODE_SERVER:-${AUTO_PORT_CODE_SERVER}}:8443

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── compose-toolbox (services/misc/compose-toolbox.yaml)
  compose-toolbox:
    image: louislam/dockge:1
    container_name: compose-toolbox
    hostname: compose-toolbox
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # The URL used to access the Dockge web UI
      - DOCKGE_STACKS_DIR=/opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/compose-toolbox/data:/app/data
      # Mount the directory where your compose stacks live so Dockge can manage them
      - ${DOCKER_DATA}/compose-toolbox/stacks:/opt/stacks
    ports:
      - ${PORT_COMPOSE_TOOLBOX:-${AUTO_PORT_COMPOSE_TOOLBOX}}:5001
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── convertx (services/misc/convertx.yaml)
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    container_name: convertx
    hostname: convertx
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # JWT secret for session tokens — change to a long random string
      - JWT_SECRET=${CONVERTX_JWT_SECRET:-changeme_use_a_long_random_string}
      # Account registration: set to false to disable new signups after setup
      - ALLOW_UNAUTHENTICATED=false
      # Base URL for generating download links
      # - HTTP_ALLOWED_ORIGIN=https://convertx.${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/convertx/data:/app/data
    ports:
      - ${PORT_CONVERTX}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── copyparty (services/files/cloud/copyparty.yaml)
  copyparty:
    image: ghcr.io/9001/copyparty:latest
    container_name: copyparty-manager
    hostname: copyparty-manager
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/copyparty/config:/cfg
      # Data volumes — map directories to serve (configure accounts in args/config)
      - ${DOCKER_DATA}/copyparty/files:/files
    ports:
      - ${PORT_COPYPARTY}:3923
    # Optional: pass CopyParty arguments via command
    # command: --cfg /cfg/copyparty.conf
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── core (services/server/management/core.yaml)
  mongo:
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    # ports:
    #   - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
  
  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Core cache for repos for latest commit hash / contents
      - repo-cache:/repo-cache
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at 
    ## "http://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using 
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./compose.env
    volumes:
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}


  # ── cronmaster (services/server/automation/cronmaster.yaml)
  cronmaster:
    image: ghcr.io/fccview/cronmaster:latest
    container_name: cronmaster
    hostname: cronmaster
    user: "root"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      - DOCKER=true
      - AUTH_PASSWORD=${CRONMASTER_AUTH_PASSWORD:-changeme}
      - HOST_CRONTAB_USER=${CRONMASTER_HOST_USER:-root}
      - NEXT_PUBLIC_CLOCK_UPDATE_INTERVAL=${CRONMASTER_CLOCK_INTERVAL:-30000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/cronmaster/scripts:/app/scripts
      - ${DOCKER_DATA}/cronmaster/data:/app/data
      - ${DOCKER_DATA}/cronmaster/snippets:/app/snippets
    ports:
      - ${PORT_CRONMASTER:-${AUTO_PORT_CRONMASTER}}:3000
    pid: host
    privileged: true
    init: true


  # ── crowdsec (services/networking/crowdsec.yaml)
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    hostname: crowdsec
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Registration key for bouncers connecting to this LAPI
      - BOUNCER_KEY_traefik=${CROWDSEC_BOUNCER_KEY}
      # Collections to install (comma-separated)
      # See: https://hub.crowdsec.net/
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/linux crowdsecurity/sshd
      # Enroll this instance with CrowdSec Central API (optional, for shared blocklist)
      # Get your key from: https://app.crowdsec.net
      # - ENROLL_KEY=${CROWDSEC_ENROLL_KEY}
      # - ENROLL_INSTANCE_NAME=${HOSTNAME:-homeserver}
      # Log level: trace, debug, info, warn, error
      # - GID=${PGID}
    volumes:
      # CrowdSec config and database
      - ${DOCKER_DATA}/crowdsec/config:/etc/crowdsec
      - ${DOCKER_DATA}/crowdsec/data:/var/lib/crowdsec/data
      # Log files to analyze (mount relevant log directories)
      - /var/log:/var/log:ro
      # Traefik logs (adjust path to your Traefik log location)
      # - ${DOCKER_DATA}/traefik/logs:/var/log/traefik:ro
      # Nginx logs
      # - /var/log/nginx:/var/log/nginx:ro
      # Auth logs
      # - /var/log/auth.log:/var/log/auth.log:ro
    ports:
      - ${PORT_CROWDSEC:-${AUTO_PORT_CROWDSEC}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  # CrowdSec Traefik Bouncer (blocks IPs at the proxy level)
  crowdsec-bouncer-traefik:
    image: fbonalair/traefik-crowdsec-bouncer:latest
    container_name: crowdsec-bouncer-traefik
    hostname: crowdsec-bouncer-traefik
    restart: unless-stopped
    depends_on:
      - crowdsec
    environment:
      - TZ=${TZ}
      # Must match BOUNCER_KEY_traefik above
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_KEY}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
      - GIN_MODE=release
    # networks:
    #   - ${DEFAULT_NETWORK}

