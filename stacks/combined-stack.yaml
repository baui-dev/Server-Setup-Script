# COMBINED STACK
# Generated by scripts/generate-stacks.sh
# Categories: server ai development productivity networking media communication files
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f combined-stack.yaml up -d

services:
  # ── jellyfin (services/media/movies-tv/jellyfin/jellyfin.yaml)
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions
      # - JELLYFIN_PublishedServerUrl=jellyfin.${BASE_DOMAIN}  # External URL for autodiscovery

    volumes:
      - ${DOCKER_DATA}/media/jellyfin/config:/config
      - ${DOCKER_DATA}/media/jellyfin/cache:/cache
      # - /path/to/media:/media                                # Media library (adjust path)
      # - /path/to/media2:/media2:ro                           # Additional library (read-only)

    ports:
      - ${PORT_JELLYFIN:-8096}:8096
      # - ${PORT_JELLYFIN_DLNA:-1900}:1900/udp                 # DLNA discovery
      # - ${PORT_JELLYFIN_LAN:-7359}:7359/udp                  # LAN autodiscovery

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── sonarr (services/media/movies-tv/sonarr/sonarr.yaml)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask
      # - DOCKER_MODS=linuxserver/mods:sonarr-striptracks      # Strip extra audio tracks mod

    volumes:
      - ${DOCKER_DATA}/media/sonarr/config:/config
      # - /path/to/tvseries:/tv                                # TV series library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_SONARR:-8989}:8989

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── radarr (services/media/movies-tv/radarr/radarr.yaml)
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask
      # - DOCKER_MODS=linuxserver/mods:radarr-striptracks      # Strip extra audio tracks mod

    volumes:
      - ${DOCKER_DATA}/media/radarr/config:/config
      # - /path/to/movies:/movies                              # Movies library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_RADARR:-7878}:7878

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── bazarr (services/media/movies-tv/bazarr/bazarr.yaml)
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/bazarr/config:/config
      # - /path/to/movies:/movies                              # Movies library (must match Radarr)
      # - /path/to/tvseries:/tv                                # TV library (must match Sonarr)

    ports:
      - ${PORT_BAZARR:-6767}:6767

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── jellyseerr (services/media/movies-tv/jellyseerr/jellyseerr.yaml)
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - LOG_LEVEL=debug                                      # Log verbosity (debug, info, warn, error)

    volumes:
      - ${DOCKER_DATA}/media/jellyseerr/config:/app/config

    ports:
      - ${PORT_JELLYSEERR:-5055}:5055

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── prowlarr (services/media/movies-tv/prowlarr/prowlarr.yaml)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/prowlarr/config:/config

    ports:
      - ${PORT_PROWLARR:-9696}:9696

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── maintainerr (services/media/movies-tv/maintainerr/maintainerr.yaml)
  maintainerr:
    image: jorenn92/maintainerr:latest
    container_name: maintainerr
    hostname: maintainerr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/media/maintainerr/config:/opt/data

    ports:
      - ${PORT_MAINTAINERR:-6246}:6246

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── lidarr (services/media/music/lidarr/lidarr.yaml)
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask

    volumes:
      - ${DOCKER_DATA}/media/lidarr/config:/config
      # - /path/to/music:/music                                # Music library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_LIDARR:-8686}:8686

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── slskd (services/media/music/slskd/slskd.yaml)
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    hostname: slskd
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SLSKD_REMOTE_CONFIGURATION=true                        # Enable remote config via Web UI
      # - SLSKD_USERNAME=slskd                                 # Soulseek username
      # - SLSKD_PASSWORD=slskd                                 # Soulseek password
      # - SLSKD_SLSK_LISTEN_PORT=50300                         # Soulseek listen port

    volumes:
      - ${DOCKER_DATA}/media/slskd/config:/app
      # - /path/to/music:/music                                # Shared music directory
      # - /path/to/downloads:/downloads                        # Downloads directory

    ports:
      - ${PORT_SLSKD:-5030}:5030
      # - ${PORT_SLSKD_HTTPS:-5031}:5031                       # HTTPS port
      # - 50300:50300                                          # Soulseek listen port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── piwigo (services/media/images/piwigo/piwigo.yaml)
  piwigo:
    image: lscr.io/linuxserver/piwigo:latest
    container_name: piwigo
    hostname: piwigo
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/piwigo/config:/config
      # - /path/to/gallery:/gallery                            # Photo gallery storage

    ports:
      - ${PORT_PIWIGO:-8101}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── adguard (services/networking/dns/adguard/adguard.yaml)
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/adguard/work:/opt/adguardhome/work
      - ${DOCKER_DATA}/networking/adguard/config:/opt/adguardhome/conf

    ports:
      - ${PORT_ADGUARD_SETUP:-3000}:3000                       # Initial setup web UI
      - ${PORT_ADGUARD_HTTP:-80}:80                            # Web UI after setup
      - ${PORT_ADGUARD_HTTPS:-443}:443                         # HTTPS web UI
      - ${PORT_ADGUARD_DNS:-53}:53/tcp                         # DNS over TCP
      - ${PORT_ADGUARD_DNS:-53}:53/udp                         # DNS over UDP
      # - 853:853/tcp                                          # DNS over TLS
      # - 784:784/udp                                          # DNS over QUIC
      # - 67:67/udp                                            # DHCP server

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── pihole (services/networking/dns/pihole/pihole.yaml)
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=changeme                                 # Admin panel password
      # - PIHOLE_DNS_=8.8.8.8;8.8.4.4                         # Upstream DNS servers
      # - DNSSEC=true                                          # Enable DNSSEC
      # - DNS_BOGUS_PRIV=true                                  # Never forward bogon IPs
      # - DNS_FQDN_REQUIRED=true                               # Never forward non-FQDNs
      # - REV_SERVER=true                                      # Enable reverse server (router)
      # - REV_SERVER_CIDR=192.168.0.0/16                       # Reverse server CIDR
      # - REV_SERVER_TARGET=192.168.0.1                        # Reverse server target (router IP)

    volumes:
      - ${DOCKER_DATA}/networking/pihole/config:/etc/pihole
      - ${DOCKER_DATA}/networking/pihole/dnsmasq:/etc/dnsmasq.d

    ports:
      - ${PORT_PIHOLE:-8080}:80                                # Admin web UI
      - ${PORT_PIHOLE_DNS:-53}:53/tcp                          # DNS over TCP
      - ${PORT_PIHOLE_DNS:-53}:53/udp                          # DNS over UDP
      # - 67:67/udp                                            # DHCP server (optional)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── unbound (services/networking/dns/unbound/unbound.yaml)
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/unbound/config:/opt/unbound/etc/unbound

    ports:
      - ${PORT_UNBOUND:-5335}:53/tcp                           # DNS over TCP
      - ${PORT_UNBOUND:-5335}:53/udp                           # DNS over UDP

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── nginx-proxy-manager (services/networking/reverse-proxy/nginx-proxy-manager/nginx-proxy-manager.yaml)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    hostname: nginx-proxy-manager
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - DB_SQLITE_FILE=/data/database.sqlite                 # SQLite DB path (default)
      # - DISABLE_IPV6=true                                    # Disable IPv6 if not supported

    volumes:
      - ${DOCKER_DATA}/networking/nginx-proxy-manager/config:/data
      - ${DOCKER_DATA}/networking/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

    ports:
      - ${PORT_NPM_HTTP:-80}:80                                # HTTP (proxy)
      - ${PORT_NPM_HTTPS:-443}:443                             # HTTPS (proxy)
      - ${PORT_NPM_ADMIN:-81}:81                               # Admin web UI

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── traefik (services/networking/reverse-proxy/traefik/traefik.yaml)
  traefik:
    image: traefik:latest
    container_name: traefik
    hostname: traefik
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}                 # Cloudflare API token (for DNS challenge)

    volumes:
      - ${DOCKER_DATA}/networking/traefik/config:/etc/traefik
      - ${DOCKER_DATA}/networking/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (read-only)

    ports:
      - ${PORT_TRAEFIK_HTTP:-80}:80                            # HTTP entrypoint
      - ${PORT_TRAEFIK_HTTPS:-443}:443                         # HTTPS entrypoint
      - ${PORT_TRAEFIK_DASHBOARD:-8080}:8080                   # Dashboard (disable in prod)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── beszel (services/networking/monitoring/beszel/beszel.yaml)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    hostname: beszel
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/beszel/config:/beszel_data

    ports:
      - ${PORT_BESZEL:-8090}:8090

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── uptime-kuma (services/networking/monitoring/uptime-kuma/uptime-kuma.yaml)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    hostname: uptime-kuma
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/networking/uptime-kuma/config:/app/data

    ports:
      - ${PORT_UPTIME_KUMA:-3001}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── gluetun (services/networking/vpn/gluetun/gluetun.yaml)
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    hostname: gluetun
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=mullvad                           # VPN provider (mullvad, nordvpn, etc.)
      - VPN_TYPE=wireguard                                     # VPN type (wireguard, openvpn)
      # - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}       # WireGuard private key
      # - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}           # WireGuard addresses
      # - SERVER_COUNTRIES=Sweden                              # VPN server country
      # - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16             # Allow LAN access through VPN

    volumes:
      - ${DOCKER_DATA}/networking/gluetun/config:/gluetun

    ports:
      - ${PORT_GLUETUN:-8888}:8888                             # HTTP proxy port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── headscale (services/networking/vpn/headscale/headscale.yaml)
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    hostname: headscale
    restart: unless-stopped

    command: serve

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/headscale/config:/etc/headscale
      - ${DOCKER_DATA}/networking/headscale/data:/var/lib/headscale

    ports:
      - ${PORT_HEADSCALE:-8080}:8080                           # gRPC and HTTP port
      # - ${PORT_HEADSCALE_METRICS:-9090}:9090                 # Metrics endpoint

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wireguard (services/networking/vpn/wireguard/wireguard.yaml)
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    hostname: wireguard
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - SERVERURL=vpn.example.com                            # External server URL or IP
      # - SERVERPORT=51820                                     # Server listen port
      # - PEERS=3                                              # Number of peer configs to generate
      # - PEERDNS=auto                                         # DNS for peers (auto or IP)
      # - INTERNAL_SUBNET=10.13.13.0                           # Internal subnet

    volumes:
      - ${DOCKER_DATA}/networking/wireguard/config:/config
      - /lib/modules:/lib/modules:ro                           # Kernel modules (required)

    ports:
      - ${PORT_WIREGUARD:-51820}:51820/udp

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── openwebui (services/ai/openwebui/openwebui.yaml)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    hostname: openwebui
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - OLLAMA_BASE_URL=http://ollama:11434                  # Ollama backend URL
      # - OPENAI_API_KEY=${OPENAI_API_KEY}                     # OpenAI API key (optional)
      # - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}                 # Secret key for sessions
      # - DEFAULT_MODELS=llama3                                # Default model to load

    volumes:
      - ${DOCKER_DATA}/ai/openwebui/config:/app/backend/data

    ports:
      - ${PORT_OPENWEBUI:-3000}:8080

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── n8n (services/ai/n8n/n8n.yaml)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - N8N_BASIC_AUTH_ACTIVE=true                           # Enable basic auth
      # - N8N_BASIC_AUTH_USER=admin                            # Basic auth username
      # - N8N_BASIC_AUTH_PASSWORD=changeme                     # Basic auth password
      # - N8N_HOST=n8n.${BASE_DOMAIN}                          # External hostname
      # - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}/              # Webhook base URL
      # - GENERIC_TIMEZONE=${TZ}                               # Timezone for workflows

    volumes:
      - ${DOCKER_DATA}/ai/n8n/config:/home/node/.n8n

    ports:
      - ${PORT_N8N:-5678}:5678

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── anythingllm (services/ai/anythingllm/anythingllm.yaml)
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    hostname: anythingllm
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - STORAGE_DIR=/app/server/storage                      # Data storage directory
      # - LLM_PROVIDER=ollama                                  # LLM provider (ollama, openai, etc.)
      # - OLLAMA_BASE_PATH=http://ollama:11434                 # Ollama base URL
      # - VECTOR_DB=lancedb                                    # Vector database provider
      # - JWT_SECRET=${JWT_SECRET}                             # JWT signing secret

    volumes:
      - ${DOCKER_DATA}/ai/anythingllm/config:/app/server/storage

    ports:
      - ${PORT_ANYTHINGLLM:-3020}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── gitea (services/development/gitea/gitea.yaml)
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    hostname: gitea
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - USER_UID=${PUID}                                     # Run as this UID
      # - USER_GID=${PGID}                                     # Run as this GID
      # - GITEA__database__DB_TYPE=sqlite3                     # Database type
      # - GITEA__server__DOMAIN=gitea.${BASE_DOMAIN}           # External domain
      # - GITEA__server__SSH_DOMAIN=gitea.${BASE_DOMAIN}       # SSH domain
      # - GITEA__server__ROOT_URL=https://gitea.${BASE_DOMAIN} # Root URL

    volumes:
      - ${DOCKER_DATA}/development/gitea/config:/data

    ports:
      - ${PORT_GITEA:-3000}:3000                               # Web UI
      # - ${PORT_GITEA_SSH:-2222}:22                           # SSH port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── code-server (services/development/code-server/code-server.yaml)
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    hostname: code-server
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - PASSWORD=changeme                                    # Web UI password
      # - HASHED_PASSWORD=                                     # Bcrypt-hashed password (takes precedence)
      # - SUDO_PASSWORD=changeme                               # Sudo password in container
      # - PROXY_DOMAIN=code.${BASE_DOMAIN}                    # Domain for proxy headers

    volumes:
      - ${DOCKER_DATA}/development/code-server/config:/config
      # - /path/to/projects:/projects                          # Project files directory

    ports:
      - ${PORT_CODE_SERVER:-8443}:8443

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── semaphore (services/development/semaphore/semaphore.yaml)
  semaphore:
    image: semaphoreui/semaphore:latest
    container_name: semaphore
    hostname: semaphore
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - SEMAPHORE_DB_DIALECT=bolt                              # Database type (bolt for embedded)
      # - SEMAPHORE_ADMIN=admin                                # Admin username
      # - SEMAPHORE_ADMIN_PASSWORD=changeme                    # Admin password
      # - SEMAPHORE_ADMIN_NAME=Admin                           # Admin display name
      # - SEMAPHORE_ADMIN_EMAIL=admin@example.com              # Admin email

    volumes:
      - ${DOCKER_DATA}/development/semaphore/config:/etc/semaphore
      - ${DOCKER_DATA}/development/semaphore/data:/var/lib/semaphore

    ports:
      - ${PORT_SEMAPHORE:-3000}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── nextcloud (services/files/nextcloud/nextcloud.yaml)
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions
      # - NEXTCLOUD_ADMIN_USER=admin                           # Initial admin username
      # - NEXTCLOUD_ADMIN_PASSWORD=changeme                    # Initial admin password
      # - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${BASE_DOMAIN}       # Trusted domain(s)
      # - MYSQL_HOST=mariadb                                   # Database host
      # - MYSQL_DATABASE=nextcloud                             # Database name
      # - MYSQL_USER=nextcloud                                 # Database user
      # - MYSQL_PASSWORD=${MYSQL_PASSWORD}                     # Database password

    volumes:
      - ${DOCKER_DATA}/files/nextcloud/config:/var/www/html
      # - /path/to/data:/var/www/html/data                     # User data directory

    ports:
      - ${PORT_NEXTCLOUD:-8880}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── filebrowser (services/files/filebrowser/filebrowser.yaml)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/files/filebrowser/config:/config
      - ${DOCKER_DATA}/files/filebrowser/database:/database
      # - /path/to/files:/srv                                  # Root directory to browse

    ports:
      - ${PORT_FILEBROWSER:-8888}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── minio (services/files/minio/minio.yaml)
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      - TZ=${TZ}
      # - MINIO_ROOT_USER=admin                                # Admin username (min 3 chars)
      # - MINIO_ROOT_PASSWORD=changeme                         # Admin password (min 8 chars)
      # - MINIO_BROWSER_REDIRECT_URL=https://minio.${BASE_DOMAIN} # Console redirect URL
      # - MINIO_SERVER_URL=https://s3.${BASE_DOMAIN}           # S3 API URL

    volumes:
      - ${DOCKER_DATA}/files/minio/data:/data

    ports:
      - ${PORT_MINIO:-9000}:9000                               # S3 API
      - ${PORT_MINIO_CONSOLE:-9001}:9001                       # Web console

    # networks:
