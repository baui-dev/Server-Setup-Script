  maintainerr:
    image: jorenn92/maintainerr:latest
    container_name: maintainerr
    hostname: maintainerr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/media/maintainerr/config:/opt/data

    ports:
      - ${PORT_MAINTAINERR:-${AUTO_PORT_MAINTAINERR}}:6246

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── matrix-synapse (services/communication/matrix-synapse/matrix-synapse.yaml)
  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    hostname: matrix-synapse
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SYNAPSE_SERVER_NAME=matrix.${BASE_DOMAIN}            # Your Matrix server domain
      # - SYNAPSE_REPORT_STATS=no                              # Report anonymous stats
      # - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml            # Config file path

    volumes:
      - ${DOCKER_DATA}/communication/matrix-synapse/config:/data

    ports:
      - ${PORT_MATRIX_SYNAPSE:-${AUTO_PORT_MATRIX_SYNAPSE}}:8008                      # HTTP federation/client API

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── mealie (services/misc/mealie.yaml)
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    hostname: mealie
    restart: unless-stopped
    depends_on:
      mealie-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Application settings
      - ALLOW_SIGNUP=${MEALIE_ALLOW_SIGNUP:-false}
      - DEFAULT_EMAIL=${MEALIE_DEFAULT_EMAIL:-admin@example.com}
      - DEFAULT_PASSWORD=${MEALIE_DEFAULT_PASSWORD:-changeme}
      - DEFAULT_GROUP=Home
      - BASE_URL=https://mealie.${BASE_DOMAIN}
      # Database — PostgreSQL
      - DB_ENGINE=postgres
      - POSTGRES_USER=${POSTGRES_USER:-mealie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=mealie-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      # Token lifetime in hours
      - TOKEN_TIME=48
      # Max workers for the API server
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      # SMTP (optional)
      # - SMTP_HOST=
      # - SMTP_PORT=587
      # - SMTP_FROM_NAME=Mealie
      # - SMTP_FROM_EMAIL=
      # - SMTP_AUTH_STRATEGY=TLS
      # - SMTP_USER=
      # - SMTP_PASSWORD=
    volumes:
      - ${DOCKER_DATA}/mealie/data:/app/data
    ports:
      - ${PORT_MEALIE}:9000
    # networks:
    #   - ${DEFAULT_NETWORK}

  mealie-db:
    image: postgres:16-alpine
    container_name: mealie-db
    hostname: mealie-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-mealie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mealie
    volumes:
      - ${DOCKER_DATA}/mealie/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealie} -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── mediacms (services/media/automation/mediacms.yaml)
  mediacms:
    image: mediacms/mediacms:latest
    container_name: mediacms
    hostname: mediacms
    restart: unless-stopped
    depends_on:
      mediacms-db:
        condition: service_healthy
      mediacms-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=mediacms-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mediacms
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=${MEDIACMS_DB_PASSWORD:-mediacms_secure_pass}
      - REDIS_LOCATION=redis://mediacms-redis:6379/0
      - SECRET_KEY=${MEDIACMS_SECRET_KEY:-changeme-very-long-secret-key}  # Django secret key
      - ALLOWED_HOSTS=${MEDIACMS_ALLOWED_HOSTS:-*}                         # Allowed hostnames (comma-separated)
      - FRONTEND_HOST=${MEDIACMS_BASE_URL:-http://localhost}               # Public-facing URL
      - DEBUG=false
      # - ADMIN_USER=${MEDIACMS_ADMIN_USER:-admin}
      # - ADMIN_EMAIL=${MEDIACMS_ADMIN_EMAIL:-admin@localhost}
      # - ADMIN_PASSWORD=${MEDIACMS_ADMIN_PASSWORD:-changeme}
    volumes:
      - ${DOCKER_DATA}/mediacms/media:/home/mediacms.io/mediacms/media_files  # Uploaded media files
      - ${DOCKER_DATA}/mediacms/logs:/home/mediacms.io/mediacms/logs          # Application logs
    ports:
      - ${PORT_MEDIACMS:-${AUTO_PORT_MEDIACMS}}:80                  # HTTP web interface (nginx)
    # networks:
    #   - ${DEFAULT_NETWORK}

  mediacms-worker:
    image: mediacms/mediacms:latest
    container_name: mediacms-worker
    hostname: mediacms-worker
    restart: unless-stopped
    depends_on:
      mediacms-db:
        condition: service_healthy
      mediacms-redis:
        condition: service_healthy
    command: celery -A cms worker --loglevel=info -Q celery
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=mediacms-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mediacms
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=${MEDIACMS_DB_PASSWORD:-mediacms_secure_pass}
      - REDIS_LOCATION=redis://mediacms-redis:6379/0
      - SECRET_KEY=${MEDIACMS_SECRET_KEY:-changeme-very-long-secret-key}
    volumes:
      - ${DOCKER_DATA}/mediacms/media:/home/mediacms.io/mediacms/media_files  # Shared media storage
      - ${DOCKER_DATA}/mediacms/logs:/home/mediacms.io/mediacms/logs
    # networks:
    #   - ${DEFAULT_NETWORK}

  mediacms-db:
    image: postgres:15-alpine
    container_name: mediacms-db
    hostname: mediacms-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mediacms
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=${MEDIACMS_DB_PASSWORD:-mediacms_secure_pass}
    volumes:
      - ${DOCKER_DATA}/mediacms/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediacms -d mediacms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  mediacms-redis:
    image: redis:7-alpine
    container_name: mediacms-redis
    hostname: mediacms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${DOCKER_DATA}/mediacms/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── mediamanager (services/media/automation/mediamanager.yaml)
  mediamanager:
    image: ghcr.io/maxdorninger/mediamanager:latest
    container_name: mediamanager
    hostname: mediamanager
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - DATABASE_URL=sqlite:///config/mediamanager.db  # Database connection string
      # - SECRET_KEY=${MEDIAMANAGER_SECRET_KEY}          # Application secret key
      # - TMDB_API_KEY=${TMDB_API_KEY}                  # The Movie Database API key for metadata
      # - BASE_URL=${MEDIAMANAGER_BASE_URL}             # Public-facing URL for the application
    volumes:
      - ${DOCKER_DATA}/mediamanager/config:/config  # Application configuration and database
      - ${MOVIES_DIR}:/movies                     # Movie library path
      - ${TV_DIR}:/tv                             # TV show library path
      - ${MEDIA_DIR}:/media                       # Full media directory
    ports:
      - ${PORT_MEDIAMANAGER:-${AUTO_PORT_MEDIAMANAGER}}:8082
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── meelo-server (services/media/music/meelo-server.yaml)
  meelo-server:
    image: ghcr.io/arthi-chaud/meelo-server:latest
    container_name: meelo-server
    hostname: meelo-server
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@meelo-db:5432/meelo
      - MEILISEARCH_URL=http://meelo-search:7700
      - MEILISEARCH_KEY=${MEELO_MEILISEARCH_KEY:-masterKey}
    volumes:
      - ${DOCKER_DATA}/meelo/server:/data
      - ${MUSIC_DIR}:/music:ro
    depends_on:
      meelo-db:
        condition: service_healthy
      meelo-search:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  meelo-front:
    image: ghcr.io/arthi-chaud/meelo-front:latest
    container_name: meelo-front
    hostname: meelo-front
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - API_URL=http://meelo-server:4000
    ports:
      - ${PORT_MEELO}:3000
    depends_on:
      - meelo-server
    # networks:
    #   - ${DEFAULT_NETWORK}

  meelo-db:
    image: postgres:16-alpine
    container_name: meelo-db
    hostname: meelo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meelo
    volumes:
      - ${DOCKER_DATA}/meelo/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d meelo"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  meelo-search:
    image: getmeili/meilisearch:latest
    container_name: meelo-search
    hostname: meelo-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEELO_MEILISEARCH_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ${DOCKER_DATA}/meelo/search:/meili_data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── meilisearch (services/misc/meilisearch.yaml)
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    hostname: meilisearch
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Environment: production or development
      # production disables the search preview UI at /
      - MEILI_ENV=production
      # Master key (min 16 bytes). Used to generate API keys for search/admin.
      # Required in production mode.
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      # HTTP address to bind (default: localhost:7700 — override to 0.0.0.0 for container)
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      # Database path inside the container
      - MEILI_DB_PATH=/meili_data
      # Dump and snapshot directories
      - MEILI_DUMP_DIR=/meili_data/dumps
      - MEILI_SNAPSHOT_DIR=/meili_data/snapshots
      # Optionally set a maximum index size (bytes)
      # - MEILI_MAX_INDEX_SIZE=107374182400
      # Enable snapshots (uncomment to enable automatic snapshots)
      # - MEILI_SCHEDULE_SNAPSHOT=true
      # - MEILI_SNAPSHOT_INTERVAL_SEC=86400
    volumes:
      - ${DOCKER_DATA}/meilisearch/data:/meili_data
    ports:
      - ${PORT_MEILISEARCH}:7700
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── memos (services/productivity/notes/memos/memos.yaml)
  memos:
    image: neosmemo/memos:latest
    container_name: memos
    hostname: memos
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - MEMOS_MODE=prod                                      # Run mode (prod, dev)
      # - MEMOS_PORT=5230                                      # Listen port
      # - MEMOS_DRIVER=sqlite                                  # Database driver

    volumes:
      - ${DOCKER_DATA}/productivity/memos/config:/var/opt/memos

    ports:
      - ${PORT_MEMOS:-${AUTO_PORT_MEMOS}}:5230

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── minio (services/files/minio/minio.yaml)
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      - TZ=${TZ}
      # - MINIO_ROOT_USER=admin                                # Admin username (min 3 chars)
      # - MINIO_ROOT_PASSWORD=changeme                         # Admin password (min 8 chars)
      # - MINIO_BROWSER_REDIRECT_URL=https://minio.${BASE_DOMAIN} # Console redirect URL
      # - MINIO_SERVER_URL=https://s3.${BASE_DOMAIN}           # S3 API URL

    volumes:
      - ${DOCKER_DATA}/files/minio/data:/data

    ports:
      - ${PORT_MINIO:-${AUTO_PORT_MINIO}}:9000                               # S3 API
      - ${PORT_MINIO_CONSOLE:-${AUTO_PORT_MINIO_CONSOLE}}:9001                       # Web console

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── mopidy (services/media/music/mopidy.yaml)
  mopidy:
    image: ghcr.io/mopidy/mopidy:latest
    container_name: mopidy
    hostname: mopidy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/mopidy/config:/etc/mopidy
      - ${DOCKER_DATA}/mopidy/data:/var/lib/mopidy
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_MOPIDY}:6680        # HTTP frontend / Iris web UI
      - ${PORT_MOPIDY_MPD:-${AUTO_PORT_MOPIDY_MPD}}:6600  # MPD protocol port
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── music-assistant (services/media/music/music-assistant.yaml)
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    hostname: music-assistant
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${MA_LOG_LEVEL:-info}
    volumes:
      - ${DOCKER_DATA}/music-assistant/data:/data
      - ${MUSIC_DIR}:/music:ro
    # ports are not used with network_mode: host; access on http://<host>:8095

# networks:
#   proxy:
#     external: true

  # ── n8n (services/ai/n8n/n8n.yaml)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - N8N_BASIC_AUTH_ACTIVE=true                           # Enable basic auth
      # - N8N_BASIC_AUTH_USER=admin                            # Basic auth username
      # - N8N_BASIC_AUTH_PASSWORD=changeme                     # Basic auth password
      # - N8N_HOST=n8n.${BASE_DOMAIN}                          # External hostname
      # - WEBHOOK_URL=https://n8n.${BASE_DOMAIN}/              # Webhook base URL
      # - GENERIC_TIMEZONE=${TZ}                               # Timezone for workflows

    volumes:
      - ${DOCKER_DATA}/ai/n8n/config:/home/node/.n8n

    ports:
      - ${PORT_N8N:-${AUTO_PORT_N8N}}:5678

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── navidrome (services/media/music/navidrome.yaml)
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    hostname: navidrome
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - ND_MUSICFOLDER=${ND_MUSICFOLDER:-/music}
      - ND_DATAFOLDER=/data
      - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
      - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
      - ND_BASEURL=${ND_BASEURL:-}
      - ND_ENABLETRANSCODINGCONFIG=${ND_ENABLETRANSCODINGCONFIG:-false}
      - ND_TRANSCODINGCACHEFOLDER=/data/cache/transcoding
      - ND_IMAGECACHEFOLDER=/data/cache/images
    volumes:
      - ${DOCKER_DATA}/navidrome/data:/data
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_NAVIDROME}:4533
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── netdata (services/networking/netdata.yaml)
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: ${NETDATA_HOSTNAME:-netdata-server}
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=${TZ}
      # Netdata Cloud claim token (optional, for cloud integration)
      # Get from: https://app.netdata.cloud
      # - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN}
      # - NETDATA_CLAIM_URL=https://app.netdata.cloud
      # - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS}
      # Custom hostname for this node in Netdata Cloud
      # - NETDATA_HOSTNAME=${HOSTNAME:-homeserver}
    volumes:
      - ${DOCKER_DATA}/netdata/config:/etc/netdata
      - ${DOCKER_DATA}/netdata/lib:/var/lib/netdata
      - ${DOCKER_DATA}/netdata/cache:/var/cache/netdata
      # Required for full system metrics
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/host/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Docker container metrics
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # When not using host network:
    # ports:
    #   - ${PORT_NETDATA:-${AUTO_PORT_NETDATA}}:19999

# ============================================================
# Netdata features:
# - Real-time metrics: CPU, memory, disk, network, processes
# - Docker container monitoring
# - Application monitoring: Nginx, Apache, MySQL, Redis, etc.
# - ML anomaly detection
# - Built-in alerting system
# - Optional Netdata Cloud integration for centralized monitoring
#
# Access:
#   http://your-server:19999 (when using host network)
#   http://your-server:${PORT_NETDATA:-${AUTO_PORT_NETDATA}} (when using bridge network)
#
# Custom configuration:
#   ${DOCKER_DATA}/netdata/config/netdata.conf
#   ${DOCKER_DATA}/netdata/config/health_alarm_notify.conf
#   ${DOCKER_DATA}/netdata/config/health.d/*.conf (alert rules)
#
# Netdata CLI:
#   docker exec netdata netdatacli reload-health
#   docker exec netdata netdatacli ping
# ============================================================

  # ── nextcloud (services/files/nextcloud/nextcloud.yaml)
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions
      # - NEXTCLOUD_ADMIN_USER=admin                           # Initial admin username
      # - NEXTCLOUD_ADMIN_PASSWORD=changeme                    # Initial admin password
      # - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${BASE_DOMAIN}       # Trusted domain(s)
      # - MYSQL_HOST=mariadb                                   # Database host
      # - MYSQL_DATABASE=nextcloud                             # Database name
      # - MYSQL_USER=nextcloud                                 # Database user
      # - MYSQL_PASSWORD=${MYSQL_PASSWORD}                     # Database password

    volumes:
      - ${DOCKER_DATA}/files/nextcloud/config:/var/www/html
      # - /path/to/data:/var/www/html/data                     # User data directory

    ports:
      - ${PORT_NEXTCLOUD:-${AUTO_PORT_NEXTCLOUD}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── nextterm (services/development/nextterm.yaml)
  nextterm:
    image: ghcr.io/gnmyt/nexterm:latest
    container_name: nextterm
    hostname: nextterm
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - DEVELOPMENT_MODE=false               # Set true to enable hot-reload (dev only)
      # - DISABLE_AUTH=false                   # Set true to bypass login (DANGER: for trusted networks only)
    volumes:
      - ${DOCKER_DATA}/nextterm/config:/app/data  # SQLite database, saved connections, and settings
    ports:
      - ${PORT_NEXTTERM:-${AUTO_PORT_NEXTTERM}}:6989
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── nginx-proxy-manager (services/networking/reverse-proxy/nginx-proxy-manager/nginx-proxy-manager.yaml)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    hostname: nginx-proxy-manager
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - DB_SQLITE_FILE=/data/database.sqlite                 # SQLite DB path (default)
      # - DISABLE_IPV6=true                                    # Disable IPv6 if not supported

    volumes:
      - ${DOCKER_DATA}/networking/nginx-proxy-manager/config:/data
      - ${DOCKER_DATA}/networking/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

    ports:
      - ${PORT_NPM_HTTP:-${AUTO_PORT_NPM_HTTP}}:80                                # HTTP (proxy)
      - ${PORT_NPM_HTTPS:-${AUTO_PORT_NPM_HTTPS}}:443                             # HTTPS (proxy)
      - ${PORT_NPM_ADMIN:-${AUTO_PORT_NPM_ADMIN}}:81                               # Admin web UI

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── notediscovery (services/productivity/notes/notediscovery.yaml)
  notediscovery:
    image: ghcr.io/notediscovery/notediscovery:latest
    container_name: notediscovery
    hostname: notediscovery
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NODE_ENV=production
      - PORT=3000
      # Security
      - SECRET=${NOTEDISCOVERY_SECRET:-changeme_generate_a_real_secret}
      # Database (SQLite default or PostgreSQL)
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notediscovery-postgres:5432/notediscovery
      # Base URL
      - BASE_URL=https://${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/notediscovery/data:/app/data
      - ${DOCKER_DATA}/notediscovery/notes:/app/notes
    ports:
      - ${PORT_NOTEDISCOVERY:-${AUTO_PORT_NOTEDISCOVERY}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── notesnook (services/productivity/notes/notesnook.yaml)
  notesnook:
    image: streetwriters/notesnook-sync:latest
    container_name: notesnook
    hostname: notesnook
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # MongoDB connection
      - MONGODB_CONNECTION_STRING=mongodb://notesnook-mongo:27017
      - MONGODB_DATABASE_NAME=notesnook
      # Redis connection
      - REDIS_URL=redis://:${REDIS_PASSWORD}@notesnook-redis:6379
      # Application configuration
      - NODE_ENV=production
      - PORT=5264
      # JWT signing secrets (generate each with: openssl rand -hex 64)
      - NOTESNOOK_JWT_SECRET=${NOTESNOOK_JWT_SECRET:-changeme_generate_a_real_secret}
      # CORS allowed origins (set to your domain)
      - ALLOWED_ORIGINS=https://${BASE_DOMAIN}
      # Optional: SMTP for account verification and password reset
      # - SMTP_HOST=smtp.${BASE_DOMAIN}
      # - SMTP_PORT=587
      # - SMTP_USERNAME=${NOTESNOOK_SMTP_USER}
      # - SMTP_PASSWORD=${NOTESNOOK_SMTP_PASSWORD}
      # - SMTP_SENDER=notesnook@${BASE_DOMAIN}
    ports:
      - ${PORT_NOTESNOOK:-${AUTO_PORT_NOTESNOOK}}:5264
    depends_on:
      - notesnook-mongo
      - notesnook-redis
    # networks:
    #   - ${DEFAULT_NETWORK}

  notesnook-mongo:
    image: mongo:7
    container_name: notesnook-mongo
    hostname: notesnook-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=notesnook
    volumes:
      - ${DOCKER_DATA}/notesnook/mongo:/data/db
    # networks:
    #   - ${DEFAULT_NETWORK}

  notesnook-redis:
    image: redis:7-alpine
    container_name: notesnook-redis
    hostname: notesnook-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/notesnook/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── ntfy (services/communication/ntfy/ntfy.yaml)
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    hostname: ntfy
    restart: unless-stopped

    command: serve

    environment:
      - TZ=${TZ}
      # - NTFY_BASE_URL=https://ntfy.${BASE_DOMAIN}            # Public base URL
      # - NTFY_BEHIND_PROXY=true                               # Set to true if behind proxy
      # - NTFY_AUTH_DEFAULT_ACCESS=deny-all                    # Default access control

    volumes:
      - ${DOCKER_DATA}/communication/ntfy/config:/etc/ntfy
      - ${DOCKER_DATA}/communication/ntfy/data:/var/cache/ntfy

    ports:
      - ${PORT_NTFY:-${AUTO_PORT_NTFY}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── ntopng (services/networking/ntopng.yaml)
  ntopng:
    image: ntop/ntopng:stable
    container_name: ntopng
    hostname: ntopng
    restart: unless-stopped
    # Host network mode required for direct interface access
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ntopng/config:/etc/ntopng
      - ${DOCKER_DATA}/ntopng/data:/var/lib/ntopng
    # When NOT using host network (limited capture via SPAN/port mirroring):
    # ports:
    #   - ${PORT_NTOPNG:-${AUTO_PORT_NTOPNG}}:3000
    command: >
      --community
      --interface=any
      --http-port=3000
      --data-dir=/var/lib/ntopng
      --config=/etc/ntopng/ntopng.conf
      --no-promisc
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

# ============================================================
# ntopng.conf example (place at ${DOCKER_DATA}/ntopng/config/ntopng.conf):
# ============================================================
# --interface=eth0       # Network interface to monitor (use 'any' for all)
# --http-port=3000       # Web UI port
# --community            # Community edition (no license required for basic features)
# --disable-login=1      # Disable login (NOT for production use)
# --local-networks=192.168.1.0/24  # Your local subnet(s)
# --data-dir=/var/lib/ntopng
#
# Access web UI:
#   http://your-server:3000 (host network) or http://your-server:${PORT_NTOPNG:-${AUTO_PORT_NTOPNG}}
#   Default login: admin / admin (change immediately)
#
# For production use with non-host networking, use a network TAP or
# configure your switch/router for port mirroring to the Docker host.
#
# Enterprise features (flow export, historical analysis, alerts) require
# a commercial license from ntop.org.
# ============================================================

  # ── omnivore-api (services/productivity/bookmarks/omnivore-api.yaml)
  omnivore-api:
    image: ghcr.io/omnivore-app/omnivore-api:latest
    container_name: omnivore-api
    hostname: omnivore-api
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      # Database
      - PG_HOST=omnivore-postgres
      - PG_PORT=5432
      - PG_DB=omnivore
      - PG_USER=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@omnivore-redis:6379
      # Security
      - JWT_SECRET=${OMNIVORE_JWT_SECRET}
      - SSO_JWT_SECRET=${OMNIVORE_JWT_SECRET}
      # Application URLs
      - CLIENT_URL=https://${BASE_DOMAIN}
      - BACKEND_URL=https://${BASE_DOMAIN}/api
      # Content fetching (Puppeteer service)
      - PUPPETEER_URL=http://omnivore-puppeteer:9000
      # Optional: email for notifications
      # - SENDGRID_API_KEY=${OMNIVORE_SENDGRID_KEY}
      # - SENDGRID_SENDER_EMAIL=omnivore@${BASE_DOMAIN}
      # Optional: Disable sign-up to only allow invited users
      # - DISABLE_EMAIL_REGISTRATION=true
    depends_on:
      omnivore-postgres:
        condition: service_healthy
      omnivore-redis:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-web:
    image: ghcr.io/omnivore-app/omnivore-web:latest
    container_name: omnivore-web
    hostname: omnivore-web
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NEXT_PUBLIC_APP_ENV=prod
      - NEXT_PUBLIC_BASE_URL=https://${BASE_DOMAIN}
      - NEXT_PUBLIC_SERVER_BASE_URL=http://omnivore-api:8080
      - NEXT_PUBLIC_HIGHLIGHTS_BASE_URL=https://${BASE_DOMAIN}
    ports:
      - ${PORT_OMNIVORE:-${AUTO_PORT_OMNIVORE}}:3000
    depends_on:
      - omnivore-api
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-puppeteer:
    image: ghcr.io/omnivore-app/omnivore-puppeteer-parse:latest
    container_name: omnivore-puppeteer
    hostname: omnivore-puppeteer
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@omnivore-redis:6379
    depends_on:
      - omnivore-redis
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-postgres:
    image: ankane/pgvector:latest
    container_name: omnivore-postgres
    hostname: omnivore-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=omnivore
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/omnivore/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d omnivore"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-redis:
    image: redis:7-alpine
    container_name: omnivore-redis
    hostname: omnivore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/omnivore/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── opencloud (services/files/cloud/opencloud.yaml)
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    container_name: opencloud
    hostname: opencloud
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        opencloud init || true
        opencloud server
    environment:
      - TZ=${TZ}
      # Set the admin password on first run
      - OC_ADMIN_USER=admin
      - OC_ADMIN_PASSWORD=${OPENCLOUD_ADMIN_PASSWORD:-changeme}
      # Public-facing URL — REQUIRED for correct redirect URLs
      - OC_URL=https://opencloud.${BASE_DOMAIN}
      # Disable TLS inside the container (terminate at reverse proxy)
      - PROXY_TLS=false
      # Log settings
      - OC_LOG_LEVEL=error
      - OC_LOG_COLOR=false
      # Insecure mode (disable cert checks for internal services — needed behind a proxy)
      - OC_INSECURE=false
      # Demo users (remove in production)
      - IDM_CREATE_DEMO_USERS=false
      # Storage driver: ocis (local posix), s3ng, or others
      - STORAGE_USERS_DRIVER=ocis
    volumes:
      # Persistent config and data directory
      - ${DOCKER_DATA}/opencloud/config:/etc/opencloud
      - ${DOCKER_DATA}/opencloud/data:/var/lib/opencloud
    ports:
      - ${PORT_OPENCLOUD:-${AUTO_PORT_OPENCLOUD}}:9200
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── openhands (services/ai/openhands.yaml)
  openhands:
    image: ghcr.io/all-hands-ai/openhands:main
    container_name: openhands
    hostname: openhands
    restart: unless-stopped
    environment:
      - TZ=${TZ}

      # --- LLM Configuration ---
      # OpenHands uses LiteLLM, so model names follow LiteLLM conventions.
      # Examples: claude-3-5-sonnet-20241022, gpt-4o, ollama/llama3.1:70b, gemini/gemini-1.5-pro
      - LLM_MODEL=${OPENHANDS_LLM_MODEL:-claude-3-5-sonnet-20241022}
      - LLM_API_KEY=${OPENHANDS_LLM_API_KEY}        # API key for chosen LLM provider
      # - LLM_BASE_URL=                              # Override API base URL (e.g. for Ollama: http://host.docker.internal:11434)
      # - LLM_OLLAMA_BASE_URL=http://host.docker.internal:11434  # Explicit Ollama base URL

      # --- Workspace ---
      # WORKSPACE_MOUNT_PATH: the directory on your HOST that the agent will be able to read/write.
      # The agent sees this directory as /workspace inside its sandbox container.
      - WORKSPACE_MOUNT_PATH=${OPENHANDS_WORKSPACE:-/opt/docker/openhands/workspace}
      # - WORKSPACE_BASE_DIR=/workspace              # Internal mount point (usually /workspace)

      # --- Sandbox / Runtime ---
      # - SANDBOX_USER_ID=${PUID}                    # UID to run as inside the sandbox container
      # - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main  # Sandbox runtime image
      # - SANDBOX_TIMEOUT=120                        # Seconds before idle sandbox is killed
      # - SANDBOX_VOLUMES=                           # Extra volumes to mount into the sandbox (host:container)
      # - PERSIST_SANDBOX=false                      # Keep sandbox container between sessions

      # --- Server ---
      # - OPENHANDS_PORT=3000                        # Internal listen port
      # - DEBUG=false                                # Enable verbose debug logging

      # --- Features ---
      # - SECURITY_ANALYZER=                         # Enable invariant security analysis (requires key)
      # - EVALUATION_HARNESS=false                   # Enable evaluation harness for benchmarking

    volumes:
      - ${DOCKER_DATA}/openhands/config:/.openhands    # OpenHands settings, history, and session data
      # Docker socket: REQUIRED for spawning sandbox runtime containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace volume (mount the same path as WORKSPACE_MOUNT_PATH so files persist)
      - ${OPENHANDS_WORKSPACE:-/opt/docker/openhands/workspace}:/opt/workspace_base

    ports:
      - ${PORT_OPENHANDS}:3000                       # WebUI

    extra_hosts:
      - "host.docker.internal:host-gateway"          # Allow container to reach host services (Ollama)

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.openhands.rule=Host(`openhands.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.openhands.entrypoints=websecure"
    #   - "traefik.http.routers.openhands.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.openhands.loadbalancer.server.port=3000"

# networks:
#   proxy:
#     external: true

  # ── openpanel (services/server/management/openpanel.yaml)
  openpanel:
    image: openpanel/openpanel:latest
    container_name: openpanel
    hostname: openpanel
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=${TZ}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${SECRET_KEY}
    volumes:
      - ${DOCKER_DATA}/openpanel/data:/etc/openpanel
      - ${DOCKER_DATA}/openpanel/websites:/home
      - ${DOCKER_DATA}/openpanel/mysql:/var/lib/mysql
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${PORT_OPENPANEL}:2087
      # Optional: expose website hosting ports
      # - "80:80"
      # - "443:443"
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── open-webui (services/ai/open-webui.yaml)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    hostname: open-webui
    restart: unless-stopped
    environment:
      - TZ=${TZ}

      # --- Ollama Backend ---
      # Set to your Ollama instance URL. Use host.docker.internal to reach Ollama on the host.
      # Set to empty string "" to disable Ollama integration entirely (OpenAI-only mode).
      - OLLAMA_BASE_URL=${OPENWEBUI_OLLAMA_URL:-http://host.docker.internal:11434}
      # - OLLAMA_API_BASE_URL=${OPENWEBUI_OLLAMA_URL:-http://host.docker.internal:11434}/api  # Deprecated alias

      # --- OpenAI API ---
      # Connect to OpenAI or any OpenAI-compatible API (LiteLLM, LocalAI, vLLM, etc.)
      # - OPENAI_API_KEY=                            # OpenAI or compatible API key
      # - OPENAI_API_BASE_URL=https://api.openai.com/v1  # Base URL (override for local/alt endpoints)
      # Multiple OpenAI-compatible endpoints (semicolon-separated for keys, comma-separated for URLs):
      # - OPENAI_API_KEYS=key1;key2
      # - OPENAI_API_BASE_URLS=http://litellm:4000/v1,http://localai:8080/v1

      # --- Authentication & Security ---
      # REQUIRED: Secret key for session signing. Generate with: openssl rand -hex 32
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # - WEBUI_AUTH=true                            # true = require login, false = open access
      # - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=           # Header for trusted SSO email (e.g. X-Auth-Email)
      # - WEBUI_AUTH_TRUSTED_NAME_HEADER=            # Header for trusted SSO display name
      # - DEFAULT_USER_ROLE=pending                  # Role for new signups: admin | user | pending
      # - ENABLE_SIGNUP=true                         # Allow new user registration
      # - ENABLE_LOGIN_FORM=true                     # Show username/password login form
      # - ENABLE_OAUTH_SIGNUP=false                  # Allow account creation via OAuth
      # - ENABLE_API_KEY=true                        # Allow API key authentication

      # --- OAuth / SSO (Authentik, Keycloak, Zitadel, etc.) ---
      # - ENABLE_OAUTH_SIGNUP=false
      # - OAUTH_PROVIDER_NAME=SSO                    # Display name on login button
      # - OAUTH_CLIENT_ID=                           # OAuth2 client ID
      # - OAUTH_CLIENT_SECRET=                       # OAuth2 client secret
      # - OPENID_PROVIDER_URL=                       # OIDC discovery endpoint
      # - OAUTH_SCOPES=openid email profile

      # --- UI / Branding ---
      # - WEBUI_NAME=Open WebUI                      # Application display name
      # - WEBUI_FAVICON_URL=                         # Custom favicon URL
      # - WEBUI_BANNERS=[]                           # JSON array of banner messages to display
      # - DEFAULT_MODELS=llama3.2                    # Pre-select this model on new chats
      # - DEFAULT_PROMPT_SUGGESTIONS=[]              # JSON array of preset prompt suggestions

      # --- RAG (Retrieval Augmented Generation) ---
      # - RAG_EMBEDDING_ENGINE=                      # Embedding engine: default (local) or openai
      # - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2  # Local embedding model
      # - RAG_RERANKING_MODEL=                       # Optional reranking model for better results
      # - PDF_EXTRACT_IMAGES=false                   # Extract images from PDFs during ingestion
      # - CHUNK_SIZE=1500                            # Document chunk size for RAG
      # - CHUNK_OVERLAP=100                          # Chunk overlap in characters

      # --- Web Search ---
      # - ENABLE_RAG_WEB_SEARCH=false                # Enable web search in chat
      # - RAG_WEB_SEARCH_ENGINE=duckduckgo           # Engine: duckduckgo | searxng | serper | brave | bing
      # - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      # - SERPER_API_KEY=                            # Serper.dev API key
      # - BRAVE_SEARCH_API_KEY=                      # Brave Search API key

      # --- Image Generation ---
      # - ENABLE_IMAGE_GENERATION=false              # Enable image generation tab
      # - IMAGE_GENERATION_ENGINE=openai             # Engine: openai | comfyui | automatic1111
      # - IMAGES_OPENAI_API_BASE_URL=https://api.openai.com/v1
      # - IMAGES_OPENAI_API_KEY=                     # API key for image generation
      # - AUTOMATIC1111_BASE_URL=http://a1111:7860   # Automatic1111 / Stable Diffusion WebUI URL

      # --- Audio (TTS / STT) ---
      # - AUDIO_STT_ENGINE=                          # Speech-to-text: openai or web (browser built-in)
      # - AUDIO_TTS_ENGINE=                          # Text-to-speech: openai, elevenlabs, or empty (browser)
      # - AUDIO_TTS_OPENAI_API_KEY=                  # TTS API key (if using openai engine)
      # - AUDIO_TTS_VOICE=alloy                      # OpenAI TTS voice

      # --- Pipelines ---
      # Open WebUI Pipelines allow custom Python processing of messages
      # - PIPELINES_URL=http://pipelines:9099        # Pipelines service URL

      # --- Telemetry ---
      # - SCARF_NO_ANALYTICS=true                    # Disable Scarf analytics

    volumes:
      - ${DOCKER_DATA}/open-webui/data:/app/backend/data    # Chat history, users, RAG docs, uploads, config

    ports:
      - ${PORT_OPENWEBUI}:8080                            # WebUI

    extra_hosts:
      - "host.docker.internal:host-gateway"               # Allows reaching Ollama on the Docker host

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.open-webui.rule=Host(`chat.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.open-webui.entrypoints=websecure"
    #   - "traefik.http.routers.open-webui.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

# networks:
#   proxy:
#     external: true

  # ── openwebui (services/ai/openwebui/openwebui.yaml)
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    hostname: openwebui
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - OLLAMA_BASE_URL=http://ollama:11434                  # Ollama backend URL
      # - OPENAI_API_KEY=${OPENAI_API_KEY}                     # OpenAI API key (optional)
      # - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}                 # Secret key for sessions
      # - DEFAULT_MODELS=llama3                                # Default model to load

    volumes:
      - ${DOCKER_DATA}/ai/openwebui/config:/app/backend/data

    ports:
      - ${PORT_OPENWEBUI:-${AUTO_PORT_OPENWEBUI}}:8080

