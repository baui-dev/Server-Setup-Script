  # ── outline (services/productivity/notes/outline/outline.yaml)
  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    hostname: outline
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SECRET_KEY=${SECRET_KEY}                             # 32-char hex secret (required)
      # - UTILS_SECRET=${UTILS_SECRET}                         # Utils secret (required)
      # - DATABASE_URL=postgres://user:pass@host:5432/outline  # PostgreSQL connection URL
      # - REDIS_URL=redis://redis:6379                         # Redis connection URL
      # - URL=https://wiki.${BASE_DOMAIN}                      # Public URL (required)
      # - PORT=3000                                            # Internal port
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}               # S3 storage access key
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}       # S3 storage secret key
      # - AWS_REGION=us-east-1                                 # S3 region
      # - AWS_S3_UPLOAD_BUCKET_NAME=outline                    # S3 bucket name

    volumes:
      - ${DOCKER_DATA}/productivity/outline/config:/var/lib/outline/data

    ports:
      - ${PORT_OUTLINE:-${AUTO_PORT_OUTLINE}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── owntone (services/media/music/owntone.yaml)
  owntone:
    image: owntone/owntone:latest
    container_name: owntone
    hostname: owntone
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/owntone/config:/etc/owntone
      - ${DOCKER_DATA}/owntone/data:/var/cache/owntone
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_OWNTONE}:3689      # DAAP / web UI
      - ${PORT_OWNTONE_MPD:-${AUTO_PORT_OWNTONE_MPD}}:6600  # MPD protocol (enable in owntone.conf)
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── owntone-server (services/media/music/owntone-server.yaml)
  owntone-server:
    image: owntone/owntone:latest
    container_name: owntone-server
    hostname: owntone-server
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/owntone-server/config:/etc/owntone
      - ${DOCKER_DATA}/owntone-server/data:/var/cache/owntone
      - ${MUSIC_DIR}:/music:ro
    # With host networking, ports are bound directly on the host:
    # 3689/tcp  - DAAP (iTunes library sharing) and web UI
    # 3688/tcp  - RSP
    # 3689/udp  - mDNS advertisement
    # 6600/tcp  - MPD protocol (if enabled in config)

# networks:
#   proxy:
#     external: true

  # ── oxicloud (services/files/cloud/oxicloud.yaml)
  oxicloud:
    image: ghcr.io/pausala/oxicloud:latest
    container_name: oxicloud
    hostname: oxicloud
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Storage root directory
      - STORAGE_PATH=/data
      # Server bind address
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Optional: admin credentials (set before first run)
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=changeme
      # Max upload size in bytes
      # - MAX_UPLOAD_SIZE=5368709120
    volumes:
      - ${DOCKER_DATA}/oxicloud/data:/data
    ports:
      - ${PORT_OXICLOUD:-${AUTO_PORT_OXICLOUD}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pairdrop (services/files/sharing/pairdrop/pairdrop.yaml)
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop
    hostname: pairdrop
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - RATE_LIMIT=true # Enable API rate limiting for public-facing deployments

    volumes:
      - ${DOCKER_DATA}/files/sharing/pairdrop/config:/config
      - ${DOCKER_DATA}/files/sharing/pairdrop/data:/data

    ports:
      - ${PORT_PAIRDROP:-${AUTO_PORT_PAIRDROP}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── palmr (services/files/palmr.yaml)
  palmr:
    image: ghcr.io/kyantech/palmr:latest
    container_name: palmr
    hostname: palmr
    restart: unless-stopped
    depends_on:
      palmr-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-palmr}:${POSTGRES_PASSWORD}@palmr-db:5432/palmr
      # Application secret (change to a long random string)
      - SECRET_KEY=${PALMR_SECRET:-changeme_use_a_long_random_string}
      # Public-facing URL
      - APP_URL=https://palmr.${BASE_DOMAIN}
      # Max upload size (bytes)
      # - MAX_UPLOAD_SIZE=5368709120
      # Disable registration (true/false)
      - DISABLE_REGISTRATION=false
    volumes:
      - ${DOCKER_DATA}/palmr/uploads:/app/uploads
    ports:
      - ${PORT_PALMR}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

  palmr-db:
    image: postgres:16-alpine
    container_name: palmr-db
    hostname: palmr-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-palmr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=palmr
    volumes:
      - ${DOCKER_DATA}/palmr/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palmr} -d palmr"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pangolin (services/media/images/pangolin.yaml)
  pangolin:
    image: fosrl/pangolin:latest
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./config:/app/config
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
#      interval: "3s"
#      timeout: "3s"
#      retries: 15

  gerbil:
    image: fosrl/gerbil:latest
    container_name: gerbil
    restart: unless-stopped
#    depends_on:
#      pangolin:
#        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3003
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/gerbil/get-config
      - --reportBandwidthTo=http://pangolin:3001/api/v1/gerbil/receive-bandwidth
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 4434:443 # Port for traefik because of the network_mode
      - 8088:80 # Port for traefik because of the network_mode

  traefik:
    image: traefik:v3.4.0
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
#    depends_on:
#      pangolin:
#        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro # Volume to store the Traefik configuration
      - ./config/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates


  # ── paperless (services/media/documents/paperless.yaml)
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    hostname: paperless
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - USERMAP_UID=${PUID}
      - USERMAP_GID=${PGID}
      # Database
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBPORT=5432
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=${POSTGRES_USER}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
      # Redis / task queue
      - PAPERLESS_REDIS=redis://:${REDIS_PASSWORD}@paperless-redis:6379
      # Application
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_TIME_ZONE=${TZ}
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-eng}
      # Admin bootstrap (only used on first run)
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      # Optional tuning
      - PAPERLESS_WORKER_TIMEOUT=${PAPERLESS_WORKER_TIMEOUT:-1800}
      - PAPERLESS_TASK_WORKERS=${PAPERLESS_TASK_WORKERS:-2}
    volumes:
      - ${DOCKER_DATA}/paperless/data:/usr/src/paperless/data
      - ${DOCKER_DATA}/paperless/media:/usr/src/paperless/media
      - ${DOCKER_DATA}/paperless/export:/usr/src/paperless/export
      - ${DOCKER_DATA}/paperless/consume:/usr/src/paperless/consume
    ports:
      - ${PORT_PAPERLESS}:8000
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-db:
    image: postgres:16-alpine
    container_name: paperless-db
    hostname: paperless-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=paperless
    volumes:
      - ${DOCKER_DATA}/paperless/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    hostname: paperless-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/paperless/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── paperless-ai (services/productivity/documents/paperless-ai.yaml)
  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless-ai
    hostname: paperless-ai
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Paperless-ngx connection
      - PAPERLESS_API_URL=http://paperless-ngx:8000
      - PAPERLESS_API_TOKEN=${PAPERLESS_AI_API_TOKEN}
      # AI provider: "openai" or "ollama"
      - AI_PROVIDER=${PAPERLESS_AI_PROVIDER:-openai}
      # -- OpenAI configuration --
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${PAPERLESS_AI_MODEL:-gpt-4o-mini}
      # Optional: custom OpenAI-compatible API endpoint (e.g., LiteLLM proxy)
      # - OPENAI_API_BASE=https://api.openai.com/v1
      # -- Ollama configuration (if AI_PROVIDER=ollama) --
      - OLLAMA_API_URL=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${PAPERLESS_OLLAMA_MODEL:-llama3.1}
      # Processing interval (minutes between checks for new documents)
      - SCAN_INTERVAL=${PAPERLESS_AI_SCAN_INTERVAL:-30}
      # Optional: tags, correspondents, and document types to assign by AI
      # - PROCESS_PREDEFINED_DOCUMENTS=true
      # Optional: language for AI analysis
      - AI_LANGUAGE=${PAPERLESS_AI_LANGUAGE:-English}
    volumes:
      - ${DOCKER_DATA}/paperless-ai/data:/app/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── paperless-ngx (services/productivity/documents/paperless-ngx.yaml)
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    hostname: paperless-ngx
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Redis broker (required)
      - PAPERLESS_REDIS=redis://:${REDIS_PASSWORD}@paperless-redis:6379
      # PostgreSQL database (required)
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=paperless-postgres
      - PAPERLESS_DBPORT=5432
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=${POSTGRES_USER}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
      # Security
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      # Public URL (used for links in emails and API responses)
      - PAPERLESS_URL=${PAPERLESS_URL:-https://paperless.${BASE_DOMAIN}}
      # Admin user created on first run
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_ADMIN_MAIL=${PAPERLESS_ADMIN_MAIL:-admin@example.com}
      # User/group mapping (match your host PUID/PGID)
      - USERMAP_UID=${PUID:-1000}
      - USERMAP_GID=${PGID:-1000}
      # OCR settings
      - PAPERLESS_OCR_LANGUAGE=eng
      # Comma-separated list of additional languages: eng+deu+fra etc.
      # Install language packs by adding to PAPERLESS_OCR_LANGUAGE
      - PAPERLESS_TIME_ZONE=${TZ}
      # Optional: document retention and processing
      - PAPERLESS_OCR_MODE=skip           # skip (only OCR non-searchable), redo, force
      - PAPERLESS_OCR_SKIP_ARCHIVE_FILE=never  # never, always, with_text
      # Optional: consumer polling (for folder-based ingestion)
      - PAPERLESS_CONSUMER_POLLING=0       # 0 = inotify (recommended), or polling interval in seconds
      # Optional: auto-tag / auto-classify
      # - PAPERLESS_ENABLE_NLTK=true
      # Optional: TIKA for enhanced document parsing (Word, Excel, etc.)
      # - PAPERLESS_TIKA_ENABLED=1
      # - PAPERLESS_TIKA_ENDPOINT=http://paperless-tika:9998
      # - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
      # Optional: email consumption
      # - PAPERLESS_EMAIL_TASK_CRON=*/10 * * * *
      # Optional: trash documents instead of permanent delete
      - PAPERLESS_EMPTY_TRASH_DELAY=30    # days before permanent deletion
      # Optional: SMTP for sending notifications
      # - PAPERLESS_EMAIL_HOST=smtp.${BASE_DOMAIN}
      # - PAPERLESS_EMAIL_PORT=587
      # - PAPERLESS_EMAIL_HOST_USER=${PAPERLESS_SMTP_USER}
      # - PAPERLESS_EMAIL_HOST_PASSWORD=${PAPERLESS_SMTP_PASSWORD}
      # - PAPERLESS_EMAIL_USE_TLS=true
    volumes:
      - ${DOCKER_DATA}/paperless-ngx/data:/usr/src/paperless/data
      - ${DOCKER_DATA}/paperless-ngx/media:/usr/src/paperless/media
      # Export directory for backups (paperless-ngx document_exporter)
      - ${DOCKER_DATA}/paperless-ngx/export:/usr/src/paperless/export
      # Consume folder: drop documents here for automatic ingestion
      - ${DOCKER_DATA}/paperless-ngx/consume:/usr/src/paperless/consume
    ports:
      - ${PORT_PAPERLESS_NGX:-${AUTO_PORT_PAPERLESS_NGX}}:8000
    depends_on:
      paperless-postgres:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-postgres:
    image: postgres:16-alpine
    container_name: paperless-postgres
    hostname: paperless-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/paperless-ngx/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    hostname: paperless-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/paperless-ngx/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# Optional: Apache Tika for Word/Excel/PowerPoint parsing
# paperless-tika:
#   image: apache/tika:latest
#   container_name: paperless-tika
#   hostname: paperless-tika
#   restart: unless-stopped
#
# Optional: Gotenberg for PDF conversion from office formats
# paperless-gotenberg:
#   image: gotenberg/gotenberg:latest
#   container_name: paperless-gotenberg
#   hostname: paperless-gotenberg
#   restart: unless-stopped
#   command:
#     - gotenberg
#     - --chromium-disable-javascript=true
#     - --chromium-allow-list=file:///tmp/.*

# networks:
#   proxy:
#     external: true

  # ── papra (services/media/documents/papra.yaml)
  papra:
    image: ghcr.io/papra-hq/papra:latest
    container_name: papra
    hostname: papra
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PAPRA_CLIENT_BASE_URL=${PAPRA_URL:-http://localhost:${PORT_PAPRA}}
      # SQLite database path (default, no external DB needed)
      - PAPRA_DB_URL=file:/app/server/db/papra.db
      # Set to true to enable registration for new users
      - PAPRA_REGISTRATION_ALLOWED=${PAPRA_REGISTRATION_ALLOWED:-false}
    volumes:
      - ${DOCKER_DATA}/papra/db:/app/server/db
      - ${DOCKER_DATA}/papra/documents:/app/server/documents
    ports:
      - ${PORT_PAPRA}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pihole (services/networking/dns/pihole/pihole.yaml)
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=changeme                                 # Admin panel password
      # - PIHOLE_DNS_=8.8.8.8;8.8.4.4                         # Upstream DNS servers
      # - DNSSEC=true                                          # Enable DNSSEC
      # - DNS_BOGUS_PRIV=true                                  # Never forward bogon IPs
      # - DNS_FQDN_REQUIRED=true                               # Never forward non-FQDNs
      # - REV_SERVER=true                                      # Enable reverse server (router)
      # - REV_SERVER_CIDR=192.168.0.0/16                       # Reverse server CIDR
      # - REV_SERVER_TARGET=192.168.0.1                        # Reverse server target (router IP)

    volumes:
      - ${DOCKER_DATA}/networking/pihole/config:/etc/pihole
      - ${DOCKER_DATA}/networking/pihole/dnsmasq:/etc/dnsmasq.d

    ports:
      - ${PORT_PIHOLE:-${AUTO_PORT_PIHOLE}}:80                                # Admin web UI
      - ${PORT_PIHOLE_DNS:-${AUTO_PORT_PIHOLE_DNS}}:53/tcp                          # DNS over TCP
      - ${PORT_PIHOLE_DNS:-${AUTO_PORT_PIHOLE_DNS}}:53/udp                          # DNS over UDP
      # - 67:67/udp                                            # DHCP server (optional)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── pingora (services/networking/pingora.yaml)
  # Example: custom Pingora proxy built from your application
  # Replace 'your-org/your-pingora-app:latest' with your compiled image
  pingora:
    image: your-org/your-pingora-app:latest
    container_name: pingora
    hostname: pingora
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Custom config file for your Pingora application
      # - CONFIG_FILE=/config/pingora.yaml
    volumes:
      - ${DOCKER_DATA}/pingora/config:/config
      - ${DOCKER_DATA}/pingora/logs:/logs
    ports:
      - 80:80
      - 443:443
      - ${PORT_PINGORA_ADMIN:-${AUTO_PORT_PINGORA_ADMIN}}:6188
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Building a Pingora application:
#
# 1. Add pingora to your Cargo.toml:
#    [dependencies]
#    pingora = { version = "0.4", features = ["lb"] }
#
# 2. Implement the ProxyHttp trait:
#    use pingora::prelude::*;
#    struct MyProxy;
#    #[async_trait]
#    impl ProxyHttp for MyProxy {
#        type CTX = ();
#        fn new_ctx(&self) -> Self::CTX {}
#        async fn upstream_peer(&self, session: &mut Session, _ctx: &mut Self::CTX)
#            -> Result<Box<HttpPeer>> {
#            let peer = Box::new(HttpPeer::new("127.0.0.1:8080", false, "".to_string()));
#            Ok(peer)
#        }
#    }
#
# 3. Build and create a Docker image:
#    FROM rust:1.75 AS builder
#    COPY . .
#    RUN cargo build --release
#    FROM debian:bookworm-slim
#    COPY --from=builder /target/release/my-proxy /usr/local/bin/
#    CMD ["my-proxy"]
#
# Pingora GitHub examples: https://github.com/cloudflare/pingora/tree/main/pingora-proxy/examples
# ============================================================

  # ── piwigo (services/media/images/piwigo/piwigo.yaml)
  piwigo:
    image: lscr.io/linuxserver/piwigo:latest
    container_name: piwigo
    hostname: piwigo
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/piwigo/config:/config
      # - /path/to/gallery:/gallery                            # Photo gallery storage

    ports:
      - ${PORT_PIWIGO:-${AUTO_PORT_PIWIGO}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── plane (services/productivity/tasks/plane/plane.yaml)
  plane:
    image: makeplane/plane-frontend:latest
    container_name: plane
    hostname: plane
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - NEXT_PUBLIC_API_BASE_URL=https://plane.${BASE_DOMAIN}  # API base URL
      # - SECRET_KEY=${SECRET_KEY}                               # App secret key (required)

    volumes:
      - ${DOCKER_DATA}/productivity/plane/config:/code/plane

    ports:
      - ${PORT_PLANE:-${AUTO_PORT_PLANE}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── planify (services/productivity/tasks/planify.yaml)
  planify:
    image: ghcr.io/alainm23/planify:latest
    container_name: planify
    hostname: planify
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # CalDAV integration (for syncing tasks via CalDAV protocol)
      # - CALDAV_SERVER_URL=https://caldav.${BASE_DOMAIN}
      # - CALDAV_USERNAME=${PLANIFY_CALDAV_USER}
      # - CALDAV_PASSWORD=${PLANIFY_CALDAV_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/planify/data:/app/data
      - ${DOCKER_DATA}/planify/config:/config
    ports:
      - ${PORT_PLANIFY:-${AUTO_PORT_PLANIFY}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── portainer (services/server/dashboards/portainer/portainer.yaml)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/server/portainer/config:/data
      - /var/run/docker.sock:/var/run/docker.sock                # Docker socket

    ports:
      - ${PORT_PORTAINER:-${AUTO_PORT_PORTAINER}}:9000                             # HTTP web UI
      - ${PORT_PORTAINER_HTTPS:-${AUTO_PORT_PORTAINER_HTTPS}}:9443                       # HTTPS web UI
      # - ${PORT_PORTAINER_AGENT:-${AUTO_PORT_PORTAINER_AGENT}}:8000                     # Agent/Edge agent port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── portmaster (services/networking/portmaster.yaml)
  portmaster:
    image: safing/portmaster:latest
    container_name: portmaster
    hostname: portmaster
    restart: unless-stopped
    # Portmaster requires privileged mode and host network for full functionality
    privileged: true
    network_mode: host
    pid: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/portmaster/data:/var/lib/portmaster
      - ${DOCKER_DATA}/portmaster/config:/etc/portmaster
      - /proc:/proc:ro
      - /sys:/sys:ro
      # Required for netfilter queue integration
      - /dev:/dev
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE

# ============================================================
# IMPORTANT: Portmaster is primarily designed as a host-level service.
# For the best experience, install it directly on the host:
#
# Ubuntu/Debian:
#   wget https://updates.safing.io/latest/linux_amd64/packages/portmaster-installer.deb
#   sudo apt install ./portmaster-installer.deb
#   sudo systemctl start portmaster
#
# Arch Linux (AUR):
#   yay -S portmaster
#
# Features:
# - Per-application network firewall rules
# - DNS-over-TLS enforcement
# - Ad and tracker blocking
# - Privacy filters and connection monitoring
# - Spn (Safing Privacy Network) - optional paid feature
#
# The web UI is accessible at http://localhost:817 after host installation.
# ============================================================

  # ── postal (services/communication/postal.yaml)
  postal:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal
    hostname: postal
    restart: unless-stopped
    command: postal web-server
    environment:
      - TZ=${TZ}
      # Postal is configured via /config/postal.yml (generated by initialize-config).
      # The YAML file must include database, redis, signing secret, and SMTP settings.
      # - POSTAL_WEB_HOST=postal.${BASE_DOMAIN}             # Hostname for web UI (set in postal.yml)
    volumes:
      - ${DOCKER_DATA}/postal/config:/config               # Contains postal.yml and signing keys
    ports:
      - "${PORT_POSTAL_HTTP}:5000"                       # Postal web UI and REST API
    depends_on:
      postal-mysql:
        condition: service_healthy
      postal-redis:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  postal-smtp:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal-smtp
    hostname: postal-smtp
    restart: unless-stopped
    command: postal smtp-server
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/postal/config:/config               # Shares the same config as the web server
    ports:
      - "25:25"                                          # SMTP — inbound mail from remote MTAs
      # - "587:587"                                      # SMTP Submission (if configured in postal.yml)
    depends_on:
      - postal
    # networks:
    #   - ${DEFAULT_NETWORK}

  postal-worker:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal-worker
    hostname: postal-worker
    restart: unless-stopped
    command: postal worker
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/postal/config:/config               # Shares the same config
    depends_on:
      - postal
    # networks:
    #   - ${DEFAULT_NETWORK}

  postal-cron:
    image: ghcr.io/postalserver/postal:latest
    container_name: postal-cron
    hostname: postal-cron
    restart: unless-stopped
    command: postal cron
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/postal/config:/config               # Shares the same config
    depends_on:
      - postal
    # networks:
    #   - ${DEFAULT_NETWORK}

  postal-mysql:
    image: mysql:8.0
    container_name: postal-mysql
    hostname: postal-mysql
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=postal
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/postal/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # networks:
    #   - ${DEFAULT_NETWORK}

  postal-redis:
    image: redis:7-alpine
    container_name: postal-redis
    hostname: postal-redis
    restart: unless-stopped
    # Note: Postal typically connects to Redis without a password (configure in postal.yml if needed)
    command: redis-server --appendonly yes
    volumes:
      - ${DOCKER_DATA}/postal/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── postiz (services/communication/postiz.yaml)
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    hostname: postiz
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MAIN_URL=https://postiz.${BASE_DOMAIN}              # Public URL of the Postiz app (no trailing slash)
      - FRONTEND_URL=https://postiz.${BASE_DOMAIN}          # Same as MAIN_URL for monolithic deploys
      - NEXT_PUBLIC_BACKEND_URL=https://postiz.${BASE_DOMAIN}/api  # Public URL of the backend API
      - BACKEND_INTERNAL_URL=${POSTIZ_BACKEND_INTERNAL_URL}    # Internal URL for frontend->backend calls
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz
      - REDIS_URL=redis://:${REDIS_PASSWORD}@postiz-redis:6379
      - JWT_SECRET=${POSTIZ_SECRET}                    # JWT signing secret; generate with: openssl rand -hex 32
      # --- Optional storage settings ---
      # - STORAGE_PROVIDER=local                        # Storage backend: local, s3, cloudflare
      # - UPLOAD_DIRECTORY=/uploads                     # Path for local file uploads (inside container)
      # - NEXT_PUBLIC_UPLOAD_DIRECTORY=/uploads         # Same path exposed to the Next.js frontend
      # - CLOUDFLARE_ACCOUNT_ID=                        # Cloudflare R2 account ID (if STORAGE_PROVIDER=cloudflare)
      # - CLOUDFLARE_ACCESS_KEY=                        # Cloudflare R2 access key
      # - CLOUDFLARE_SECRET_ACCESS_KEY=                 # Cloudflare R2 secret key
      # - CLOUDFLARE_BUCKETNAME=postiz                  # Cloudflare R2 bucket name
      # - CLOUDFLARE_BUCKET_URL=                        # Public URL of the R2 bucket
      # - IS_GENERAL=true                               # Set true for public/open registration mode
      # - DISABLE_REGISTRATION=false                    # Set true to close public registration
      # - OPENAI_API_KEY=                               # OpenAI API key for AI caption generation
      # - RESEND_API_KEY=                               # Resend API key for transactional emails
      # - EMAIL_FROM_NAME=Postiz                        # Sender name for transactional emails
      # - EMAIL_FROM_ADDRESS=no-reply@example.com       # Sender email address
    volumes:
      - ${DOCKER_DATA}/postiz/uploads:/uploads             # User-uploaded media files (local storage)
      - ${DOCKER_DATA}/postiz/config:/config               # Application config and runtime data
    ports:
      - "${PORT_POSTIZ}:3000"                            # Postiz web UI (Next.js frontend)
      # - "5000:5000"                                    # Backend API (if running split/separate)
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  postiz-postgres:
    image: postgres:16-alpine
    container_name: postiz-postgres
    hostname: postiz-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postiz
    volumes:
      - ${DOCKER_DATA}/postiz/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # networks:
    #   - ${DEFAULT_NETWORK}

  postiz-redis:
    image: redis:7-alpine
    container_name: postiz-redis
    hostname: postiz-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ${DOCKER_DATA}/postiz/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── profilarr (services/media/movies-tv/profilarr.yaml)
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    hostname: profilarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Auth mode: on (require login) | local (local users only) | off (no auth) | oidc
      - AUTH=${PROFILARR_AUTH:-on}
      # - LOG_LEVEL=info                             # Logging verbosity: debug, info, warning, error
      # Optional: parser sidecar (for advanced format testing)
      # Deploy alongside: ghcr.io/dictionarry-hub/profilarr-parser:latest
    volumes:
      - ${DOCKER_DATA}/profilarr/config:/config        # Profilarr configuration and sync state
    ports:
      - ${PORT_PROFILARR:-${AUTO_PORT_PROFILARR}}:6868
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.profilarr.rule=Host(`profilarr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.profilarr.entrypoints=websecure"
    #   - "traefik.http.routers.profilarr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.profilarr.loadbalancer.server.port=6868"

# networks:
#   proxy:
#     external: true

  # ── prowlarr (services/media/movies-tv/prowlarr/prowlarr.yaml)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/prowlarr/config:/config

    ports:
      - ${PORT_PROWLARR:-${AUTO_PORT_PROWLARR}}:9696

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── pulsarr (services/media/automation/pulsarr.yaml)
  pulsarr:
    image: lakker/pulsarr:latest
    # image: lakker/pulsarr:node  # ARM / Linux kernel < 4.11 alternative
    container_name: pulsarr
    hostname: pulsarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Primary config is done via web UI after first start.
      # Optional env vars (can also be set in the UI):
      # - PLEX_TOKEN=${AGREGARR_PLEX_TOKEN}          # Plex authentication token
      # - PLEX_URL=http://plex:32400                 # Plex server URL
      # - SONARR_URL=http://sonarr:8989              # Sonarr instance URL
      # - SONARR_API_KEY=${SONARR_API_KEY}           # Sonarr API key
      # - RADARR_URL=http://radarr:7878              # Radarr instance URL
      # - RADARR_API_KEY=${RADARR_API_KEY}           # Radarr API key
      # - LOG_LEVEL=info                             # Logging verbosity
    volumes:
      - ${DOCKER_DATA}/pulsarr/config:/config          # Pulsarr configuration and state database
    ports:
      - ${PORT_PULSARR:-${AUTO_PORT_PULSARR}}:3003
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.pulsarr.rule=Host(`pulsarr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.pulsarr.entrypoints=websecure"
    #   - "traefik.http.routers.pulsarr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.pulsarr.loadbalancer.server.port=3003"

# networks:
#   proxy:
#     external: true

  # ── puter (services/server/webos/puter.yaml)
  puter:
    image: ghcr.io/heyputer/puter:latest
    container_name: puter
    hostname: puter
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUTER_DOMAIN=${PUTER_DOMAIN}          # Domain for the Puter instance (e.g. puter.example.com)
      # - PUTER_API_DOMAIN=api.${PUTER_DOMAIN} # API subdomain (auto-derived if unset)
    volumes:
      - ${DOCKER_DATA}/puter/config:/etc/puter   # Application configuration
      - ${DOCKER_DATA}/puter/data:/var/puter     # User data and file storage
    ports:
      - ${PORT_PUTER:-${AUTO_PORT_PUTER}}:4100
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pydio (services/files/file-manager/pydio.yaml)
  pydio:
    image: pydio/cells:latest
    container_name: pydio
    hostname: pydio
    restart: unless-stopped
    depends_on:
      pydio-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Public-facing URL (required for OAuth2 redirects)
      - CELLS_EXTERNAL=https://pydio.${BASE_DOMAIN}
      # Internal bind address
      - CELLS_BIND=0.0.0.0:8080
      # Disable internal TLS (terminate at reverse proxy)
      - CELLS_NO_TLS=1
      # Site URI
      - CELLS_SITE_URI=http://0.0.0.0:8080
      # Database DSN
      - CELLS_DB_HOST=pydio-db
      - CELLS_DB_USER=${MYSQL_USER:-pydio}
      - CELLS_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - CELLS_DB_NAME=pydio
      # Log level: debug | info | warn | error
      - CELLS_LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/pydio/cells:/var/cells
      - ${DOCKER_DATA}/pydio/data:/var/cells/data
    ports:
      - ${PORT_PYDIO:-${AUTO_PORT_PYDIO}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  pydio-db:
    image: mariadb:11
    container_name: pydio-db
    hostname: pydio-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=pydio
      - MYSQL_USER=${MYSQL_USER:-pydio}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/pydio/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pyload (services/media/downloads/pyload.yaml)
  pyload:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: pyload
    hostname: pyload
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/downloads/pyload/config:/config
      - ${DOCKER_DATA}/media/downloads/pyload/downloads:/downloads

    ports:
      - ${PORT_PYLOAD:-${AUTO_PORT_PYLOAD}}:8000
      - ${PORT_PYLOAD_CLICKNLOAD:-${AUTO_PORT_PYLOAD_CLICKNLOAD}}:9666

  # ── qbit-manage (services/media/downloads/qbit-manage.yaml)
  qbit-manage:
    image: bobokun/qbit_manage:latest
    container_name: qbit-manage
    hostname: qbit-manage
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Run schedule (cron format, or integer for minutes between runs)
      - QBT_RUN=false           # Set to true to run once and exit
      - QBT_SCHEDULE=1440       # Run every 1440 minutes (24h). Use cron: "0 */6 * * *"
      - QBT_CONFIG=/config/config.yml
      # Logging verbosity (DEBUG, INFO, WARNING, ERROR)
      - QBT_LOG_LEVEL=${QBITMANAGE_LOG_LEVEL:-INFO}
      # Maximum log files to keep
      - QBT_MAX_LOG_FILES=10
    volumes:
      - ${DOCKER_DATA}/qbit-manage/config:/config
      # Must match the download paths used inside qBittorrent
      - ${DOWNLOADS_DIR:-/downloads}:/downloads
      # If qBittorrent runs on the same host, can map its config for reading
      # - ${DOCKER_DATA}/qbittorrent/config:/qbittorrent-config:ro
    # qbit-manage connects to qBittorrent API over the network, no ports needed
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# REQUIRED: Create ${DOCKER_DATA}/qbit-manage/config/config.yml
# Full config reference: https://github.com/StuffAnThings/qbit_manage/wiki/Config-Setup
# ============================================================
# qbt:
#   host: qbittorrent             # qBittorrent hostname or IP
#   port: 8085
#   user: ${QBITTORRENT_USERNAME:-admin}
#   pass: ${QBITTORRENT_PASSWORD}
#
# settings:
#   force_auto_tmm: false         # Auto-assign category based on save path
#   tracker_error_tag: issue      # Tag for torrents with tracker errors
#   nohardlinks_tag: noHL         # Tag for torrents with no hardlinks
#   share_limits_tag: QL          # Tag prefix for share limit groups
#   # Remove orphaned files not linked to any torrent
#   orphaned_exclude_patterns:
#     - "**/.DS_Store"
#     - "**/Thumbs.db"
#
# directory:
#   root_dir: /downloads/         # Root download directory
#   # Category-specific subdirectories
#
# cat:                            # Category definitions
#   movies:
#     save_path: /downloads/movies
#   tv:
#     save_path: /downloads/tv
#   music:
#     save_path: /downloads/music
#
# tracker:                        # Tracker-based tagging
#   # nyaa.si:
#   #   tag: Nyaa
#   # tracker.alpharatio.club:
#   #   tag: AlphaRatio
#
# share_limits:
#   # Remove/tag torrents after reaching share limits
#   noHL:
#     priority: 1
#     min_seeding_time: 0
#     max_ratio: 2.0
#     max_seeding_time: 129600
#     cleanup: false
# ============================================================

  # ── qbitrr (services/media/downloads/qbitrr.yaml)
  qbitrr:
    image: feramance/qbitrr:latest
    container_name: qbitrr
    hostname: qbitrr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/qbitrr/config:/config
      # Must match the download paths used in qBittorrent, Sonarr, and Radarr
      - ${DOWNLOADS_DIR:-/downloads}:/downloads
    # qBitrr connects to qBittorrent/Sonarr/Radarr over the network
    # No ports exposed by this service itself
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# REQUIRED: Create ${DOCKER_DATA}/qbitrr/config/config.toml
# Full config reference: https://github.com/Feramance/qBitrr/wiki/Configuration
# ============================================================
# [qBittorrent]
# host = "qbittorrent"
# port = 8085
# username = "${QBITTORRENT_USERNAME:-admin}"
# password = "${QBITTORRENT_PASSWORD}"
# # Category for downloads managed by qBitrr
# managed_categories = ["tv-sonarr", "radarr"]
#
# [Settings]
# # How often to check for stalled/failed downloads (seconds)
# loop_sleep_timer = 5
# # Number of seconds before a torrent is considered stalled
# stalled_time = 1800
# # Remove torrents with no seeds
# failed_removal_timer = 30
# # Re-search failed items
# auto_search_enabled = true
# # Log level: CRITICAL, ERROR, WARNING, INFO, DEBUG, TRACE
# log_level = "INFO"
#
# [[Radarr]]
# # Name (used for logging)
# name = "Radarr"
# host = "radarr"
# port = 7878
# api_key = "${RADARR_API_KEY}"
# # Category assigned to Radarr downloads in qBittorrent
# category = "radarr"
#
# [[Sonarr]]
# name = "Sonarr"
# host = "sonarr"
# port = 8989
# api_key = "${SONARR_API_KEY}"
# category = "tv-sonarr"
# # Profile for anime (optional)
# # anime_category = "anime-sonarr"
# ============================================================

  # ── qbittorrent (services/media/downloads/qbittorrent.yaml)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8085
      # - TORRENTING_PORT=${PORT_QBITTORRENT_TORRENT:-${AUTO_PORT_QBITTORRENT_TORRENT}} # Incoming BitTorrent port

    volumes:
      - ${DOCKER_DATA}/media/downloads/qbittorrent/config:/config
      - ${DOCKER_DATA}/media/downloads/qbittorrent/downloads:/downloads

    ports:
      - ${PORT_QBITTORRENT:-${AUTO_PORT_QBITTORRENT}}:8085
      - ${PORT_QBITTORRENT_TORRENT:-${AUTO_PORT_QBITTORRENT_TORRENT}}:6881
      - ${PORT_QBITTORRENT_TORRENT:-${AUTO_PORT_QBITTORRENT_TORRENT}}:6881/udp

  # ── radarr (services/media/movies-tv/radarr/radarr.yaml)
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask
      # - DOCKER_MODS=linuxserver/mods:radarr-striptracks      # Strip extra audio tracks mod

    volumes:
      - ${DOCKER_DATA}/media/radarr/config:/config
      # - /path/to/movies:/movies                              # Movies library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_RADARR:-${AUTO_PORT_RADARR}}:7878

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── rdtclient (services/media/downloads/rdtclient.yaml)
  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    hostname: rdtclient
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # PUID/PGID for file ownership
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      # Application config and database (SQLite)
      - ${DOCKER_DATA}/rdtclient/config:/data/db
      # Download directory - must match the path used by Sonarr/Radarr
      - ${DOWNLOADS_DIR:-/downloads}:/data/downloads
    ports:
      # Web UI and fake qBittorrent API endpoint
      - ${PORT_RDTCLIENT:-${AUTO_PORT_RDTCLIENT}}:6500
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Access:
#   http://your-server:${PORT_RDTCLIENT:-${AUTO_PORT_RDTCLIENT}}
#   Default login: admin / admin (change immediately)
#
# First-time setup:
# 1. Access the web UI and login
# 2. Go to Settings -> Providers
# 3. Select your provider (Real-Debrid, AllDebrid, etc.)
# 4. Enter your provider API key:
#    - Real-Debrid: https://real-debrid.com/apitoken
#    - AllDebrid: https://alldebrid.com/apikeys
# 5. Go to Settings -> Download Client
#    - Set download location to: /data/downloads
#    - Configure concurrent download limits
# 6. Configure Sonarr/Radarr to use rdtclient as their qBittorrent:
#    Settings -> Download Clients -> qBittorrent:
#    - Host: rdtclient (or server IP)
#    - Port: 6500
#    - Category: tv (for Sonarr) / movies (for Radarr)
#    - Username/Password: (set in rdtclient settings)
#
# Prowlarr integration:
#   Add indexers to Prowlarr normally - rdtclient handles the download
#   via Real-Debrid after Sonarr/Radarr grabs the torrent.
# ============================================================

  # ── recyclarr (services/media/automation/recyclarr.yaml)
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    hostname: recyclarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - CRON_SCHEDULE=@daily # Override the default sync schedule

    volumes:
      - ${DOCKER_DATA}/media/automation/recyclarr/config:/config

  # ── redlib (services/misc/redlib.yaml)
  redlib:
    image: quay.io/redlib/redlib:latest
    container_name: redlib
    hostname: redlib
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      # UI defaults (can be overridden per user in settings)
      - REDLIB_DEFAULT_THEME=system
      - REDLIB_DEFAULT_FRONT_PAGE=default
      - REDLIB_DEFAULT_LAYOUT=card
      - REDLIB_DEFAULT_WIDE=false
      - REDLIB_DEFAULT_POST_SORT=hot
      - REDLIB_DEFAULT_COMMENT_SORT=confidence
      - REDLIB_DEFAULT_SHOW_NSFW=false
      - REDLIB_DEFAULT_BLUR_NSFW=true
      - REDLIB_DEFAULT_USE_HLS=false
      - REDLIB_DEFAULT_HIDE_HLS_NOTIFICATION=false
      - REDLIB_DEFAULT_AUTOPLAY_VIDEOS=false
      # SFW-only mode: blocks all NSFW content regardless of user preference
      - REDLIB_SFW_ONLY=false
      # Robots.txt: set to true to block indexing
      - REDLIB_ROBOTS_DISABLE_INDEXING=false
      # Optionally restrict to specific subreddits (comma-separated)
      # - REDLIB_PUSHSHIFT_FRONTEND=
    ports:
      - ${PORT_REDLIB:-${AUTO_PORT_REDLIB}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── rustpad (services/development/rustpad.yaml)
  rustpad:
    image: ekzhang/rustpad:latest
    container_name: rustpad
    hostname: rustpad
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - PORT=3030                            # Internal HTTP listen port (default: 3030)
      # - EXPIRY_DAYS=1                        # Days before an idle document is automatically deleted (default: 1)
      # - RUST_LOG=info                        # Log verbosity: error | warn | info | debug | trace
      # - ORIGIN=https://pad.example.com       # Allowed CORS origin for WebSocket connections (set to public URL)
    ports:
      - ${PORT_RUSTPAD}:3030
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── sabnzbd (services/media/downloads/sabnzbd.yaml)
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    hostname: sabnzbd
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/downloads/sabnzbd/config:/config
      - ${DOCKER_DATA}/media/downloads/sabnzbd/downloads:/downloads
      - ${DOCKER_DATA}/media/downloads/sabnzbd/incomplete:/incomplete-downloads

    ports:
      - ${PORT_SABNZBD:-${AUTO_PORT_SABNZBD}}:8080

  # ── safeline-mgt (services/server/security/safeline-mgt.yaml)
  safeline-pg:
    image: postgres:15-alpine
    container_name: safeline-pg
    hostname: safeline-pg
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=safeline-ce
      - POSTGRES_DB=safeline-ce
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/safeline/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeline-ce -d safeline-ce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-mgt:
    image: chaitin/safeline-mgt:latest
    container_name: safeline-mgt
    hostname: safeline-mgt
    restart: unless-stopped
    depends_on:
      safeline-pg:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # PostgreSQL DSN
      - MGT_PG=host=safeline-pg port=5432 user=safeline-ce password=${POSTGRES_PASSWORD} dbname=safeline-ce sslmode=disable
      # Detection engine endpoint
      - MARIO_URL=http://safeline-mario:80/
      # WAF proxy management socket
      - TENGINE_URL=http://safeline-tengine:9001
      # FVM rule engine endpoint
      - FVM_URL=http://safeline-fvm:9004
      # Initial admin password (set on first boot only)
      # - ADMIN_PASSWORD=${SECRET_KEY}
    volumes:
      - ${DOCKER_DATA}/safeline/mgt:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Management Web UI — access via https://HOST:PORT_SAFELINE
      - ${PORT_SAFELINE}:1443
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-tengine:
    image: chaitin/safeline-tengine:latest
    container_name: safeline-tengine
    hostname: safeline-tengine
    restart: unless-stopped
    depends_on:
      - safeline-mgt
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/safeline/tengine/config:/etc/nginx
      - ${DOCKER_DATA}/safeline/tengine/logs:/var/log/nginx
      - ${DOCKER_DATA}/safeline/tengine/cache:/var/cache/nginx
    ports:
      # Public HTTP/HTTPS ports — traffic routed through the WAF
      - 80:80
      - 443:443
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-mario:
    image: chaitin/safeline-mario:latest
    container_name: safeline-mario
    hostname: safeline-mario
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Log verbosity: debug, info, warn, error
      # - LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/safeline/mario:/app/data
    # networks:
    #   - ${DEFAULT_NETWORK}

  safeline-fvm:
    image: chaitin/safeline-fvm:latest
    container_name: safeline-fvm
    hostname: safeline-fvm
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/safeline/fvm:/app/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── seafile (services/files/file-manager/seafile.yaml)
  seafile:
    image: seafileltd/seafile-mc:latest
    container_name: seafile
    hostname: seafile
    restart: unless-stopped
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-memcached:
        condition: service_started
    environment:
      - TZ=${TZ}
      # Database host and root password
      - DB_HOST=seafile-db
      - DB_ROOT_PASSWD=${MYSQL_ROOT_PASSWORD}
      # Admin credentials for initial setup
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL:-admin@example.com}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD:-changeme}
      # Server name shown in the web UI
      - SEAFILE_SERVER_NAME=Seafile
      # Internal hostname (used for building SERVICE_URL)
      - SEAFILE_SERVER_HOSTNAME=seafile.${BASE_DOMAIN}
      # Let's Encrypt (disabled — terminate TLS at reverse proxy)
      - SEAFILE_SERVER_LETSENCRYPT=false
      # Force HTTPS for all internal links
      - FORCE_HTTPS_IN_CONF=false
      # Public service URLs
      - SERVICE_URL=https://seafile.${BASE_DOMAIN}
      - FILE_SERVER_ROOT=https://seafile.${BASE_DOMAIN}/seafhttp
    volumes:
      - ${DOCKER_DATA}/seafile/data:/shared
    ports:
      - ${PORT_SEAFILE}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    hostname: seafile-db
    restart: unless-stopped
    command: --innodb_log_file_size=256M --transaction-isolation=READ-COMMITTED
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_BIN=1
    volumes:
      - ${DOCKER_DATA}/seafile/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  seafile-memcached:
    image: memcached:1.6-alpine
    container_name: seafile-memcached
    hostname: seafile-memcached
    restart: unless-stopped
    # Seafile recommends at least 128 MB of memcached
    command: memcached -m 256
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── semaphore (services/development/semaphore/semaphore.yaml)
  semaphore:
    image: semaphoreui/semaphore:latest
    container_name: semaphore
    hostname: semaphore
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - SEMAPHORE_DB_DIALECT=bolt                              # Database type (bolt for embedded)
      # - SEMAPHORE_ADMIN=admin                                # Admin username
      # - SEMAPHORE_ADMIN_PASSWORD=changeme                    # Admin password
      # - SEMAPHORE_ADMIN_NAME=Admin                           # Admin display name
      # - SEMAPHORE_ADMIN_EMAIL=admin@example.com              # Admin email

    volumes:
      - ${DOCKER_DATA}/development/semaphore/config:/etc/semaphore
      - ${DOCKER_DATA}/development/semaphore/data:/var/lib/semaphore

    ports:
      - ${PORT_SEMAPHORE:-${AUTO_PORT_SEMAPHORE}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── serpbear (services/productivity/seo/serpbear.yaml)
  serpbear:
    image: towfiqi/serpbear:latest
    container_name: serpbear
    hostname: serpbear
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SECRET=${SERPBEAR_SECRET}              # API secret key (openssl rand -hex 32)
      - NEXT_AUTH_SECRET=${SERPBEAR_SECRET}    # NextAuth session secret
      - NEXT_AUTH_URL=http://localhost:${PORT_SERPBEAR:-${AUTO_PORT_SERPBEAR}}  # Public URL of this instance
      # - SMTP_HOST=smtp.example.com           # SMTP host for email reports
      # - SMTP_PORT=587                        # SMTP port
      # - SMTP_USER=user@example.com           # SMTP username
      # - SMTP_PASSWORD=changeme               # SMTP password
      # - SMTP_EMAIL=serpbear@example.com      # From address for report emails
    volumes:
      - ${DOCKER_DATA}/serpbear/data:/app/data   # SQLite database and persistent data
    ports:
      - ${PORT_SERPBEAR:-${AUTO_PORT_SERPBEAR}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── simplex (services/communication/simplex.yaml)
  simplex:
    image: simplexchat/smp-server:latest
    container_name: simplex
    hostname: simplex
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # SMP server is configured via /etc/opt/simplex/smp-server.ini
      # Most options can also be passed as CLI flags via the 'command' field.
      # - ADDR=                                          # Public hostname or IP for this server
      # - PASS=                                          # Optional: password for client registration
    volumes:
      - ${DOCKER_DATA}/simplex/config:/etc/opt/simplex    # Server config (smp-server.ini, TLS certs)
      - ${DOCKER_DATA}/simplex/data:/var/opt/simplex      # Server store log and queue data
    ports:
      - "${PORT_SIMPLEX}:5225"                           # SMP protocol port (TCP) — used by clients
      # - "443:443"                                      # HTTPS/TLS port (optional, for TLS termination)
    # networks:
    #   - ${DEFAULT_NETWORK}

  # simplex-xftp:
  #   image: simplexchat/xftp-server:latest
  #   container_name: simplex-xftp
  #   hostname: simplex-xftp
  #   restart: unless-stopped
  #   environment:
  #     - TZ=${TZ}
  #   volumes:
  #     - ${DOCKER_DATA}/simplex-xftp/config:/etc/opt/simplex-xftp  # XFTP server config and certs
  #     - ${DOCKER_DATA}/simplex-xftp/data:/var/opt/simplex-xftp    # File chunk storage
  #   ports:
  #     - "443:443"                                      # XFTP protocol port (TCP)

# networks:
#   proxy:
#     external: true

  # ── siyuan (services/productivity/notes/siyuan.yaml)
  siyuan:
    image: b3log/siyuan:latest
    container_name: siyuan
    hostname: siyuan
    restart: unless-stopped
    # SiYuan requires specific user context; runs as uid 1000 by default
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --workspace=/siyuan/workspace
      # Set a strong access code (required to log in via browser)
      - --accessAuthCode=${SIYUAN_ACCESS_CODE:-changeme}
      # Optional: serve on all interfaces (default is 127.0.0.1)
      - --bind=0.0.0.0
      # Optional: enable read-only mode
      # - --readonly
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/siyuan/workspace:/siyuan/workspace
    ports:
      - ${PORT_SIYUAN:-${AUTO_PORT_SIYUAN}}:6806
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── slskd (services/media/music/slskd/slskd.yaml)
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    hostname: slskd
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SLSKD_REMOTE_CONFIGURATION=true                        # Enable remote config via Web UI
      # - SLSKD_USERNAME=slskd                                 # Soulseek username
      # - SLSKD_PASSWORD=slskd                                 # Soulseek password
      # - SLSKD_SLSK_LISTEN_PORT=50300                         # Soulseek listen port

    volumes:
      - ${DOCKER_DATA}/media/slskd/config:/app
      # - /path/to/music:/music                                # Shared music directory
      # - /path/to/downloads:/downloads                        # Downloads directory

    ports:
      - ${PORT_SLSKD:-${AUTO_PORT_SLSKD}}:5030
      # - ${PORT_SLSKD_HTTPS:-${AUTO_PORT_SLSKD_HTTPS}}:5031                       # HTTPS port
      # - 50300:50300                                          # Soulseek listen port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── sonarr (services/media/movies-tv/sonarr/sonarr.yaml)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask
      # - DOCKER_MODS=linuxserver/mods:sonarr-striptracks      # Strip extra audio tracks mod

    volumes:
      - ${DOCKER_DATA}/media/sonarr/config:/config
      # - /path/to/tvseries:/tv                                # TV series library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_SONARR:-${AUTO_PORT_SONARR}}:8989

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── spacedrive (services/files/spacedrive.yaml)
  spacedrive:
    image: ghcr.io/spacedriveapp/spacedrive/server:latest
    container_name: spacedrive
    hostname: spacedrive
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Data directory inside the container
      - SD_DATA_DIR=/data
      # Origin allowed to connect (set to your domain in production)
      # - SD_AUTH_SECRET=changeme
    volumes:
      - ${DOCKER_DATA}/spacedrive/data:/data
      # Mount additional storage locations to index
      # - /mnt/nas:/mnt/nas:ro
    ports:
      - ${PORT_SPACEDRIVE}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── ssm-client (services/server/management/ssm-client.yaml)
  ssm-client:
    image: ghcr.io/squirrelcorporation/squirrelserversmanager-client:latest
    container_name: ssm-client
    hostname: ssm-client
    restart: unless-stopped
    depends_on:
      - ssm-server
    environment:
      - TZ=${TZ}
    ports:
      - ${PORT_SSM:-${AUTO_PORT_SSM}}:8000
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-server:
    image: ghcr.io/squirrelcorporation/squirrelserversmanager-server:latest
    container_name: ssm-server
    hostname: ssm-server
    restart: unless-stopped
    depends_on:
      ssm-mongodb:
        condition: service_healthy
      ssm-redis:
        condition: service_started
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - MONGODB_URI=mongodb://ssm-mongodb:27017/ssm
      - REDIS_HOST=ssm-redis
      - REDIS_PORT=6379
    volumes:
      - ${DOCKER_DATA}/ssm/server/config:/app/config
      - ${DOCKER_DATA}/ssm/server/playbooks:/app/playbooks
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-agent-proxy:
    image: ghcr.io/squirrelcorporation/squirrelserversmanager-agent-proxy:latest
    container_name: ssm-agent-proxy
    hostname: ssm-agent-proxy
    restart: unless-stopped
    depends_on:
      - ssm-server
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ssm/agent-proxy/config:/config
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-mongodb:
    image: mongo:7.0
    container_name: ssm-mongodb
    hostname: ssm-mongodb
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ssm/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  ssm-redis:
    image: redis:7-alpine
    container_name: ssm-redis
    hostname: ssm-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ssm/redis:/data
    command: --save 60 1 --loglevel warning
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── stackauth-backend (services/server/auth/stackauth-backend.yaml)
  stackauth-postgres:
    image: postgres:16-alpine
    container_name: stackauth-postgres
    hostname: stackauth-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=stackauth
      - POSTGRES_USER=stackauth
      - POSTGRES_PASSWORD=${STACKAUTH_POSTGRES_PASSWORD:-stackauth_pass}
    volumes:
      - ${DOCKER_DATA}/stackauth/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackauth -d stackauth"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  stackauth-backend:
    image: stackauth/backend:latest
    container_name: stackauth-backend
    hostname: stackauth-backend
    restart: unless-stopped
    depends_on:
      stackauth-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database
      - STACK_DATABASE_CONNECTION_STRING=postgresql://stackauth:${STACKAUTH_POSTGRES_PASSWORD:-stackauth_pass}@stackauth-postgres:5432/stackauth
      # Secret key for signing tokens - generate with: openssl rand -hex 32
      - STACK_SECRET_SERVER_KEY=${STACKAUTH_SECRET_SERVER_KEY}
      # Public URL of the backend (used for redirect URIs)
      - NEXT_PUBLIC_STACK_API_URL=https://auth.${BASE_DOMAIN}
      # Superuser API key (for dashboard access)
      - STACK_SUPERUSER_USERNAME=${STACKAUTH_ADMIN_EMAIL:-admin@${BASE_DOMAIN}}
      - STACK_SUPERUSER_PASSWORD=${STACKAUTH_ADMIN_PASSWORD:-changeme}
      # Email (optional, for magic links and notifications)
      # - STACK_EMAIL_HOST=smtp.${BASE_DOMAIN}
      # - STACK_EMAIL_PORT=587
      # - STACK_EMAIL_USERNAME=${SMTP_USERNAME}
      # - STACK_EMAIL_PASSWORD=${SMTP_PASSWORD}
      # - STACK_EMAIL_FROM=auth@${BASE_DOMAIN}
      # OAuth providers (configure in dashboard or via env)
      # - STACK_OAUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # - STACK_OAUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # - STACK_OAUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      # - STACK_OAUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    volumes:
      - ${DOCKER_DATA}/stackauth/backend:/app/data
    ports:
      - ${PORT_STACKAUTH:-${AUTO_PORT_STACKAUTH}}:8101
    # networks:
    #   - ${DEFAULT_NETWORK}

  stackauth-dashboard:
    image: stackauth/dashboard:latest
    container_name: stackauth-dashboard
    hostname: stackauth-dashboard
    restart: unless-stopped
    depends_on:
      - stackauth-backend
    environment:
      - TZ=${TZ}
      # Points to the backend API
      - NEXT_PUBLIC_STACK_API_URL=https://auth.${BASE_DOMAIN}
      - STACK_API_URL=http://stackauth-backend:8101
    ports:
      - ${PORT_STACKAUTH_DASHBOARD:-${AUTO_PORT_STACKAUTH_DASHBOARD}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access the dashboard at http://your-server:${PORT_STACKAUTH_DASHBOARD:-${AUTO_PORT_STACKAUTH_DASHBOARD}}
# 2. Login with STACKAUTH_ADMIN_EMAIL / STACKAUTH_ADMIN_PASSWORD
# 3. Create your first project and configure auth methods
# 4. Copy the Project API keys into your application
#
# SDK integration (Next.js example):
#   npm install @stackframe/stack
#   Configure NEXT_PUBLIC_STACK_PROJECT_ID and NEXT_PUBLIC_STACK_API_URL
# ============================================================

  # ── stalwart (services/communication/stalwart.yaml)
  stalwart:
    image: stalwartlabs/mail-server:latest
    container_name: stalwart
    hostname: stalwart
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Stalwart uses /opt/stalwart-mail/etc/config.toml for configuration.
      # Most settings are managed via the web UI after initial setup.
      # - STALWART_ADMIN_PASSWORD=${STALWART_ADMIN_PASSWORD}  # Initial admin password; auto-generated if omitted
    volumes:
      - ${DOCKER_DATA}/stalwart/data:/opt/stalwart-mail    # Config, mail data, certs, and RocksDB
    ports:
      - "${PORT_STALWART_SMTP}:25"          # SMTP (inbound mail from remote MTAs)
      - "587:587"                            # SMTP Submission (outbound from mail clients, STARTTLS)
      - "465:465"                            # SMTPS Submission (outbound, implicit TLS)
      - "${PORT_STALWART_IMAP}:143"         # IMAP4 (plaintext + STARTTLS)
      - "993:993"                            # IMAPS (implicit TLS)
      - "4190:4190"                          # ManageSieve (server-side filtering scripts)
      - "${PORT_STALWART_HTTP}:8080"        # HTTP — admin UI and JMAP API
      # - "443:443"                          # HTTPS — admin UI/JMAP with TLS (requires TLS cert in /opt/stalwart-mail/etc/certs)
      # - "110:110"                          # POP3 (enable POP3 in config.toml if needed)
      # - "995:995"                          # POP3S (implicit TLS)
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── stirling-pdf (services/media/documents/stirling-pdf.yaml)
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    hostname: stirling-pdf
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Set to true and configure settings.yml to enable authentication
      - DOCKER_ENABLE_SECURITY=${STIRLING_ENABLE_SECURITY:-false}
      # Set to true to install Calibre for ebook conversion (larger image)
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=${STIRLING_INSTALL_CALIBRE:-false}
      # Comma-separated locale codes for OCR language packs to install
      - LANGS=${STIRLING_LANGS:-en_GB}
    volumes:
      - ${DOCKER_DATA}/stirling-pdf/configs:/configs
      - ${DOCKER_DATA}/stirling-pdf/customFiles:/customFiles
      - ${DOCKER_DATA}/stirling-pdf/logs:/logs
      - ${DOCKER_DATA}/stirling-pdf/pipeline/watchedFolders:/pipeline/watchedFolders
      - ${DOCKER_DATA}/stirling-pdf/pipeline/finishedFolders:/pipeline/finishedFolders
    ports:
      - ${PORT_STIRLING}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── stirlingpdf (services/productivity/stirlingpdf.yaml)
  stirlingpdf:
    image: frooodle/s-pdf:latest
    container_name: stirlingpdf
    hostname: stirlingpdf
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # -- Security / Authentication --
      # Enable login page and user management (false = no login required)
      - DOCKER_ENABLE_SECURITY=false
      # Initial admin credentials (only used when security is enabled)
      # - SECURITY_INITIALLOGIN_USERNAME=${STIRLINGPDF_ADMIN_USER:-admin}
      # - SECURITY_INITIALLOGIN_PASSWORD=${STIRLINGPDF_ADMIN_PASSWORD:-changeme}
      # -- Feature flags --
      # Install Calibre for e-book to PDF conversion (large image, optional)
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      # -- OCR Languages --
      # Languages to make available for OCR (space-separated Tesseract lang codes)
      # Common: eng deu fra spa por ita chi-sim chi-tra jpn kor ara
      - LANGS=en_GB
      # -- Application settings --
      # Show update notification in UI
      - SYSTEM_SHOW_UPDATE=false
      # -- Custom branding (optional) --
      # - SYSTEM_DEFAULTLOCALE=en-US
      # - UI_APP_NAME=Stirling PDF
      # - UI_HOME_DESCRIPTION=All your PDF tools in one place
      # - UI_APP_NAVBAR_NAME=PDF Tools
    volumes:
      # Custom Tesseract training data for additional OCR language packs
      - ${DOCKER_DATA}/stirlingpdf/trainingData:/usr/share/tessdata
      # Custom application configuration (e.g., settings.yml overrides)
      - ${DOCKER_DATA}/stirlingpdf/configs:/configs
      # Persistent application logs
      - ${DOCKER_DATA}/stirlingpdf/logs:/logs
      # Custom files (e.g., custom scripts, fonts)
      - ${DOCKER_DATA}/stirlingpdf/customFiles:/customFiles
    ports:
      - ${PORT_STIRLINGPDF:-${AUTO_PORT_STIRLINGPDF}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── tdarr (services/media/movies-tv/tdarr.yaml)
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    hostname: tdarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - umask=002
      - serverIP=0.0.0.0                         # IP for the Tdarr server to bind to
      - serverPort=8266                          # Node communication port
      - webUIPort=8265                           # Web UI port
      - internalNode=true                        # Run a built-in transcoding node alongside the server
      - internalNodeIP=0.0.0.0
      - nodeName=${TDARR_NODE_ID:-InternalNode}  # Display name for the built-in node
      # - NVIDIA_DRIVER_CAPABILITIES=all         # Uncomment for NVIDIA GPU transcoding
      # - NVIDIA_VISIBLE_DEVICES=all             # Uncomment for NVIDIA GPU transcoding
    volumes:
      - ${DOCKER_DATA}/tdarr/server:/app/server    # Tdarr server data and database
      - ${DOCKER_DATA}/tdarr/configs:/app/configs  # Plugin and transcoding configurations
      - ${DOCKER_DATA}/tdarr/logs:/app/logs        # Application logs
      - ${MOVIES_DIR}:/media/movies              # Movie library
      - ${TV_DIR}:/media/tv                      # TV show library
      - ${DOCKER_DATA}/tdarr/transcode:/temp       # Temporary transcoding workspace
    ports:
      - ${PORT_TDARR:-${AUTO_PORT_TDARR}}:8265                 # Web UI
      - ${PORT_TDARR_NODE:-${AUTO_PORT_TDARR_NODE}}:8266            # Node communication API
    # Optional: NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Tdarr External Node - add additional nodes for distributed transcoding
  # Each node should have a unique nodeName and can have dedicated GPU resources
  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node
    hostname: tdarr-node
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - umask=002
      - nodeName=${TDARR_NODE_ID:-ExternalNode01} # Unique name for this node in the cluster
      - serverIP=${TDARR_SERVER_IP:-tdarr}         # Tdarr server hostname or IP
      - serverPort=8266                            # Must match the server's serverPort
      # - NVIDIA_DRIVER_CAPABILITIES=all           # Uncomment for NVIDIA GPU transcoding
      # - NVIDIA_VISIBLE_DEVICES=all               # Uncomment for NVIDIA GPU transcoding
    volumes:
      - ${DOCKER_DATA}/tdarr/configs:/app/configs    # Shared configurations (must match server)
      - ${DOCKER_DATA}/tdarr/logs:/app/logs
      - ${MOVIES_DIR}:/media/movies                # Must match server paths exactly
      - ${TV_DIR}:/media/tv
      - ${DOCKER_DATA}/tdarr/transcode:/temp         # Temporary transcoding workspace
    # No ports - node communicates back to server on serverPort
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── tianji (services/networking/tianji.yaml)
  tianji:
    image: moonrailgun/tianji:latest
    container_name: tianji
    hostname: tianji
    restart: unless-stopped
    depends_on:
      tianji-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - DATABASE_URL=postgresql://tianji:${POSTGRES_PASSWORD}@tianji-postgres:5432/tianji
      - JWT_SECRET=${SECRET_KEY}
      - ALLOW_REGISTER=false
      # - WEBSITE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/tianji/data:/app/data
    ports:
      - ${PORT_TIANJI}:12345
    # networks:
    #   - ${DEFAULT_NETWORK}

  tianji-postgres:
    image: postgres:15-alpine
    container_name: tianji-postgres
    hostname: tianji-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=tianji
      - POSTGRES_USER=tianji
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/tianji/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianji -d tianji"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── tirreno (services/server/security/tirreno.yaml)
  tirreno:
    image: ghcr.io/tirrenotechnologies/tirreno:latest
    container_name: tirreno
    hostname: tirreno
    restart: unless-stopped
    depends_on:
      tirreno-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # PostgreSQL connection details
      - DB_HOST=tirreno-postgres
      - DB_PORT=5432
      - DB_NAME=tirreno
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      # Application secret for signing sessions/tokens
      - APP_SECRET=${SECRET_KEY}
      # Full public URL (used for callback and link generation)
      # - APP_URL=https://tirreno.${BASE_DOMAIN}
      # Admin account credentials set on first boot
      # - ADMIN_EMAIL=admin@${BASE_DOMAIN}
      # - ADMIN_PASSWORD=changeme
      # Log level: debug, info, warning, error
      # - LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/tirreno/config:/app/config
      - ${DOCKER_DATA}/tirreno/data:/app/data
    ports:
      - ${PORT_TIRRENO}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

  tirreno-postgres:
    image: postgres:16-alpine
    container_name: tirreno-postgres
    hostname: tirreno-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tirreno
    volumes:
      - ${DOCKER_DATA}/tirreno/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d tirreno"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── todometer (services/productivity/tasks/todometer.yaml)
  todometer:
    image: ghcr.io/rawnly/todometer:latest
    container_name: todometer
    hostname: todometer
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NODE_ENV=production
      - PORT=3000
      # Security / session secret
      - SECRET=${TODOMETER_SECRET:-changeme_generate_a_real_secret}
      # Database (SQLite by default)
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@todometer-postgres:5432/todometer
      # Optional: public base URL
      - BASE_URL=https://${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/todometer/data:/app/data
    ports:
      - ${PORT_TODOMETER:-${AUTO_PORT_TODOMETER}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── traefik (services/networking/reverse-proxy/traefik/traefik.yaml)
  traefik:
    image: traefik:latest
    container_name: traefik
    hostname: traefik
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}                 # Cloudflare API token (for DNS challenge)

    volumes:
      - ${DOCKER_DATA}/networking/traefik/config:/etc/traefik
      - ${DOCKER_DATA}/networking/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (read-only)

    ports:
      - ${PORT_TRAEFIK_HTTP:-${AUTO_PORT_TRAEFIK_HTTP}}:80                            # HTTP entrypoint
      - ${PORT_TRAEFIK_HTTPS:-${AUTO_PORT_TRAEFIK_HTTPS}}:443                         # HTTPS entrypoint
      - ${PORT_TRAEFIK_DASHBOARD:-${AUTO_PORT_TRAEFIK_DASHBOARD}}:8080                   # Dashboard (disable in prod)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── trilium (services/productivity/notes/trilium.yaml)
  trilium:
    image: triliumnext/notes:latest
    container_name: trilium
    hostname: trilium
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Optional: set the timezone for note timestamps
      - TRILIUM_DATA_DIR=/home/node/trilium-data
      # Optional: disable update check notifications
      # - TRILIUM_NO_AUTHENTICATION=false
    volumes:
      # Persists the SQLite database and all note attachments
      - ${DOCKER_DATA}/trilium/data:/home/node/trilium-data
    ports:
      - ${PORT_TRILIUM:-${AUTO_PORT_TRILIUM}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── tududi (services/productivity/notes/tududi.yaml)
  tududi:
    image: chrisvel/tududi:latest
    container_name: tududi-notes
    hostname: tududi-notes
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Rails environment
      - RAILS_ENV=production
      # Secret key base - generate with: openssl rand -hex 64
      - SECRET_KEY_BASE=${TUDUDI_SECRET_KEY:-changeme_generate_a_real_64char_hex_secret}
      # Admin user credentials (created on first run)
      - TUDUDI_USER_EMAIL=${TUDUDI_USER_EMAIL:-admin@example.com}
      - TUDUDI_USER_PASSWORD=${TUDUDI_USER_PASSWORD:-changeme}
      # Database (SQLite default)
      # To use PostgreSQL, set DATABASE_URL:
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tududi-postgres:5432/tududi
      # Application host (used for asset URLs)
      - APP_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/tududi-notes/data:/app/db
    ports:
      - ${PORT_TUDUDI_NOTES:-${AUTO_PORT_TUDUDI_NOTES}}:4567
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── umami (services/media/music/umami.yaml)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    hostname: umami
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-changeme-replace-with-long-random-secret}
    ports:
      - ${PORT_UMAMI:-${AUTO_PORT_UMAMI}}:3000
    depends_on:
      umami-db:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    hostname: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - ${DOCKER_DATA}/umami/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── unbound (services/networking/dns/unbound/unbound.yaml)
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/unbound/config:/opt/unbound/etc/unbound

    ports:
      - ${PORT_UNBOUND:-${AUTO_PORT_UNBOUND}}:53/tcp                           # DNS over TCP
      - ${PORT_UNBOUND:-${AUTO_PORT_UNBOUND}}:53/udp                           # DNS over UDP

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── unison (services/files/file-manager/unison.yaml)
  unison:
    image: eugenmayer/unison:latest
    container_name: unison
    hostname: unison
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Unison listens on this port for incoming client connections
      - UNISON_PORT=5000
      # Optional: SSH public key for client authentication
      # - SSH_AUTH_KEYS=ssh-rsa AAAA...
      # Optional: log verbosity
      # - UNISON_DEBUG=1
    volumes:
      # Primary sync directory
      - ${DOCKER_DATA}/unison/sync:/data/sync
      # Unison profile and state directory
      - ${DOCKER_DATA}/unison/config:/root/.unison
    ports:
      # Unison native socket port
      - ${PORT_UNISON:-${AUTO_PORT_UNISON}}:5000
      # SSH port (for SSH transport)
      - ${PORT_UNISON_SSH:-${AUTO_PORT_UNISON_SSH}}:22
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── uptime-kuma (services/networking/monitoring/uptime-kuma/uptime-kuma.yaml)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    hostname: uptime-kuma
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/networking/uptime-kuma/config:/app/data

    ports:
      - ${PORT_UPTIME_KUMA:-${AUTO_PORT_UPTIME_KUMA}}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── vikunja (services/productivity/tasks/vikunja/vikunja.yaml)
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    hostname: vikunja
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - VIKUNJA_SERVICE_PUBLICURL=https://tasks.${BASE_DOMAIN}/ # Public URL
      # - VIKUNJA_SERVICE_JWTSECRET=${JWT_SECRET}                # JWT secret key
      # - VIKUNJA_DATABASE_TYPE=sqlite                           # Database type
      # - VIKUNJA_SERVICE_ENABLEREGISTRATION=true                # Allow new registrations

    volumes:
      - ${DOCKER_DATA}/productivity/vikunja/config:/app/vikunja/files

    ports:
      - ${PORT_VIKUNJA:-${AUTO_PORT_VIKUNJA}}:3456

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wallabag (services/productivity/bookmarks/wallabag/wallabag.yaml)
  wallabag:
    image: wallabag/wallabag:latest
    container_name: wallabag
    hostname: wallabag
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SYMFONY__ENV__DOMAIN_NAME=https://wallabag.${BASE_DOMAIN} # Public URL
      # - SYMFONY__ENV__DATABASE_DRIVER=pdo_sqlite              # Database driver
      # - SYMFONY__ENV__SECRET=${SYMFONY_SECRET}                # App secret key
      # - SYMFONY__ENV__FOSUSER_REGISTRATION=false              # Disable registration

    volumes:
      - ${DOCKER_DATA}/productivity/wallabag/config:/var/www/wallabag/data
      - ${DOCKER_DATA}/productivity/wallabag/images:/var/www/wallabag/web/assets/images

    ports:
      - ${PORT_WALLABAG:-${AUTO_PORT_WALLABAG}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── watchtower (services/server/management/watchtower/watchtower.yaml)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true                                 # Remove old images after update
      - WATCHTOWER_SCHEDULE=0 0 4 * * *                        # Cron: run daily at 4 AM
      # - WATCHTOWER_NOTIFICATIONS=shoutrrr                    # Notification provider
      # - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL} # Notification URL
      # - WATCHTOWER_MONITOR_ONLY=true                         # Only monitor, don't update

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock               # Docker socket (required)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wazuhmanager (services/server/wazuhmanager.yaml)
  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - TZ=${TZ}
      # Indexer connection
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      # Filebeat TLS verification
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      # API credentials
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      # Wazuh manager persistent state
      - wazuh-api-config:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      # SSL certificates (generate before first run)
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      # Manager ossec.conf
      - ${DOCKER_DATA}/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    ports:
      # Agent registration (authd)
      - "1515:1515"
      # Agent data ingestion (agentd) — UDP and TCP
      - "1514:1514/udp"
      - "1514:1514"
      # Wazuh REST API
      - "55000:55000"
    # networks:
    #   - ${DEFAULT_NETWORK}

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.0
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - TZ=${TZ}
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      # SSL certificates
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      # Indexer configuration
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    ports:
      # OpenSearch REST API / indexer
      - "9200:9200"
    # networks:
    #   - ${DEFAULT_NETWORK}

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
    environment:
      - TZ=${TZ}
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_ADMIN_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_ADMIN_PASSWORD}
    volumes:
      # SSL certificates for the dashboard
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ${DOCKER_DATA}/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      # Dashboard configuration
      - ${DOCKER_DATA}/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ${DOCKER_DATA}/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    ports:
      # Dashboard HTTPS web UI
      - ${PORT_WAZUH_DASHBOARD}:443
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager
    # networks:
    #   - ${DEFAULT_NETWORK}


  # ── wireguard (services/networking/vpn/wireguard/wireguard.yaml)
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    hostname: wireguard
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - SERVERURL=vpn.example.com                            # External server URL or IP
      # - SERVERPORT=51820                                     # Server listen port
      # - PEERS=3                                              # Number of peer configs to generate
      # - PEERDNS=auto                                         # DNS for peers (auto or IP)
      # - INTERNAL_SUBNET=10.13.13.0                           # Internal subnet

    volumes:
      - ${DOCKER_DATA}/networking/wireguard/config:/config
      - /lib/modules:/lib/modules:ro                           # Kernel modules (required)

    ports:
      - ${PORT_WIREGUARD:-${AUTO_PORT_WIREGUARD}}:51820/udp

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wizarr (services/media/automation/wizarr.yaml)
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    hostname: wizarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - APP_URL=${WIZARR_APP_URL:-http://localhost:5690}  # Public-facing URL (used in invitation links)
      # - DISABLE_BUILTIN_AUTH=false             # Set to true if using an external SSO/auth proxy
    volumes:
      - ${DOCKER_DATA}/wizarr/database:/data/database  # SQLite database and application data
    ports:
      - ${PORT_WIZARR:-${AUTO_PORT_WIZARR}}:5690
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── zerotier (services/files/backup/zerotier.yaml)
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    hostname: zerotier
    restart: unless-stopped
    # ZeroTier must run in host network mode or with specific capabilities
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - TZ=${TZ}
      # Automatically join this network on container start
      # - ZEROTIER_ONE_NETWORK_IDS=<your-network-id>
    volumes:
      # Persists identity and network config across restarts
      - ${DOCKER_DATA}/zerotier/data:/var/lib/zerotier-one
    # ports: not needed when network_mode: host

# networks:
#   proxy:
#     external: true

  # ── zipline (services/files/zipline.yaml)
  zipline:
    image: ghcr.io/diced/zipline:latest
    container_name: zipline
    hostname: zipline
    restart: unless-stopped
    depends_on:
      zipline-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Application secret — MUST be a long, random string
      - CORE_SECRET=${ZIPLINE_SECRET}
      # PostgreSQL connection
      - CORE_DATABASE_URL=postgresql://${POSTGRES_USER:-zipline}:${POSTGRES_PASSWORD}@zipline-db/zipline
      # Host and port
      - CORE_HOST=0.0.0.0
      - CORE_PORT=3000
      # Storage: local or s3
      - DATASOURCE_TYPE=local
      - DATASOURCE_LOCAL_DIRECTORY=/zipline/uploads
      # Optionally use S3-compatible storage
      # - DATASOURCE_TYPE=s3
      # - DATASOURCE_S3_BUCKET=zipline
      # - DATASOURCE_S3_ACCESS_KEY_ID=
      # - DATASOURCE_S3_SECRET_ACCESS_KEY=
      # - DATASOURCE_S3_REGION=us-east-1
      # - DATASOURCE_S3_ENDPOINT=
      # Public-facing URL
      - CORE_RETURN_HTTPS=true
      # Max upload size (bytes, default: 100 MB)
      # - UPLOADER_MAX_SIZE=104857600
      # Allow user registration
      - FEATURES_INVITES=true
      - FEATURES_ROBOTS_TXT=false
      - FEATURES_USER_REGISTRATION=false
    volumes:
      - ${DOCKER_DATA}/zipline/uploads:/zipline/uploads
      - ${DOCKER_DATA}/zipline/public:/zipline/public
    ports:
      - ${PORT_ZIPLINE}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

  zipline-db:
    image: postgres:16-alpine
    container_name: zipline-db
    hostname: zipline-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-zipline}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=zipline
    volumes:
      - ${DOCKER_DATA}/zipline/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zipline} -d zipline"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── zitadel (services/server/auth/zitadel.yaml)
  zitadel-postgres:
    image: postgres:16-alpine
    container_name: zitadel-postgres
    hostname: zitadel-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=zitadel
      - POSTGRES_USER=zitadel
      - POSTGRES_PASSWORD=${ZITADEL_POSTGRES_PASSWORD:-zitadel_pass}
    volumes:
      - ${DOCKER_DATA}/zitadel/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: zitadel
    hostname: zitadel
    restart: unless-stopped
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode disabled
    environment:
      - TZ=${TZ}
      # Master key for encryption - generate with: zitadel keys generate or openssl rand -hex 32
      - ZITADEL_MASTERKEY=${ZITADEL_MASTERKEY}
      # Database (PostgreSQL)
      - ZITADEL_DATABASE_POSTGRES_HOST=zitadel-postgres
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=${ZITADEL_POSTGRES_PASSWORD:-zitadel_pass}
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=zitadel
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=${ZITADEL_POSTGRES_PASSWORD:-zitadel_pass}
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable
      # External domain - the public-facing URL
      - ZITADEL_EXTERNALDOMAIN=${BASE_DOMAIN}
      - ZITADEL_EXTERNALPORT=${PORT_ZITADEL:-${AUTO_PORT_ZITADEL}}
      - ZITADEL_EXTERNALSECURE=false
      # First instance admin user (created on first start)
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME=${ZITADEL_ADMIN_EMAIL:-admin@${BASE_DOMAIN}}
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=${ZITADEL_ADMIN_PASSWORD:-Password1!}
      # Port
      - ZITADEL_PORT=8080
      # Log level: debug, info, warn, error
      # - ZITADEL_LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/zitadel/config:/config
    ports:
      - ${PORT_ZITADEL:-${AUTO_PORT_ZITADEL}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_ZITADEL:-${AUTO_PORT_ZITADEL}}/ui/console
# 2. Login with ZITADEL_ADMIN_EMAIL and ZITADEL_ADMIN_PASSWORD
# 3. You will be prompted to change the password on first login
# 4. Create organizations, projects, and applications from the console
#
# For production with TLS:
#   Change --tlsMode to 'external' or 'enabled'
#   Set ZITADEL_EXTERNALSECURE=true
#   Set ZITADEL_EXTERNALPORT=443
#
# CockroachDB alternative (for distributed deployments):
#   Replace postgres service with CockroachDB and update
#   ZITADEL_DATABASE_COCKROACH_* env vars instead
# ============================================================

  # ── zoraxy (services/networking/zoraxy.yaml)
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    container_name: zoraxy
    hostname: zoraxy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Web management interface port (internal)
      - PORT=8123
      # Enable fast GeoIP lookup (downloads MaxMind GeoLite2 DB)
      - FASTGEOIP=true
      # Disable authentication (NOT recommended for production)
      # - NOAUTH=false
      # ZeroTier network ID (if using ZeroTier for SDN)
      # - ZTNETWORK=${ZEROTIER_NETWORK_ID}
    volumes:
      # Persistent configuration (proxy rules, SSL certs, settings)
      - ${DOCKER_DATA}/zoraxy/config:/opt/zoraxy/config
      # Docker socket for container auto-discovery (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Sync localtime
      - /etc/localtime:/etc/localtime:ro
    ports:
      # HTTP (reverse proxy entrypoint)
      - 80:80
      # HTTPS (reverse proxy entrypoint with TLS)
      - 443:443
      # Web management UI
      - ${PORT_ZORAXY:-${AUTO_PORT_ZORAXY}}:8123
      # Optional: additional TCP proxy ports (configure in UI)
      # - 8022:22  # SSH proxy example
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_ZORAXY:-${AUTO_PORT_ZORAXY}} for the management UI
# 2. Create admin credentials on first visit
# 3. Navigate to "HTTP Proxy" to add reverse proxy rules:
#    - Subdomain: myapp.${BASE_DOMAIN} -> http://container-name:port
# 4. Navigate to "TLS/SSL" to enable Let's Encrypt:
#    - Enter your email address
#    - Add domains to certificate requests
# 5. Set your default site under "Default Site"
#
# GeoIP blocking:
#   Requires FASTGEOIP=true (downloads ~50MB database on first start)
#   Configure blocked/allowed countries under "GeoBlock"
#
# Basic authentication:
#   Add per-proxy-rule authentication under proxy rule settings
# ============================================================

  # ── ztnet (services/networking/ztnet.yaml)
  ztnet-postgres:
    image: postgres:16-alpine
    container_name: ztnet-postgres
    hostname: ztnet-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=ztnet
      - POSTGRES_USER=ztnet
      - POSTGRES_PASSWORD=${ZTNET_POSTGRES_PASSWORD:-ztnet_pass}
    volumes:
      - ${DOCKER_DATA}/ztnet/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztnet -d ztnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  ztnet:
    image: sinamics/ztnet:latest
    container_name: ztnet
    hostname: ztnet
    restart: unless-stopped
    depends_on:
      ztnet-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database connection
      - DATABASE_URL=postgresql://ztnet:${ZTNET_POSTGRES_PASSWORD:-ztnet_pass}@ztnet-postgres:5432/ztnet
      # Next-auth secret - generate with: openssl rand -base64 32
      - NEXTAUTH_SECRET=${ZTNET_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://ztnet.${BASE_DOMAIN}
      # ZeroTier controller API (local or remote)
      - ZT_ADDR=http://zerotier:9993
      # ZeroTier auth token (found in /var/lib/zerotier-one/authtoken.secret)
      - ZT_SECRET=${ZTNET_ZT_SECRET}
      # Node environment
      - NODE_ENV=production
    volumes:
      - ${DOCKER_DATA}/ztnet/config:/app/data
      # Mount ZeroTier socket if running on host
      # - /var/lib/zerotier-one:/var/lib/zerotier-one
    ports:
      - ${PORT_ZTNET:-${AUTO_PORT_ZTNET}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

  # ZeroTier One (the actual VPN daemon)
  # Required if not running ZeroTier on the host directly
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    hostname: zerotier
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${DOCKER_DATA}/ztnet/zerotier:/var/lib/zerotier-one
    # ZeroTier API port (internal, not exposed publicly)
    # ports:
    #   - 9993:9993/tcp
    #   - 9993:9993/udp

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Start zerotier first, let it generate authtoken.secret
# 2. Copy the token: cat ${DOCKER_DATA}/ztnet/zerotier/authtoken.secret
# 3. Set ZT_SECRET to that token
# 4. Access ztnet at http://your-server:${PORT_ZTNET:-${AUTO_PORT_ZTNET}}
# 5. Create an admin account on first visit
# 6. Create networks and authorize members from the dashboard
# ============================================================


