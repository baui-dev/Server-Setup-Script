      - KUBECONFIG=/home/kubero/.kube/config
      # Application secret key
      - KUBERO_SESSION_KEY=${SECRET_KEY}
      # Admin credentials
      - KUBERO_USERS=[{"id":1,"method":"local","username":"admin","password":"${SECRET_KEY}","insecure":false,"skipTLSVerify":false}]
      # Webhook secret for git integrations
      - KUBERO_WEBHOOK_SECRET=${SECRET_KEY}
      # Domain used for app routing
      # - KUBERO_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/kubero/config:/home/kubero/.kube
      - ${DOCKER_DATA}/kubero/data:/app/data
    ports:
      - ${PORT_KUBERO}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── kyoo-back (services/media/automation/kyoo-back.yaml)
  kyoo-back:
    image: ghcr.io/zoriya/kyoo_back:edge
    container_name: kyoo-back
    hostname: kyoo-back
    restart: unless-stopped
    depends_on:
      kyoo-db:
        condition: service_healthy
      kyoo-search:
        condition: service_healthy
      kyoo-rabbit:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - KYOO_APIKEYS=${KYOO_APIKEYS:-changeme-apikey}            # Comma-separated API keys for internal service communication
      - POSTGRES_HOST=kyoo-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kyoo
      - POSTGRES_USER=kyoo
      - POSTGRES_PASSWORD=${KYOO_DB_PASSWORD:-kyoo_secure_pass}
      - MEILI_HOST=http://kyoo-search:7700
      - MEILI_MASTER_KEY=${KYOO_MEILI_KEY:-kyoo_meili_key}
      - RABBITMQ_HOST=kyoo-rabbit
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=kyoo
      - RABBITMQ_PASSWORD=${KYOO_RABBIT_PASSWORD:-kyoo_rabbit_pass}
    volumes:
      - ${MEDIA_DIR}:/media:ro                   # Full media directory (read-only)
      - ${MOVIES_DIR}:/movies:ro                 # Movie library (read-only)
      - ${TV_DIR}:/tv:ro                         # TV show library (read-only)
      - ${DOCKER_DATA}/kyoo/back:/metadata         # Kyoo backend metadata cache
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-front:
    image: ghcr.io/zoriya/kyoo_front:edge
    container_name: kyoo-front
    hostname: kyoo-front
    restart: unless-stopped
    depends_on:
      - kyoo-back
    environment:
      - TZ=${TZ}
      - KYOO_URL=http://kyoo-back:5000           # Internal backend API URL
    ports:
      - ${PORT_KYOO:-${AUTO_PORT_KYOO}}:8901
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-transcoder:
    image: ghcr.io/zoriya/kyoo_transcoder:edge
    container_name: kyoo-transcoder
    hostname: kyoo-transcoder
    restart: unless-stopped
    depends_on:
      - kyoo-back
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=kyoo-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kyoo
      - POSTGRES_USER=kyoo
      - POSTGRES_PASSWORD=${KYOO_DB_PASSWORD:-kyoo_secure_pass}
      - GOCODER_PREFIX=/video
      - GOCODER_SAFE_PATH=/media                 # Must match the /media volume mount
    volumes:
      - ${MEDIA_DIR}:/media:ro                   # Full media directory (read-only)
      - ${MOVIES_DIR}:/movies:ro                 # Movie library (read-only)
      - ${TV_DIR}:/tv:ro                         # TV show library (read-only)
      - ${DOCKER_DATA}/kyoo/transcoder:/cache      # Transcoding cache directory
    # Optional: GPU passthrough for hardware transcoding
    # devices:
    #   - /dev/dri:/dev/dri                      # Intel/AMD VA-API GPU
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-db:
    image: postgres:16-alpine
    container_name: kyoo-db
    hostname: kyoo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kyoo
      - POSTGRES_USER=kyoo
      - POSTGRES_PASSWORD=${KYOO_DB_PASSWORD:-kyoo_secure_pass}
    volumes:
      - ${DOCKER_DATA}/kyoo/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyoo -d kyoo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-search:
    image: getmeili/meilisearch:v1.7
    container_name: kyoo-search
    hostname: kyoo-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${KYOO_MEILI_KEY:-kyoo_meili_key}
      - MEILI_ENV=production
    volumes:
      - ${DOCKER_DATA}/kyoo/search:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health | grep -q 'available'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-rabbit:
    image: rabbitmq:3-alpine
    container_name: kyoo-rabbit
    hostname: kyoo-rabbit
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=kyoo
      - RABBITMQ_DEFAULT_PASS=${KYOO_RABBIT_PASSWORD:-kyoo_rabbit_pass}
    volumes:
      - ${DOCKER_DATA}/kyoo/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── leadertask (services/productivity/tasks/leadertask.yaml)
  leadertask:
    image: leadertask/server:latest
    container_name: leadertask
    hostname: leadertask
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NODE_ENV=production
      # License key (required for self-hosted edition)
      - LICENSE_KEY=${LEADERTASK_LICENSE_KEY}
      # Database connection
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@leadertask-postgres:5432/leadertask
      # Redis for sessions and queuing
      - REDIS_URL=redis://:${REDIS_PASSWORD}@leadertask-redis:6379
      # Security
      - JWT_SECRET=${LEADERTASK_JWT_SECRET:-changeme_generate_a_real_secret}
      # Application URL
      - APP_URL=https://${BASE_DOMAIN}
      - PORT=3000
    volumes:
      - ${DOCKER_DATA}/leadertask/data:/app/data
    ports:
      - ${PORT_LEADERTASK:-${AUTO_PORT_LEADERTASK}}:3000
    depends_on:
      - leadertask-postgres
      - leadertask-redis
    # networks:
    #   - ${DEFAULT_NETWORK}

  leadertask-postgres:
    image: postgres:16-alpine
    container_name: leadertask-postgres
    hostname: leadertask-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=leadertask
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/leadertask/postgres:/var/lib/postgresql/data
    # networks:
    #   - ${DEFAULT_NETWORK}

  leadertask-redis:
    image: redis:7-alpine
    container_name: leadertask-redis
    hostname: leadertask-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/leadertask/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── librespeed (services/media/downloads/librespeed.yaml)
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    container_name: librespeed
    hostname: librespeed
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Mode: standalone (no DB), backend (with DB for telemetry)
      - MODE=standalone
      # Telemetry - log test results to a database
      # - TELEMETRY=true
      # Database for telemetry (comment out if MODE=standalone)
      # - DB_TYPE=sqlite   # sqlite, mysql, postgresql
      # - DB_NAME=/config/database.sql
      # For MySQL/PostgreSQL:
      # - DB_HOSTNAME=librespeed-db
      # - DB_USERNAME=librespeed
      # - DB_PASSWORD=${LIBRESPEED_DB_PASSWORD:-librespeed_pass}
      # Password to protect the statistics page (optional)
      # - STATS_PASSWORD=${LIBRESPEED_STATS_PASSWORD}
      # Custom title for the speed test page
      # - TITLE=My Speed Test Server
      # Disable chunk (default: false)
      # - DISABLE_IPINFO=true
      # IPINFO API key for IP lookup (optional)
      # - IPINFO_APIKEY=${IPINFO_API_KEY}
    volumes:
      - ${DOCKER_DATA}/librespeed/config:/config
    ports:
      - ${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Access:
#   http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}
#
# Telemetry (optional test history):
#   Set TELEMETRY=true and configure a database
#   View results at: http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}/results/telemetry.php
#   (Requires STATS_PASSWORD if set)
#
# API testing (headless):
#   curl http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}/backend/empty.php
#   Use the LibreSpeed CLI: https://github.com/librespeed/speedtest-cli
#   ./librespeed-cli --server http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}
#
# Multiple servers (edit /config/servers.json):
#   Add multiple server entries for regional testing
# ============================================================

  # ── lidarr (services/media/music/lidarr/lidarr.yaml)
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask

    volumes:
      - ${DOCKER_DATA}/media/lidarr/config:/config
      # - /path/to/music:/music                                # Music library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_LIDARR:-${AUTO_PORT_LIDARR}}:8686

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── linkding (services/productivity/bookmarks/linkding.yaml)
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    hostname: linkding
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Initial superuser credentials (only used if no superuser exists)
      - LD_SUPERUSER_NAME=${LINKDING_ADMIN_USER:-admin}
      - LD_SUPERUSER_PASSWORD=${LINKDING_ADMIN_PASSWORD:-changeme}
      # Optional: superuser email
      - LD_SUPERUSER_EMAIL=${LINKDING_ADMIN_EMAIL:-admin@example.com}
      # Disable public user registration (recommended for personal use)
      - LD_ENABLE_PUBLIC_SHARING=False
      # Context path if running behind a reverse proxy sub-path (e.g., /bookmarks)
      # - LD_CONTEXT_PATH=bookmarks/
      # Server port inside the container
      - LD_SERVER_PORT=9090
      # Enable authentication proxy support (e.g., Authelia, Authentik)
      # - LD_ENABLE_AUTH_PROXY=True
      # - LD_AUTH_PROXY_USERNAME_HEADER=HTTP_X_FORWARDED_USER
      # - LD_AUTH_PROXY_LOGOUT_URL=https://auth.${BASE_DOMAIN}/logout
      # Optional: custom DB backend (default is SQLite)
      # - LD_DB_ENGINE=postgres
      # - LD_DB_HOST=linkding-postgres
      # - LD_DB_NAME=linkding
      # - LD_DB_USER=${POSTGRES_USER}
      # - LD_DB_PASSWORD=${POSTGRES_PASSWORD}
      # - LD_DB_PORT=5432
    volumes:
      # Persists the SQLite database and favicon cache
      - ${DOCKER_DATA}/linkding/data:/etc/linkding/data
    ports:
      - ${PORT_LINKDING:-${AUTO_PORT_LINKDING}}:9090
    # networks:
    #   - ${DEFAULT_NETWORK}

# Uncomment to use a dedicated PostgreSQL backend instead of SQLite:
