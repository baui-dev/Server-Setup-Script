  # ── ferretdb (services/server/management/ferretdb.yaml)
  postgres:
    # Recommended: Pin to a specific version
    # https://github.com/FerretDB/documentdb/pkgs/container/postgres-documentdb
    image: ghcr.io/ferretdb/postgres-documentdb
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    # ports:
    #   - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres

  ferretdb:
    # Recommended: Pin to a specific version
    # https://github.com/FerretDB/FerretDB/pkgs/container/ferretdb
    image: ghcr.io/ferretdb/ferretdb
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - postgres
    # ports:
    #   - 27017:27017
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres
  
  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      - 9120:9120
    env_file: ./compose.env
    environment:
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Core cache for repos for latest commit hash / contents
      - repo-cache:/repo-cache
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at 
    ## "http://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using 
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./compose.env
    volumes:
      ## Mount external docker socket
      - :/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}


  # ── filebrowser (services/files/filebrowser/filebrowser.yaml)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/files/filebrowser/config:/config
      - ${DOCKER_DATA}/files/filebrowser/database:/database
      # - /path/to/files:/srv                                  # Root directory to browse

    ports:
      - ${PORT_FILEBROWSER:-${AUTO_PORT_FILEBROWSER}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── filerise (services/files/filerise.yaml)
  filerise:
    image: error311/filerise:latest
    container_name: filerise
    hostname: filerise
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/filerise/config:/var/www/html/config
      - ${DOCKER_DATA}/filerise/uploads:/var/www/html/uploads
    ports:
      - ${PORT_FILERISE}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── firefly (services/networking/firefly.yaml)
  firefly-postgres:
    image: postgres:16-alpine
    container_name: firefly-postgres
    hostname: firefly-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=firefly
      - POSTGRES_USER=firefly
      - POSTGRES_PASSWORD=${FIREFLY_POSTGRES_PASSWORD:-firefly_pass}
    volumes:
      - ${DOCKER_DATA}/firefly/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  firefly:
    image: fireflyiii/core:latest
    container_name: firefly
    hostname: firefly
    restart: unless-stopped
    depends_on:
      firefly-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # App settings
      - APP_ENV=production
      - APP_DEBUG=false
      # Generate with: php artisan key:generate --show
      - APP_KEY=${FIREFLY_APP_KEY}
      - APP_URL=https://firefly.${BASE_DOMAIN}
      # Trusted proxies (use * for all, or specific IP)
      - TRUSTED_PROXIES=**
      # Database
      - DB_CONNECTION=pgsql
      - DB_HOST=firefly-postgres
      - DB_PORT=5432
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${FIREFLY_POSTGRES_PASSWORD:-firefly_pass}
      # Default language and locale
      - DEFAULT_LANGUAGE=en_US
      - DEFAULT_LOCALE=equal
      # MAIL settings (optional)
      # - MAIL_MAILER=smtp
      # - MAIL_HOST=smtp.${BASE_DOMAIN}
      # - MAIL_PORT=587
      # - MAIL_FROM=firefly@${BASE_DOMAIN}
      # - MAIL_USERNAME=${SMTP_USERNAME}
      # - MAIL_PASSWORD=${SMTP_PASSWORD}
      # - MAIL_ENCRYPTION=tls
      # Authentication (optional LDAP/SSO)
      # - AUTHENTICATION_GUARD=remote_user_guard
      # - AUTHENTICATION_GUARD_HEADER=REMOTE_USER
      # Disable registration (set to false to allow new signups)
      - ALLOW_WEBHOOKS=false
      # Session driver (database recommended for production)
      - SESSION_DRIVER=database
      - CACHE_DRIVER=database
    volumes:
      - ${DOCKER_DATA}/firefly/upload:/var/www/html/storage/upload
      - ${DOCKER_DATA}/firefly/export:/var/www/html/storage/export
    ports:
      - ${PORT_FIREFLY:-${AUTO_PORT_FIREFLY}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Firefly III Data Importer - optional companion tool
  # firefly-importer:
