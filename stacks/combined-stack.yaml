# COMBINED STACK
# Generated by scripts/generate-stacks.py
# Categories: media
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/media/jellyfin/config:/config
    - ${DOCKER_DATA}/media/jellyfin/cache:/cache
    ports:
    - ${PORT_JELLYFIN:-8096}:8096
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/sonarr/config:/config
    ports:
    - ${PORT_SONARR:-8989}:8989
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/radarr/config:/config
    ports:
    - ${PORT_RADARR:-7878}:7878
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/media/jellyseerr/config:/app/config
    ports:
    - ${PORT_JELLYSEERR:-5055}:5055
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/prowlarr/config:/config
    ports:
    - ${PORT_PROWLARR:-9696}:9696
