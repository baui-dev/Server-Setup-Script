      # - GOTIFY_DEFAULTUSER_NAME=admin                        # Default admin username
      # - GOTIFY_DEFAULTUSER_PASS=admin                        # Default admin password
      # - GOTIFY_SERVER_KEEPALIVEPERIODSECONDS=0               # WebSocket keepalive interval

    volumes:
