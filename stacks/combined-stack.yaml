    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - ${DOCKER_DATA}/infisical/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d infisical"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    hostname: infisical-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    # Uncomment to require Redis auth (also update REDIS_URL above)
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/infisical/redis:/data
