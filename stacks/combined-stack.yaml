  # ── keycloak (services/server/auth/keycloak.yaml)
  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    hostname: keycloak-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_pass}
    volumes:
      - ${DOCKER_DATA}/keycloak/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    hostname: keycloak
    restart: unless-stopped
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    # Run in production mode (requires HTTPS or proxy headers)
    # Use 'start-dev' for development (no HTTPS required)
    command: start --optimized
    environment:
      - TZ=${TZ}
      # Admin credentials (change immediately after first login)
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      # Database
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_POSTGRES_PASSWORD:-keycloak_pass}
      # Hostname (required for production mode)
      - KC_HOSTNAME=auth.${BASE_DOMAIN}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      # HTTP settings
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      # Proxy mode: edge (reverse proxy handles TLS), reencrypt, passthrough
      - KC_PROXY=edge
      # Health and metrics endpoints
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      # Logging
      - KC_LOG_LEVEL=${KC_LOG_LEVEL:-INFO}
      # Caching (ispn = Infinispan, local = single node)
      - KC_CACHE=local
      # Theme (optional custom theme)
      # - KC_SPI_THEME_DEFAULT=keycloak
    volumes:
      - ${DOCKER_DATA}/keycloak/config:/opt/keycloak/conf
      # Optional: custom themes
      # - ${DOCKER_DATA}/keycloak/themes:/opt/keycloak/themes
      # Optional: custom providers/extensions
      # - ${DOCKER_DATA}/keycloak/providers:/opt/keycloak/providers
    ports:
      - ${PORT_KEYCLOAK:-${AUTO_PORT_KEYCLOAK}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_KEYCLOAK:-${AUTO_PORT_KEYCLOAK}}/admin
# 2. Login with KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
# 3. Create a new realm (do not use the master realm for apps)
# 4. Create clients for each application needing SSO
#
# For development (no reverse proxy), use:
#   command: start-dev
#   Remove KC_HOSTNAME, KC_PROXY, KC_HOSTNAME_STRICT settings
#
# Build optimized image for production:
#   docker build --build-arg KC_DB=postgres -t keycloak-custom .
# ============================================================

  # ── khoj (services/ai/khoj.yaml)

  # --- PostgreSQL with pgvector (required for vector similarity search) ---
  khoj-postgres:
    image: ankane/pgvector:latest      # PostgreSQL with pgvector extension for semantic search
    container_name: khoj-postgres
    hostname: khoj-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=khoj
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/khoj/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d khoj"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Redis (required for task queue and caching) ---
  khoj-redis:
    image: redis:7-alpine
    container_name: khoj-redis
    hostname: khoj-redis
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ${DOCKER_DATA}/khoj/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Khoj Server ---
  khoj:
    image: ghcr.io/khoj-ai/khoj:latest
    container_name: khoj
    hostname: khoj
    restart: unless-stopped
    depends_on:
      khoj-postgres:
        condition: service_healthy
      khoj-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}

      # --- Admin Account (created on first start) ---
      - KHOJ_ADMIN_EMAIL=${KHOJ_ADMIN_EMAIL:-admin@example.com}
      - KHOJ_ADMIN_PASSWORD=${KHOJ_ADMIN_PASSWORD:-changeme}
      # Django secret key - REQUIRED, generate with: openssl rand -hex 32
      - KHOJ_DJANGO_SECRET_KEY=${KHOJ_DJANGO_SECRET_KEY:-changeme_generate_with_openssl_rand_hex_32}

      # --- Database (PostgreSQL with pgvector) ---
      - POSTGRES_DB=khoj
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=khoj-postgres
      - POSTGRES_PORT=5432

      # --- Redis ---
      - KHOJ_REDIS_URL=redis://:${REDIS_PASSWORD}@khoj-redis:6379/0

      # --- LLM Providers (configure at least one) ---
      # Khoj will use these for AI chat and agent features
      # - OPENAI_API_KEY=              # OpenAI API key (gpt-4o, gpt-4-turbo, etc.)
      # - ANTHROPIC_API_KEY=           # Anthropic API key (claude-3-5-sonnet, etc.)
      # - GEMINI_API_KEY=              # Google Gemini API key
      # - MISTRAL_API_KEY=             # Mistral AI API key (mistral-large, etc.)
      # - COHERE_API_KEY=              # Cohere API key

      # --- Ollama / Local LLM ---
      # - OLLAMA_HOST=http://host.docker.internal:11434  # Ollama endpoint for local models

      # --- Search / Features ---
      # - KHOJ_TELEMETRY_DISABLED=true # Disable anonymous telemetry (recommended for self-hosted)
      - KHOJ_TELEMETRY_DISABLED=true
      # - KHOJ_DEBUG=false             # Enable Django debug mode (do NOT use in production)

      # --- Storage ---
      # - KHOJ_MODELS_DIR=/root/.khoj/models  # Directory to cache downloaded embedding models

      # --- Web Search (for web agent) ---
      # - SERPER_DEV_API_KEY=          # Serper.dev key for Google web search agent capability
      # - BING_SEARCH_V7_SUBSCRIPTION_KEY=  # Bing Search API key
      # - JINA_API_KEY=                # Jina.ai reader key (for URL content extraction)

    volumes:
      - ${DOCKER_DATA}/khoj/config:/root/.khoj    # Config files, model cache, uploaded files

    ports:
      - ${PORT_KHOJ}:42110             # WebUI + API

    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.khoj.rule=Host(`khoj.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.khoj.entrypoints=websecure"
    #   - "traefik.http.routers.khoj.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.khoj.loadbalancer.server.port=42110"

# networks:
#   proxy:
#     external: true

  # ── kodcloud (services/server/webos/kodcloud.yaml)
  kodcloud:
    image: kodcloud/kodcloud:latest
    container_name: kodcloud
    hostname: kodcloud
    restart: unless-stopped
