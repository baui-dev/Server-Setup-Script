# MEDIA STACK
# Generated by scripts/generate-stacks.py
# Services: jellyfin, sonarr
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/media/jellyfin/config:/config
    - ${DOCKER_DATA}/media/jellyfin/cache:/cache
    ports:
    - ${PORT_JELLYFIN:-8096}:8096
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/sonarr/config:/config
    ports:
    - ${PORT_SONARR:-8989}:8989
