# MEDIA STACK
# Generated by scripts/generate-stacks.py
# Services: jellyfin, sonarr, radarr, bazarr, jellyseerr, prowlarr, maintainerr, lidarr, slskd, piwigo
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/media/jellyfin/config:/config
    - ${DOCKER_DATA}/media/jellyfin/cache:/cache
    ports:
    - ${PORT_JELLYFIN:-8096}:8096
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/sonarr/config:/config
    ports:
    - ${PORT_SONARR:-8989}:8989
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/radarr/config:/config
    ports:
    - ${PORT_RADARR:-7878}:7878
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/bazarr/config:/config
    ports:
    - ${PORT_BAZARR:-6767}:6767
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/media/jellyseerr/config:/app/config
    ports:
    - ${PORT_JELLYSEERR:-5055}:5055
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/prowlarr/config:/config
    ports:
    - ${PORT_PROWLARR:-9696}:9696
  maintainerr:
    image: jorenn92/maintainerr:latest
    container_name: maintainerr
    hostname: maintainerr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/media/maintainerr/config:/opt/data
    ports:
    - ${PORT_MAINTAINERR:-6246}:6246
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/lidarr/config:/config
    ports:
    - ${PORT_LIDARR:-8686}:8686
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    hostname: slskd
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
    - ${DOCKER_DATA}/media/slskd/config:/app
    ports:
    - ${PORT_SLSKD:-5030}:5030
  piwigo:
    image: lscr.io/linuxserver/piwigo:latest
    container_name: piwigo
    hostname: piwigo
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/media/piwigo/config:/config
    ports:
    - ${PORT_PIWIGO:-8101}:80
