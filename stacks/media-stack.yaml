# MEDIA STACK
# Generated by scripts/generate-stacks.sh
# Services: agregarr aiostreams autobrr bazarr bitmagnet deej-ai dispatcharr flaresolverr flexget homehost immich-server jdownloader jellyfin jellyfin-vue jellyseerr jfa-go kyoo-back librespeed lidarr maintainerr mediacms mediamanager meelo-server mopidy music-assistant navidrome owntone owntone-server pangolin paperless papra piwigo profilarr prowlarr pulsarr pyload qbit-manage qbitrr qbittorrent radarr rdtclient recyclarr sabnzbd slskd sonarr stirling-pdf tdarr umami wizarr
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f media-stack.yaml up -d

services:
  # ── agregarr (services/media/movies-tv/agregarr.yaml)
  agregarr:
    image: agregarr/agregarr:latest
    container_name: agregarr
    hostname: agregarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Plex connection (configure via web UI after first start, or set here)
      # - PLEX_TOKEN=${AGREGARR_PLEX_TOKEN}          # Your Plex auth token
      # - PLEX_URL=${AGREGARR_PLEX_URL:-http://plex:32400}  # Plex server URL
    volumes:
      - ${DOCKER_DATA}/agregarr/config:/config          # Agregarr configuration and state
    ports:
      - ${PORT_AGREGARR:-${AUTO_PORT_AGREGARR}}:7171
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.agregarr.rule=Host(`agregarr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.agregarr.entrypoints=websecure"
    #   - "traefik.http.routers.agregarr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.agregarr.loadbalancer.server.port=7171"

# networks:
#   proxy:
#     external: true

  # ── aiostreams (services/media/movies-tv/aiostreams.yaml)
  aiostreams:
    image: ghcr.io/viren070/aiostreams:latest
    container_name: aiostreams
    restart: unless-stopped
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  # ── autobrr (services/media/automation/autobrr.yaml)
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    hostname: autobrr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/automation/autobrr/config:/config

    ports:
      - ${PORT_AUTOBRR:-${AUTO_PORT_AUTOBRR}}:7474

  # ── bazarr (services/media/movies-tv/bazarr/bazarr.yaml)
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/bazarr/config:/config
      # - /path/to/movies:/movies                              # Movies library (must match Radarr)
      # - /path/to/tvseries:/tv                                # TV library (must match Sonarr)

    ports:
      - ${PORT_BAZARR:-${AUTO_PORT_BAZARR}}:6767

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── bitmagnet (services/media/downloads/bitmagnet.yaml)
  bitmagnet-postgres:
    image: postgres:16-alpine
    container_name: bitmagnet-postgres
    hostname: bitmagnet-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=bitmagnet
      - POSTGRES_USER=bitmagnet
      - POSTGRES_PASSWORD=${BITMAGNET_POSTGRES_PASSWORD:-bitmagnet_pass}
      # Tuning for DHT indexer workload
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --data-checksums
    volumes:
      - ${DOCKER_DATA}/bitmagnet/postgres:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitmagnet -d bitmagnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  bitmagnet:
    image: bitmagnetio/bitmagnet:latest
    container_name: bitmagnet
    hostname: bitmagnet
    restart: unless-stopped
    depends_on:
      bitmagnet-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database
      - POSTGRES_HOST=bitmagnet-postgres
      - POSTGRES_NAME=bitmagnet
      - POSTGRES_USER=bitmagnet
      - POSTGRES_PASSWORD=${BITMAGNET_POSTGRES_PASSWORD:-bitmagnet_pass}
      # DHT crawler settings
      # Number of DHT nodes to crawl simultaneously
      - DHT_CRAWLER_MAX_OPEN_CONNECTIONS=4096
      # Disable classification to reduce resource usage (comment out to enable)
      # - CLASSIFIER_DISABLED=true
      # tmdb API key for media metadata enrichment (optional)
      # - TMDB_API_KEY=${TMDB_API_KEY}
      # Log level: debug, info, warn, error
      - LOG_LEVEL=${BITMAGNET_LOG_LEVEL:-info}
    volumes:
      - ${DOCKER_DATA}/bitmagnet/config:/root/.config/bitmagnet
    ports:
      # Web UI and API
      - ${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}:3333
      # DHT crawler port (BitTorrent DHT protocol)
      - ${PORT_BITMAGNET_TORRENT:-${AUTO_PORT_BITMAGNET_TORRENT}}:3334/tcp
      - ${PORT_BITMAGNET_TORRENT:-${AUTO_PORT_BITMAGNET_TORRENT}}:3334/udp
    command:
      - worker
      - run
      - --all
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Access:
#   Web UI:    http://your-server:${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}
#   GraphQL:   http://your-server:${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}/graphql
#   Torznab:   http://your-server:${PORT_BITMAGNET:-${AUTO_PORT_BITMAGNET}}/torznab (for Prowlarr/Sonarr)
#
# Prowlarr integration:
#   Add as Torznab indexer with URL: http://bitmagnet:3333/torznab
#
# Resource requirements:
#   The DHT crawler is network and DB intensive. Expect:
#   - High network traffic (DHT crawling)
#   - Large PostgreSQL database (grows continuously)
#   - Significant CPU for content classification
#   Reduce --max-open-connections to lower resource usage.
# ============================================================

  # ── deej-ai (services/media/music/deej-ai.yaml)
  deej-ai:
    image: teticio/deej-ai:latest
    container_name: deej-ai
    hostname: deej-ai
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Optional: Spotify integration for playlist export / library augmentation
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-}
      - SPOTIFY_USERNAME=${SPOTIFY_USERNAME:-}
    volumes:
      - ${DOCKER_DATA}/deej-ai/models:/models
      - ${DOCKER_DATA}/deej-ai/data:/data
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_DEEJ_AI}:5000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── dispatcharr (services/media/movies-tv/dispatcharr.yaml)
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    hostname: dispatcharr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - LOG_LEVEL=info                             # Logging verbosity: debug, info, warning, error
    volumes:
      - ${DOCKER_DATA}/dispatcharr/config:/config      # Configuration, database, EPG cache
    ports:
      - ${PORT_DISPATCHARR:-${AUTO_PORT_DISPATCHARR}}:9191
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.dispatcharr.rule=Host(`dispatcharr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.dispatcharr.entrypoints=websecure"
    #   - "traefik.http.routers.dispatcharr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.dispatcharr.loadbalancer.server.port=9191"

# networks:
#   proxy:
#     external: true

  # ── flaresolverr (services/media/utilities/flaresolverr.yaml)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      # - CAPTCHA_SOLVER=none # Select an external captcha solver if needed

    ports:
      - ${PORT_FLARESOLVERR:-${AUTO_PORT_FLARESOLVERR}}:8191

  # ── flexget (services/media/automation/flexget.yaml)
  flexget:
    image: wiserain/flexget:latest
    container_name: flexget
    hostname: flexget
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - FG_WEBUI_PASSWD=${FLEXGET_WEBUI_PASSWORD:-changeme}  # Web UI password (required)
      # - FG_LOG_LEVEL=info                      # Logging level: debug, info, warning, error, critical
      # - FG_LOG_FILE=/config/flexget.log        # Log file path inside container
    volumes:
      - ${DOCKER_DATA}/flexget/config:/config      # FlexGet config.yml and plugin data
      - ${DOWNLOADS_DIR}:/downloads              # Output directory for completed downloads
      - ${MOVIES_DIR}:/movies                    # Movie library (for post-processing move tasks)
      - ${TV_DIR}:/tv                            # TV show library (for post-processing move tasks)
    ports:
      - ${PORT_FLEXGET:-${AUTO_PORT_FLEXGET}}:5050               # Web UI (FlexGet built-in web server)
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── homehost (services/media/movies-tv/homehost.yaml)
  homehost:
    image: ghcr.io/home-host/homehost:latest
    container_name: homehost-cine
    hostname: homehost-cine
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - TMDB_API_KEY=${TMDB_API_KEY}           # TMDB API key for fetching metadata and posters
      # - BASE_URL=${HOMEHOST_BASE_URL}           # External URL for generating deep links
      # - ADMIN_PASSWORD=${HOMEHOST_ADMIN_PASS}  # Initial admin password
    volumes:
      - ${DOCKER_DATA}/homehost/config:/config     # HomeHost configuration and database
      - ${MOVIES_DIR}:/movies:ro                 # Movie library (read-only)
      - ${TV_DIR}:/tv:ro                         # TV show library (read-only)
    ports:
      - ${PORT_HOMEHOST:-${AUTO_PORT_HOMEHOST}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── immich-server (services/media/images/immich-server.yaml)
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    hostname: immich-server
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-db
      - DB_PORT=5432
      - DB_DATABASE_NAME=${IMMICH_DB_NAME:-immich}
      - DB_USERNAME=${IMMICH_DB_USER}
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PORT=6379
      - UPLOAD_LOCATION=/usr/src/app/upload
      - IMMICH_LOG_LEVEL=${IMMICH_LOG_LEVEL:-log}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${PORT_IMMICH}:2283
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    hostname: immich-machine-learning
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Uncomment to enable GPU acceleration (CUDA):
      # - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${DOCKER_DATA}/immich/model-cache:/cache
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # networks:
    #   - ${DEFAULT_NETWORK}

  immich-redis:
    image: redis:6.2-alpine
    container_name: immich-redis
    hostname: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  immich-db:
    # pgvecto.rs provides vector similarity search used by Immich for ML features.
    # See https://github.com/tensorchord/pgvecto.rs for details.
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-db
    hostname: immich-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${IMMICH_DB_USER}
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=${IMMICH_DB_NAME:-immich}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ${DOCKER_DATA}/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
        Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}"
        --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
        echo "checksum failure count is $$Chksum";
        [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_period: 5m
      start_interval: 30s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── jdownloader (services/media/downloads/jdownloader.yaml)
  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    hostname: jdownloader
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - USER_ID=${PUID}
      - GROUP_ID=${PGID}
      # - WEB_AUTHENTICATION=1 # Enable the built-in login page for the web UI

    volumes:
      - ${DOCKER_DATA}/media/downloads/jdownloader/config:/config
      - ${DOCKER_DATA}/media/downloads/jdownloader/downloads:/output

    ports:
      - ${PORT_JDOWNLOADER:-${AUTO_PORT_JDOWNLOADER}}:5800

  # ── jellyfin (services/media/movies-tv/jellyfin/jellyfin.yaml)
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions
      # - JELLYFIN_PublishedServerUrl=jellyfin.${BASE_DOMAIN}  # External URL for autodiscovery

    volumes:
      - ${DOCKER_DATA}/media/jellyfin/config:/config
      - ${DOCKER_DATA}/media/jellyfin/cache:/cache
      # - /path/to/media:/media                                # Media library (adjust path)
      # - /path/to/media2:/media2:ro                           # Additional library (read-only)

    ports:
      - ${PORT_JELLYFIN:-${AUTO_PORT_JELLYFIN}}:8096
      # - ${PORT_JELLYFIN_DLNA:-${AUTO_PORT_JELLYFIN_DLNA}}:1900/udp                 # DLNA discovery
      # - ${PORT_JELLYFIN_LAN:-${AUTO_PORT_JELLYFIN_LAN}}:7359/udp                  # LAN autodiscovery

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── jellyfin-vue (services/media/movies-tv/jellyfin-vue.yaml)
  jellyfin-vue:
    image: ghcr.io/jellyfin/jellyfin-vue:unstable
    container_name: jellyfin-vue
    hostname: jellyfin-vue
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # - DEFAULT_SERVERS=http://jellyfin:8096   # Optional: pre-configure the Jellyfin server URL
    ports:
      - ${PORT_JELLYFIN_VUE:-${AUTO_PORT_JELLYFIN_VUE}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── jellyseerr (services/media/movies-tv/jellyseerr/jellyseerr.yaml)
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    hostname: jellyseerr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - LOG_LEVEL=debug                                      # Log verbosity (debug, info, warn, error)

    volumes:
      - ${DOCKER_DATA}/media/jellyseerr/config:/app/config

    ports:
      - ${PORT_JELLYSEERR:-${AUTO_PORT_JELLYSEERR}}:5055

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── jfa-go (services/media/automation/jfa-go.yaml)
  jfa-go:
    image: hrfee/jfa-go:latest
    container_name: jfa-go
    hostname: jfa-go
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # jfa-go does not use PUID/PGID; it runs as the user defined in config
    volumes:
      - ${DOCKER_DATA}/jfa-go/config:/data         # jfa-go configuration, database, and email templates
      - ${DOCKER_DATA}/jellyfin/config:/jf:ro      # Jellyfin config directory (read-only, for local Jellyfin detection)
      # - /etc/localtime:/etc/localtime:ro       # Alternative timezone sync
    ports:
      - ${PORT_JFA_GO:-${AUTO_PORT_JFA_GO}}:8056
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── kyoo-back (services/media/automation/kyoo-back.yaml)
  kyoo-back:
    image: ghcr.io/zoriya/kyoo_back:edge
    container_name: kyoo-back
    hostname: kyoo-back
    restart: unless-stopped
    depends_on:
      kyoo-db:
        condition: service_healthy
      kyoo-search:
        condition: service_healthy
      kyoo-rabbit:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - KYOO_APIKEYS=${KYOO_APIKEYS:-changeme-apikey}            # Comma-separated API keys for internal service communication
      - POSTGRES_HOST=kyoo-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kyoo
      - POSTGRES_USER=kyoo
      - POSTGRES_PASSWORD=${KYOO_DB_PASSWORD:-kyoo_secure_pass}
      - MEILI_HOST=http://kyoo-search:7700
      - MEILI_MASTER_KEY=${KYOO_MEILI_KEY:-kyoo_meili_key}
      - RABBITMQ_HOST=kyoo-rabbit
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=kyoo
      - RABBITMQ_PASSWORD=${KYOO_RABBIT_PASSWORD:-kyoo_rabbit_pass}
    volumes:
      - ${MEDIA_DIR}:/media:ro                   # Full media directory (read-only)
      - ${MOVIES_DIR}:/movies:ro                 # Movie library (read-only)
      - ${TV_DIR}:/tv:ro                         # TV show library (read-only)
      - ${DOCKER_DATA}/kyoo/back:/metadata         # Kyoo backend metadata cache
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-front:
    image: ghcr.io/zoriya/kyoo_front:edge
    container_name: kyoo-front
    hostname: kyoo-front
    restart: unless-stopped
    depends_on:
      - kyoo-back
    environment:
      - TZ=${TZ}
      - KYOO_URL=http://kyoo-back:5000           # Internal backend API URL
    ports:
      - ${PORT_KYOO:-${AUTO_PORT_KYOO}}:8901
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-transcoder:
    image: ghcr.io/zoriya/kyoo_transcoder:edge
    container_name: kyoo-transcoder
    hostname: kyoo-transcoder
    restart: unless-stopped
    depends_on:
      - kyoo-back
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=kyoo-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kyoo
      - POSTGRES_USER=kyoo
      - POSTGRES_PASSWORD=${KYOO_DB_PASSWORD:-kyoo_secure_pass}
      - GOCODER_PREFIX=/video
      - GOCODER_SAFE_PATH=/media                 # Must match the /media volume mount
    volumes:
      - ${MEDIA_DIR}:/media:ro                   # Full media directory (read-only)
      - ${MOVIES_DIR}:/movies:ro                 # Movie library (read-only)
      - ${TV_DIR}:/tv:ro                         # TV show library (read-only)
      - ${DOCKER_DATA}/kyoo/transcoder:/cache      # Transcoding cache directory
    # Optional: GPU passthrough for hardware transcoding
    # devices:
    #   - /dev/dri:/dev/dri                      # Intel/AMD VA-API GPU
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-db:
    image: postgres:16-alpine
    container_name: kyoo-db
    hostname: kyoo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kyoo
      - POSTGRES_USER=kyoo
      - POSTGRES_PASSWORD=${KYOO_DB_PASSWORD:-kyoo_secure_pass}
    volumes:
      - ${DOCKER_DATA}/kyoo/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyoo -d kyoo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-search:
    image: getmeili/meilisearch:v1.7
    container_name: kyoo-search
    hostname: kyoo-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${KYOO_MEILI_KEY:-kyoo_meili_key}
      - MEILI_ENV=production
    volumes:
      - ${DOCKER_DATA}/kyoo/search:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health | grep -q 'available'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  kyoo-rabbit:
    image: rabbitmq:3-alpine
    container_name: kyoo-rabbit
    hostname: kyoo-rabbit
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=kyoo
      - RABBITMQ_DEFAULT_PASS=${KYOO_RABBIT_PASSWORD:-kyoo_rabbit_pass}
    volumes:
      - ${DOCKER_DATA}/kyoo/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── librespeed (services/media/downloads/librespeed.yaml)
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    container_name: librespeed
    hostname: librespeed
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Mode: standalone (no DB), backend (with DB for telemetry)
      - MODE=standalone
      # Telemetry - log test results to a database
      # - TELEMETRY=true
      # Database for telemetry (comment out if MODE=standalone)
      # - DB_TYPE=sqlite   # sqlite, mysql, postgresql
      # - DB_NAME=/config/database.sql
      # For MySQL/PostgreSQL:
      # - DB_HOSTNAME=librespeed-db
      # - DB_USERNAME=librespeed
      # - DB_PASSWORD=${LIBRESPEED_DB_PASSWORD:-librespeed_pass}
      # Password to protect the statistics page (optional)
      # - STATS_PASSWORD=${LIBRESPEED_STATS_PASSWORD}
      # Custom title for the speed test page
      # - TITLE=My Speed Test Server
      # Disable chunk (default: false)
      # - DISABLE_IPINFO=true
      # IPINFO API key for IP lookup (optional)
      # - IPINFO_APIKEY=${IPINFO_API_KEY}
    volumes:
      - ${DOCKER_DATA}/librespeed/config:/config
    ports:
      - ${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Access:
#   http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}
#
# Telemetry (optional test history):
#   Set TELEMETRY=true and configure a database
#   View results at: http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}/results/telemetry.php
#   (Requires STATS_PASSWORD if set)
#
# API testing (headless):
#   curl http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}/backend/empty.php
#   Use the LibreSpeed CLI: https://github.com/librespeed/speedtest-cli
#   ./librespeed-cli --server http://your-server:${PORT_LIBRESPEED:-${AUTO_PORT_LIBRESPEED}}
#
# Multiple servers (edit /config/servers.json):
#   Add multiple server entries for regional testing
# ============================================================

  # ── lidarr (services/media/music/lidarr/lidarr.yaml)
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask

    volumes:
      - ${DOCKER_DATA}/media/lidarr/config:/config
      # - /path/to/music:/music                                # Music library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_LIDARR:-${AUTO_PORT_LIDARR}}:8686

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── maintainerr (services/media/movies-tv/maintainerr/maintainerr.yaml)
  maintainerr:
    image: jorenn92/maintainerr:latest
    container_name: maintainerr
    hostname: maintainerr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/media/maintainerr/config:/opt/data

    ports:
      - ${PORT_MAINTAINERR:-${AUTO_PORT_MAINTAINERR}}:6246

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── mediacms (services/media/automation/mediacms.yaml)
  mediacms:
    image: mediacms/mediacms:latest
    container_name: mediacms
    hostname: mediacms
    restart: unless-stopped
    depends_on:
      mediacms-db:
        condition: service_healthy
      mediacms-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=mediacms-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mediacms
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=${MEDIACMS_DB_PASSWORD:-mediacms_secure_pass}
      - REDIS_LOCATION=redis://mediacms-redis:6379/0
      - SECRET_KEY=${MEDIACMS_SECRET_KEY:-changeme-very-long-secret-key}  # Django secret key
      - ALLOWED_HOSTS=${MEDIACMS_ALLOWED_HOSTS:-*}                         # Allowed hostnames (comma-separated)
      - FRONTEND_HOST=${MEDIACMS_BASE_URL:-http://localhost}               # Public-facing URL
      - DEBUG=false
      # - ADMIN_USER=${MEDIACMS_ADMIN_USER:-admin}
      # - ADMIN_EMAIL=${MEDIACMS_ADMIN_EMAIL:-admin@localhost}
      # - ADMIN_PASSWORD=${MEDIACMS_ADMIN_PASSWORD:-changeme}
    volumes:
      - ${DOCKER_DATA}/mediacms/media:/home/mediacms.io/mediacms/media_files  # Uploaded media files
      - ${DOCKER_DATA}/mediacms/logs:/home/mediacms.io/mediacms/logs          # Application logs
    ports:
      - ${PORT_MEDIACMS:-${AUTO_PORT_MEDIACMS}}:80                  # HTTP web interface (nginx)
    # networks:
    #   - ${DEFAULT_NETWORK}

  mediacms-worker:
    image: mediacms/mediacms:latest
    container_name: mediacms-worker
    hostname: mediacms-worker
    restart: unless-stopped
    depends_on:
      mediacms-db:
        condition: service_healthy
      mediacms-redis:
        condition: service_healthy
    command: celery -A cms worker --loglevel=info -Q celery
    environment:
      - TZ=${TZ}
      - POSTGRES_HOST=mediacms-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mediacms
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=${MEDIACMS_DB_PASSWORD:-mediacms_secure_pass}
      - REDIS_LOCATION=redis://mediacms-redis:6379/0
      - SECRET_KEY=${MEDIACMS_SECRET_KEY:-changeme-very-long-secret-key}
    volumes:
      - ${DOCKER_DATA}/mediacms/media:/home/mediacms.io/mediacms/media_files  # Shared media storage
      - ${DOCKER_DATA}/mediacms/logs:/home/mediacms.io/mediacms/logs
    # networks:
    #   - ${DEFAULT_NETWORK}

  mediacms-db:
    image: postgres:15-alpine
    container_name: mediacms-db
    hostname: mediacms-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mediacms
      - POSTGRES_USER=mediacms
      - POSTGRES_PASSWORD=${MEDIACMS_DB_PASSWORD:-mediacms_secure_pass}
    volumes:
      - ${DOCKER_DATA}/mediacms/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediacms -d mediacms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # networks:
    #   - ${DEFAULT_NETWORK}

  mediacms-redis:
    image: redis:7-alpine
    container_name: mediacms-redis
    hostname: mediacms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${DOCKER_DATA}/mediacms/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── mediamanager (services/media/automation/mediamanager.yaml)
  mediamanager:
    image: ghcr.io/maxdorninger/mediamanager:latest
    container_name: mediamanager
    hostname: mediamanager
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - DATABASE_URL=sqlite:///config/mediamanager.db  # Database connection string
      # - SECRET_KEY=${MEDIAMANAGER_SECRET_KEY}          # Application secret key
      # - TMDB_API_KEY=${TMDB_API_KEY}                  # The Movie Database API key for metadata
      # - BASE_URL=${MEDIAMANAGER_BASE_URL}             # Public-facing URL for the application
    volumes:
      - ${DOCKER_DATA}/mediamanager/config:/config  # Application configuration and database
      - ${MOVIES_DIR}:/movies                     # Movie library path
      - ${TV_DIR}:/tv                             # TV show library path
      - ${MEDIA_DIR}:/media                       # Full media directory
    ports:
      - ${PORT_MEDIAMANAGER:-${AUTO_PORT_MEDIAMANAGER}}:8082
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── meelo-server (services/media/music/meelo-server.yaml)
  meelo-server:
    image: ghcr.io/arthi-chaud/meelo-server:latest
    container_name: meelo-server
    hostname: meelo-server
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@meelo-db:5432/meelo
      - MEILISEARCH_URL=http://meelo-search:7700
      - MEILISEARCH_KEY=${MEELO_MEILISEARCH_KEY:-masterKey}
    volumes:
      - ${DOCKER_DATA}/meelo/server:/data
      - ${MUSIC_DIR}:/music:ro
    depends_on:
      meelo-db:
        condition: service_healthy
      meelo-search:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  meelo-front:
    image: ghcr.io/arthi-chaud/meelo-front:latest
    container_name: meelo-front
    hostname: meelo-front
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - API_URL=http://meelo-server:4000
    ports:
      - ${PORT_MEELO}:3000
    depends_on:
      - meelo-server
    # networks:
    #   - ${DEFAULT_NETWORK}

  meelo-db:
    image: postgres:16-alpine
    container_name: meelo-db
    hostname: meelo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meelo
    volumes:
      - ${DOCKER_DATA}/meelo/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d meelo"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  meelo-search:
    image: getmeili/meilisearch:latest
    container_name: meelo-search
    hostname: meelo-search
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEELO_MEILISEARCH_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ${DOCKER_DATA}/meelo/search:/meili_data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── mopidy (services/media/music/mopidy.yaml)
  mopidy:
    image: ghcr.io/mopidy/mopidy:latest
    container_name: mopidy
    hostname: mopidy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/mopidy/config:/etc/mopidy
      - ${DOCKER_DATA}/mopidy/data:/var/lib/mopidy
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_MOPIDY}:6680        # HTTP frontend / Iris web UI
      - ${PORT_MOPIDY_MPD:-${AUTO_PORT_MOPIDY_MPD}}:6600  # MPD protocol port
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── music-assistant (services/media/music/music-assistant.yaml)
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    hostname: music-assistant
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${MA_LOG_LEVEL:-info}
    volumes:
      - ${DOCKER_DATA}/music-assistant/data:/data
      - ${MUSIC_DIR}:/music:ro
    # ports are not used with network_mode: host; access on http://<host>:8095

# networks:
#   proxy:
#     external: true

  # ── navidrome (services/media/music/navidrome.yaml)
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    hostname: navidrome
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - ND_MUSICFOLDER=${ND_MUSICFOLDER:-/music}
      - ND_DATAFOLDER=/data
      - ND_LOGLEVEL=${ND_LOGLEVEL:-info}
      - ND_SESSIONTIMEOUT=${ND_SESSIONTIMEOUT:-24h}
      - ND_BASEURL=${ND_BASEURL:-}
      - ND_ENABLETRANSCODINGCONFIG=${ND_ENABLETRANSCODINGCONFIG:-false}
      - ND_TRANSCODINGCACHEFOLDER=/data/cache/transcoding
      - ND_IMAGECACHEFOLDER=/data/cache/images
    volumes:
      - ${DOCKER_DATA}/navidrome/data:/data
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_NAVIDROME}:4533
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── owntone (services/media/music/owntone.yaml)
  owntone:
    image: owntone/owntone:latest
    container_name: owntone
    hostname: owntone
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/owntone/config:/etc/owntone
      - ${DOCKER_DATA}/owntone/data:/var/cache/owntone
      - ${MUSIC_DIR}:/music:ro
    ports:
      - ${PORT_OWNTONE}:3689      # DAAP / web UI
      - ${PORT_OWNTONE_MPD:-${AUTO_PORT_OWNTONE_MPD}}:6600  # MPD protocol (enable in owntone.conf)
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── owntone-server (services/media/music/owntone-server.yaml)
  owntone-server:
    image: owntone/owntone:latest
    container_name: owntone-server
    hostname: owntone-server
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/owntone-server/config:/etc/owntone
      - ${DOCKER_DATA}/owntone-server/data:/var/cache/owntone
      - ${MUSIC_DIR}:/music:ro
    # With host networking, ports are bound directly on the host:
    # 3689/tcp  - DAAP (iTunes library sharing) and web UI
    # 3688/tcp  - RSP
    # 3689/udp  - mDNS advertisement
    # 6600/tcp  - MPD protocol (if enabled in config)

# networks:
#   proxy:
#     external: true

  # ── pangolin (services/media/images/pangolin.yaml)
  pangolin:
    image: fosrl/pangolin:latest
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./config:/app/config
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
#      interval: "3s"
#      timeout: "3s"
#      retries: 15

  gerbil:
    image: fosrl/gerbil:latest
    container_name: gerbil
    restart: unless-stopped
#    depends_on:
#      pangolin:
#        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3003
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/gerbil/get-config
      - --reportBandwidthTo=http://pangolin:3001/api/v1/gerbil/receive-bandwidth
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 4434:443 # Port for traefik because of the network_mode
      - 8088:80 # Port for traefik because of the network_mode

  traefik:
    image: traefik:v3.4.0
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
#    depends_on:
#      pangolin:
#        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro # Volume to store the Traefik configuration
      - ./config/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates


  # ── paperless (services/media/documents/paperless.yaml)
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    hostname: paperless
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - USERMAP_UID=${PUID}
      - USERMAP_GID=${PGID}
      # Database
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBPORT=5432
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=${POSTGRES_USER}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
      # Redis / task queue
      - PAPERLESS_REDIS=redis://:${REDIS_PASSWORD}@paperless-redis:6379
      # Application
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_TIME_ZONE=${TZ}
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE:-eng}
      # Admin bootstrap (only used on first run)
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      # Optional tuning
      - PAPERLESS_WORKER_TIMEOUT=${PAPERLESS_WORKER_TIMEOUT:-1800}
      - PAPERLESS_TASK_WORKERS=${PAPERLESS_TASK_WORKERS:-2}
    volumes:
      - ${DOCKER_DATA}/paperless/data:/usr/src/paperless/data
      - ${DOCKER_DATA}/paperless/media:/usr/src/paperless/media
      - ${DOCKER_DATA}/paperless/export:/usr/src/paperless/export
      - ${DOCKER_DATA}/paperless/consume:/usr/src/paperless/consume
    ports:
      - ${PORT_PAPERLESS}:8000
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-db:
    image: postgres:16-alpine
    container_name: paperless-db
    hostname: paperless-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=paperless
    volumes:
      - ${DOCKER_DATA}/paperless/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    hostname: paperless-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/paperless/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── papra (services/media/documents/papra.yaml)
  papra:
    image: ghcr.io/papra-hq/papra:latest
    container_name: papra
    hostname: papra
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PAPRA_CLIENT_BASE_URL=${PAPRA_URL:-http://localhost:${PORT_PAPRA}}
      # SQLite database path (default, no external DB needed)
      - PAPRA_DB_URL=file:/app/server/db/papra.db
      # Set to true to enable registration for new users
      - PAPRA_REGISTRATION_ALLOWED=${PAPRA_REGISTRATION_ALLOWED:-false}
    volumes:
      - ${DOCKER_DATA}/papra/db:/app/server/db
      - ${DOCKER_DATA}/papra/documents:/app/server/documents
    ports:
      - ${PORT_PAPRA}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── piwigo (services/media/images/piwigo/piwigo.yaml)
  piwigo:
    image: lscr.io/linuxserver/piwigo:latest
    container_name: piwigo
    hostname: piwigo
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/piwigo/config:/config
      # - /path/to/gallery:/gallery                            # Photo gallery storage

    ports:
      - ${PORT_PIWIGO:-${AUTO_PORT_PIWIGO}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── profilarr (services/media/movies-tv/profilarr.yaml)
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    hostname: profilarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Auth mode: on (require login) | local (local users only) | off (no auth) | oidc
      - AUTH=${PROFILARR_AUTH:-on}
      # - LOG_LEVEL=info                             # Logging verbosity: debug, info, warning, error
      # Optional: parser sidecar (for advanced format testing)
      # Deploy alongside: ghcr.io/dictionarry-hub/profilarr-parser:latest
    volumes:
      - ${DOCKER_DATA}/profilarr/config:/config        # Profilarr configuration and sync state
    ports:
      - ${PORT_PROFILARR:-${AUTO_PORT_PROFILARR}}:6868
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.profilarr.rule=Host(`profilarr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.profilarr.entrypoints=websecure"
    #   - "traefik.http.routers.profilarr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.profilarr.loadbalancer.server.port=6868"

# networks:
#   proxy:
#     external: true

  # ── prowlarr (services/media/movies-tv/prowlarr/prowlarr.yaml)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/prowlarr/config:/config

    ports:
      - ${PORT_PROWLARR:-${AUTO_PORT_PROWLARR}}:9696

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── pulsarr (services/media/automation/pulsarr.yaml)
  pulsarr:
    image: lakker/pulsarr:latest
    # image: lakker/pulsarr:node  # ARM / Linux kernel < 4.11 alternative
    container_name: pulsarr
    hostname: pulsarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Primary config is done via web UI after first start.
      # Optional env vars (can also be set in the UI):
      # - PLEX_TOKEN=${AGREGARR_PLEX_TOKEN}          # Plex authentication token
      # - PLEX_URL=http://plex:32400                 # Plex server URL
      # - SONARR_URL=http://sonarr:8989              # Sonarr instance URL
      # - SONARR_API_KEY=${SONARR_API_KEY}           # Sonarr API key
      # - RADARR_URL=http://radarr:7878              # Radarr instance URL
      # - RADARR_API_KEY=${RADARR_API_KEY}           # Radarr API key
      # - LOG_LEVEL=info                             # Logging verbosity
    volumes:
      - ${DOCKER_DATA}/pulsarr/config:/config          # Pulsarr configuration and state database
    ports:
      - ${PORT_PULSARR:-${AUTO_PORT_PULSARR}}:3003
    # networks:
    #   - ${DEFAULT_NETWORK}

    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.pulsarr.rule=Host(`pulsarr.${BASE_DOMAIN}`)"
    #   - "traefik.http.routers.pulsarr.entrypoints=websecure"
    #   - "traefik.http.routers.pulsarr.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.pulsarr.loadbalancer.server.port=3003"

# networks:
#   proxy:
#     external: true

  # ── pyload (services/media/downloads/pyload.yaml)
  pyload:
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: pyload
    hostname: pyload
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/downloads/pyload/config:/config
      - ${DOCKER_DATA}/media/downloads/pyload/downloads:/downloads

    ports:
      - ${PORT_PYLOAD:-${AUTO_PORT_PYLOAD}}:8000
      - ${PORT_PYLOAD_CLICKNLOAD:-${AUTO_PORT_PYLOAD_CLICKNLOAD}}:9666

  # ── qbit-manage (services/media/downloads/qbit-manage.yaml)
  qbit-manage:
    image: bobokun/qbit_manage:latest
    container_name: qbit-manage
    hostname: qbit-manage
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Run schedule (cron format, or integer for minutes between runs)
      - QBT_RUN=false           # Set to true to run once and exit
      - QBT_SCHEDULE=1440       # Run every 1440 minutes (24h). Use cron: "0 */6 * * *"
      - QBT_CONFIG=/config/config.yml
      # Logging verbosity (DEBUG, INFO, WARNING, ERROR)
      - QBT_LOG_LEVEL=${QBITMANAGE_LOG_LEVEL:-INFO}
      # Maximum log files to keep
      - QBT_MAX_LOG_FILES=10
    volumes:
      - ${DOCKER_DATA}/qbit-manage/config:/config
      # Must match the download paths used inside qBittorrent
      - ${DOWNLOADS_DIR:-/downloads}:/downloads
      # If qBittorrent runs on the same host, can map its config for reading
      # - ${DOCKER_DATA}/qbittorrent/config:/qbittorrent-config:ro
    # qbit-manage connects to qBittorrent API over the network, no ports needed
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# REQUIRED: Create ${DOCKER_DATA}/qbit-manage/config/config.yml
# Full config reference: https://github.com/StuffAnThings/qbit_manage/wiki/Config-Setup
# ============================================================
# qbt:
#   host: qbittorrent             # qBittorrent hostname or IP
#   port: 8085
#   user: ${QBITTORRENT_USERNAME:-admin}
#   pass: ${QBITTORRENT_PASSWORD}
#
# settings:
#   force_auto_tmm: false         # Auto-assign category based on save path
#   tracker_error_tag: issue      # Tag for torrents with tracker errors
#   nohardlinks_tag: noHL         # Tag for torrents with no hardlinks
#   share_limits_tag: QL          # Tag prefix for share limit groups
#   # Remove orphaned files not linked to any torrent
#   orphaned_exclude_patterns:
#     - "**/.DS_Store"
#     - "**/Thumbs.db"
#
# directory:
#   root_dir: /downloads/         # Root download directory
#   # Category-specific subdirectories
#
# cat:                            # Category definitions
#   movies:
#     save_path: /downloads/movies
#   tv:
#     save_path: /downloads/tv
#   music:
#     save_path: /downloads/music
#
# tracker:                        # Tracker-based tagging
#   # nyaa.si:
#   #   tag: Nyaa
#   # tracker.alpharatio.club:
#   #   tag: AlphaRatio
#
# share_limits:
#   # Remove/tag torrents after reaching share limits
#   noHL:
#     priority: 1
#     min_seeding_time: 0
#     max_ratio: 2.0
#     max_seeding_time: 129600
#     cleanup: false
# ============================================================

  # ── qbitrr (services/media/downloads/qbitrr.yaml)
  qbitrr:
    image: feramance/qbitrr:latest
    container_name: qbitrr
    hostname: qbitrr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/qbitrr/config:/config
      # Must match the download paths used in qBittorrent, Sonarr, and Radarr
      - ${DOWNLOADS_DIR:-/downloads}:/downloads
    # qBitrr connects to qBittorrent/Sonarr/Radarr over the network
    # No ports exposed by this service itself
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# REQUIRED: Create ${DOCKER_DATA}/qbitrr/config/config.toml
# Full config reference: https://github.com/Feramance/qBitrr/wiki/Configuration
# ============================================================
# [qBittorrent]
# host = "qbittorrent"
# port = 8085
# username = "${QBITTORRENT_USERNAME:-admin}"
# password = "${QBITTORRENT_PASSWORD}"
# # Category for downloads managed by qBitrr
# managed_categories = ["tv-sonarr", "radarr"]
#
# [Settings]
# # How often to check for stalled/failed downloads (seconds)
# loop_sleep_timer = 5
# # Number of seconds before a torrent is considered stalled
# stalled_time = 1800
# # Remove torrents with no seeds
# failed_removal_timer = 30
# # Re-search failed items
# auto_search_enabled = true
# # Log level: CRITICAL, ERROR, WARNING, INFO, DEBUG, TRACE
# log_level = "INFO"
#
# [[Radarr]]
# # Name (used for logging)
# name = "Radarr"
# host = "radarr"
# port = 7878
# api_key = "${RADARR_API_KEY}"
# # Category assigned to Radarr downloads in qBittorrent
# category = "radarr"
#
# [[Sonarr]]
# name = "Sonarr"
# host = "sonarr"
# port = 8989
# api_key = "${SONARR_API_KEY}"
# category = "tv-sonarr"
# # Profile for anime (optional)
# # anime_category = "anime-sonarr"
# ============================================================

  # ── qbittorrent (services/media/downloads/qbittorrent.yaml)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8085
      # - TORRENTING_PORT=${PORT_QBITTORRENT_TORRENT:-${AUTO_PORT_QBITTORRENT_TORRENT}} # Incoming BitTorrent port

    volumes:
      - ${DOCKER_DATA}/media/downloads/qbittorrent/config:/config
      - ${DOCKER_DATA}/media/downloads/qbittorrent/downloads:/downloads

    ports:
      - ${PORT_QBITTORRENT:-${AUTO_PORT_QBITTORRENT}}:8085
      - ${PORT_QBITTORRENT_TORRENT:-${AUTO_PORT_QBITTORRENT_TORRENT}}:6881
      - ${PORT_QBITTORRENT_TORRENT:-${AUTO_PORT_QBITTORRENT_TORRENT}}:6881/udp

  # ── radarr (services/media/movies-tv/radarr/radarr.yaml)
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask
      # - DOCKER_MODS=linuxserver/mods:radarr-striptracks      # Strip extra audio tracks mod

    volumes:
      - ${DOCKER_DATA}/media/radarr/config:/config
      # - /path/to/movies:/movies                              # Movies library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_RADARR:-${AUTO_PORT_RADARR}}:7878

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── rdtclient (services/media/downloads/rdtclient.yaml)
  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    hostname: rdtclient
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # PUID/PGID for file ownership
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      # Application config and database (SQLite)
      - ${DOCKER_DATA}/rdtclient/config:/data/db
      # Download directory - must match the path used by Sonarr/Radarr
      - ${DOWNLOADS_DIR:-/downloads}:/data/downloads
    ports:
      # Web UI and fake qBittorrent API endpoint
      - ${PORT_RDTCLIENT:-${AUTO_PORT_RDTCLIENT}}:6500
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Access:
#   http://your-server:${PORT_RDTCLIENT:-${AUTO_PORT_RDTCLIENT}}
#   Default login: admin / admin (change immediately)
#
# First-time setup:
# 1. Access the web UI and login
# 2. Go to Settings -> Providers
# 3. Select your provider (Real-Debrid, AllDebrid, etc.)
# 4. Enter your provider API key:
#    - Real-Debrid: https://real-debrid.com/apitoken
#    - AllDebrid: https://alldebrid.com/apikeys
# 5. Go to Settings -> Download Client
#    - Set download location to: /data/downloads
#    - Configure concurrent download limits
# 6. Configure Sonarr/Radarr to use rdtclient as their qBittorrent:
#    Settings -> Download Clients -> qBittorrent:
#    - Host: rdtclient (or server IP)
#    - Port: 6500
#    - Category: tv (for Sonarr) / movies (for Radarr)
#    - Username/Password: (set in rdtclient settings)
#
# Prowlarr integration:
#   Add indexers to Prowlarr normally - rdtclient handles the download
#   via Real-Debrid after Sonarr/Radarr grabs the torrent.
# ============================================================

  # ── recyclarr (services/media/automation/recyclarr.yaml)
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    hostname: recyclarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - CRON_SCHEDULE=@daily # Override the default sync schedule

    volumes:
      - ${DOCKER_DATA}/media/automation/recyclarr/config:/config

  # ── sabnzbd (services/media/downloads/sabnzbd.yaml)
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    hostname: sabnzbd
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/media/downloads/sabnzbd/config:/config
      - ${DOCKER_DATA}/media/downloads/sabnzbd/downloads:/downloads
      - ${DOCKER_DATA}/media/downloads/sabnzbd/incomplete:/incomplete-downloads

    ports:
      - ${PORT_SABNZBD:-${AUTO_PORT_SABNZBD}}:8080

  # ── slskd (services/media/music/slskd/slskd.yaml)
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    hostname: slskd
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SLSKD_REMOTE_CONFIGURATION=true                        # Enable remote config via Web UI
      # - SLSKD_USERNAME=slskd                                 # Soulseek username
      # - SLSKD_PASSWORD=slskd                                 # Soulseek password
      # - SLSKD_SLSK_LISTEN_PORT=50300                         # Soulseek listen port

    volumes:
      - ${DOCKER_DATA}/media/slskd/config:/app
      # - /path/to/music:/music                                # Shared music directory
      # - /path/to/downloads:/downloads                        # Downloads directory

    ports:
      - ${PORT_SLSKD:-${AUTO_PORT_SLSKD}}:5030
      # - ${PORT_SLSKD_HTTPS:-${AUTO_PORT_SLSKD_HTTPS}}:5031                       # HTTPS port
      # - 50300:50300                                          # Soulseek listen port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── sonarr (services/media/movies-tv/sonarr/sonarr.yaml)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - UMASK=002                                            # File permissions mask
      # - DOCKER_MODS=linuxserver/mods:sonarr-striptracks      # Strip extra audio tracks mod

    volumes:
      - ${DOCKER_DATA}/media/sonarr/config:/config
      # - /path/to/tvseries:/tv                                # TV series library
      # - /path/to/downloads:/downloads                        # Download client output

    ports:
      - ${PORT_SONARR:-${AUTO_PORT_SONARR}}:8989

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── stirling-pdf (services/media/documents/stirling-pdf.yaml)
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    hostname: stirling-pdf
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Set to true and configure settings.yml to enable authentication
      - DOCKER_ENABLE_SECURITY=${STIRLING_ENABLE_SECURITY:-false}
      # Set to true to install Calibre for ebook conversion (larger image)
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=${STIRLING_INSTALL_CALIBRE:-false}
      # Comma-separated locale codes for OCR language packs to install
      - LANGS=${STIRLING_LANGS:-en_GB}
    volumes:
      - ${DOCKER_DATA}/stirling-pdf/configs:/configs
      - ${DOCKER_DATA}/stirling-pdf/customFiles:/customFiles
      - ${DOCKER_DATA}/stirling-pdf/logs:/logs
      - ${DOCKER_DATA}/stirling-pdf/pipeline/watchedFolders:/pipeline/watchedFolders
      - ${DOCKER_DATA}/stirling-pdf/pipeline/finishedFolders:/pipeline/finishedFolders
    ports:
      - ${PORT_STIRLING}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── tdarr (services/media/movies-tv/tdarr.yaml)
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    hostname: tdarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - umask=002
      - serverIP=0.0.0.0                         # IP for the Tdarr server to bind to
      - serverPort=8266                          # Node communication port
      - webUIPort=8265                           # Web UI port
      - internalNode=true                        # Run a built-in transcoding node alongside the server
      - internalNodeIP=0.0.0.0
      - nodeName=${TDARR_NODE_ID:-InternalNode}  # Display name for the built-in node
      # - NVIDIA_DRIVER_CAPABILITIES=all         # Uncomment for NVIDIA GPU transcoding
      # - NVIDIA_VISIBLE_DEVICES=all             # Uncomment for NVIDIA GPU transcoding
    volumes:
      - ${DOCKER_DATA}/tdarr/server:/app/server    # Tdarr server data and database
      - ${DOCKER_DATA}/tdarr/configs:/app/configs  # Plugin and transcoding configurations
      - ${DOCKER_DATA}/tdarr/logs:/app/logs        # Application logs
      - ${MOVIES_DIR}:/media/movies              # Movie library
      - ${TV_DIR}:/media/tv                      # TV show library
      - ${DOCKER_DATA}/tdarr/transcode:/temp       # Temporary transcoding workspace
    ports:
      - ${PORT_TDARR:-${AUTO_PORT_TDARR}}:8265                 # Web UI
      - ${PORT_TDARR_NODE:-${AUTO_PORT_TDARR_NODE}}:8266            # Node communication API
    # Optional: NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Tdarr External Node - add additional nodes for distributed transcoding
  # Each node should have a unique nodeName and can have dedicated GPU resources
  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node
    hostname: tdarr-node
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - umask=002
      - nodeName=${TDARR_NODE_ID:-ExternalNode01} # Unique name for this node in the cluster
      - serverIP=${TDARR_SERVER_IP:-tdarr}         # Tdarr server hostname or IP
      - serverPort=8266                            # Must match the server's serverPort
      # - NVIDIA_DRIVER_CAPABILITIES=all           # Uncomment for NVIDIA GPU transcoding
      # - NVIDIA_VISIBLE_DEVICES=all               # Uncomment for NVIDIA GPU transcoding
    volumes:
      - ${DOCKER_DATA}/tdarr/configs:/app/configs    # Shared configurations (must match server)
      - ${DOCKER_DATA}/tdarr/logs:/app/logs
      - ${MOVIES_DIR}:/media/movies                # Must match server paths exactly
      - ${TV_DIR}:/media/tv
      - ${DOCKER_DATA}/tdarr/transcode:/temp         # Temporary transcoding workspace
    # No ports - node communicates back to server on serverPort
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── umami (services/media/music/umami.yaml)
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    hostname: umami
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-changeme-replace-with-long-random-secret}
    ports:
      - ${PORT_UMAMI:-${AUTO_PORT_UMAMI}}:3000
    depends_on:
      umami-db:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    hostname: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=umami
    volumes:
      - ${DOCKER_DATA}/umami/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── wizarr (services/media/automation/wizarr.yaml)
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    hostname: wizarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - APP_URL=${WIZARR_APP_URL:-http://localhost:5690}  # Public-facing URL (used in invitation links)
      # - DISABLE_BUILTIN_AUTH=false             # Set to true if using an external SSO/auth proxy
    volumes:
      - ${DOCKER_DATA}/wizarr/database:/data/database  # SQLite database and application data
    ports:
      - ${PORT_WIZARR:-${AUTO_PORT_WIZARR}}:5690
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true


