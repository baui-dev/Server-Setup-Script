# NETWORKING STACK
# Generated by scripts/generate-stacks.sh
# Services: adguard adguardhome algo amneziawg beepass beszel caddy changedetection checkmate crowdsec firefly gluetun godoxy headscale hiddify komari lucky netdata nginx-proxy-manager ntopng pihole pingora portmaster tianji traefik unbound uptime-kuma wireguard zoraxy ztnet
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f networking-stack.yaml up -d

services:
  # ── adguard (services/networking/dns/adguard/adguard.yaml)
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/adguard/work:/opt/adguardhome/work
      - ${DOCKER_DATA}/networking/adguard/config:/opt/adguardhome/conf

    ports:
      - ${PORT_ADGUARD_SETUP:-${AUTO_PORT_ADGUARD_SETUP}}:3000                       # Initial setup web UI
      - ${PORT_ADGUARD_HTTP:-${AUTO_PORT_ADGUARD_HTTP}}:80                            # Web UI after setup
      - ${PORT_ADGUARD_HTTPS:-${AUTO_PORT_ADGUARD_HTTPS}}:443                         # HTTPS web UI
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/tcp                         # DNS over TCP
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/udp                         # DNS over UDP
      # - 853:853/tcp                                          # DNS over TLS
      # - 784:784/udp                                          # DNS over QUIC
      # - 67:67/udp                                            # DHCP server

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── adguardhome (services/networking/adguardhome.yaml)
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    hostname: adguardhome
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      # Config and work directories
      - ${DOCKER_DATA}/adguardhome/conf:/opt/adguardhome/conf
      - ${DOCKER_DATA}/adguardhome/work:/opt/adguardhome/work
    ports:
      # Web UI (initial setup wizard and admin panel)
      - ${PORT_ADGUARD:-${AUTO_PORT_ADGUARD}}:3000/tcp
      # Web UI (after setup, migrates from 3000 to 80/443)
      - ${PORT_ADGUARD_HTTP:-${AUTO_PORT_ADGUARD_HTTP}}:80/tcp
      - ${PORT_ADGUARD_HTTPS:-${AUTO_PORT_ADGUARD_HTTPS}}:443/tcp
      # DNS (UDP + TCP)
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/udp
      - ${PORT_ADGUARD_DNS:-${AUTO_PORT_ADGUARD_DNS}}:53/tcp
      # DNS-over-TLS (optional)
      # - ${PORT_ADGUARD_DOT:-${AUTO_PORT_ADGUARD_DOT}}:853/tcp
      # DNS-over-HTTPS (optional, served via HTTPS port)
      # - ${PORT_ADGUARD_DOH:-${AUTO_PORT_ADGUARD_DOH}}:443/tcp
      # DNSCrypt (optional)
      # - ${PORT_ADGUARD_DNSCRYPT:-${AUTO_PORT_ADGUARD_DNSCRYPT}}:5443/udp
      # - ${PORT_ADGUARD_DNSCRYPT:-${AUTO_PORT_ADGUARD_DNSCRYPT}}:5443/tcp
    # AdGuard Home needs to bind to port 53 - ensure system DNS is released
    # On systemd systems: sudo systemctl stop systemd-resolved
    # And: sudo sed -i 's/#DNSStubListener=yes/DNSStubListener=no/' /etc/systemd/resolved.conf
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_ADGUARD:-${AUTO_PORT_ADGUARD}} for initial setup
# 2. Set admin username/password
# 3. Configure upstream DNS servers (e.g., Unbound, 1.1.1.1, 8.8.8.8)
# 4. Add blocklists (Recommended: OISD, AdGuard DNS filter)
#
# If port 53 is in use by systemd-resolved:
#   sudo systemctl stop systemd-resolved && sudo systemctl disable systemd-resolved
#   echo "nameserver 127.0.0.1" | sudo tee /etc/resolv.conf
#
# Upstream DNS (configured in UI, not env vars):
#   - Unbound (local): 127.0.0.1:5335 or host-gateway:5335
#   - Cloudflare: https://cloudflare-dns.com/dns-query (DoH)
#   - Quad9: tls://dns.quad9.net (DoT)
#
# Recommended blocklists (add in UI):
#   https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
#   https://raw.githubusercontent.com/nicehash/NiceHashQuickMiner/main/assets/blocklist.txt
#   https://big.oisd.nl
# ============================================================

  # ── algo (services/networking/algo.yaml)
  algo:
    image: trailofbits/algo:latest
    container_name: algo
    hostname: algo
    # Algo runs as a one-shot provisioning task, not a persistent service
    restart: "no"
    environment:
      - TZ=${TZ}
      # Cloud provider (local = on this host/VM)
      # - PROVIDER=local
      # Server configuration (see config/config.cfg)
    volumes:
      # Config file with user list and server settings
      - ${DOCKER_DATA}/algo/config:/algo/config
      # Output directory for client configs and keys
      - ${DOCKER_DATA}/algo/output:/algo/configs
      # SSH keys for server access (if provisioning remote)
      # - ~/.ssh:/root/.ssh:ro
    # Interactive run command - see below for usage
    command: algo

# ============================================================
# Algo VPN is primarily an Ansible-based provisioning tool.
# Usage via Docker (interactive):
#
#   docker run --rm -it \
#     -v ${DOCKER_DATA}/algo/config:/algo/config \
#     -v ${DOCKER_DATA}/algo/output:/algo/configs \
#     trailofbits/algo:latest
#
# For LOCAL server deployment (on this host):
#   1. Edit ${DOCKER_DATA}/algo/config/config.cfg to add user names
#   2. Run: docker run --rm -it --net=host --cap-add=NET_ADMIN \
#        -v ${DOCKER_DATA}/algo/config:/algo/config \
#        trailofbits/algo:latest bash -c "cd /algo && ansible-playbook main.yml -e 'provider=local'"
#
# Output (client configs) will be at:
#   ${DOCKER_DATA}/algo/output/<server-ip>/
#   - configs/wireguard/*.conf  (WireGuard client configs)
#   - configs/ipsec/manual/*.mobileconfig  (iOS/macOS IKEv2)
#
# Alternative: Use WireGuard directly (simpler for Docker):
#   See: https://github.com/linuxserver/docker-wireguard
#   Image: lscr.io/linuxserver/wireguard:latest
# ============================================================

  # ── amneziawg (services/networking/amneziawg.yaml)
  amneziawg:
    image: amneziavpn/amnezia-wg:latest
    container_name: amneziawg
    hostname: amneziawg
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/amneziawg/config:/config
      - ${DOCKER_DATA}/amneziawg/data:/data
    ports:
      # WireGuard/AmneziaWG UDP port (choose a non-standard port to avoid detection)
      - ${PORT_AMNEZIAWG:-${AUTO_PORT_AMNEZIAWG}}:51820/udp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.forwarding=1
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# AmneziaVPN server setup:
# 1. Generate server keys:
#    docker exec amneziawg awg genkey | tee /tmp/server_private | awg pubkey > /tmp/server_public
#
# 2. Create ${DOCKER_DATA}/amneziawg/config/wg0.conf:
#    [Interface]
#    PrivateKey = <server-private-key>
#    Address = 10.8.0.1/24
#    ListenPort = 51820
#    PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
#    PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
#
#    # Obfuscation parameters (AmneziaWG specific)
#    Jc = 3       # Junk packet count (1-128)
#    Jmin = 50    # Junk min size
#    Jmax = 1000  # Junk max size
#    S1 = 0       # Init packet junk size
#    S2 = 0       # Response junk size
#    H1 = 1       # Init packet magic header
#    H2 = 2       # Response magic header
#    H3 = 3       # Cookie magic header
#    H4 = 4       # Transport magic header
#
#    [Peer]
#    PublicKey = <client-public-key>
#    AllowedIPs = 10.8.0.2/32
#
# 3. Configure AmneziaVPN client app with server IP and obfuscation params
# ============================================================

  # ── beepass (services/networking/beepass.yaml)
  beepass:
    image: beepassvpn/hub:latest
    container_name: beepass
    hostname: beepass
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # API and management port
      # - API_PORT=8080
      # VPN server ports
      # - VPN_PORT_START=10000
      # - VPN_PORT_END=11000
    volumes:
      - ${DOCKER_DATA}/beepass/config:/config
      - ${DOCKER_DATA}/beepass/data:/data
    ports:
      - ${PORT_BEEPASS:-${AUTO_PORT_BEEPASS}}:8080
      # VPN access key port range (expose the range used by Outline servers)
      # - "10000-10100:10000-10100/tcp"
      # - "10000-10100:10000-10100/udp"
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Outline Server (Shadowsocks-based, managed by BeePass)
  # Each Outline server instance provides VPN access via Shadowsocks
  outline-server:
    image: quay.io/outline/shadowbox:stable
    container_name: outline-server
    hostname: outline-server
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - SB_API_PORT=8081
      - SB_CERTIFICATE_FILE=/data/shadowbox.crt
      - SB_PRIVATE_KEY_FILE=/data/shadowbox.key
      # Management API prefix - must match Outline Manager
      - SB_API_PREFIX=${OUTLINE_API_PREFIX:-secret}
    volumes:
      - ${DOCKER_DATA}/beepass/outline:/data
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN

# networks:
#   proxy:
#     external: true

# ============================================================
# BeePass / Outline Setup:
# 1. Install Outline Manager (desktop app) from getoutline.org/get-started
# 2. Run the Outline server container above
# 3. In Outline Manager, click "Advanced" -> "Set up Outline yourself"
# 4. Provide the management API URL: https://your-server:8081/secret/
# 5. Create access keys and share them with BeePass clients
#
# Client apps: https://getoutline.org/get-started/#step-3
# BeePass client: https://beepass.app
#
# Note: BeePass Hub may have different requirements - verify the
# correct image and configuration at the GitHub repository.
# ============================================================

  # ── beszel (services/networking/monitoring/beszel/beszel.yaml)
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    hostname: beszel
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/beszel/config:/beszel_data

    ports:
      - ${PORT_BESZEL:-${AUTO_PORT_BESZEL}}:8090

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── caddy (services/networking/caddy.yaml)
  caddy:
    image: caddy:latest
    container_name: caddy
    hostname: caddy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${DOCKER_DATA}/caddy/data:/data
      - ${DOCKER_DATA}/caddy/config:/config
    ports:
      - 80:80
      - 443:443


  # ── changedetection (services/networking/monitoring/changedetection.yaml)
  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    hostname: changedetection
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/networking/monitoring/changedetection/data:/datastore

    ports:
      - ${PORT_CHANGEDETECTION:-${AUTO_PORT_CHANGEDETECTION}}:5000

  # ── checkmate (services/networking/checkmate.yaml)
  checkmate-mongo:
    image: mongo:7
    container_name: checkmate-mongo
    hostname: checkmate-mongo
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MONGO_INITDB_DATABASE=checkmate
      - MONGO_INITDB_ROOT_USERNAME=${CHECKMATE_MONGO_USER:-checkmate}
      - MONGO_INITDB_ROOT_PASSWORD=${CHECKMATE_MONGO_PASSWORD:-checkmate_pass}
    volumes:
      - ${DOCKER_DATA}/checkmate/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # networks:
    #   - ${DEFAULT_NETWORK}

  checkmate:
    image: bluewavelabs/checkmate:latest
    container_name: checkmate
    hostname: checkmate
    restart: unless-stopped
    depends_on:
      checkmate-mongo:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database
      - DB_CONNECTION_STRING=mongodb://${CHECKMATE_MONGO_USER:-checkmate}:${CHECKMATE_MONGO_PASSWORD:-checkmate_pass}@checkmate-mongo:27017/checkmate?authSource=admin
      # JWT secret for sessions - generate with: openssl rand -hex 32
      - JWT_SECRET=${CHECKMATE_JWT_SECRET}
      # Admin account created on first run
      - ADMIN_EMAIL=${CHECKMATE_ADMIN_EMAIL:-admin@${BASE_DOMAIN}}
      - ADMIN_PASSWORD=${CHECKMATE_ADMIN_PASSWORD:-changeme}
      # App URL (used for alert links)
      - CLIENT_HOST=https://checkmate.${BASE_DOMAIN}
      # Email notifications (optional)
      # - MAILER_SERVICE=gmail
      # - MAILER_HOST=smtp.${BASE_DOMAIN}
      # - MAILER_PORT=587
      # - MAILER_USER=${SMTP_USERNAME}
      # - MAILER_PASS=${SMTP_PASSWORD}
      # - SYSTEM_EMAIL_ADDRESS=checkmate@${BASE_DOMAIN}
      # Log level: error, warn, info, http, debug
      - LOG_LEVEL=${CHECKMATE_LOG_LEVEL:-info}
      # Allow new user registration (false for private instance)
      - ALLOW_REGISTRATION=false
    volumes:
      - ${DOCKER_DATA}/checkmate/config:/app/config
    ports:
      - ${PORT_CHECKMATE:-${AUTO_PORT_CHECKMATE}}:12000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_CHECKMATE:-${AUTO_PORT_CHECKMATE}}
# 2. Login with ADMIN_EMAIL / ADMIN_PASSWORD
# 3. Add monitors: URL, TCP port, ping, or Docker container checks
# 4. Configure notification integrations (email, Slack, Discord, etc.)
# 5. Create status pages for public visibility
# ============================================================

  # ── crowdsec (services/networking/crowdsec.yaml)
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    hostname: crowdsec
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Registration key for bouncers connecting to this LAPI
      - BOUNCER_KEY_traefik=${CROWDSEC_BOUNCER_KEY}
      # Collections to install (comma-separated)
      # See: https://hub.crowdsec.net/
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/linux crowdsecurity/sshd
      # Enroll this instance with CrowdSec Central API (optional, for shared blocklist)
      # Get your key from: https://app.crowdsec.net
      # - ENROLL_KEY=${CROWDSEC_ENROLL_KEY}
      # - ENROLL_INSTANCE_NAME=${HOSTNAME:-homeserver}
      # Log level: trace, debug, info, warn, error
      # - GID=${PGID}
    volumes:
      # CrowdSec config and database
      - ${DOCKER_DATA}/crowdsec/config:/etc/crowdsec
      - ${DOCKER_DATA}/crowdsec/data:/var/lib/crowdsec/data
      # Log files to analyze (mount relevant log directories)
      - /var/log:/var/log:ro
      # Traefik logs (adjust path to your Traefik log location)
      # - ${DOCKER_DATA}/traefik/logs:/var/log/traefik:ro
      # Nginx logs
      # - /var/log/nginx:/var/log/nginx:ro
      # Auth logs
      # - /var/log/auth.log:/var/log/auth.log:ro
    ports:
      - ${PORT_CROWDSEC:-${AUTO_PORT_CROWDSEC}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  # CrowdSec Traefik Bouncer (blocks IPs at the proxy level)
  crowdsec-bouncer-traefik:
    image: fbonalair/traefik-crowdsec-bouncer:latest
    container_name: crowdsec-bouncer-traefik
    hostname: crowdsec-bouncer-traefik
    restart: unless-stopped
    depends_on:
      - crowdsec
    environment:
      - TZ=${TZ}
      # Must match BOUNCER_KEY_traefik above
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_KEY}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
      - GIN_MODE=release
    # networks:
    #   - ${DEFAULT_NETWORK}

  # CrowdSec Dashboard (Metabase) - optional web UI
  # crowdsec-dashboard:
  #   image: metabase/metabase:latest
  #   container_name: crowdsec-dashboard
  #   hostname: crowdsec-dashboard
  #   restart: unless-stopped
  #   volumes:
  #     - ${DOCKER_DATA}/crowdsec/metabase:/metabase-data
  #     - ${DOCKER_DATA}/crowdsec/data/crowdsec.db:/metabase-data/crowdsec.db:ro
  #   ports:
  #     - ${PORT_CROWDSEC_DASHBOARD:-${AUTO_PORT_CROWDSEC_DASHBOARD}}:3000

# networks:
#   proxy:
#     external: true

# ============================================================
# Traefik bouncer middleware integration:
# Add to traefik dynamic config or labels:
#   http:
#     middlewares:
#       crowdsec:
#         forwardAuth:
#           address: http://crowdsec-bouncer-traefik:8080/api/v1/forwardAuth
#           trustForwardHeader: true
#
# Add bouncer manually if needed:
#   docker exec crowdsec cscli bouncers add traefik-bouncer
#   (copy the generated key to CROWDSEC_BOUNCER_KEY)
#
# List decisions:
#   docker exec crowdsec cscli decisions list
#
# List alerts:
#   docker exec crowdsec cscli alerts list
#
# Test a scenario:
#   docker exec crowdsec cscli simulate enable crowdsecurity/http-scan-uniques_404
# ============================================================

  # ── firefly (services/networking/firefly.yaml)
  firefly-postgres:
    image: postgres:16-alpine
    container_name: firefly-postgres
    hostname: firefly-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=firefly
      - POSTGRES_USER=firefly
      - POSTGRES_PASSWORD=${FIREFLY_POSTGRES_PASSWORD:-firefly_pass}
    volumes:
      - ${DOCKER_DATA}/firefly/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  firefly:
    image: fireflyiii/core:latest
    container_name: firefly
    hostname: firefly
    restart: unless-stopped
    depends_on:
      firefly-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # App settings
      - APP_ENV=production
      - APP_DEBUG=false
      # Generate with: php artisan key:generate --show
      - APP_KEY=${FIREFLY_APP_KEY}
      - APP_URL=https://firefly.${BASE_DOMAIN}
      # Trusted proxies (use * for all, or specific IP)
      - TRUSTED_PROXIES=**
      # Database
      - DB_CONNECTION=pgsql
      - DB_HOST=firefly-postgres
      - DB_PORT=5432
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${FIREFLY_POSTGRES_PASSWORD:-firefly_pass}
      # Default language and locale
      - DEFAULT_LANGUAGE=en_US
      - DEFAULT_LOCALE=equal
      # MAIL settings (optional)
      # - MAIL_MAILER=smtp
      # - MAIL_HOST=smtp.${BASE_DOMAIN}
      # - MAIL_PORT=587
      # - MAIL_FROM=firefly@${BASE_DOMAIN}
      # - MAIL_USERNAME=${SMTP_USERNAME}
      # - MAIL_PASSWORD=${SMTP_PASSWORD}
      # - MAIL_ENCRYPTION=tls
      # Authentication (optional LDAP/SSO)
      # - AUTHENTICATION_GUARD=remote_user_guard
      # - AUTHENTICATION_GUARD_HEADER=REMOTE_USER
      # Disable registration (set to false to allow new signups)
      - ALLOW_WEBHOOKS=false
      # Session driver (database recommended for production)
      - SESSION_DRIVER=database
      - CACHE_DRIVER=database
    volumes:
      - ${DOCKER_DATA}/firefly/upload:/var/www/html/storage/upload
      - ${DOCKER_DATA}/firefly/export:/var/www/html/storage/export
    ports:
      - ${PORT_FIREFLY:-${AUTO_PORT_FIREFLY}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Firefly III Data Importer - optional companion tool
  # firefly-importer:
  #   image: fireflyiii/data-importer:latest
  #   container_name: firefly-importer
  #   hostname: firefly-importer
  #   restart: unless-stopped
  #   depends_on:
  #     - firefly
  #   environment:
  #     - TZ=${TZ}
  #     - FIREFLY_III_URL=http://firefly:8080
  #     - VANITY_URL=https://firefly.${BASE_DOMAIN}
  #     - FIREFLY_III_ACCESS_TOKEN=${FIREFLY_ACCESS_TOKEN}
  #   ports:
  #     - ${PORT_FIREFLY_IMPORTER:-${AUTO_PORT_FIREFLY_IMPORTER}}:8080

  # Firefly III Cron (automated recurring transactions)
  firefly-cron:
    image: alpine:latest
    container_name: firefly-cron
    hostname: firefly-cron
    restart: unless-stopped
    depends_on:
      - firefly
    environment:
      - TZ=${TZ}
    command: >
      sh -c "while true; do
        wget -qO- http://firefly:8080/api/v1/cron/${FIREFLY_CRON_TOKEN:-changeme};
        sleep 86400;
      done"

# networks:
#   proxy:
#     external: true

  # ── gluetun (services/networking/vpn/gluetun/gluetun.yaml)
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    hostname: gluetun
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=mullvad                           # VPN provider (mullvad, nordvpn, etc.)
      - VPN_TYPE=wireguard                                     # VPN type (wireguard, openvpn)
      # - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}       # WireGuard private key
      # - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}           # WireGuard addresses
      # - SERVER_COUNTRIES=Sweden                              # VPN server country
      # - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16             # Allow LAN access through VPN

    volumes:
      - ${DOCKER_DATA}/networking/gluetun/config:/gluetun

    ports:
      - ${PORT_GLUETUN:-${AUTO_PORT_GLUETUN}}:8888                             # HTTP proxy port

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── godoxy (services/networking/godoxy.yaml)
  godoxy:
    image: traefik:v3.0
    container_name: godoxy
    hostname: godoxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DATA}/godoxy/traefik:/etc/traefik
    ports:
      - 80:80
      - 443:443
      - ${PORT_GODOXY_DASHBOARD:-${AUTO_PORT_GODOXY_DASHBOARD}}:8080


  # ── headscale (services/networking/vpn/headscale/headscale.yaml)
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    hostname: headscale
    restart: unless-stopped

    command: serve

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/headscale/config:/etc/headscale
      - ${DOCKER_DATA}/networking/headscale/data:/var/lib/headscale

    ports:
      - ${PORT_HEADSCALE:-${AUTO_PORT_HEADSCALE}}:8080                           # gRPC and HTTP port
      # - ${PORT_HEADSCALE_METRICS:-${AUTO_PORT_HEADSCALE_METRICS}}:9090                 # Metrics endpoint

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── hiddify (services/networking/hiddify.yaml)
  hiddify:
    image: hiddify/hiddify-manager:latest
    container_name: hiddify
    hostname: hiddify
    restart: unless-stopped
    # Hiddify needs host network for full protocol support
    network_mode: host
    privileged: true
    environment:
      - TZ=${TZ}
      # Admin panel credentials
      - ADMIN_SECRET=${HIDDIFY_ADMIN_SECRET:-changeme}
      # Domain for certificates and proxy endpoints
      - DOMAIN=${BASE_DOMAIN}
      # Fake domain (SNI for reality protocol)
      # - FAKE_DOMAIN=www.google.com
      # Mode: auto-cdn-ip, direct, sub-link-only
      # - MODE=auto-cdn-ip
    volumes:
      - ${DOCKER_DATA}/hiddify/config:/opt/hiddify-manager
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # When using bridge network (limited functionality):
    # ports:
    #   - 80:80
    #   - 443:443
    #   - ${PORT_HIDDIFY:-${AUTO_PORT_HIDDIFY}}:8443

# ============================================================
# Hiddify Manager requires host network for full functionality.
# It manages its own internal Docker containers for different protocols.
#
# First-time setup:
# 1. Point your domain DNS to the server IP
# 2. Start the container and wait for initialization (~2 min)
# 3. Access the admin panel:
#    https://your-server/<ADMIN_SECRET>/
# 4. Configure proxy protocols and generate subscription links
# 5. Share the subscription link with clients (Hiddify, V2rayNG, etc.)
#
# Client apps:
# - HiddifyNext (Android, iOS, Windows, macOS, Linux)
# - V2rayNG (Android)
# - Shadowrocket (iOS)
# - Clash / Mihomo (cross-platform)
#
# Note: This tool is designed for use in regions with internet censorship.
# Ensure compliance with local laws when deploying.
# ============================================================

  # ── komari (services/networking/komari.yaml)
  komari:
    image: ghcr.io/komari-monitor/komari:latest
    container_name: komari
    hostname: komari
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Admin credentials (set on first run)
      # - ADMIN_USERNAME=${KOMARI_USERNAME:-admin}
      # - ADMIN_PASSWORD=${KOMARI_PASSWORD:-changeme}
      # Database (SQLite by default)
      # - DATABASE_URL=sqlite:///data/komari.db
    volumes:
      - ${DOCKER_DATA}/komari/data:/data
    ports:
      - ${PORT_KOMARI:-${AUTO_PORT_KOMARI}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  # Komari Agent - deploy on each server to monitor
  # komari-agent:
  #   image: ghcr.io/komari-monitor/komari-agent:latest
  #   container_name: komari-agent
  #   hostname: komari-agent
  #   restart: unless-stopped
  #   network_mode: host
  #   environment:
  #     - TZ=${TZ}
  #     # Server URL and auth token (get from Komari dashboard)
  #     - KOMARI_SERVER=https://komari.${BASE_DOMAIN}
  #     - KOMARI_TOKEN=${KOMARI_AGENT_TOKEN}
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_KOMARI:-${AUTO_PORT_KOMARI}}
# 2. Create admin credentials on first visit
# 3. Navigate to Settings -> Agents to get an agent token
# 4. Deploy the komari-agent on each server to monitor
# 5. Agents will appear in the dashboard once connected
# ============================================================

  # ── lucky (services/networking/lucky.yaml)
  lucky:
    image: gdy666/lucky:latest
    container_name: lucky
    hostname: lucky
    restart: unless-stopped
    # Lucky needs host network for full port forwarding capabilities
    # Alternatively, use bridge network and map specific ports
    network_mode: host
    environment:
      - TZ=${TZ}
      # Web UI port (default 16601)
      # - LUCKY_PORT=16601
    volumes:
      - ${DOCKER_DATA}/lucky/config:/goodluck
    # When not using host network mode, uncomment ports:
    # ports:
    #   - ${PORT_LUCKY:-${AUTO_PORT_LUCKY}}:16601

# ============================================================
# Lucky features:
# - DDNS: Supports Cloudflare, DNSPOD, Aliyun, HE.net, and 30+ others
# - Port forwarding: Map external ports to internal services
# - Reverse proxy: Built-in HTTP/HTTPS proxy with Let's Encrypt SSL
# - WOL: Wake computers on your LAN remotely
# - STun: NAT traversal for P2P connections
#
# First-time setup:
# 1. Access http://your-server:16601
# 2. Set admin credentials on first visit
# 3. Configure DDNS providers with your API keys
# 4. Add port forwarding rules for your services
#
# Note: Host network mode is required for full functionality.
# When using in Docker with bridge networking, some port forwarding
# features may not work as expected.
# ============================================================

  # ── netdata (services/networking/netdata.yaml)
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: ${NETDATA_HOSTNAME:-netdata-server}
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=${TZ}
      # Netdata Cloud claim token (optional, for cloud integration)
      # Get from: https://app.netdata.cloud
      # - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN}
      # - NETDATA_CLAIM_URL=https://app.netdata.cloud
      # - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS}
      # Custom hostname for this node in Netdata Cloud
      # - NETDATA_HOSTNAME=${HOSTNAME:-homeserver}
    volumes:
      - ${DOCKER_DATA}/netdata/config:/etc/netdata
      - ${DOCKER_DATA}/netdata/lib:/var/lib/netdata
      - ${DOCKER_DATA}/netdata/cache:/var/cache/netdata
      # Required for full system metrics
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/host/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Docker container metrics
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # When not using host network:
    # ports:
    #   - ${PORT_NETDATA:-${AUTO_PORT_NETDATA}}:19999

# ============================================================
# Netdata features:
# - Real-time metrics: CPU, memory, disk, network, processes
# - Docker container monitoring
# - Application monitoring: Nginx, Apache, MySQL, Redis, etc.
# - ML anomaly detection
# - Built-in alerting system
# - Optional Netdata Cloud integration for centralized monitoring
#
# Access:
#   http://your-server:19999 (when using host network)
#   http://your-server:${PORT_NETDATA:-${AUTO_PORT_NETDATA}} (when using bridge network)
#
# Custom configuration:
#   ${DOCKER_DATA}/netdata/config/netdata.conf
#   ${DOCKER_DATA}/netdata/config/health_alarm_notify.conf
#   ${DOCKER_DATA}/netdata/config/health.d/*.conf (alert rules)
#
# Netdata CLI:
#   docker exec netdata netdatacli reload-health
#   docker exec netdata netdatacli ping
# ============================================================

  # ── nginx-proxy-manager (services/networking/reverse-proxy/nginx-proxy-manager/nginx-proxy-manager.yaml)
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    hostname: nginx-proxy-manager
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - DB_SQLITE_FILE=/data/database.sqlite                 # SQLite DB path (default)
      # - DISABLE_IPV6=true                                    # Disable IPv6 if not supported

    volumes:
      - ${DOCKER_DATA}/networking/nginx-proxy-manager/config:/data
      - ${DOCKER_DATA}/networking/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

    ports:
      - ${PORT_NPM_HTTP:-${AUTO_PORT_NPM_HTTP}}:80                                # HTTP (proxy)
      - ${PORT_NPM_HTTPS:-${AUTO_PORT_NPM_HTTPS}}:443                             # HTTPS (proxy)
      - ${PORT_NPM_ADMIN:-${AUTO_PORT_NPM_ADMIN}}:81                               # Admin web UI

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── ntopng (services/networking/ntopng.yaml)
  ntopng:
    image: ntop/ntopng:stable
    container_name: ntopng
    hostname: ntopng
    restart: unless-stopped
    # Host network mode required for direct interface access
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/ntopng/config:/etc/ntopng
      - ${DOCKER_DATA}/ntopng/data:/var/lib/ntopng
    # When NOT using host network (limited capture via SPAN/port mirroring):
    # ports:
    #   - ${PORT_NTOPNG:-${AUTO_PORT_NTOPNG}}:3000
    command: >
      --community
      --interface=any
      --http-port=3000
      --data-dir=/var/lib/ntopng
      --config=/etc/ntopng/ntopng.conf
      --no-promisc
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

# ============================================================
# ntopng.conf example (place at ${DOCKER_DATA}/ntopng/config/ntopng.conf):
# ============================================================
# --interface=eth0       # Network interface to monitor (use 'any' for all)
# --http-port=3000       # Web UI port
# --community            # Community edition (no license required for basic features)
# --disable-login=1      # Disable login (NOT for production use)
# --local-networks=192.168.1.0/24  # Your local subnet(s)
# --data-dir=/var/lib/ntopng
#
# Access web UI:
#   http://your-server:3000 (host network) or http://your-server:${PORT_NTOPNG:-${AUTO_PORT_NTOPNG}}
#   Default login: admin / admin (change immediately)
#
# For production use with non-host networking, use a network TAP or
# configure your switch/router for port mirroring to the Docker host.
#
# Enterprise features (flow export, historical analysis, alerts) require
# a commercial license from ntop.org.
# ============================================================

  # ── pihole (services/networking/dns/pihole/pihole.yaml)
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=changeme                                 # Admin panel password
      # - PIHOLE_DNS_=8.8.8.8;8.8.4.4                         # Upstream DNS servers
      # - DNSSEC=true                                          # Enable DNSSEC
      # - DNS_BOGUS_PRIV=true                                  # Never forward bogon IPs
      # - DNS_FQDN_REQUIRED=true                               # Never forward non-FQDNs
      # - REV_SERVER=true                                      # Enable reverse server (router)
      # - REV_SERVER_CIDR=192.168.0.0/16                       # Reverse server CIDR
      # - REV_SERVER_TARGET=192.168.0.1                        # Reverse server target (router IP)

    volumes:
      - ${DOCKER_DATA}/networking/pihole/config:/etc/pihole
      - ${DOCKER_DATA}/networking/pihole/dnsmasq:/etc/dnsmasq.d

    ports:
      - ${PORT_PIHOLE:-${AUTO_PORT_PIHOLE}}:80                                # Admin web UI
      - ${PORT_PIHOLE_DNS:-${AUTO_PORT_PIHOLE_DNS}}:53/tcp                          # DNS over TCP
      - ${PORT_PIHOLE_DNS:-${AUTO_PORT_PIHOLE_DNS}}:53/udp                          # DNS over UDP
      # - 67:67/udp                                            # DHCP server (optional)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── pingora (services/networking/pingora.yaml)
  # Example: custom Pingora proxy built from your application
  # Replace 'your-org/your-pingora-app:latest' with your compiled image
  pingora:
    image: your-org/your-pingora-app:latest
    container_name: pingora
    hostname: pingora
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Custom config file for your Pingora application
      # - CONFIG_FILE=/config/pingora.yaml
    volumes:
      - ${DOCKER_DATA}/pingora/config:/config
      - ${DOCKER_DATA}/pingora/logs:/logs
    ports:
      - 80:80
      - 443:443
      - ${PORT_PINGORA_ADMIN:-${AUTO_PORT_PINGORA_ADMIN}}:6188
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# Building a Pingora application:
#
# 1. Add pingora to your Cargo.toml:
#    [dependencies]
#    pingora = { version = "0.4", features = ["lb"] }
#
# 2. Implement the ProxyHttp trait:
#    use pingora::prelude::*;
#    struct MyProxy;
#    #[async_trait]
#    impl ProxyHttp for MyProxy {
#        type CTX = ();
#        fn new_ctx(&self) -> Self::CTX {}
#        async fn upstream_peer(&self, session: &mut Session, _ctx: &mut Self::CTX)
#            -> Result<Box<HttpPeer>> {
#            let peer = Box::new(HttpPeer::new("127.0.0.1:8080", false, "".to_string()));
#            Ok(peer)
#        }
#    }
#
# 3. Build and create a Docker image:
#    FROM rust:1.75 AS builder
#    COPY . .
#    RUN cargo build --release
#    FROM debian:bookworm-slim
#    COPY --from=builder /target/release/my-proxy /usr/local/bin/
#    CMD ["my-proxy"]
#
# Pingora GitHub examples: https://github.com/cloudflare/pingora/tree/main/pingora-proxy/examples
# ============================================================

  # ── portmaster (services/networking/portmaster.yaml)
  portmaster:
    image: safing/portmaster:latest
    container_name: portmaster
    hostname: portmaster
    restart: unless-stopped
    # Portmaster requires privileged mode and host network for full functionality
    privileged: true
    network_mode: host
    pid: host
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/portmaster/data:/var/lib/portmaster
      - ${DOCKER_DATA}/portmaster/config:/etc/portmaster
      - /proc:/proc:ro
      - /sys:/sys:ro
      # Required for netfilter queue integration
      - /dev:/dev
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE

# ============================================================
# IMPORTANT: Portmaster is primarily designed as a host-level service.
# For the best experience, install it directly on the host:
#
# Ubuntu/Debian:
#   wget https://updates.safing.io/latest/linux_amd64/packages/portmaster-installer.deb
#   sudo apt install ./portmaster-installer.deb
#   sudo systemctl start portmaster
#
# Arch Linux (AUR):
#   yay -S portmaster
#
# Features:
# - Per-application network firewall rules
# - DNS-over-TLS enforcement
# - Ad and tracker blocking
# - Privacy filters and connection monitoring
# - Spn (Safing Privacy Network) - optional paid feature
#
# The web UI is accessible at http://localhost:817 after host installation.
# ============================================================

  # ── tianji (services/networking/tianji.yaml)
  tianji:
    image: moonrailgun/tianji:latest
    container_name: tianji
    hostname: tianji
    restart: unless-stopped
    depends_on:
      tianji-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - DATABASE_URL=postgresql://tianji:${POSTGRES_PASSWORD}@tianji-postgres:5432/tianji
      - JWT_SECRET=${SECRET_KEY}
      - ALLOW_REGISTER=false
      # - WEBSITE_DOMAIN=${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/tianji/data:/app/data
    ports:
      - ${PORT_TIANJI}:12345
    # networks:
    #   - ${DEFAULT_NETWORK}

  tianji-postgres:
    image: postgres:15-alpine
    container_name: tianji-postgres
    hostname: tianji-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=tianji
      - POSTGRES_USER=tianji
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/tianji/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianji -d tianji"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── traefik (services/networking/reverse-proxy/traefik/traefik.yaml)
  traefik:
    image: traefik:latest
    container_name: traefik
    hostname: traefik
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}                 # Cloudflare API token (for DNS challenge)

    volumes:
      - ${DOCKER_DATA}/networking/traefik/config:/etc/traefik
      - ${DOCKER_DATA}/networking/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro            # Docker socket (read-only)

    ports:
      - ${PORT_TRAEFIK_HTTP:-${AUTO_PORT_TRAEFIK_HTTP}}:80                            # HTTP entrypoint
      - ${PORT_TRAEFIK_HTTPS:-${AUTO_PORT_TRAEFIK_HTTPS}}:443                         # HTTPS entrypoint
      - ${PORT_TRAEFIK_DASHBOARD:-${AUTO_PORT_TRAEFIK_DASHBOARD}}:8080                   # Dashboard (disable in prod)

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── unbound (services/networking/dns/unbound/unbound.yaml)
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped

    environment:
      - TZ=${TZ}

    volumes:
      - ${DOCKER_DATA}/networking/unbound/config:/opt/unbound/etc/unbound

    ports:
      - ${PORT_UNBOUND:-${AUTO_PORT_UNBOUND}}:53/tcp                           # DNS over TCP
      - ${PORT_UNBOUND:-${AUTO_PORT_UNBOUND}}:53/udp                           # DNS over UDP

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── uptime-kuma (services/networking/monitoring/uptime-kuma/uptime-kuma.yaml)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    hostname: uptime-kuma
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/networking/uptime-kuma/config:/app/data

    ports:
      - ${PORT_UPTIME_KUMA:-${AUTO_PORT_UPTIME_KUMA}}:3001

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wireguard (services/networking/vpn/wireguard/wireguard.yaml)
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    hostname: wireguard
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - SERVERURL=vpn.example.com                            # External server URL or IP
      # - SERVERPORT=51820                                     # Server listen port
      # - PEERS=3                                              # Number of peer configs to generate
      # - PEERDNS=auto                                         # DNS for peers (auto or IP)
      # - INTERNAL_SUBNET=10.13.13.0                           # Internal subnet

    volumes:
      - ${DOCKER_DATA}/networking/wireguard/config:/config
      - /lib/modules:/lib/modules:ro                           # Kernel modules (required)

    ports:
      - ${PORT_WIREGUARD:-${AUTO_PORT_WIREGUARD}}:51820/udp

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── zoraxy (services/networking/zoraxy.yaml)
  zoraxy:
    image: zoraxydocker/zoraxy:latest
    container_name: zoraxy
    hostname: zoraxy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Web management interface port (internal)
      - PORT=8123
      # Enable fast GeoIP lookup (downloads MaxMind GeoLite2 DB)
      - FASTGEOIP=true
      # Disable authentication (NOT recommended for production)
      # - NOAUTH=false
      # ZeroTier network ID (if using ZeroTier for SDN)
      # - ZTNETWORK=${ZEROTIER_NETWORK_ID}
    volumes:
      # Persistent configuration (proxy rules, SSL certs, settings)
      - ${DOCKER_DATA}/zoraxy/config:/opt/zoraxy/config
      # Docker socket for container auto-discovery (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Sync localtime
      - /etc/localtime:/etc/localtime:ro
    ports:
      # HTTP (reverse proxy entrypoint)
      - 80:80
      # HTTPS (reverse proxy entrypoint with TLS)
      - 443:443
      # Web management UI
      - ${PORT_ZORAXY:-${AUTO_PORT_ZORAXY}}:8123
      # Optional: additional TCP proxy ports (configure in UI)
      # - 8022:22  # SSH proxy example
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Access http://your-server:${PORT_ZORAXY:-${AUTO_PORT_ZORAXY}} for the management UI
# 2. Create admin credentials on first visit
# 3. Navigate to "HTTP Proxy" to add reverse proxy rules:
#    - Subdomain: myapp.${BASE_DOMAIN} -> http://container-name:port
# 4. Navigate to "TLS/SSL" to enable Let's Encrypt:
#    - Enter your email address
#    - Add domains to certificate requests
# 5. Set your default site under "Default Site"
#
# GeoIP blocking:
#   Requires FASTGEOIP=true (downloads ~50MB database on first start)
#   Configure blocked/allowed countries under "GeoBlock"
#
# Basic authentication:
#   Add per-proxy-rule authentication under proxy rule settings
# ============================================================

  # ── ztnet (services/networking/ztnet.yaml)
  ztnet-postgres:
    image: postgres:16-alpine
    container_name: ztnet-postgres
    hostname: ztnet-postgres
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=ztnet
      - POSTGRES_USER=ztnet
      - POSTGRES_PASSWORD=${ZTNET_POSTGRES_PASSWORD:-ztnet_pass}
    volumes:
      - ${DOCKER_DATA}/ztnet/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztnet -d ztnet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  ztnet:
    image: sinamics/ztnet:latest
    container_name: ztnet
    hostname: ztnet
    restart: unless-stopped
    depends_on:
      ztnet-postgres:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Database connection
      - DATABASE_URL=postgresql://ztnet:${ZTNET_POSTGRES_PASSWORD:-ztnet_pass}@ztnet-postgres:5432/ztnet
      # Next-auth secret - generate with: openssl rand -base64 32
      - NEXTAUTH_SECRET=${ZTNET_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://ztnet.${BASE_DOMAIN}
      # ZeroTier controller API (local or remote)
      - ZT_ADDR=http://zerotier:9993
      # ZeroTier auth token (found in /var/lib/zerotier-one/authtoken.secret)
      - ZT_SECRET=${ZTNET_ZT_SECRET}
      # Node environment
      - NODE_ENV=production
    volumes:
      - ${DOCKER_DATA}/ztnet/config:/app/data
      # Mount ZeroTier socket if running on host
      # - /var/lib/zerotier-one:/var/lib/zerotier-one
    ports:
      - ${PORT_ZTNET:-${AUTO_PORT_ZTNET}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

  # ZeroTier One (the actual VPN daemon)
  # Required if not running ZeroTier on the host directly
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    hostname: zerotier
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${DOCKER_DATA}/ztnet/zerotier:/var/lib/zerotier-one
    # ZeroTier API port (internal, not exposed publicly)
    # ports:
    #   - 9993:9993/tcp
    #   - 9993:9993/udp

# networks:
#   proxy:
#     external: true

# ============================================================
# First-time setup:
# 1. Start zerotier first, let it generate authtoken.secret
# 2. Copy the token: cat ${DOCKER_DATA}/ztnet/zerotier/authtoken.secret
# 3. Set ZT_SECRET to that token
# 4. Access ztnet at http://your-server:${PORT_ZTNET:-${AUTO_PORT_ZTNET}}
# 5. Create an admin account on first visit
# 6. Create networks and authorize members from the dashboard
# ============================================================


