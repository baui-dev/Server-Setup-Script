# NETWORKING STACK
# Generated by scripts/generate-stacks.py
# Services: adguard, pihole, unbound, nginx-proxy-manager, traefik, beszel, uptime-kuma, gluetun, headscale, wireguard
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    hostname: adguard
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/adguard/work:/opt/adguardhome/work
    - ${DOCKER_DATA}/networking/adguard/config:/opt/adguardhome/conf
    ports:
    - ${PORT_ADGUARD_SETUP:-3000}:3000
    - ${PORT_ADGUARD_HTTP:-80}:80
    - ${PORT_ADGUARD_HTTPS:-443}:443
    - ${PORT_ADGUARD_DNS:-53}:53/tcp
    - ${PORT_ADGUARD_DNS:-53}:53/udp
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/pihole/config:/etc/pihole
    - ${DOCKER_DATA}/networking/pihole/dnsmasq:/etc/dnsmasq.d
    ports:
    - ${PORT_PIHOLE:-8080}:80
    - ${PORT_PIHOLE_DNS:-53}:53/tcp
    - ${PORT_PIHOLE_DNS:-53}:53/udp
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    hostname: unbound
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/unbound/config:/opt/unbound/etc/unbound
    ports:
    - ${PORT_UNBOUND:-5335}:53/tcp
    - ${PORT_UNBOUND:-5335}:53/udp
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    hostname: nginx-proxy-manager
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/nginx-proxy-manager/config:/data
    - ${DOCKER_DATA}/networking/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    ports:
    - ${PORT_NPM_HTTP:-80}:80
    - ${PORT_NPM_HTTPS:-443}:443
    - ${PORT_NPM_ADMIN:-81}:81
  traefik:
    image: traefik:latest
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/traefik/config:/etc/traefik
    - ${DOCKER_DATA}/networking/traefik/letsencrypt:/letsencrypt
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - ${PORT_TRAEFIK_HTTP:-80}:80
    - ${PORT_TRAEFIK_HTTPS:-443}:443
    - ${PORT_TRAEFIK_DASHBOARD:-8080}:8080
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    hostname: beszel
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/beszel/config:/beszel_data
    ports:
    - ${PORT_BESZEL:-8090}:8090
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    hostname: uptime-kuma
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/uptime-kuma/config:/app/data
    ports:
    - ${PORT_UPTIME_KUMA:-3001}:3001
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    hostname: gluetun
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    environment:
    - TZ=${TZ}
    - VPN_SERVICE_PROVIDER=mullvad
    - VPN_TYPE=wireguard
    volumes:
    - ${DOCKER_DATA}/networking/gluetun/config:/gluetun
    ports:
    - ${PORT_GLUETUN:-8888}:8888
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    hostname: headscale
    restart: unless-stopped
    command: serve
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/networking/headscale/config:/etc/headscale
    - ${DOCKER_DATA}/networking/headscale/data:/var/lib/headscale
    ports:
    - ${PORT_HEADSCALE:-8080}:8080
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    hostname: wireguard
    restart: unless-stopped
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    sysctls:
    - net.ipv4.conf.all.src_valid_mark=1
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/networking/wireguard/config:/config
    - /lib/modules:/lib/modules:ro
    ports:
    - ${PORT_WIREGUARD:-51820}:51820/udp
