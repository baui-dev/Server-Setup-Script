      - TZ=${TZ}
      # - SYMFONY__ENV__DOMAIN_NAME=https://wallabag.${BASE_DOMAIN} # Public URL
      # - SYMFONY__ENV__DATABASE_DRIVER=pdo_sqlite              # Database driver
      # - SYMFONY__ENV__SECRET=${SYMFONY_SECRET}                # App secret key
      # - SYMFONY__ENV__FOSUSER_REGISTRATION=false              # Disable registration

    volumes:
      - ${DOCKER_DATA}/productivity/wallabag/config:/var/www/wallabag/data
      - ${DOCKER_DATA}/productivity/wallabag/images:/var/www/wallabag/web/assets/images

    ports:
      - ${PORT_WALLABAG:-${AUTO_PORT_WALLABAG}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}


