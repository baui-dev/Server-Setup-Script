# PRODUCTIVITY STACK
# Generated by scripts/generate-stacks.sh
# Services: actual-budget blinko donetick excalidraw hoarder joplin karakeep leadertask linkding linkwarden logseq memos notediscovery notesnook omnivore-api outline paperless-ai paperless-ngx plane planify serpbear siyuan stirlingpdf todometer trilium tududi vikunja wallabag
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f productivity-stack.yaml up -d

services:
  # ── actual-budget (services/productivity/finance/actual-budget/actual-budget.yaml)
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    hostname: actual-budget
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - ACTUAL_OPENID_DISCOVERY_URL=${ACTUAL_OPENID_DISCOVERY_URL} # Optional OIDC SSO provider

    volumes:
      - ${DOCKER_DATA}/productivity/finance/actual-budget/config:/config
      - ${DOCKER_DATA}/productivity/finance/actual-budget/data:/data

    ports:
      - ${PORT_ACTUAL_BUDGET:-${AUTO_PORT_ACTUAL_BUDGET}}:5006

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── blinko (services/productivity/notes/blinko.yaml)
  blinko:
    image: blinkospace/blinko:latest
    container_name: blinko
    hostname: blinko
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      # Database connection (PostgreSQL required)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@blinko-postgres:5432/blinko
      # NextAuth secret - generate with: openssl rand -hex 32
      - NEXTAUTH_SECRET=${BLINKO_NEXTAUTH_SECRET:-changeme_generate_a_real_secret}
      - NEXTAUTH_URL=https://${BASE_DOMAIN}
      # Application port inside the container
      - PORT=1111
      # -- AI provider (optional but recommended) --
      # OpenAI:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_MODEL=gpt-4o-mini
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # Ollama (self-hosted):
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - OLLAMA_MODEL=llama3.1
    volumes:
      - ${DOCKER_DATA}/blinko/data:/app/.blinko
    ports:
      - ${PORT_BLINKO:-${AUTO_PORT_BLINKO}}:1111
    depends_on:
      blinko-postgres:
        condition: service_healthy
    # networks:
    #   - ${DEFAULT_NETWORK}

  blinko-postgres:
    image: postgres:16-alpine
    container_name: blinko-postgres
    hostname: blinko-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=blinko
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/blinko/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d blinko"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── donetick (services/productivity/donetick.yaml)
  donetick:
    image: donetick/donetick:latest
    container_name: donetick
    hostname: donetick
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Application environment
      - DT_ENV=production
      # Database (SQLite by default, stored in the data volume)
      # - DT_DB_TYPE=sqlite   # sqlite or postgres
      # - DT_DB_HOST=donetick-postgres
      # - DT_DB_PORT=5432
      # - DT_DB_NAME=donetick
      # - DT_DB_USER=${POSTGRES_USER}
      # - DT_DB_PASSWORD=${POSTGRES_PASSWORD}
      # JWT / session secret
      - DT_JWT_SECRET=${DONETICK_JWT_SECRET:-changeme_generate_a_real_secret}
      # Server configuration
      - DT_PORT=3000
      # Optional: disable user registration
      # - DT_DISABLE_REGISTRATION=true
      # Optional: Telegram bot notifications
      # - DT_TELEGRAM_BOT_TOKEN=${DONETICK_TELEGRAM_TOKEN}
      # Optional: Pushover notifications
      # - DT_PUSHOVER_USER=${DONETICK_PUSHOVER_USER}
      # - DT_PUSHOVER_TOKEN=${DONETICK_PUSHOVER_TOKEN}
      # Optional: SMTP for email reminders
      # - DT_EMAIL_HOST=smtp.${BASE_DOMAIN}
      # - DT_EMAIL_PORT=587
      # - DT_EMAIL_FROM=donetick@${BASE_DOMAIN}
      # - DT_EMAIL_USER=${DONETICK_SMTP_USER}
      # - DT_EMAIL_PASSWORD=${DONETICK_SMTP_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/donetick/data:/donetick/data
    ports:
      - ${PORT_DONETICK:-${AUTO_PORT_DONETICK}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── excalidraw (services/productivity/excalidraw.yaml)
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    hostname: excalidraw
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Optional: point to a self-hosted storage/collaboration backend
      # VITE_APP_BACKEND_V2_GET_URL: https://excalidraw.${BASE_DOMAIN}/api/v2/scenes/
      # VITE_APP_BACKEND_V2_POST_URL: https://excalidraw.${BASE_DOMAIN}/api/v2/scenes/
      # VITE_APP_WS_SERVER_URL: wss://excalidraw-room.${BASE_DOMAIN}
      # VITE_APP_LIBRARY_URL: https://libraries.excalidraw.com
      # VITE_APP_LIBRARY_BACKEND: https://us-central1-excalidraw-room-persistence.cloudfunctions.net/rooms
    ports:
      - ${PORT_EXCALIDRAW:-${AUTO_PORT_EXCALIDRAW}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# Optional: Self-hosted collaboration room server (enables real-time multiplayer)
# excalidraw-room:
#   image: excalidraw/excalidraw-room:latest
#   container_name: excalidraw-room
#   hostname: excalidraw-room
#   restart: unless-stopped
#   ports:
#     - ${PORT_EXCALIDRAW_ROOM:-${AUTO_PORT_EXCALIDRAW_ROOM}}:80

# Optional: Self-hosted storage backend for persistent scenes
# excalidraw-storage:
#   image: excalidraw/excalidraw-storage-backend:latest
#   container_name: excalidraw-storage
#   hostname: excalidraw-storage
#   restart: unless-stopped
#   environment:
#     - STORAGE_DRIVER=filesystem
#     - STORAGE_PATH=/data
#   volumes:
#     - ${DOCKER_DATA}/excalidraw/storage:/data

# networks:
#   proxy:
#     external: true

  # ── hoarder (services/productivity/bookmarks/hoarder.yaml)
  hoarder:
    image: ghcr.io/hoarder-app/hoarder:release
    container_name: hoarder
    hostname: hoarder
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Authentication - generate with: openssl rand -hex 32
      - NEXTAUTH_SECRET=${HOARDER_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:${PORT_HOARDER:-${AUTO_PORT_HOARDER}}
      # Data directory inside the container
      - DATA_DIR=/data
      # Meilisearch integration (full-text search)
      - MEILI_ADDR=${HOARDER_MEILI_ADDR:-http://hoarder-meilisearch:7700}
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
      # Chromium for screenshots and link previews
      - BROWSER_WEB_URL=http://hoarder-chrome:9222
      # -- AI Tagging (choose one provider) --
      # OpenAI (recommended for best results):
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - INFERENCE_TEXT_MODEL=gpt-4o-mini
      # - INFERENCE_IMAGE_MODEL=gpt-4o-mini
      # Ollama (self-hosted, no API key needed):
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - INFERENCE_TEXT_MODEL=llama3.1
      # - INFERENCE_IMAGE_MODEL=llava
      # Language for AI inference
      # - INFERENCE_LANG=english
      # -- Optional settings --
      # Disable new user registration after initial setup:
      # - DISABLE_SIGNUPS=true
      # Max asset size for screenshots (bytes):
      # - MAX_ASSET_SIZE=4194304
      # Enable OAuth (e.g., Authentik, Authelia):
      # - OAUTH_WELLKNOWN_URL=https://auth.${BASE_DOMAIN}/.well-known/openid-configuration
      # - OAUTH_CLIENT_ID=${HOARDER_OAUTH_CLIENT_ID}
      # - OAUTH_CLIENT_SECRET=${HOARDER_OAUTH_CLIENT_SECRET}
    volumes:
      - ${DOCKER_DATA}/hoarder/data:/data
    ports:
      - ${PORT_HOARDER:-${AUTO_PORT_HOARDER}}:3000
    depends_on:
      - hoarder-meilisearch
      - hoarder-chrome
    # networks:
    #   - ${DEFAULT_NETWORK}

  hoarder-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: hoarder-chrome
    hostname: hoarder-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    # networks:
    #   - ${DEFAULT_NETWORK}

  hoarder-meilisearch:
    image: getmeili/meilisearch:v1.11.3
    container_name: hoarder-meilisearch
    hostname: hoarder-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
    volumes:
      - ${DOCKER_DATA}/hoarder/meilisearch:/meili_data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── joplin (services/productivity/notes/joplin/joplin.yaml)
  joplin:
    image: joplin/server:latest
    container_name: joplin
    hostname: joplin
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - APP_BASE_URL=http://localhost:22300                     # Public base URL (change to your domain)
      - APP_PORT=22300                                         # Application port
      # - DB_CLIENT=pg                                         # Database client (pg or sqlite3)
      # - POSTGRES_HOST=postgres                               # PostgreSQL host
      # - POSTGRES_PORT=5432                                   # PostgreSQL port
      # - POSTGRES_DATABASE=joplin                             # PostgreSQL database
      # - POSTGRES_USER=joplin                                 # PostgreSQL user
      # - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}               # PostgreSQL password

    volumes:
      - ${DOCKER_DATA}/productivity/joplin/config:/home/joplin

    ports:
      - ${PORT_JOPLIN:-${AUTO_PORT_JOPLIN}}:22300

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── karakeep (services/productivity/bookmarks/karakeep.yaml)
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    hostname: karakeep
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Authentication - generate with: openssl rand -hex 32
      - NEXTAUTH_SECRET=${HOARDER_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:${PORT_KARAKEEP:-${AUTO_PORT_KARAKEEP}}
      - DATA_DIR=/data
      # Meilisearch integration
      - MEILI_ADDR=http://karakeep-meilisearch:7700
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
      # Chromium for screenshots
      - BROWSER_WEB_URL=http://karakeep-chrome:9222
      # -- AI Tagging (choose one provider) --
      # OpenAI:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - INFERENCE_TEXT_MODEL=gpt-4o-mini
      # - INFERENCE_IMAGE_MODEL=gpt-4o-mini
      # Ollama (self-hosted):
      # - OLLAMA_BASE_URL=http://ollama:11434
      # - INFERENCE_TEXT_MODEL=llama3.1
      # - INFERENCE_IMAGE_MODEL=llava
      # - INFERENCE_LANG=english
      # -- Optional settings --
      # - DISABLE_SIGNUPS=true
      # - MAX_ASSET_SIZE=4194304
      # OAuth SSO:
      # - OAUTH_WELLKNOWN_URL=https://auth.${BASE_DOMAIN}/.well-known/openid-configuration
      # - OAUTH_CLIENT_ID=${KARAKEEP_OAUTH_CLIENT_ID}
      # - OAUTH_CLIENT_SECRET=${KARAKEEP_OAUTH_CLIENT_SECRET}
    volumes:
      - ${DOCKER_DATA}/karakeep/data:/data
    ports:
      - ${PORT_KARAKEEP:-${AUTO_PORT_KARAKEEP}}:3000
    depends_on:
      - karakeep-meilisearch
      - karakeep-chrome
    # networks:
    #   - ${DEFAULT_NETWORK}

  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: karakeep-chrome
    hostname: karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    # networks:
    #   - ${DEFAULT_NETWORK}

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.11.3
    container_name: karakeep-meilisearch
    hostname: karakeep-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${HOARDER_MEILI_KEY}
    volumes:
      - ${DOCKER_DATA}/karakeep/meilisearch:/meili_data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── leadertask (services/productivity/tasks/leadertask.yaml)
  leadertask:
    image: leadertask/server:latest
    container_name: leadertask
    hostname: leadertask
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NODE_ENV=production
      # License key (required for self-hosted edition)
      - LICENSE_KEY=${LEADERTASK_LICENSE_KEY}
      # Database connection
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@leadertask-postgres:5432/leadertask
      # Redis for sessions and queuing
      - REDIS_URL=redis://:${REDIS_PASSWORD}@leadertask-redis:6379
      # Security
      - JWT_SECRET=${LEADERTASK_JWT_SECRET:-changeme_generate_a_real_secret}
      # Application URL
      - APP_URL=https://${BASE_DOMAIN}
      - PORT=3000
    volumes:
      - ${DOCKER_DATA}/leadertask/data:/app/data
    ports:
      - ${PORT_LEADERTASK:-${AUTO_PORT_LEADERTASK}}:3000
    depends_on:
      - leadertask-postgres
      - leadertask-redis
    # networks:
    #   - ${DEFAULT_NETWORK}

  leadertask-postgres:
    image: postgres:16-alpine
    container_name: leadertask-postgres
    hostname: leadertask-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=leadertask
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/leadertask/postgres:/var/lib/postgresql/data
    # networks:
    #   - ${DEFAULT_NETWORK}

  leadertask-redis:
    image: redis:7-alpine
    container_name: leadertask-redis
    hostname: leadertask-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/leadertask/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── linkding (services/productivity/bookmarks/linkding.yaml)
  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    hostname: linkding
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Initial superuser credentials (only used if no superuser exists)
      - LD_SUPERUSER_NAME=${LINKDING_ADMIN_USER:-admin}
      - LD_SUPERUSER_PASSWORD=${LINKDING_ADMIN_PASSWORD:-changeme}
      # Optional: superuser email
      - LD_SUPERUSER_EMAIL=${LINKDING_ADMIN_EMAIL:-admin@example.com}
      # Disable public user registration (recommended for personal use)
      - LD_ENABLE_PUBLIC_SHARING=False
      # Context path if running behind a reverse proxy sub-path (e.g., /bookmarks)
      # - LD_CONTEXT_PATH=bookmarks/
      # Server port inside the container
      - LD_SERVER_PORT=9090
      # Enable authentication proxy support (e.g., Authelia, Authentik)
      # - LD_ENABLE_AUTH_PROXY=True
      # - LD_AUTH_PROXY_USERNAME_HEADER=HTTP_X_FORWARDED_USER
      # - LD_AUTH_PROXY_LOGOUT_URL=https://auth.${BASE_DOMAIN}/logout
      # Optional: custom DB backend (default is SQLite)
      # - LD_DB_ENGINE=postgres
      # - LD_DB_HOST=linkding-postgres
      # - LD_DB_NAME=linkding
      # - LD_DB_USER=${POSTGRES_USER}
      # - LD_DB_PASSWORD=${POSTGRES_PASSWORD}
      # - LD_DB_PORT=5432
    volumes:
      # Persists the SQLite database and favicon cache
      - ${DOCKER_DATA}/linkding/data:/etc/linkding/data
    ports:
      - ${PORT_LINKDING:-${AUTO_PORT_LINKDING}}:9090
    # networks:
    #   - ${DEFAULT_NETWORK}

# Uncomment to use a dedicated PostgreSQL backend instead of SQLite:
# linkding-postgres:
#   image: postgres:16-alpine
#   container_name: linkding-postgres
#   hostname: linkding-postgres
#   restart: unless-stopped
#   environment:
#     - POSTGRES_DB=linkding
#     - POSTGRES_USER=${POSTGRES_USER}
#     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
#   volumes:
#     - ${DOCKER_DATA}/linkding/postgres:/var/lib/postgresql/data

# networks:
#   proxy:
#     external: true

  # ── linkwarden (services/productivity/bookmarks/linkwarden/linkwarden.yaml)
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    hostname: linkwarden
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}                   # Auth secret (required)
      # - NEXTAUTH_URL=https://links.${BASE_DOMAIN}            # Public URL (required)
      # - DATABASE_URL=postgresql://user:pass@host:5432/linkwarden # PostgreSQL URL
      # - STORAGE_FOLDER=/data                                 # Storage folder for archives
      # - NEXT_PUBLIC_DISABLE_REGISTRATION=true                # Disable new registrations

    volumes:
      - ${DOCKER_DATA}/productivity/linkwarden/config:/data/data

    ports:
      - ${PORT_LINKWARDEN:-${AUTO_PORT_LINKWARDEN}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── logseq (services/productivity/notes/logseq.yaml)
  logseq:
    image: ghcr.io/logseq/logseq-web:latest
    container_name: logseq
    hostname: logseq
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      # Mount a local graph directory for the web app to read/write
      - ${DOCKER_DATA}/logseq/graph:/graph
      - ${DOCKER_DATA}/logseq/config:/config
    ports:
      - ${PORT_LOGSEQ:-${AUTO_PORT_LOGSEQ}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# Alternative: Use Syncthing to sync the Logseq graph folder across devices.
# See: compose/stacks/misc-stack/files-stack/backup-stacks/ for Syncthing config.

# networks:
#   proxy:
#     external: true

  # ── memos (services/productivity/notes/memos/memos.yaml)
  memos:
    image: neosmemo/memos:latest
    container_name: memos
    hostname: memos
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - MEMOS_MODE=prod                                      # Run mode (prod, dev)
      # - MEMOS_PORT=5230                                      # Listen port
      # - MEMOS_DRIVER=sqlite                                  # Database driver

    volumes:
      - ${DOCKER_DATA}/productivity/memos/config:/var/opt/memos

    ports:
      - ${PORT_MEMOS:-${AUTO_PORT_MEMOS}}:5230

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── notediscovery (services/productivity/notes/notediscovery.yaml)
  notediscovery:
    image: ghcr.io/notediscovery/notediscovery:latest
    container_name: notediscovery
    hostname: notediscovery
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NODE_ENV=production
      - PORT=3000
      # Security
      - SECRET=${NOTEDISCOVERY_SECRET:-changeme_generate_a_real_secret}
      # Database (SQLite default or PostgreSQL)
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notediscovery-postgres:5432/notediscovery
      # Base URL
      - BASE_URL=https://${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/notediscovery/data:/app/data
      - ${DOCKER_DATA}/notediscovery/notes:/app/notes
    ports:
      - ${PORT_NOTEDISCOVERY:-${AUTO_PORT_NOTEDISCOVERY}}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── notesnook (services/productivity/notes/notesnook.yaml)
  notesnook:
    image: streetwriters/notesnook-sync:latest
    container_name: notesnook
    hostname: notesnook
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # MongoDB connection
      - MONGODB_CONNECTION_STRING=mongodb://notesnook-mongo:27017
      - MONGODB_DATABASE_NAME=notesnook
      # Redis connection
      - REDIS_URL=redis://:${REDIS_PASSWORD}@notesnook-redis:6379
      # Application configuration
      - NODE_ENV=production
      - PORT=5264
      # JWT signing secrets (generate each with: openssl rand -hex 64)
      - NOTESNOOK_JWT_SECRET=${NOTESNOOK_JWT_SECRET:-changeme_generate_a_real_secret}
      # CORS allowed origins (set to your domain)
      - ALLOWED_ORIGINS=https://${BASE_DOMAIN}
      # Optional: SMTP for account verification and password reset
      # - SMTP_HOST=smtp.${BASE_DOMAIN}
      # - SMTP_PORT=587
      # - SMTP_USERNAME=${NOTESNOOK_SMTP_USER}
      # - SMTP_PASSWORD=${NOTESNOOK_SMTP_PASSWORD}
      # - SMTP_SENDER=notesnook@${BASE_DOMAIN}
    ports:
      - ${PORT_NOTESNOOK:-${AUTO_PORT_NOTESNOOK}}:5264
    depends_on:
      - notesnook-mongo
      - notesnook-redis
    # networks:
    #   - ${DEFAULT_NETWORK}

  notesnook-mongo:
    image: mongo:7
    container_name: notesnook-mongo
    hostname: notesnook-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=notesnook
    volumes:
      - ${DOCKER_DATA}/notesnook/mongo:/data/db
    # networks:
    #   - ${DEFAULT_NETWORK}

  notesnook-redis:
    image: redis:7-alpine
    container_name: notesnook-redis
    hostname: notesnook-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/notesnook/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── omnivore-api (services/productivity/bookmarks/omnivore-api.yaml)
  omnivore-api:
    image: ghcr.io/omnivore-app/omnivore-api:latest
    container_name: omnivore-api
    hostname: omnivore-api
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_ENV=production
      # Database
      - PG_HOST=omnivore-postgres
      - PG_PORT=5432
      - PG_DB=omnivore
      - PG_USER=${POSTGRES_USER}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@omnivore-redis:6379
      # Security
      - JWT_SECRET=${OMNIVORE_JWT_SECRET}
      - SSO_JWT_SECRET=${OMNIVORE_JWT_SECRET}
      # Application URLs
      - CLIENT_URL=https://${BASE_DOMAIN}
      - BACKEND_URL=https://${BASE_DOMAIN}/api
      # Content fetching (Puppeteer service)
      - PUPPETEER_URL=http://omnivore-puppeteer:9000
      # Optional: email for notifications
      # - SENDGRID_API_KEY=${OMNIVORE_SENDGRID_KEY}
      # - SENDGRID_SENDER_EMAIL=omnivore@${BASE_DOMAIN}
      # Optional: Disable sign-up to only allow invited users
      # - DISABLE_EMAIL_REGISTRATION=true
    depends_on:
      omnivore-postgres:
        condition: service_healthy
      omnivore-redis:
        condition: service_started
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-web:
    image: ghcr.io/omnivore-app/omnivore-web:latest
    container_name: omnivore-web
    hostname: omnivore-web
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NEXT_PUBLIC_APP_ENV=prod
      - NEXT_PUBLIC_BASE_URL=https://${BASE_DOMAIN}
      - NEXT_PUBLIC_SERVER_BASE_URL=http://omnivore-api:8080
      - NEXT_PUBLIC_HIGHLIGHTS_BASE_URL=https://${BASE_DOMAIN}
    ports:
      - ${PORT_OMNIVORE:-${AUTO_PORT_OMNIVORE}}:3000
    depends_on:
      - omnivore-api
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-puppeteer:
    image: ghcr.io/omnivore-app/omnivore-puppeteer-parse:latest
    container_name: omnivore-puppeteer
    hostname: omnivore-puppeteer
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@omnivore-redis:6379
    depends_on:
      - omnivore-redis
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-postgres:
    image: ankane/pgvector:latest
    container_name: omnivore-postgres
    hostname: omnivore-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=omnivore
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/omnivore/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d omnivore"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  omnivore-redis:
    image: redis:7-alpine
    container_name: omnivore-redis
    hostname: omnivore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/omnivore/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── outline (services/productivity/notes/outline/outline.yaml)
  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    hostname: outline
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SECRET_KEY=${SECRET_KEY}                             # 32-char hex secret (required)
      # - UTILS_SECRET=${UTILS_SECRET}                         # Utils secret (required)
      # - DATABASE_URL=postgres://user:pass@host:5432/outline  # PostgreSQL connection URL
      # - REDIS_URL=redis://redis:6379                         # Redis connection URL
      # - URL=https://wiki.${BASE_DOMAIN}                      # Public URL (required)
      # - PORT=3000                                            # Internal port
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}               # S3 storage access key
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}       # S3 storage secret key
      # - AWS_REGION=us-east-1                                 # S3 region
      # - AWS_S3_UPLOAD_BUCKET_NAME=outline                    # S3 bucket name

    volumes:
      - ${DOCKER_DATA}/productivity/outline/config:/var/lib/outline/data

    ports:
      - ${PORT_OUTLINE:-${AUTO_PORT_OUTLINE}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── paperless-ai (services/productivity/documents/paperless-ai.yaml)
  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: paperless-ai
    hostname: paperless-ai
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Paperless-ngx connection
      - PAPERLESS_API_URL=http://paperless-ngx:8000
      - PAPERLESS_API_TOKEN=${PAPERLESS_AI_API_TOKEN}
      # AI provider: "openai" or "ollama"
      - AI_PROVIDER=${PAPERLESS_AI_PROVIDER:-openai}
      # -- OpenAI configuration --
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${PAPERLESS_AI_MODEL:-gpt-4o-mini}
      # Optional: custom OpenAI-compatible API endpoint (e.g., LiteLLM proxy)
      # - OPENAI_API_BASE=https://api.openai.com/v1
      # -- Ollama configuration (if AI_PROVIDER=ollama) --
      - OLLAMA_API_URL=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${PAPERLESS_OLLAMA_MODEL:-llama3.1}
      # Processing interval (minutes between checks for new documents)
      - SCAN_INTERVAL=${PAPERLESS_AI_SCAN_INTERVAL:-30}
      # Optional: tags, correspondents, and document types to assign by AI
      # - PROCESS_PREDEFINED_DOCUMENTS=true
      # Optional: language for AI analysis
      - AI_LANGUAGE=${PAPERLESS_AI_LANGUAGE:-English}
    volumes:
      - ${DOCKER_DATA}/paperless-ai/data:/app/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── paperless-ngx (services/productivity/documents/paperless-ngx.yaml)
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    hostname: paperless-ngx
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Redis broker (required)
      - PAPERLESS_REDIS=redis://:${REDIS_PASSWORD}@paperless-redis:6379
      # PostgreSQL database (required)
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=paperless-postgres
      - PAPERLESS_DBPORT=5432
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=${POSTGRES_USER}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
      # Security
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      # Public URL (used for links in emails and API responses)
      - PAPERLESS_URL=${PAPERLESS_URL:-https://paperless.${BASE_DOMAIN}}
      # Admin user created on first run
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_ADMIN_MAIL=${PAPERLESS_ADMIN_MAIL:-admin@example.com}
      # User/group mapping (match your host PUID/PGID)
      - USERMAP_UID=${PUID:-1000}
      - USERMAP_GID=${PGID:-1000}
      # OCR settings
      - PAPERLESS_OCR_LANGUAGE=eng
      # Comma-separated list of additional languages: eng+deu+fra etc.
      # Install language packs by adding to PAPERLESS_OCR_LANGUAGE
      - PAPERLESS_TIME_ZONE=${TZ}
      # Optional: document retention and processing
      - PAPERLESS_OCR_MODE=skip           # skip (only OCR non-searchable), redo, force
      - PAPERLESS_OCR_SKIP_ARCHIVE_FILE=never  # never, always, with_text
      # Optional: consumer polling (for folder-based ingestion)
      - PAPERLESS_CONSUMER_POLLING=0       # 0 = inotify (recommended), or polling interval in seconds
      # Optional: auto-tag / auto-classify
      # - PAPERLESS_ENABLE_NLTK=true
      # Optional: TIKA for enhanced document parsing (Word, Excel, etc.)
      # - PAPERLESS_TIKA_ENABLED=1
      # - PAPERLESS_TIKA_ENDPOINT=http://paperless-tika:9998
      # - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
      # Optional: email consumption
      # - PAPERLESS_EMAIL_TASK_CRON=*/10 * * * *
      # Optional: trash documents instead of permanent delete
      - PAPERLESS_EMPTY_TRASH_DELAY=30    # days before permanent deletion
      # Optional: SMTP for sending notifications
      # - PAPERLESS_EMAIL_HOST=smtp.${BASE_DOMAIN}
      # - PAPERLESS_EMAIL_PORT=587
      # - PAPERLESS_EMAIL_HOST_USER=${PAPERLESS_SMTP_USER}
      # - PAPERLESS_EMAIL_HOST_PASSWORD=${PAPERLESS_SMTP_PASSWORD}
      # - PAPERLESS_EMAIL_USE_TLS=true
    volumes:
      - ${DOCKER_DATA}/paperless-ngx/data:/usr/src/paperless/data
      - ${DOCKER_DATA}/paperless-ngx/media:/usr/src/paperless/media
      # Export directory for backups (paperless-ngx document_exporter)
      - ${DOCKER_DATA}/paperless-ngx/export:/usr/src/paperless/export
      # Consume folder: drop documents here for automatic ingestion
      - ${DOCKER_DATA}/paperless-ngx/consume:/usr/src/paperless/consume
    ports:
      - ${PORT_PAPERLESS_NGX:-${AUTO_PORT_PAPERLESS_NGX}}:8000
    depends_on:
      paperless-postgres:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-postgres:
    image: postgres:16-alpine
    container_name: paperless-postgres
    hostname: paperless-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/paperless-ngx/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    hostname: paperless-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/paperless-ngx/redis:/data
    # networks:
    #   - ${DEFAULT_NETWORK}

# Optional: Apache Tika for Word/Excel/PowerPoint parsing
# paperless-tika:
#   image: apache/tika:latest
#   container_name: paperless-tika
#   hostname: paperless-tika
#   restart: unless-stopped
#
# Optional: Gotenberg for PDF conversion from office formats
# paperless-gotenberg:
#   image: gotenberg/gotenberg:latest
#   container_name: paperless-gotenberg
#   hostname: paperless-gotenberg
#   restart: unless-stopped
#   command:
#     - gotenberg
#     - --chromium-disable-javascript=true
#     - --chromium-allow-list=file:///tmp/.*

# networks:
