# PRODUCTIVITY STACK
# Generated by scripts/generate-stacks.py
# Services: joplin, outline, memos, linkwarden, wallabag, vikunja, plane
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  joplin:
    image: joplin/server:latest
    container_name: joplin
    hostname: joplin
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - APP_BASE_URL=http://localhost:22300
    - APP_PORT=22300
    volumes:
    - ${DOCKER_DATA}/productivity/joplin/config:/home/joplin
    ports:
    - ${PORT_JOPLIN:-22300}:22300
  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    hostname: outline
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/productivity/outline/config:/var/lib/outline/data
    ports:
    - ${PORT_OUTLINE:-3900}:3000
  memos:
    image: neosmemo/memos:latest
    container_name: memos
    hostname: memos
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/productivity/memos/config:/var/opt/memos
    ports:
    - ${PORT_MEMOS:-5230}:5230
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    hostname: linkwarden
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/productivity/linkwarden/config:/data/data
    ports:
    - ${PORT_LINKWARDEN:-3300}:3000
  wallabag:
    image: wallabag/wallabag:latest
    container_name: wallabag
    hostname: wallabag
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/productivity/wallabag/config:/var/www/wallabag/data
    - ${DOCKER_DATA}/productivity/wallabag/images:/var/www/wallabag/web/assets/images
    ports:
    - ${PORT_WALLABAG:-8760}:80
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    hostname: vikunja
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/productivity/vikunja/config:/app/vikunja/files
    ports:
    - ${PORT_VIKUNJA:-3456}:3456
  plane:
    image: makeplane/plane-frontend:latest
    container_name: plane
    hostname: plane
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/productivity/plane/config:/code/plane
    ports:
    - ${PORT_PLANE:-8970}:80
