# PRODUCTIVITY STACK
# Generated by scripts/generate-stacks.sh
# Services: joplin outline memos linkwarden wallabag vikunja plane
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f productivity-stack.yaml up -d

services:
  # ── joplin (services/productivity/notes/joplin/joplin.yaml)
  joplin:
    image: joplin/server:latest
    container_name: joplin
    hostname: joplin
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - APP_BASE_URL=http://localhost:22300                     # Public base URL (change to your domain)
      - APP_PORT=22300                                         # Application port
      # - DB_CLIENT=pg                                         # Database client (pg or sqlite3)
      # - POSTGRES_HOST=postgres                               # PostgreSQL host
      # - POSTGRES_PORT=5432                                   # PostgreSQL port
      # - POSTGRES_DATABASE=joplin                             # PostgreSQL database
      # - POSTGRES_USER=joplin                                 # PostgreSQL user
      # - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}               # PostgreSQL password

    volumes:
      - ${DOCKER_DATA}/productivity/joplin/config:/home/joplin

    ports:
      - ${PORT_JOPLIN:-22300}:22300

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── outline (services/productivity/notes/outline/outline.yaml)
  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    hostname: outline
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SECRET_KEY=${SECRET_KEY}                             # 32-char hex secret (required)
      # - UTILS_SECRET=${UTILS_SECRET}                         # Utils secret (required)
      # - DATABASE_URL=postgres://user:pass@host:5432/outline  # PostgreSQL connection URL
      # - REDIS_URL=redis://redis:6379                         # Redis connection URL
      # - URL=https://wiki.${BASE_DOMAIN}                      # Public URL (required)
      # - PORT=3000                                            # Internal port
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}               # S3 storage access key
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}       # S3 storage secret key
      # - AWS_REGION=us-east-1                                 # S3 region
      # - AWS_S3_UPLOAD_BUCKET_NAME=outline                    # S3 bucket name

    volumes:
      - ${DOCKER_DATA}/productivity/outline/config:/var/lib/outline/data

    ports:
      - ${PORT_OUTLINE:-3900}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── memos (services/productivity/notes/memos/memos.yaml)
  memos:
    image: neosmemo/memos:latest
    container_name: memos
    hostname: memos
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - MEMOS_MODE=prod                                      # Run mode (prod, dev)
      # - MEMOS_PORT=5230                                      # Listen port
      # - MEMOS_DRIVER=sqlite                                  # Database driver

    volumes:
      - ${DOCKER_DATA}/productivity/memos/config:/var/opt/memos

    ports:
      - ${PORT_MEMOS:-5230}:5230

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── linkwarden (services/productivity/bookmarks/linkwarden/linkwarden.yaml)
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    hostname: linkwarden
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}                   # Auth secret (required)
      # - NEXTAUTH_URL=https://links.${BASE_DOMAIN}            # Public URL (required)
      # - DATABASE_URL=postgresql://user:pass@host:5432/linkwarden # PostgreSQL URL
      # - STORAGE_FOLDER=/data                                 # Storage folder for archives
      # - NEXT_PUBLIC_DISABLE_REGISTRATION=true                # Disable new registrations

    volumes:
      - ${DOCKER_DATA}/productivity/linkwarden/config:/data/data

    ports:
      - ${PORT_LINKWARDEN:-3300}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── wallabag (services/productivity/bookmarks/wallabag/wallabag.yaml)
  wallabag:
    image: wallabag/wallabag:latest
    container_name: wallabag
    hostname: wallabag
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SYMFONY__ENV__DOMAIN_NAME=https://wallabag.${BASE_DOMAIN} # Public URL
      # - SYMFONY__ENV__DATABASE_DRIVER=pdo_sqlite              # Database driver
      # - SYMFONY__ENV__SECRET=${SYMFONY_SECRET}                # App secret key
      # - SYMFONY__ENV__FOSUSER_REGISTRATION=false              # Disable registration

    volumes:
      - ${DOCKER_DATA}/productivity/wallabag/config:/var/www/wallabag/data
      - ${DOCKER_DATA}/productivity/wallabag/images:/var/www/wallabag/web/assets/images

    ports:
      - ${PORT_WALLABAG:-8760}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── vikunja (services/productivity/tasks/vikunja/vikunja.yaml)
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    hostname: vikunja
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - VIKUNJA_SERVICE_PUBLICURL=https://tasks.${BASE_DOMAIN}/ # Public URL
      # - VIKUNJA_SERVICE_JWTSECRET=${JWT_SECRET}                # JWT secret key
      # - VIKUNJA_DATABASE_TYPE=sqlite                           # Database type
      # - VIKUNJA_SERVICE_ENABLEREGISTRATION=true                # Allow new registrations

    volumes:
      - ${DOCKER_DATA}/productivity/vikunja/config:/app/vikunja/files

    ports:
      - ${PORT_VIKUNJA:-3456}:3456

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── plane (services/productivity/tasks/plane/plane.yaml)
  plane:
    image: makeplane/plane-frontend:latest
    container_name: plane
    hostname: plane
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - NEXT_PUBLIC_API_BASE_URL=https://plane.${BASE_DOMAIN}  # API base URL
      # - SECRET_KEY=${SECRET_KEY}                               # App secret key (required)

    volumes:
      - ${DOCKER_DATA}/productivity/plane/config:/code/plane

    ports:
      - ${PORT_PLANE:-8970}:80

    # networks:
    #   - ${DEFAULT_NETWORK}


