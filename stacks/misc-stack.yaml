# MISC STACK
# Generated by scripts/generate-stacks.py
# Services: qbittorrent, sabnzbd, autobrr, recyclarr, flaresolverr
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    - WEBUI_PORT=8085
    volumes:
    - ${DOCKER_DATA}/misc/qbittorrent/config:/config
    ports:
    - ${PORT_QBITTORRENT:-8085}:8085
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    hostname: sabnzbd
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    volumes:
    - ${DOCKER_DATA}/misc/sabnzbd/config:/config
    ports:
    - ${PORT_SABNZBD:-8080}:8080
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    hostname: autobrr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/misc/autobrr/config:/config
    ports:
    - ${PORT_AUTOBRR:-7474}:7474
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    hostname: recyclarr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/misc/recyclarr/config:/config
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    - LOG_LEVEL=info
    ports:
    - ${PORT_FLARESOLVERR:-8191}:8191
