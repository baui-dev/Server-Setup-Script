# MISC STACK
# Generated by scripts/generate-stacks.sh
# Services: compose-toolbox convertx mealie meilisearch redlib
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f misc-stack.yaml up -d

services:
  # ── compose-toolbox (services/misc/compose-toolbox.yaml)
  compose-toolbox:
    image: louislam/dockge:1
    container_name: compose-toolbox
    hostname: compose-toolbox
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # The URL used to access the Dockge web UI
      - DOCKGE_STACKS_DIR=/opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/compose-toolbox/data:/app/data
      # Mount the directory where your compose stacks live so Dockge can manage them
      - ${DOCKER_DATA}/compose-toolbox/stacks:/opt/stacks
    ports:
      - ${PORT_COMPOSE_TOOLBOX:-${AUTO_PORT_COMPOSE_TOOLBOX}}:5001
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── convertx (services/misc/convertx.yaml)
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    container_name: convertx
    hostname: convertx
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # JWT secret for session tokens — change to a long random string
      - JWT_SECRET=${CONVERTX_JWT_SECRET:-changeme_use_a_long_random_string}
      # Account registration: set to false to disable new signups after setup
      - ALLOW_UNAUTHENTICATED=false
      # Base URL for generating download links
      # - HTTP_ALLOWED_ORIGIN=https://convertx.${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/convertx/data:/app/data
    ports:
      - ${PORT_CONVERTX}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── mealie (services/misc/mealie.yaml)
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    hostname: mealie
    restart: unless-stopped
    depends_on:
      mealie-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Application settings
      - ALLOW_SIGNUP=${MEALIE_ALLOW_SIGNUP:-false}
      - DEFAULT_EMAIL=${MEALIE_DEFAULT_EMAIL:-admin@example.com}
      - DEFAULT_PASSWORD=${MEALIE_DEFAULT_PASSWORD:-changeme}
      - DEFAULT_GROUP=Home
      - BASE_URL=https://mealie.${BASE_DOMAIN}
      # Database — PostgreSQL
      - DB_ENGINE=postgres
      - POSTGRES_USER=${POSTGRES_USER:-mealie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SERVER=mealie-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      # Token lifetime in hours
      - TOKEN_TIME=48
      # Max workers for the API server
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      # SMTP (optional)
      # - SMTP_HOST=
      # - SMTP_PORT=587
      # - SMTP_FROM_NAME=Mealie
      # - SMTP_FROM_EMAIL=
      # - SMTP_AUTH_STRATEGY=TLS
      # - SMTP_USER=
      # - SMTP_PASSWORD=
    volumes:
      - ${DOCKER_DATA}/mealie/data:/app/data
    ports:
      - ${PORT_MEALIE}:9000
    # networks:
    #   - ${DEFAULT_NETWORK}

  mealie-db:
    image: postgres:16-alpine
    container_name: mealie-db
    hostname: mealie-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-mealie}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mealie
    volumes:
      - ${DOCKER_DATA}/mealie/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealie} -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── meilisearch (services/misc/meilisearch.yaml)
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    hostname: meilisearch
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Environment: production or development
      # production disables the search preview UI at /
      - MEILI_ENV=production
      # Master key (min 16 bytes). Used to generate API keys for search/admin.
      # Required in production mode.
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY}
      # HTTP address to bind (default: localhost:7700 — override to 0.0.0.0 for container)
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      # Database path inside the container
      - MEILI_DB_PATH=/meili_data
      # Dump and snapshot directories
      - MEILI_DUMP_DIR=/meili_data/dumps
      - MEILI_SNAPSHOT_DIR=/meili_data/snapshots
      # Optionally set a maximum index size (bytes)
      # - MEILI_MAX_INDEX_SIZE=107374182400
      # Enable snapshots (uncomment to enable automatic snapshots)
      # - MEILI_SCHEDULE_SNAPSHOT=true
      # - MEILI_SNAPSHOT_INTERVAL_SEC=86400
    volumes:
      - ${DOCKER_DATA}/meilisearch/data:/meili_data
    ports:
      - ${PORT_MEILISEARCH}:7700
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── redlib (services/misc/redlib.yaml)
  redlib:
    image: quay.io/redlib/redlib:latest
    container_name: redlib
    hostname: redlib
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      # UI defaults (can be overridden per user in settings)
      - REDLIB_DEFAULT_THEME=system
      - REDLIB_DEFAULT_FRONT_PAGE=default
      - REDLIB_DEFAULT_LAYOUT=card
      - REDLIB_DEFAULT_WIDE=false
      - REDLIB_DEFAULT_POST_SORT=hot
      - REDLIB_DEFAULT_COMMENT_SORT=confidence
      - REDLIB_DEFAULT_SHOW_NSFW=false
      - REDLIB_DEFAULT_BLUR_NSFW=true
      - REDLIB_DEFAULT_USE_HLS=false
      - REDLIB_DEFAULT_HIDE_HLS_NOTIFICATION=false
      - REDLIB_DEFAULT_AUTOPLAY_VIDEOS=false
      # SFW-only mode: blocks all NSFW content regardless of user preference
      - REDLIB_SFW_ONLY=false
      # Robots.txt: set to true to block indexing
      - REDLIB_ROBOTS_DISABLE_INDEXING=false
      # Optionally restrict to specific subreddits (comma-separated)
      # - REDLIB_PUSHSHIFT_FRONTEND=
    ports:
      - ${PORT_REDLIB:-${AUTO_PORT_REDLIB}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true


