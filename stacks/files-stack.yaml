# FILES STACK
# Generated by scripts/generate-stacks.sh
# Services: nextcloud filebrowser minio
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f files-stack.yaml up -d

services:
  # ── nextcloud (services/files/nextcloud/nextcloud.yaml)
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions
      # - NEXTCLOUD_ADMIN_USER=admin                           # Initial admin username
      # - NEXTCLOUD_ADMIN_PASSWORD=changeme                    # Initial admin password
      # - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${BASE_DOMAIN}       # Trusted domain(s)
      # - MYSQL_HOST=mariadb                                   # Database host
      # - MYSQL_DATABASE=nextcloud                             # Database name
      # - MYSQL_USER=nextcloud                                 # Database user
      # - MYSQL_PASSWORD=${MYSQL_PASSWORD}                     # Database password

    volumes:
      - ${DOCKER_DATA}/files/nextcloud/config:/var/www/html
      # - /path/to/data:/var/www/html/data                     # User data directory

    ports:
      - ${PORT_NEXTCLOUD:-8880}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── filebrowser (services/files/filebrowser/filebrowser.yaml)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/files/filebrowser/config:/config
      - ${DOCKER_DATA}/files/filebrowser/database:/database
      # - /path/to/files:/srv                                  # Root directory to browse

    ports:
      - ${PORT_FILEBROWSER:-8888}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── minio (services/files/minio/minio.yaml)
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      - TZ=${TZ}
      # - MINIO_ROOT_USER=admin                                # Admin username (min 3 chars)
      # - MINIO_ROOT_PASSWORD=changeme                         # Admin password (min 8 chars)
      # - MINIO_BROWSER_REDIRECT_URL=https://minio.${BASE_DOMAIN} # Console redirect URL
      # - MINIO_SERVER_URL=https://s3.${BASE_DOMAIN}           # S3 API URL

    volumes:
      - ${DOCKER_DATA}/files/minio/data:/data

    ports:
      - ${PORT_MINIO:-9000}:9000                               # S3 API
      - ${PORT_MINIO_CONSOLE:-9001}:9001                       # Web console

    # networks:
    #   - ${DEFAULT_NETWORK}


