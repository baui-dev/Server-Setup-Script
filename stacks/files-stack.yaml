# FILES STACK
# Generated by scripts/generate-stacks.sh
# Services: alist alist-sync archivebox bichon cloudreve copyparty duplicati enclosed filebrowser filerise foxel minio nextcloud opencloud oxicloud pairdrop palmr pydio seafile spacedrive unison zerotier zipline
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f files-stack.yaml up -d

services:
  # ── alist (services/files/alist.yaml)
  alist:
    image: xhofe/alist:latest
    container_name: alist
    hostname: alist
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Set to true to force a password reset on next start
      - ALIST_FORCE_RESET_PASSWORD=false
    volumes:
      - ${DOCKER_DATA}/alist/data:/opt/alist/data
    ports:
      - ${PORT_ALIST}:5244
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── alist-sync (services/files/backup/alist-sync.yaml)
  alist-sync:
    image: ghcr.io/alist-org/alist-sync:latest
    container_name: alist-sync
    hostname: alist-sync
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # AList base URL and admin token
      - ALIST_BASE_URL=http://alist:5244
      - ALIST_TOKEN=${ALIST_ADMIN_TOKEN:-changeme}
      # Sync schedule (cron format)
      - SYNC_CRON=0 3 * * *
      # Source and destination paths within AList (e.g. /local/backup -> /onedrive/backup)
      - SYNC_SRC=/local/source
      - SYNC_DST=/remote/destination
      # Sync mode: copy | sync | move
      - SYNC_MODE=copy
      # Delete destination files not present in source (sync mode only)
      - SYNC_DELETE=false
    volumes:
      - ${DOCKER_DATA}/alist-sync/config:/app/config
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── archivebox (services/files/archivebox.yaml)
  archivebox:
    image: archivebox/archivebox:latest
    container_name: archivebox
    hostname: archivebox
    restart: unless-stopped
    command: server --quick-init 0.0.0.0:8000
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Admin credentials — set before first run
      - ADMIN_USERNAME=${ARCHIVEBOX_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ARCHIVEBOX_ADMIN_PASSWORD:-changeme}
      # Allow public access without login
      - PUBLIC_INDEX=false
      - PUBLIC_SNAPSHOTS=false
      - PUBLIC_ADD_VIEW=false
      # Public-facing URL (important for assets and links)
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=https://archivebox.${BASE_DOMAIN}
      # Storage backends to enable (all enabled by default)
      - SAVE_TITLE=true
      - SAVE_FAVICON=true
      - SAVE_WGET=true
      - SAVE_WARC=true
      - SAVE_PDF=true
      - SAVE_SCREENSHOT=true
      - SAVE_DOM=true
      - SAVE_SINGLEFILE=true
      # Chrome/Chromium binary (bundled in the image)
      # - CHROME_BINARY=chromium-browser
      # Search backend (uncomment to enable full-text search)
      # - SEARCH_BACKEND_ENGINE=sonic
      # - SEARCH_BACKEND_HOST_NAME=sonic
      # - SEARCH_BACKEND_PORT=1491
      # - SEARCH_BACKEND_PASSWORD=changeme
    volumes:
      - ${DOCKER_DATA}/archivebox/data:/data
    ports:
      - ${PORT_ARCHIVEBOX}:8000
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── bichon (services/files/bichon.yaml)
  bichon:
    image: offen/docker-volume-backup:latest
    container_name: bichon
    hostname: bichon
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Cron schedule for automatic backups (default: daily at 02:00)
      - BACKUP_CRON_EXPRESSION=0 2 * * *
      # Archive filename prefix
      - BACKUP_FILENAME=bichon-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      # Retention: prune backups older than N days
      - BACKUP_RETENTION_DAYS=7
      # Local storage directory inside the container
      - BACKUP_ARCHIVE=/archive
      # Optional: encrypt with GPG passphrase
      # - GPG_PASSPHRASE=
      # Optional: push to S3-compatible storage
      # - AWS_S3_BUCKET_NAME=my-backups
      # - AWS_S3_PATH=bichon
      # - AWS_ENDPOINT=
      # - AWS_ACCESS_KEY_ID=
      # - AWS_SECRET_ACCESS_KEY=
      # Optional: push via SFTP
      # - SSH_HOST_NAME=
      # - SSH_PORT=22
      # - SSH_USER=
      # - SSH_PASSWORD=
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Target volumes to back up (add as many as needed)
      - ${DOCKER_DATA}:/backup/data:ro
      # Local archive destination
      - ${DOCKER_DATA}/bichon/archives:/archive
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── cloudreve (services/files/cloud/cloudreve.yaml)
  cloudreve:
    image: cloudreve/cloudreve:latest
    container_name: cloudreve
    hostname: cloudreve
    restart: unless-stopped
    depends_on:
      cloudreve-db:
        condition: service_healthy
      cloudreve-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKER_DATA}/cloudreve/uploads:/cloudreve/uploads
      - ${DOCKER_DATA}/cloudreve/avatar:/cloudreve/avatar
      # The conf.ini is generated on first run inside /cloudreve
      - ${DOCKER_DATA}/cloudreve/config:/cloudreve
      # Aria2 downloads directory (optional)
      # - ${DOCKER_DATA}/cloudreve/downloads:/downloads
    ports:
      - ${PORT_CLOUDREVE:-${AUTO_PORT_CLOUDREVE}}:5212
    # networks:
    #   - ${DEFAULT_NETWORK}

  cloudreve-db:
    image: mariadb:11
    container_name: cloudreve-db
    hostname: cloudreve-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=cloudreve
      - MYSQL_USER=${MYSQL_USER:-cloudreve}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/cloudreve/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  cloudreve-redis:
    image: redis:7-alpine
    container_name: cloudreve-redis
    hostname: cloudreve-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── copyparty (services/files/cloud/copyparty.yaml)
  copyparty:
    image: ghcr.io/9001/copyparty:latest
    container_name: copyparty-manager
    hostname: copyparty-manager
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/copyparty/config:/cfg
      # Data volumes — map directories to serve (configure accounts in args/config)
      - ${DOCKER_DATA}/copyparty/files:/files
    ports:
      - ${PORT_COPYPARTY}:3923
    # Optional: pass CopyParty arguments via command
    # command: --cfg /cfg/copyparty.conf
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── duplicati (services/files/backup/duplicati.yaml)
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    hostname: duplicati
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Optional: CLI arguments appended to the server start command
      # - CLI_ARGS=--webservice-password=changeme
    volumes:
      - ${DOCKER_DATA}/duplicati/config:/config
      # Backup destination for local backups
      - ${DOCKER_DATA}/duplicati/backups:/backups
      # Source data to back up — mount all directories you want to protect
      - ${DOCKER_DATA}:/source:ro
      # Optionally mount additional locations
      # - /mnt/nas:/mnt/nas:ro
      # - /home:/home:ro
    ports:
      - ${PORT_DUPLICATI}:8200
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── enclosed (services/files/enclosed.yaml)
  enclosed:
    image: ghcr.io/corentinth/enclosed:latest
    container_name: enclosed
    hostname: enclosed
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Storage type: 'fs' (filesystem) or 's3'
      - STORAGE_DRIVER=fs
      - STORAGE_FS_FOLDER_PATH=/app/data/storage
      # Set to 'true' to enable authentication (requires login to create notes)
      - AUTH_IS_AUTH_REQUIRED=false
      # Authentication credentials when AUTH_IS_AUTH_REQUIRED is true
      # - AUTH_ADMIN_USERNAME=admin
      # - AUTH_ADMIN_PASSWORD=changeme
      # Maximum note size in bytes (default: 5 MB)
      # - NOTE_MAX_ENCRYPTED_PAYLOAD_LENGTH=5242880
      # Public-facing URL
      # - PUBLIC_BASE_URL=https://enclosed.${BASE_DOMAIN}
    volumes:
      - ${DOCKER_DATA}/enclosed/data:/app/data
    ports:
      - ${PORT_ENCLOSED}:8787
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── filebrowser (services/files/filebrowser/filebrowser.yaml)
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions

    volumes:
      - ${DOCKER_DATA}/files/filebrowser/config:/config
      - ${DOCKER_DATA}/files/filebrowser/database:/database
      # - /path/to/files:/srv                                  # Root directory to browse

    ports:
      - ${PORT_FILEBROWSER:-${AUTO_PORT_FILEBROWSER}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── filerise (services/files/filerise.yaml)
  filerise:
    image: error311/filerise:latest
    container_name: filerise
    hostname: filerise
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${DOCKER_DATA}/filerise/config:/var/www/html/config
      - ${DOCKER_DATA}/filerise/uploads:/var/www/html/uploads
    ports:
      - ${PORT_FILERISE}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── foxel (services/files/cloud/foxel.yaml)
  foxel:
    image: foxel/foxel:latest
    container_name: foxel
    hostname: foxel
    restart: unless-stopped
    depends_on:
      foxel-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Database connection
      - DB_HOST=foxel-db
      - DB_PORT=3306
      - DB_DATABASE=foxel
      - DB_USERNAME=${MYSQL_USER:-foxel}
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Application key (generate with: openssl rand -base64 32)
      - APP_KEY=${FOXEL_APP_KEY:-changeme_use_openssl_rand_base64_32}
      - APP_URL=https://foxel.${BASE_DOMAIN}
      - APP_ENV=production
    volumes:
      - ${DOCKER_DATA}/foxel/storage:/var/www/html/storage
      - ${DOCKER_DATA}/foxel/photos:/var/www/html/public/photos
    ports:
      - ${PORT_FOXEL:-${AUTO_PORT_FOXEL}}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

  foxel-db:
    image: mariadb:11
    container_name: foxel-db
    hostname: foxel-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=foxel
      - MYSQL_USER=${MYSQL_USER:-foxel}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/foxel/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── minio (services/files/minio/minio.yaml)
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      - TZ=${TZ}
      # - MINIO_ROOT_USER=admin                                # Admin username (min 3 chars)
      # - MINIO_ROOT_PASSWORD=changeme                         # Admin password (min 8 chars)
      # - MINIO_BROWSER_REDIRECT_URL=https://minio.${BASE_DOMAIN} # Console redirect URL
      # - MINIO_SERVER_URL=https://s3.${BASE_DOMAIN}           # S3 API URL

    volumes:
      - ${DOCKER_DATA}/files/minio/data:/data

    ports:
      - ${PORT_MINIO:-${AUTO_PORT_MINIO}}:9000                               # S3 API
      - ${PORT_MINIO_CONSOLE:-${AUTO_PORT_MINIO_CONSOLE}}:9001                       # Web console

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── nextcloud (services/files/nextcloud/nextcloud.yaml)
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - PUID=${PUID}                                         # User ID for file permissions
      # - PGID=${PGID}                                         # Group ID for file permissions
      # - NEXTCLOUD_ADMIN_USER=admin                           # Initial admin username
      # - NEXTCLOUD_ADMIN_PASSWORD=changeme                    # Initial admin password
      # - NEXTCLOUD_TRUSTED_DOMAINS=cloud.${BASE_DOMAIN}       # Trusted domain(s)
      # - MYSQL_HOST=mariadb                                   # Database host
      # - MYSQL_DATABASE=nextcloud                             # Database name
      # - MYSQL_USER=nextcloud                                 # Database user
      # - MYSQL_PASSWORD=${MYSQL_PASSWORD}                     # Database password

    volumes:
      - ${DOCKER_DATA}/files/nextcloud/config:/var/www/html
      # - /path/to/data:/var/www/html/data                     # User data directory

    ports:
      - ${PORT_NEXTCLOUD:-${AUTO_PORT_NEXTCLOUD}}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── opencloud (services/files/cloud/opencloud.yaml)
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    container_name: opencloud
    hostname: opencloud
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        opencloud init || true
        opencloud server
    environment:
      - TZ=${TZ}
      # Set the admin password on first run
      - OC_ADMIN_USER=admin
      - OC_ADMIN_PASSWORD=${OPENCLOUD_ADMIN_PASSWORD:-changeme}
      # Public-facing URL — REQUIRED for correct redirect URLs
      - OC_URL=https://opencloud.${BASE_DOMAIN}
      # Disable TLS inside the container (terminate at reverse proxy)
      - PROXY_TLS=false
      # Log settings
      - OC_LOG_LEVEL=error
      - OC_LOG_COLOR=false
      # Insecure mode (disable cert checks for internal services — needed behind a proxy)
      - OC_INSECURE=false
      # Demo users (remove in production)
      - IDM_CREATE_DEMO_USERS=false
      # Storage driver: ocis (local posix), s3ng, or others
      - STORAGE_USERS_DRIVER=ocis
    volumes:
      # Persistent config and data directory
      - ${DOCKER_DATA}/opencloud/config:/etc/opencloud
      - ${DOCKER_DATA}/opencloud/data:/var/lib/opencloud
    ports:
      - ${PORT_OPENCLOUD:-${AUTO_PORT_OPENCLOUD}}:9200
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── oxicloud (services/files/cloud/oxicloud.yaml)
  oxicloud:
    image: ghcr.io/pausala/oxicloud:latest
    container_name: oxicloud
    hostname: oxicloud
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Storage root directory
      - STORAGE_PATH=/data
      # Server bind address
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Optional: admin credentials (set before first run)
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=changeme
      # Max upload size in bytes
      # - MAX_UPLOAD_SIZE=5368709120
    volumes:
      - ${DOCKER_DATA}/oxicloud/data:/data
    ports:
      - ${PORT_OXICLOUD:-${AUTO_PORT_OXICLOUD}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pairdrop (services/files/sharing/pairdrop/pairdrop.yaml)
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    container_name: pairdrop
    hostname: pairdrop
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # - RATE_LIMIT=true # Enable API rate limiting for public-facing deployments

    volumes:
      - ${DOCKER_DATA}/files/sharing/pairdrop/config:/config
      - ${DOCKER_DATA}/files/sharing/pairdrop/data:/data

    ports:
      - ${PORT_PAIRDROP:-${AUTO_PORT_PAIRDROP}}:3000

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── palmr (services/files/palmr.yaml)
  palmr:
    image: ghcr.io/kyantech/palmr:latest
    container_name: palmr
    hostname: palmr
    restart: unless-stopped
    depends_on:
      palmr-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-palmr}:${POSTGRES_PASSWORD}@palmr-db:5432/palmr
      # Application secret (change to a long random string)
      - SECRET_KEY=${PALMR_SECRET:-changeme_use_a_long_random_string}
      # Public-facing URL
      - APP_URL=https://palmr.${BASE_DOMAIN}
      # Max upload size (bytes)
      # - MAX_UPLOAD_SIZE=5368709120
      # Disable registration (true/false)
      - DISABLE_REGISTRATION=false
    volumes:
      - ${DOCKER_DATA}/palmr/uploads:/app/uploads
    ports:
      - ${PORT_PALMR}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

  palmr-db:
    image: postgres:16-alpine
    container_name: palmr-db
    hostname: palmr-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-palmr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=palmr
    volumes:
      - ${DOCKER_DATA}/palmr/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palmr} -d palmr"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── pydio (services/files/file-manager/pydio.yaml)
  pydio:
    image: pydio/cells:latest
    container_name: pydio
    hostname: pydio
    restart: unless-stopped
    depends_on:
      pydio-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Public-facing URL (required for OAuth2 redirects)
      - CELLS_EXTERNAL=https://pydio.${BASE_DOMAIN}
      # Internal bind address
      - CELLS_BIND=0.0.0.0:8080
      # Disable internal TLS (terminate at reverse proxy)
      - CELLS_NO_TLS=1
      # Site URI
      - CELLS_SITE_URI=http://0.0.0.0:8080
      # Database DSN
      - CELLS_DB_HOST=pydio-db
      - CELLS_DB_USER=${MYSQL_USER:-pydio}
      - CELLS_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - CELLS_DB_NAME=pydio
      # Log level: debug | info | warn | error
      - CELLS_LOG_LEVEL=info
    volumes:
      - ${DOCKER_DATA}/pydio/cells:/var/cells
      - ${DOCKER_DATA}/pydio/data:/var/cells/data
    ports:
      - ${PORT_PYDIO:-${AUTO_PORT_PYDIO}}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

  pydio-db:
    image: mariadb:11
    container_name: pydio-db
    hostname: pydio-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=pydio
      - MYSQL_USER=${MYSQL_USER:-pydio}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${DOCKER_DATA}/pydio/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── seafile (services/files/file-manager/seafile.yaml)
  seafile:
    image: seafileltd/seafile-mc:latest
    container_name: seafile
    hostname: seafile
    restart: unless-stopped
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-memcached:
        condition: service_started
    environment:
      - TZ=${TZ}
      # Database host and root password
      - DB_HOST=seafile-db
      - DB_ROOT_PASSWD=${MYSQL_ROOT_PASSWORD}
      # Admin credentials for initial setup
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL:-admin@example.com}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD:-changeme}
      # Server name shown in the web UI
      - SEAFILE_SERVER_NAME=Seafile
      # Internal hostname (used for building SERVICE_URL)
      - SEAFILE_SERVER_HOSTNAME=seafile.${BASE_DOMAIN}
      # Let's Encrypt (disabled — terminate TLS at reverse proxy)
      - SEAFILE_SERVER_LETSENCRYPT=false
      # Force HTTPS for all internal links
      - FORCE_HTTPS_IN_CONF=false
      # Public service URLs
      - SERVICE_URL=https://seafile.${BASE_DOMAIN}
      - FILE_SERVER_ROOT=https://seafile.${BASE_DOMAIN}/seafhttp
    volumes:
      - ${DOCKER_DATA}/seafile/data:/shared
    ports:
      - ${PORT_SEAFILE}:80
    # networks:
    #   - ${DEFAULT_NETWORK}

  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    hostname: seafile-db
    restart: unless-stopped
    command: --innodb_log_file_size=256M --transaction-isolation=READ-COMMITTED
    environment:
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_LOG_BIN=1
    volumes:
      - ${DOCKER_DATA}/seafile/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

  seafile-memcached:
    image: memcached:1.6-alpine
    container_name: seafile-memcached
    hostname: seafile-memcached
    restart: unless-stopped
    # Seafile recommends at least 128 MB of memcached
    command: memcached -m 256
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── spacedrive (services/files/spacedrive.yaml)
  spacedrive:
    image: ghcr.io/spacedriveapp/spacedrive/server:latest
    container_name: spacedrive
    hostname: spacedrive
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Data directory inside the container
      - SD_DATA_DIR=/data
      # Origin allowed to connect (set to your domain in production)
      # - SD_AUTH_SECRET=changeme
    volumes:
      - ${DOCKER_DATA}/spacedrive/data:/data
      # Mount additional storage locations to index
      # - /mnt/nas:/mnt/nas:ro
    ports:
      - ${PORT_SPACEDRIVE}:8080
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── unison (services/files/file-manager/unison.yaml)
  unison:
    image: eugenmayer/unison:latest
    container_name: unison
    hostname: unison
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # Unison listens on this port for incoming client connections
      - UNISON_PORT=5000
      # Optional: SSH public key for client authentication
      # - SSH_AUTH_KEYS=ssh-rsa AAAA...
      # Optional: log verbosity
      # - UNISON_DEBUG=1
    volumes:
      # Primary sync directory
      - ${DOCKER_DATA}/unison/sync:/data/sync
      # Unison profile and state directory
      - ${DOCKER_DATA}/unison/config:/root/.unison
    ports:
      # Unison native socket port
      - ${PORT_UNISON:-${AUTO_PORT_UNISON}}:5000
      # SSH port (for SSH transport)
      - ${PORT_UNISON_SSH:-${AUTO_PORT_UNISON_SSH}}:22
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true

  # ── zerotier (services/files/backup/zerotier.yaml)
  zerotier:
    image: zerotier/zerotier:latest
    container_name: zerotier
    hostname: zerotier
    restart: unless-stopped
    # ZeroTier must run in host network mode or with specific capabilities
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - TZ=${TZ}
      # Automatically join this network on container start
      # - ZEROTIER_ONE_NETWORK_IDS=<your-network-id>
    volumes:
      # Persists identity and network config across restarts
      - ${DOCKER_DATA}/zerotier/data:/var/lib/zerotier-one
    # ports: not needed when network_mode: host

# networks:
#   proxy:
#     external: true

  # ── zipline (services/files/zipline.yaml)
  zipline:
    image: ghcr.io/diced/zipline:latest
    container_name: zipline
    hostname: zipline
    restart: unless-stopped
    depends_on:
      zipline-db:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Application secret — MUST be a long, random string
      - CORE_SECRET=${ZIPLINE_SECRET}
      # PostgreSQL connection
      - CORE_DATABASE_URL=postgresql://${POSTGRES_USER:-zipline}:${POSTGRES_PASSWORD}@zipline-db/zipline
      # Host and port
      - CORE_HOST=0.0.0.0
      - CORE_PORT=3000
      # Storage: local or s3
      - DATASOURCE_TYPE=local
      - DATASOURCE_LOCAL_DIRECTORY=/zipline/uploads
      # Optionally use S3-compatible storage
      # - DATASOURCE_TYPE=s3
      # - DATASOURCE_S3_BUCKET=zipline
      # - DATASOURCE_S3_ACCESS_KEY_ID=
      # - DATASOURCE_S3_SECRET_ACCESS_KEY=
      # - DATASOURCE_S3_REGION=us-east-1
      # - DATASOURCE_S3_ENDPOINT=
      # Public-facing URL
      - CORE_RETURN_HTTPS=true
      # Max upload size (bytes, default: 100 MB)
      # - UPLOADER_MAX_SIZE=104857600
      # Allow user registration
      - FEATURES_INVITES=true
      - FEATURES_ROBOTS_TXT=false
      - FEATURES_USER_REGISTRATION=false
    volumes:
      - ${DOCKER_DATA}/zipline/uploads:/zipline/uploads
      - ${DOCKER_DATA}/zipline/public:/zipline/public
    ports:
      - ${PORT_ZIPLINE}:3000
    # networks:
    #   - ${DEFAULT_NETWORK}

  zipline-db:
    image: postgres:16-alpine
    container_name: zipline-db
    hostname: zipline-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-zipline}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=zipline
    volumes:
      - ${DOCKER_DATA}/zipline/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zipline} -d zipline"]
      interval: 10s
      timeout: 5s
      retries: 5
    # networks:
    #   - ${DEFAULT_NETWORK}

# networks:
#   proxy:
#     external: true


