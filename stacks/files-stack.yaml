# FILES STACK
# Generated by scripts/generate-stacks.py
# Services: nextcloud, filebrowser, minio
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    hostname: nextcloud
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/files/nextcloud/config:/var/www/html
    ports:
    - ${PORT_NEXTCLOUD:-8880}:80
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/files/filebrowser/config:/config
    - ${DOCKER_DATA}/files/filebrowser/database:/database
    ports:
    - ${PORT_FILEBROWSER:-8888}:80
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/files/minio/data:/data
    ports:
    - ${PORT_MINIO:-9000}:9000
    - ${PORT_MINIO_CONSOLE:-9001}:9001
