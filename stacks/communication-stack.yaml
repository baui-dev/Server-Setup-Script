# COMMUNICATION STACK
# Generated by scripts/generate-stacks.py
# Services: matrix-synapse, ntfy, gotify
#
# Edit port variables in your .env file before deploying.
version: '3.8'
services:
  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    hostname: matrix-synapse
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/communication/matrix-synapse/config:/data
    ports:
    - ${PORT_MATRIX_SYNAPSE:-8008}:8008
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    hostname: ntfy
    restart: unless-stopped
    command: serve
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/communication/ntfy/config:/etc/ntfy
    - ${DOCKER_DATA}/communication/ntfy/data:/var/cache/ntfy
    ports:
    - ${PORT_NTFY:-8840}:80
  gotify:
    image: gotify/server:latest
    container_name: gotify
    hostname: gotify
    restart: unless-stopped
    environment:
    - TZ=${TZ}
    volumes:
    - ${DOCKER_DATA}/communication/gotify/config:/app/data
    ports:
    - ${PORT_GOTIFY:-8850}:80
