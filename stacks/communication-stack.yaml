# COMMUNICATION STACK
# Generated by scripts/generate-stacks.sh
# Services: matrix-synapse ntfy gotify
#
# Edit port variables in your .env file before deploying.
# Start: docker compose -f communication-stack.yaml up -d

services:
  # ── matrix-synapse (services/communication/matrix-synapse/matrix-synapse.yaml)
  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    hostname: matrix-synapse
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - SYNAPSE_SERVER_NAME=matrix.${BASE_DOMAIN}            # Your Matrix server domain
      # - SYNAPSE_REPORT_STATS=no                              # Report anonymous stats
      # - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml            # Config file path

    volumes:
      - ${DOCKER_DATA}/communication/matrix-synapse/config:/data

    ports:
      - ${PORT_MATRIX_SYNAPSE:-8008}:8008                      # HTTP federation/client API

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── ntfy (services/communication/ntfy/ntfy.yaml)
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    hostname: ntfy
    restart: unless-stopped

    command: serve

    environment:
      - TZ=${TZ}
      # - NTFY_BASE_URL=https://ntfy.${BASE_DOMAIN}            # Public base URL
      # - NTFY_BEHIND_PROXY=true                               # Set to true if behind proxy
      # - NTFY_AUTH_DEFAULT_ACCESS=deny-all                    # Default access control

    volumes:
      - ${DOCKER_DATA}/communication/ntfy/config:/etc/ntfy
      - ${DOCKER_DATA}/communication/ntfy/data:/var/cache/ntfy

    ports:
      - ${PORT_NTFY:-8840}:80

    # networks:
    #   - ${DEFAULT_NETWORK}

  # ── gotify (services/communication/gotify/gotify.yaml)
  gotify:
    image: gotify/server:latest
    container_name: gotify
    hostname: gotify
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      # - GOTIFY_DEFAULTUSER_NAME=admin                        # Default admin username
      # - GOTIFY_DEFAULTUSER_PASS=admin                        # Default admin password
      # - GOTIFY_SERVER_KEEPALIVEPERIODSECONDS=0               # WebSocket keepalive interval

    volumes:
      - ${DOCKER_DATA}/communication/gotify/config:/app/data

    ports:
      - ${PORT_GOTIFY:-8850}:80

    # networks:
    #   - ${DEFAULT_NETWORK}


